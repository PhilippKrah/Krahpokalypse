<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familien-Planer</title>

    <!-- Damit die App vom Startbildschirm wie eine App startet (ohne Browserleiste) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Familie">

    <style>
        :root {
            --bg-color: #f7f9fc;
            --card-color: #ffffff;
            --primary-color: #4f46e5;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --muted-color: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-color);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            color: var(--primary-color);
        }

        p.subtitle {
            margin: 4px 0 0 0;
            color: var(--muted-color);
            font-size: 14px;
        }

        /* Eingabe-Bereich */
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px; /* Verhindert automatisches Zoomen auf iPhones */
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Umschalter "Ich / Wir" — bleibt stehen, kostet pro Aufgabe nichts */
        .mode-switch {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            background: #f3f4f6;
            padding: 4px;
            border-radius: 10px;
        }

        .mode-switch button {
            flex: 1;
            background: transparent;
            color: var(--muted-color);
            padding: 8px;
            font-size: 14px;
            border-radius: 8px;
        }

        .mode-switch button.active {
            background: var(--card-color);
            color: var(--text-color);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* Tagwahl unter dem Schnell-Eingabefeld */
        .day-chips {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .day-chips button {
            flex: 0 0 auto;
            background: #f3f4f6;
            color: var(--muted-color);
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 999px;
        }

        .day-chips button.active {
            background: var(--primary-color);
            color: white;
        }

        /* Abschnitte nach Tagen */
        .section {
            margin-top: 4px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 0 6px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            flex: 1;
            display: flex;
            align-items: baseline;
            gap: 6px;
            background: none;
            border: none;
            padding: 0;
            color: var(--text-color);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
        }

        .section-title:hover {
            opacity: 1;
        }

        .section-title.empty {
            color: var(--muted-color);
            font-weight: 500;
        }

        .section-count {
            font-size: 13px;
            font-weight: 400;
            color: var(--muted-color);
        }

        .chevron {
            display: inline-block;
            width: 14px;
            font-size: 11px;
            color: var(--muted-color);
        }

        .add-btn {
            background: none;
            color: var(--primary-color);
            font-size: 22px;
            line-height: 1;
            padding: 2px 8px;
        }

        /* To-Do Liste */
        .todo-list {
            list-style: none;
            padding: 0;
            margin: 0 0 4px 0;
        }

        .todo-item {
            padding: 2px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .todo-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Grosse Trefferflaeche: Kaestchen hakt ab, Text oeffnet die Aktionen */
        .check-btn {
            background: none;
            padding: 10px 4px 10px 0;
            font-size: 18px;
            line-height: 1;
        }

        .todo-text {
            flex: 1;
            padding: 10px 0;
            font-size: 16px;
            cursor: pointer;
            word-break: break-word;
        }

        .todo-text.done {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .share-mark {
            font-size: 13px;
            color: var(--muted-color);
        }

        /* Woher eine liegengebliebene Aufgabe kommt — bewusst grau, keine Warnfarbe */
        .seit-mark {
            font-size: 13px;
            color: var(--muted-color);
            white-space: nowrap;
        }

        /* Aktionsleiste: erscheint unter der Aufgabe, ein Tipp = verschoben */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 4px 0 10px 26px;
        }

        .actions button {
            background: #eef2ff;
            color: var(--primary-color);
            padding: 8px 10px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
        }

        .actions button.current {
            background: var(--primary-color);
            color: white;
        }

        .actions button:disabled {
            opacity: 0.35;
        }

        /* Aufgabentext bearbeiten: ersetzt die Zeile, bis OK oder ✕ */
        .edit-form {
            flex: 1;
            display: flex;
            gap: 6px;
            padding: 4px 0;
        }

        .edit-form input {
            flex: 1;
            min-width: 0;
            padding: 8px 10px;
            font-size: 16px;
        }

        .edit-form button {
            padding: 8px 12px;
            font-size: 14px;
        }

        .edit-form button.cancel {
            background: #f3f4f6;
            color: var(--muted-color);
        }

        .actions button.danger {
            background: #fee2e2;
            color: #ef4444;
        }

        .compose {
            display: flex;
            gap: 6px;
            padding: 8px 0;
        }

        .compose input {
            font-size: 16px;
        }

        .empty-hint {
            margin: 0;
            padding: 8px 0;
            color: #9ca3af;
            font-size: 14px;
        }

        /* Login-Bereich */
        .hidden {
            display: none;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .login-form input {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .login-form input:focus {
            border-color: var(--primary-color);
        }

        .error-msg {
            margin: 0;
            color: #ef4444;
            font-size: 14px;
            text-align: center;
        }

        .hint {
            margin: 4px 0 0 0;
            color: var(--muted-color);
            font-size: 13px;
            text-align: center;
        }

        /* Zeile mit angemeldetem Namen und Abmelden-Knopf */
        .user-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            color: var(--muted-color);
        }

        .logout-btn {
            background: none;
            color: var(--primary-color);
            padding: 4px 8px;
            font-size: 13px;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>🏡 Unser Familien-Planer</h1>
        <p class="subtitle">Version 0.3</p>
    </header>

    <!-- Solange niemand angemeldet ist, ist nur dieser Bereich sichtbar -->
    <div id="authView" class="hidden">
        <form class="login-form" onsubmit="signIn(event)">
            <input type="email" id="emailInput" placeholder="E-Mail" autocomplete="username" required>
            <input type="password" id="passwordInput" placeholder="Passwort" autocomplete="current-password" required>
            <button type="submit" id="loginButton">Anmelden</button>
        </form>
        <p id="authError" class="error-msg hidden"></p>
        <p class="hint">Zugang bekommst du von Papa — Accounts werden in Supabase angelegt.</p>
    </div>

    <!-- Die eigentliche App: erst nach erfolgreichem Login sichtbar -->
    <div id="appView" class="hidden">
        <div class="user-bar">
            <span id="userEmail"></span>
            <span>
                <a class="logout-btn" href="apps/" target="_blank" rel="noopener">▦ Apps</a>
                <button class="logout-btn" onclick="signOut()">Abmelden</button>
            </span>
        </div>

        <!-- Schnelle Erfassung: Text tippen, optional gleich einen Tag antippen -->
        <div class="mode-switch">
            <button id="modeMine" onclick="setMode('privat')">🔒 Nur ich</button>
            <button id="modeShared" onclick="setMode('geteilt')">👥 Wir beide</button>
        </div>

        <form class="input-group" onsubmit="quickAdd(event)">
            <input type="text" id="todoInput" placeholder="Schnell notieren …" autocomplete="off">
            <button type="submit">+</button>
        </form>

        <!-- Optionale Tagwahl vor dem Abschicken. Nichts antippen heisst "Ohne Datum". -->
        <div class="day-chips" id="quickDays"></div>

        <!-- Die nach Tagen gruppierte Liste -->
        <div id="sections"></div>
    </div>
</div>


<!-- Hier endet der HTML-Bereich deiner App -->

<!-- 1. SCHRITT: Externe Supabase-Bibliothek laden (echte Bundle-URL, nicht nur die CDN-Startseite) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. SCHRITT: Dein Programm-Code -->
<script>
    // Zuerst definieren wir die Zugangsdaten.
    // Wichtig: nur die Projekt-Basis-URL, den REST-Pfad /rest/v1/ hängt der Client selbst an.
    const SUPABASE_URL = "https://jzfhuqgyvujgriuierye.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6Zmh1cWd5dnVqZ3JpdWllcnllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxODgzNDgsImV4cCI6MjEwMTc2NDM0OH0.eRH8-E16T8qewLPipHEMmPKKTzKRGK-p0CUU8X6NdtE";

    // Jetzt erst erstellen wir den Supabase-Client (Initialisierung).
    // Der Client heißt 'db' — 'supabase' ist die geladene Bibliothek und darf nicht überschrieben werden.
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- Zustand ---

    let todos = [];              // Alle sichtbaren Aufgaben (eigene + geteilte)
    let currentUserId = null;    // Wer ist angemeldet — entscheidet ueber "meine" Aufgaben
    let openActionsId = null;    // Bei welcher Aufgabe ist die Aktionsleiste offen?
    let composeKey = null;       // In welchem Abschnitt ist die Eingabezeile offen?
    let editId = null;           // Welche Aufgabe wird gerade umbenannt?
    let quickDate = null;        // Vorgewaehlter Tag fuer das Schnell-Eingabefeld
    let inputMode = localStorage.getItem('inputMode') || 'privat';
    let collapsed = new Set(JSON.parse(localStorage.getItem('collapsed') || '[]'));

    const WOCHENTAG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
    const WOCHENTAG_KURZ = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

    // Verhindert, dass Sonderzeichen in einer Aufgabe das generierte HTML zerlegen
    function escapeHtml(text) {
        return String(text).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
    }

    // --- Datum ---
    // Alles rechnet in Ortszeit. toISOString() waere hier falsch: das rechnet nach
    // UTC um und macht abends aus "heute" schon "morgen".

    function toIso(date) {
        const monat = String(date.getMonth() + 1).padStart(2, '0');
        const tag = String(date.getDate()).padStart(2, '0');
        return `${date.getFullYear()}-${monat}-${tag}`;
    }

    function fromIso(iso) {
        return new Date(iso + 'T00:00:00');
    }

    function heuteIso() {
        return toIso(new Date());
    }

    // Datum in n Tagen ab heute
    function isoInTagen(n) {
        const d = new Date();
        d.setDate(d.getDate() + n);
        return toIso(d);
    }

    // Ueberschrift eines Tages: "Heute", "Morgen", sonst "Mittwoch, 12.8."
    function tagesLabel(iso) {
        if (iso === heuteIso()) return 'Heute';
        if (iso === isoInTagen(1)) return 'Morgen';
        const d = fromIso(iso);
        return `${WOCHENTAG[d.getDay()]}, ${d.getDate()}.${d.getMonth() + 1}.`;
    }

    // Kurzform fuer die Buttons in der Aktionsleiste
    function tagesLabelKurz(iso) {
        if (iso === heuteIso()) return 'Heute';
        if (iso === isoInTagen(1)) return 'Morgen';
        return WOCHENTAG_KURZ[fromIso(iso).getDay()];
    }

    // Hinweis fuer Liegengebliebenes unter "Heute": "seit gestern", "seit Mo",
    // ab einer Woche mit Datum (sonst waere "seit Mo" mehrdeutig).
    function seitLabel(iso) {
        const tage = Math.round((fromIso(heuteIso()) - fromIso(iso)) / 86400000);
        if (tage === 1) return 'seit gestern';
        if (tage < 7) return 'seit ' + WOCHENTAG_KURZ[fromIso(iso).getDay()];
        const d = fromIso(iso);
        return `seit ${d.getDate()}.${d.getMonth() + 1}.`;
    }

    // --- Laden ---

    async function loadTodos() {
        try {
            const { data, error } = await db
                .from('todos')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) throw error;

            todos = data || [];
            renderTodos();
            raeumeAuf();
        } catch (error) {
            console.error("Fehler beim Laden:", error.message);
        }
    }

    // Erledigtes, dessen Tag vorbei ist, wird endgueltig geloescht — sonst waechst
    // die Liste ewig. Undatiertes Erledigtes bleibt bewusst stehen: da war nie ein
    // Tag, der "rum" sein koennte.
    async function raeumeAuf() {
        const heute = heuteIso();
        const alt = todos.filter(t => t.is_completed && t.due_date && t.due_date < heute && !t.deferred);
        if (alt.length === 0) return;

        const ids = alt.map(t => t.id);
        todos = todos.filter(t => !ids.includes(t.id));
        renderTodos();

        const { error } = await db.from('todos').delete().in('id', ids);
        if (error) {
            console.error("Aufräumen fehlgeschlagen:", error.message);
            loadTodos(); // Stand aus der Datenbank wiederherstellen
        }
    }

    function findTodo(id) {
        return todos.find(t => String(t.id) === String(id));
    }

    // --- Gruppierung ---
    // Ordnet jede Aufgabe einem Abschnitt zu. Liegengebliebenes rutscht still
    // nach "Heute" — das gespeicherte Datum bleibt dabei unangetastet.
    function abschnittVon(todo) {
        const heute = heuteIso();
        if (todo.deferred) return 'spaeter';                 // bewusst weggelegt, unabhaengig vom Datum
        if (!todo.due_date) return 'ohne';                   // frischer Eingang
        if (todo.due_date <= heute) return heute;            // Liegengebliebenes rutscht still nach heute
        if (todo.due_date <= isoInTagen(6)) return todo.due_date;
        return 'spaeter';                                    // weiter als eine Woche weg
    }

    // Position innerhalb eines Abschnitts. Ohne eigene Sortierung zaehlt der
    // Anlegezeitpunkt (in ms) — Neues landet so automatisch unten. Ein Pfeil-Tipp
    // setzt sort_order auf die Mitte zwischen den neuen Nachbarn, dadurch aendert
    // sich pro Tipp nur eine einzige Zeile in der Datenbank.
    function rang(todo) {
        if (todo.sort_order !== null && todo.sort_order !== undefined) return Number(todo.sort_order);
        const t = Date.parse(todo.created_at);
        return isNaN(t) ? 0 : t;
    }

    function gruppiere() {
        const gruppen = {};

        todos.forEach(todo => {
            const key = abschnittVon(todo);
            (gruppen[key] = gruppen[key] || []).push(todo);
        });

        // Innerhalb eines Abschnitts: Offenes zuerst, Erledigtes sinkt nach unten
        Object.values(gruppen).forEach(liste => {
            liste.sort((a, b) => (a.is_completed !== b.is_completed)
                ? (a.is_completed ? 1 : -1)
                : (rang(a) - rang(b)) || String(a.id).localeCompare(String(b.id)));
        });

        return gruppen;
    }

    // --- Zeichnen ---

    function renderTodos() {
        const container = document.getElementById('sections');
        if (!container) return;

        const gruppen = gruppiere();

        // Reihenfolge: der frische Eingang oben, weggelegtes ganz unten.
        let html = abschnitt('ohne', 'Ohne Datum', gruppen['ohne'] || []);

        // Die naechsten sieben Tage bekommen immer eine Ueberschrift, auch wenn
        // sie leer sind: sonst gaebe es dort kein "+" zum Anlegen.
        for (let i = 0; i < 7; i++) {
            const iso = isoInTagen(i);
            html += abschnitt(iso, tagesLabel(iso), gruppen[iso] || []);
        }

        html += abschnitt('spaeter', 'Später', gruppen['spaeter'] || []);

        // Tippt man gerade in einer Eingabezeile (neue Aufgabe oder Umbenennen),
        // ueberlebt das Neuzeichnen (z.B. wenn die Datenbank antwortet) Text und
        // Cursor. Nur dann — sonst springt jeder Tipp anderswo zurueck zu dieser Zeile.
        // data-key verhindert, dass Text in eine andere Zeile wandert.
        const gemerkt = ['composeInput', 'editInput'].map(id => {
            const el = document.getElementById(id);
            return el && { id, key: el.dataset.key, wert: el.value, fokus: document.activeElement === el };
        }).filter(Boolean);

        container.innerHTML = html;

        gemerkt.forEach(g => {
            const el = document.getElementById(g.id);
            if (!el || el.dataset.key !== g.key) return;
            el.value = g.wert;
            if (g.fokus) el.focus({ preventScroll: true });
        });

        zeichneTagwahl();
    }

    // Chips unter dem Schnell-Eingabefeld: optional vor dem Abschicken antippen.
    function zeichneTagwahl() {
        const box = document.getElementById('quickDays');
        if (!box) return;

        let html = `<button class="${quickDate === null ? 'active' : ''}" onclick="setQuickDate(null)">Ohne Datum</button>`;
        for (let i = 0; i < 7; i++) {
            const iso = isoInTagen(i);
            html += `<button class="${quickDate === iso ? 'active' : ''}" onclick="setQuickDate('${iso}')">${tagesLabelKurz(iso)}</button>`;
        }
        box.innerHTML = html;
    }

    function setQuickDate(iso) {
        quickDate = iso;
        zeichneTagwahl();
        document.getElementById('todoInput').focus(); // Tastatur bleibt offen
    }

    function abschnitt(key, label, liste) {
        const zu = collapsed.has(key);
        const offen = liste.filter(t => !t.is_completed).length;

        let html = `
            <div class="section">
                <div class="section-header">
                    <button class="section-title ${liste.length === 0 ? 'empty' : ''}" onclick="toggleSection('${key}')">
                        <span class="chevron">${zu ? '▶' : '▼'}</span>
                        <span>${escapeHtml(label)}</span>
                        ${offen > 0 ? `<span class="section-count">${offen}</span>` : ''}
                    </button>
                    <button class="add-btn" onclick="openCompose('${key}')" title="Aufgabe hinzufügen">+</button>
                </div>`;

        if (!zu) {
            if (composeKey === key) {
                html += `
                    <form class="compose" onsubmit="addFromCompose(event, '${key}')">
                        <input type="text" id="composeInput" data-key="${key}" placeholder="Aufgabe …" autocomplete="off">
                        <button type="submit">OK</button>
                    </form>`;
            }

            if (liste.length > 0) {
                html += '<ul class="todo-list">' + liste.map(zeile).join('') + '</ul>';
            }
        }

        return html + '</div>';
    }

    function zeile(todo) {
        const geteilt = todo.visibility === 'geteilt';
        const fremd = todo.user_id && todo.user_id !== currentUserId;
        const liegengeblieben = !todo.deferred && !todo.is_completed
            && todo.due_date && todo.due_date < heuteIso();

        if (String(editId) === String(todo.id)) {
            return `
                <li class="todo-item">
                    <form class="edit-form" onsubmit="saveEdit(event, '${todo.id}')">
                        <input type="text" id="editInput" data-key="${todo.id}" value="${escapeHtml(todo.task)}"
                               autocomplete="off" onkeydown="if (event.key === 'Escape') cancelEdit()">
                        <button type="submit">OK</button>
                        <button type="button" class="cancel" onclick="cancelEdit()" title="Abbrechen">✕</button>
                    </form>
                </li>`;
        }

        let html = `
            <li class="todo-item">
                <div class="todo-row">
                    <button class="check-btn" onclick="toggleTodo('${todo.id}')" title="Erledigt">
                        ${todo.is_completed ? '✅' : '⬜'}
                    </button>
                    <span class="todo-text ${todo.is_completed ? 'done' : ''}" onclick="openActions('${todo.id}')">
                        ${escapeHtml(todo.task)}
                    </span>
                    ${liegengeblieben ? `<span class="seit-mark">${seitLabel(todo.due_date)}</span>` : ''}
                    ${geteilt ? `<span class="share-mark" title="${fremd ? 'geteilt vom Partner' : 'geteilt'}">👥</span>` : ''}
                </div>`;

        if (String(openActionsId) === String(todo.id)) {
            html += aktionsleiste(todo);
        }

        return html + '</li>';
    }

    // Ein Tipp auf einen dieser Knoepfe verschiebt die Aufgabe — kein Ausschneiden,
    // kein Einfuegen, kein Kalender-Dialog.
    function aktionsleiste(todo) {
        let buttons = '';

        for (let i = 0; i < 7; i++) {
            const iso = isoInTagen(i);
            const aktuell = (!todo.deferred && todo.due_date === iso) ? 'current' : '';
            buttons += `<button class="${aktuell}" onclick="setDueDate('${todo.id}', '${iso}')">${tagesLabelKurz(iso)}</button>`;
        }

        const ohne = (!todo.deferred && !todo.due_date) ? 'current' : '';
        buttons += `<button class="${ohne}" onclick="setDueDate('${todo.id}', null)">Ohne Datum</button>`;
        buttons += `<button class="${todo.deferred ? 'current' : ''}" onclick="setDeferred('${todo.id}')">Später</button>`;
        buttons += `<button onclick="startEdit('${todo.id}')">✏️ Ändern</button>`;

        // Sortieren nur unter dem Offenen eines Abschnitts — Erledigtes sinkt ohnehin nach unten
        if (!todo.is_completed) {
            const offen = offeneImAbschnitt(todo);
            const i = offen.indexOf(todo);
            buttons += `<button onclick="moveTodo('${todo.id}', -1)" ${i <= 0 ? 'disabled' : ''} title="Nach oben">↑</button>`;
            buttons += `<button onclick="moveTodo('${todo.id}', 1)" ${i >= offen.length - 1 ? 'disabled' : ''} title="Nach unten">↓</button>`;
        }
        buttons += `<button onclick="toggleVisibility('${todo.id}')">${todo.visibility === 'geteilt' ? '🔒 Nur ich' : '👥 Teilen'}</button>`;
        buttons += `<button class="danger" onclick="deleteTodo('${todo.id}')">Löschen</button>`;

        return `<div class="actions">${buttons}</div>`;
    }

    // --- Bedienung ---

    function toggleSection(key) {
        if (collapsed.has(key)) {
            collapsed.delete(key);
        } else {
            collapsed.add(key);
            if (composeKey === key) composeKey = null;
        }
        localStorage.setItem('collapsed', JSON.stringify([...collapsed]));
        renderTodos();
    }

    function openActions(id) {
        openActionsId = String(openActionsId) === String(id) ? null : id;
        editId = null;
        renderTodos();
    }

    // --- Umbenennen ---

    function startEdit(id) {
        editId = id;
        openActionsId = null;
        renderTodos();

        const eingabe = document.getElementById('editInput');
        if (eingabe) {
            eingabe.focus();
            eingabe.setSelectionRange(eingabe.value.length, eingabe.value.length); // Cursor ans Ende
        }
    }

    function cancelEdit() {
        editId = null;
        renderTodos();
    }

    async function saveEdit(event, id) {
        event.preventDefault();
        const todo = findTodo(id);
        const text = document.getElementById('editInput').value.trim();
        editId = null;

        // Leerer Text loescht nicht — dafuer gibt es den Loeschen-Knopf
        if (!todo || text === '' || text === todo.task) {
            renderTodos();
            return;
        }

        const vorher = { task: todo.task };
        todo.task = text;
        renderTodos();

        await speichere(id, { task: text }, vorher);
    }

    // --- Sortieren ---

    function offeneImAbschnitt(todo) {
        return (gruppiere()[abschnittVon(todo)] || []).filter(t => !t.is_completed);
    }

    // Eine Stelle nach oben (-1) oder unten (+1). Die Aktionsleiste bleibt offen,
    // damit man mehrmals hintereinander tippen kann.
    async function moveTodo(id, richtung) {
        const todo = findTodo(id);
        if (!todo) return;

        const offen = offeneImAbschnitt(todo);
        const i = offen.indexOf(todo);
        const nachbar = offen[i + richtung];
        if (!nachbar) return;
        const dahinter = offen[i + 2 * richtung];

        // Mitte zwischen Nachbar und dem dahinter; am Rand eine Sekunde weiter
        const neu = dahinter
            ? (rang(nachbar) + rang(dahinter)) / 2
            : rang(nachbar) + richtung * 1000;

        const vorher = { sort_order: todo.sort_order === undefined ? null : todo.sort_order };
        todo.sort_order = neu;
        renderTodos();

        await speichere(id, { sort_order: neu }, vorher);
    }

    function openCompose(key) {
        composeKey = composeKey === key ? null : key;
        collapsed.delete(key); // Abschnitt aufklappen, sonst tippt man ins Leere
        localStorage.setItem('collapsed', JSON.stringify([...collapsed]));
        renderTodos();

        // Fokus nur beim Oeffnen setzen, nicht bei jedem Neuzeichnen
        const eingabe = document.getElementById('composeInput');
        if (eingabe) eingabe.focus();
    }

    function setMode(modus) {
        inputMode = modus;
        localStorage.setItem('inputMode', modus);
        zeichneModus();
    }

    function zeichneModus() {
        document.getElementById('modeMine').classList.toggle('active', inputMode === 'privat');
        document.getElementById('modeShared').classList.toggle('active', inputMode === 'geteilt');
    }

    // --- Aendern ---
    // Muster: erst lokal aendern und zeichnen (damit es sofort reagiert), dann
    // speichern. Schlaegt das Speichern fehl, wird der alte Stand zurueckgeholt.

    async function speichere(id, aenderung, vorher) {
        const { error } = await db.from('todos').update(aenderung).eq('id', id);
        if (error) {
            Object.assign(findTodo(id) || {}, vorher);
            renderTodos();
            alert("Konnte nicht gespeichert werden: " + error.message);
            console.error(error);
        }
    }

    async function toggleTodo(id) {
        const todo = findTodo(id);
        if (!todo) return;

        const vorher = { is_completed: todo.is_completed };
        todo.is_completed = !todo.is_completed;
        renderTodos();

        await speichere(id, { is_completed: todo.is_completed }, vorher);
    }

    // Einen Tag waehlen holt die Aufgabe automatisch aus "Später" zurueck.
    async function setDueDate(id, iso) {
        const todo = findTodo(id);
        if (!todo) return;

        const vorher = { due_date: todo.due_date, deferred: todo.deferred };
        todo.due_date = iso;
        todo.deferred = false;
        openActionsId = null; // Aktion erledigt, Leiste wieder zu
        renderTodos();

        await speichere(id, { due_date: iso, deferred: false }, vorher);
    }

    // "Später" heisst: weggelegt, ohne Termin.
    async function setDeferred(id) {
        const todo = findTodo(id);
        if (!todo) return;

        const vorher = { due_date: todo.due_date, deferred: todo.deferred };
        todo.due_date = null;
        todo.deferred = true;
        openActionsId = null;
        renderTodos();

        await speichere(id, { due_date: null, deferred: true }, vorher);
    }

    async function toggleVisibility(id) {
        const todo = findTodo(id);
        if (!todo) return;

        const vorher = { visibility: todo.visibility };
        todo.visibility = todo.visibility === 'geteilt' ? 'privat' : 'geteilt';
        openActionsId = null;
        renderTodos();

        await speichere(id, { visibility: todo.visibility }, vorher);
    }

    async function deleteTodo(id) {
        const todo = findTodo(id);
        if (!todo) return;

        const index = todos.indexOf(todo);
        todos.splice(index, 1);
        openActionsId = null;
        renderTodos();

        const { error } = await db.from('todos').delete().eq('id', id);
        if (error) {
            todos.splice(index, 0, todo); // zurueck an die alte Stelle
            renderTodos();
            alert("Konnte nicht gelöscht werden: " + error.message);
            console.error(error);
        }
    }

    // --- Anlegen ---

    // Reihenfolge frei waehlbar: Text tippen und abschicken, oder vorher einen
    // Tag antippen. Der gewaehlte Tag bleibt fuer weitere Eingaben stehen.
    function quickAdd(event) {
        event.preventDefault();
        const input = document.getElementById('todoInput');
        if (addTodo(input.value, quickDate)) input.value = '';
    }

    function addFromCompose(event, key) {
        event.preventDefault();
        const input = document.getElementById('composeInput');
        const text = input.value;
        input.value = ''; // vor dem Neuzeichnen leeren, sonst kaeme der Text zurueck
        // 'ohne' und 'spaeter' sind keine Tage — dort entsteht die Aufgabe ohne Datum
        const iso = (key === 'ohne' || key === 'spaeter') ? null : key;
        addTodo(text, iso, key === 'spaeter');
    }

    // Legt die Aufgabe sofort in der Liste an und speichert im Hintergrund.
    function addTodo(text, iso, zurueckgestellt) {
        text = (text || '').trim();
        if (text === '') return false;

        const platzhalter = {
            id: 'neu-' + Date.now(),
            task: text,
            is_completed: false,
            due_date: iso,
            deferred: !!zurueckgestellt,
            visibility: inputMode,
            user_id: currentUserId,
            created_at: new Date().toISOString()
        };

        todos.push(platzhalter);
        renderTodos();

        speichereNeu(platzhalter);
        return true;
    }

    async function speichereNeu(platzhalter) {
        // user_id setzt die Datenbank selbst (Default auth.uid()), deshalb schicken
        // wir sie nicht mit — so kann auch niemand im fremden Namen anlegen.
        const { data, error } = await db
            .from('todos')
            .insert([{
                task: platzhalter.task,
                is_completed: false,
                due_date: platzhalter.due_date,
                deferred: platzhalter.deferred,
                visibility: platzhalter.visibility
            }])
            .select()
            .single();

        const index = todos.indexOf(platzhalter);

        if (error) {
            if (index !== -1) todos.splice(index, 1); // Platzhalter wieder entfernen
            renderTodos();
            alert("Konnte nicht gespeichert werden: " + error.message);
            console.error(error);
            return;
        }

        // Platzhalter durch die echte Zeile aus der Datenbank ersetzen
        if (index !== -1) todos[index] = data;
        renderTodos();
    }

    // --- Anmeldung / Zugriffsschutz ---

    // Schaltet zwischen Login-Maske und App um. Ohne Session sehen Fremde nur das Login.
    function showView(session) {
        const authView = document.getElementById('authView');
        const appView = document.getElementById('appView');

        if (session) {
            currentUserId = session.user.id;
            authView.classList.add('hidden');
            appView.classList.remove('hidden');
            document.getElementById('userEmail').textContent = 'Angemeldet als ' + session.user.email;
            zeichneModus();
        } else {
            currentUserId = null;
            appView.classList.add('hidden');
            authView.classList.remove('hidden');
            todos = [];
        }
    }

    function showAuthError(message) {
        const box = document.getElementById('authError');
        box.textContent = message;
        box.classList.toggle('hidden', !message);
    }

    async function signIn(event) {
        event.preventDefault(); // Formular soll die Seite nicht neu laden
        const button = document.getElementById('loginButton');
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value;

        showAuthError('');
        button.disabled = true;
        button.textContent = 'Anmelden …';

        const { error } = await db.auth.signInWithPassword({ email, password });

        button.disabled = false;
        button.textContent = 'Anmelden';

        if (error) {
            showAuthError('Anmeldung fehlgeschlagen. E-Mail oder Passwort stimmt nicht.');
            console.error(error);
            return;
        }

        document.getElementById('passwordInput').value = '';
        // Das Nachladen der Liste übernimmt onAuthStateChange
    }

    async function signOut() {
        const { error } = await db.auth.signOut();
        if (error) console.error(error);
    }

    // Einziger Einstiegspunkt der App: feuert beim Seitenaufruf (mit einer eventuell
    // gespeicherten Sitzung) und danach bei jedem Login und Logout.
    db.auth.onAuthStateChange((_event, session) => {
        showView(session);
        if (session) loadTodos();
    });
</script>
