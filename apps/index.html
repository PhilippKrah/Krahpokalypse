<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps</title>
    <meta name="theme-color" content="#4f46e5">
    <style>
        :root {
            --bg-color: #f7f9fc;
            --card-color: #ffffff;
            --primary-color: #4f46e5;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --muted-color: #6b7280;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-color);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -1px rgba(0,0,0,.06);
        }
        h1 { margin: 0 0 4px; font-size: 24px; color: var(--primary-color); text-align: center; }
        .subtitle { margin: 0 0 20px; text-align: center; color: var(--muted-color); font-size: 14px; }
        ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
        a.app {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 16px; min-height: 44px;
            border: 1px solid var(--border-color); border-radius: 12px;
            color: inherit; text-decoration: none;
        }
        a.app:hover, a.app:focus-visible { border-color: var(--primary-color); background: var(--bg-color); }
        .icon { font-size: 28px; line-height: 1; }
        .name { font-weight: 600; }
        .desc { font-size: 13px; color: var(--muted-color); margin-top: 2px; }
        .ext { margin-left: auto; color: var(--muted-color); }
    </style>
</head>
<body>
<div class="app-container">
    <h1>▦ Apps</h1>
    <p class="subtitle">Alles öffnet in einem neuen Fenster</p>
    <ul id="liste"></ul>
</div>

<script>
// Neue App = ein Eintrag mehr. Pfade relativ zu /apps/.
const APPS = [
    { icon: '🏡', name: 'Familien-Planer', desc: 'Gemeinsame Aufgabenliste', url: '../' },
    { icon: '🌲', name: 'Der Gutsverwalter', desc: 'Spiel – Waldgut im Gleichgewicht halten (Tastatur, am PC)', url: '../spiele/foerster/' }
];

document.getElementById('liste').innerHTML = APPS.map(a => `
    <li><a class="app" href="${a.url}" target="_blank" rel="noopener">
        <span class="icon">${a.icon}</span>
        <span><div class="name">${a.name}</div><div class="desc">${a.desc}</div></span>
        <span class="ext" aria-hidden="true">↗</span>
    </a></li>`).join('');
</script>
</body>
</html>
