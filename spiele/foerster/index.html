function mowArea(x,y,max){const out=[],seen=new Set([idx(x,y)]),q=[[x,y]];
  while(q.length&&out.length<max){const [cx,cy]=q.shift();const i=idx(cx,cy);if(grass[i]>=1&&light[i]>=0.55&&ground[i]!==G_PATH&&!fkind[i]){out.push(i);
    for(const [dx,dy] of DIRS){const nx=cx+dx,ny=cy+dy;if(inb(nx,ny)&&!seen.has(idx(nx,ny))){seen.add(idx(nx,ny));q.push([nx,ny])}}}}
  return out}
function toggleMow(){
  if(P.mowTask){P.mowTask=null;const t=G.tasks.find(t=>t.type==='maehen');toast(t?`Mähfläche abgesteckt – „Wiese mähen“ umfasst jetzt ${taskItems(t).length} Felder.`:'Keine Fläche abgesteckt.');guide('mow');return}
  P.mowTask=true;addMowTile(idx(P.x,P.y));
  toast('Pflock-Modus: Lauf über das Gras, das gemäht werden soll. [M] beendet.');
}
function addMowTile(i){if(!P.mowTask||grass[i]<1||ground[i]===G_PATH||fkind[i])return;const t=groupTask('maehen');if(t.items.includes(i))return;t.items.push(i);SFX.peg()}
function help(s){
  const c=s.cur;if(!c||s.state!=='work')return;
  const n=normOf(2);   // wie bisher 2 Arbeitspunkte
  if(c.kind==='single')c.task.done+=n;
  else if(c.kind==='item'||c.kind==='routine')c.left-=n;
  else c.left-=n*100/capOf(s);   // feste Spannen laufen in Minuten
}

function talk(s){
  if(s.id==='hannes')guide('talk_hannes');
  if(s.id==='jost')guide('talk_jost');
  if(s.id==='hannes'&&G.week===1&&!G.talkedIntro){G.talkedIntro=true;
    showCard(`<h2>Hannes, der Knecht</h2>
      <div class="rep">„Grüß Gott, Herr Verwalter! Ich bin der Hannes. Der Baron war ja ganz aus dem Häuschen.</div>
      <div class="rep">Schauen Sie sich ruhig alles an. Was getan werden muss, merken Sie sich im <b>Notizbuch [N]</b> – stellen Sie sich einfach davor <b>[Leertaste]</b>. Gras zum Mähen stecken Sie am besten mit Pflöcken ab <b>[M]</b>; die Wiese vor dem Hoftor hätt's nötig, die Hennen brauchen Heu.</div>
      <div class="rep">Der Sonntag gehört Ihnen: Da sehen Sie sich um, bis es dämmert. Am Sonntagabend verteilen Sie die Arbeit der Woche im Notizbuch, am Montag früh stehen wir hier auf dem Hof, und dann packen wir an. Wer nichts hört, macht sein Übliches.</div>
      <div class="rep">Grete kümmert sich um die Hühner und kocht, Liese hält Haus und Garten in Ordnung und geht für uns zum Markt. Der Jost, unser Holzfäller, ist noch im Dorf – nächste Woche ist er zurück.“</div>`,'[Leertaste] weiter');return}
  if(s.id==='jost'&&G.week>=2&&!G.talkedJost){G.talkedJost=true;
    showCard(`<h2>Jost, der Holzfäller</h2><div class="rep">„Tach, Herr Verwalter. Bin zurück. Zeigen Sie mir, was weg soll – ich mach ein Zeichen dran und fäll's.</div>
      <div class="rep">Nur eins: Wo ich Licht reinlass, kommt Gras. Und wo Gras ist, sind bald die Hasen. Und die Birken – die fliegen überall hin, wo's hell ist.“</div>`,'[Leertaste] weiter');return}
  const doing=doingText(s);let line;
  if(G.phase==='sonntag'||G.phase==='plan')line=G.phase==='plan'?'„Gleich ist Feierabend. Schreiben Sie auf, was wir am Montag tun sollen.“':'„Sonntag, Herr Verwalter. Wir haben frei.“';
  else if(G.phase==='mittag')line='„Brotzeit, Herr Verwalter.“';
  else if(doing)line=`„Bin grad dran: ${doing}.“`;
  else if(s.away)line='';
  else if(G.phase==='tag'&&s.state==='rest')line='„Im Moment hab ich nichts mehr zu tun – ich halte mich bereit.“';
  else if(G.phase==='abend')line=s.id==='grete'?`„Für heute bin ich fertig.${G.barnHay<G.chickens?' Aber das Heu wird knapp!':''}“`:'„Für heute bin ich fertig.“';
  else line='„Gleich geht\'s los.“';
  if(s.id==='liese'&&G.gardenBacklog>0)line+=' „Der Garten wächst mir über den Kopf.“';
  const vor=s.id==='hannes'&&(G.phase==='sonntag'||G.phase==='plan')&&G.wetter&&CFG.wetter&&line.endsWith('“');   // Sonntag: Hannes' Vorhersage für die kommende Werkwoche
  if(vor)line=line.slice(0,-1)+' '+wetterKnie(G.week)+'“';
  toast(`${s.name}: ${line}`,vor?8000:4500);
}

  let l;const tot=G.food.brot+G.food.eier+G.food.fleisch+G.food.beeren,wks=tot/Math.max(1,(eaters().length+1)*CFG.ration);   // Wochenrationen im Vorrat
  if(G.mealHungry&&G.mealHungry.length>1&&G.mealHungry.length===eaters().filter(s=>s.weak).length)l='Letzte Woche gab\'s nichts zu essen, nicht mal Brotzeit. Diese Woche sind alle zu schwach zum Arbeiten.';
  else if(G.mealHungry&&G.mealHungry.length)l=`${G.mealHungry.join(' und ')} ${G.mealHungry.length>1?'haben':'hat'} letzte Woche nichts abgekriegt und ${G.mealHungry.length>1?'bleiben':'bleibt'} diese Woche liegen.`;
  else if(G.coldMeal&&G.week>1&&!(G.mealHungry&&G.mealHungry.length))l='Letzte Woche gab\'s nur kalte Brotzeit. Satt sind wir, aber Freude macht das keine.';
  else if(n.spoiled&&Object.keys(n.spoiled).length)l=`Über Nacht ist was verdorben: ${Object.entries(n.spoiled).map(([k,v])=>v+' '+FOODS.find(f=>f[0]===k)[1]).join(', ')}. Schade drum.`;
  else if(st.gardenHares>0)l='Im Garten haben sich Hasen eingegraben!';
  else if(wks<1)l='Die Speisekammer ist so gut wie leer, Herr Verwalter. Soll ich zum Markt?';
  else if(wks<2)l='Das Essen reicht vielleicht noch für eine Woche.';
  else if(G.gardenBacklog>0&&st.gHoles>0)l='Ich komm mit den Löchern im Rasen nicht nach.';
  else if(G.gardenBacklog>0)l='Der Garten wächst mir über den Kopf.';
  else l='Im Haus und im Garten ist alles in Ordnung.';
  out.push(['Liese',l]);
  let o;
  if(G.frostSeit&&G.frostSeit===G.week-1)o='Über Nacht hat der Frost die Beeren erwischt – an den Sträuchern hängt nichts mehr.';
  else if(n.newFox)o='Nachts hört man jetzt einen weiteren Fuchs bellen.';
  else if(n.foxGone)o='Ein Fuchs scheint das Revier verlassen zu haben.';
  else if(n.darkBurrows)o='Auf einer Lichtung, die zuwächst, sind die Hasenbaue verlassen.';
  else if(st.hares>prev.hares*1.4&&st.hares-prev.hares>4)o='Überall raschelt es im Gras – die Hasen werden mehr.';
  else if(st.hares<prev.hares*0.7&&prev.hares>5)o='Die Wiesen sind still geworden. Kaum ein Hase.';
  else if(n.newBurrows)o='Irgendwo im Revier haben Hasen einen neuen Bau gegraben.';
  else o=['Ein ruhiger Morgen. Tau liegt auf den Wiesen.','Nebel hängt zwischen den Stämmen.','Ein Specht klopft irgendwo im Wald.','Die Amseln singen schon vor Sonnenaufgang.'][G.week%4];
  return{staff:out,obs:o};
}

// ================================================================ Rückkehr des Barons
function showEnding(){
  G.state='end';closeMenu();
  const s=stats(),items=[];

  add('haus',0.1,1-s.gPlants/6,'Kein Wildwuchs im Garten.','Da wachsen Bäume in meinem Garten!');

  if(scen.kind==='winter'){
    add('wunsch',0.25,G.barnWood/scen.wood,'Die Scheune ist voll Holz. Der Winter kann kommen.',G.barnWood<scen.wood*0.4?'Mit dem bisschen Holz erfrieren wir im Januar!':'Das Holz wird knapp werden bis zum Frühjahr.');
    add('wunsch',0.15,G.barnHares/scen.hareStock,'Hasen im Rauch – sehr vorausschauend.',G.barnHares?'Ein paar Hasen mehr im Vorrat hätten nicht geschadet.':'Kein einziger Hase im Vorrat? Was sollen wir im Februar essen?');
  } else if(scen.kind==='jagd'){

    add('wunsch',0.25,n<lo?n/lo:n>hi?1-(n-hi)/hi:1,'Hasen in Hülle und Fülle – die Herren werden staunen.',n<lo?'Kaum ein Hase im Revier. Die Jagd wird eine Blamage.':'Das ist keine Jagd mehr, das ist eine Plage.');
    add('wunsch',0.15,s.foxes/2,'Und der Fuchs ist auch da. Halali!',s.foxes?'Nur ein einziger Fuchs? Mager.':'Kein Fuchs im ganzen Revier? Unverzeihlich.');
  } else {
    add('wunsch',0.25,s.big/scen.big,'Prächtige Stämme. Der Händler wird zahlen.',s.big<scen.big*0.8?'Wo sind meine Bäume? Sie haben mir den Wald verheizt!':'Ein paar stattliche Stämme fehlen mir.');
    add('wunsch',0.15,G.barnWood/scen.wood,'Und Brennholz ist auch da.','Kein Brennholz in der Scheune.');
  }
  add('wald',0.08,s.hofBright/startStats.hofBright/0.8,'Die Hofwiese ist weit und licht.','Der Wald steht mir ja bis vor die Tür!');
  add('wald',0.08,s.big/startStats.big/0.75,'Der Wald steht gesund und dicht.','Wo ist mein Wald? Das ist ja ein Kahlschlag!');
  const sw=items.reduce((a,i)=>a+i.w,0),score=items.reduce((a,i)=>a+i.w*i.v,0)/sw;
  let verdict;
  if(score>=0.85)verdict=['Der Baron schüttelt Ihnen lange die Hand.','„Hervorragend. Ich wüsste mein Gut in keinen besseren Händen.“'];
  else if(score>=0.65)verdict=['Der Baron nickt knapp.','„Ordentlich. Sie dürfen bleiben.“'];
  else if(score>=0.4)verdict=['Der Baron runzelt die Stirn.','„Ich hatte mehr erwartet. Das wird von Ihrem Lohn abgezogen.“'];
  else verdict=['Der Baron läuft rot an.','„Packen Sie Ihre Sachen. Und zwar sofort!“'];
  const said=items.filter(i=>i.v>=0.85||i.v<0.6).sort((a,b)=>Math.abs(b.v-0.7)*b.w-Math.abs(a.v-0.7)*a.w).slice(0,6);
  let html=`<h2>Der Baron kehrt zurück</h2><div class="rep">Die Kutsche hält am Tor. Der Baron schreitet über sein Anwesen und blickt hinaus in den Wald …</div><ul>`;
  for(const i of said)html+=`<li class="${i.v>=0.6?'good':'bad'}">„${i.v>=0.6?i.good:i.bad}“</li>`;
  html+=`</ul><div class="rep"><b>${verdict[0]}</b><br>${verdict[1]}</div><h3>Aus dem Notizbuch des Barons</h3><ul>`;
  for(const g of [['haus','Das Anwesen'],['wunsch','Mein Wunsch'],['wald','Der Wald']])
    for(const i of items.filter(i=>i.group===g[0]))html+=`<li class="${i.v>=0.6?'good':'bad'}">${g[1]}: ${i.v>=0.6?i.good:i.bad}</li>`;
  html+='</ul>';
  const hints=[];
  if(lost&&G.hist.some(h=>h.hares<8))hints.push('Wo der Fuchs keine Hasen findet, holt er sich die Hennen – wenn der Stall offen steht.');
  if(lost)hints.push('Grete schließt den Stall nur, wenn ihr am Abend noch Kraft bleibt.');
  if(s.gardenHares||s.fBroken)hints.push('Hasen wandern zum Licht. Die größte Lichtung ist der Hof – oder eine, die man ihnen anderswo schafft.');
  if(s.hofBright<startStats.hofBright*0.85)hints.push('Birken fliegen auf jede helle Fläche. Wer die Hofwiese nicht pflegt, verliert sie.');
  if(s.big<startStats.big*0.8)hints.push('Jede Fällung bringt Licht – und mit dem Licht kommen Gras und Hasen.');
  if(hints.length)html+=`<h3>Randnotizen</h3><ul>${hints.slice(0,4).map(h=>`<li>${h}</li>`).join('')}</ul>`;
  html+=`<div style="text-align:center;margin-top:12px"><button onclick="hideCard(true);newGame()">Neue Anstellung (neues Spiel)</button></div>`;
  showCard(html,null);
}

// ================================================================ Fenster: Karten, Menü, Notizbuch, Meldungen
const overlay=document.getElementById('overlay'),menuEl=document.getElementById('menu');

overlay.addEventListener('click',e=>{if(G.state==='card'&&!cardYes&&e.target===overlay)hideCard()});
// Eine gewählte Option ausführen; am Sonntag kostet sie Spielminuten (o.min, sonst CFG.zeit.sonntag.aktion), sofern sie ihre Zeit nicht selbst gebucht hat
function runOpt(o){if(o.work&&G.phase==='sonntag'){toast(SUN_NOWORK,4200);return}actSpent=false;o.fn();if(G.phase==='sonntag'&&!actSpent)sundayAdvance(o.min!==undefined?o.min:CFG.zeit.sonntag.aktion);actSpent=false}
function openMenu(){const [fx,fy]=facing();const sub=subjectAt(fx,fy);if(!sub)return;const m=buildOptions(sub,fx,fy);if(!m.opts.length)return;

  menu={...m,sel:0};G.state='menu';renderMenu()}
function renderMenu(){menuEl.innerHTML=`<div class="t">${menu.title}</div>`+menu.opts.map((o,k)=>`<div class="o ${k===menu.sel?'sel':''}" data-k="${k}"><span style="color:#8595a1">${k+1}</span> ${o.label}</div>`).join('');
  menuEl.style.display='block';menuEl.querySelectorAll('.o').forEach(el=>el.onclick=()=>chooseMenu(+el.dataset.k))}

function chooseMenu(k){const o=menu.opts[k];closeMenu();runOpt(o)}
function toast(t,ms){const box=document.getElementById('toasts');const d=document.createElement('div');d.className='toast';d.textContent=t;box.appendChild(d);
  while(box.children.length>4)box.firstChild.remove();setTimeout(()=>{d.style.opacity=0;setTimeout(()=>d.remove(),700)},ms||2800)}

const book={tab:0,sel:0,col:0};
const TABS=['Tafel','Personal','Erkenntnisse','Briefe','Vorräte','Karte'];   // Tafel = Zeitleiste je Person + Aufgabenliste (Paket 13: Aufträge und Tagesplan zusammengelegt)
const STAFF_TXT={
  hannes:'Üblich: holt ein, was am Hof liegt.',

  grete:'Üblich: füttert morgens die Hennen mit Heu aus der Scheune, kocht vormittags das Mittagessen und schließt abends den Stall.',
  liese:'Üblich: hält Haus und Garten in Ordnung – Löcher, Unkraut, Rasen –, so weit ihre Kraft reicht. Geht zum Markt, wenn man sie schickt.'
};
const canList=s=>Object.values(TASKS).filter(d=>d.who[s.id]).map(d=>`${d.label.replace(/ \(.*$/,'')}${d.fixed?'':' '+Math.round(100/d.who[s.id])+' %'}${d.nurJung.includes(s.id)?' (nur Jungbäume)':''}`).join(', ');
const bookTasks=()=>G.tasks.filter(visibleTask);
const spoilNote=k=>{const n=spoilsWeek(k);return n?` <small style="color:#a0501e">(${n} verderben diese Woche)</small>`:''}
function moveTask(t,d){const list=bookTasks(),k=list.indexOf(t),o=list[k+d];if(!o)return;const a=G.tasks.indexOf(t),b=G.tasks.indexOf(o);[G.tasks[a],G.tasks[b]]=[G.tasks[b],G.tasks[a]]}
const dayTypeHtml=()=>{const w=G.dayType==='wald';return `<div class="rep"><b>${w?'Waldtag':'Hoftag'}</b> – ${w?'warmes Essen abends, keine Heimkehr zu Mittag: weite Wege nur einmal':'warmes Essen mittags, alle kommen zu Mittag heim: weite Wege doppelt'} <small>${boardMode()==='edit'?'[H] umschalten':'am Sonntag gewählt'}</small></div>`};
function toggleDayType(){if(!['sonntag','plan'].includes(G.phase)){toast('Hof- oder Waldtag legst du am Sonntag fest (Notizbuch [N], [H]).');return false}G.dayType=G.dayType==='wald'?'hof':'wald';return true}
// Ab wann die Tafel plant: in der Werkwoche tagsüber „ab jetzt“ (Rest des Tages vom Ist-Zustand, nur zu lesen), sonst die ganze (kommende) Werkwoche ab Tagesbeginn
const boardLive=()=>G.phase==='tag'||G.phase==='mittag';
function boardFrom(){return boardLive()?G.min:G.times.start}
// Rechte an der Tafel (Paket 12): Sonntag/Sonntagabend ('edit') alles änderbar. Werkwoche ('read'): nur lesen. Einzige Ausnahme 'person': Umplanen einer angesprochenen Person
// (book.replan = ihre ID, nur tagsüber): nur ihre Spalte, nur Aufgaben, die niemand anderem gehören (Sammelposten: sich selbst ein-/austragen), Reihenfolge nur in ihrer Liste.
function boardMode(){return G.phase==='sonntag'||G.phase==='plan'?'edit':book.replan&&boardLive()?'person':'read'}
function canEdit(t,s){
  const m=boardMode();if(!t||!s||m==='read'||!canDo(t.type,s.id,t))return false;
  if(m==='edit')return true;
  return s.id===book.replan&&(assigned(t,s.id)||!!TASKS[t.type].group||!crewOf(t).length)}
function denyEdit(t,s){
  const m=boardMode();
  if(m==='read')toast('In der Werkwoche änderst du den Plan nicht. Sprich eine Person an: „Umplanen“ – oder plane am Sonntag neu.',4200);
  else if(s&&s.id!==book.replan)toast(`Du planst gerade nur ${S(book.replan).name} um.`);
  else if(t)toast(`${taskTitle(t)}: ${whoName(t)} ist schon dafür eingeteilt – das ändert sich nur, wenn du ihn oder sie umplanst.`,4200)}
function assignCell(t,s){if(!t||!s||!canDo(t.type,s.id,t))return false;if(!canEdit(t,s)){denyEdit(t,s);return false}toggleAssign(t,s.id);return true}
// Reihenfolge ändern: Sonntag global (moveTask); Umplanen nur innerhalb der Liste der Person und nur zwischen Aufgaben ohne andere Zugeteilte (andere Listen bleiben so unberührt)
function moveOwn(t,s,d){
  const mine=G.tasks.filter(x=>visibleTask(x)&&assigned(x,s.id)),k=mine.indexOf(t),o=mine[k+d];
  if(k<0||!o||crewOf(t).length>1||crewOf(o).length>1)return false;
  const a=G.tasks.indexOf(t),b=G.tasks.indexOf(o);[G.tasks[a],G.tasks[b]]=[G.tasks[b],G.tasks[a]];return true}
function reorder(t,s,d){
  const m=boardMode();
  if(m==='edit'){moveTask(t,d);return true}
  if(m==='person'&&s&&s.id===book.replan&&assigned(t,s.id)&&moveOwn(t,s,d))return true;
  denyEdit(t,s);return false}
// Umplanen: Tafel nur für diese Person öffnen; beim Schließen (Esc/N) gilt die Änderung ab jetzt für ihren restlichen Tag
function openReplan(s){const l=bookTasks(),r=l.findIndex(t=>assigned(t,s.id));
  book.tab=0;book.col=staff.indexOf(s);book.sel=Math.max(0,r);book.replan=s.id;book.replanSig=staffSig(s);openBook(s.id)}
function finishReplan(){
  const s=S(book.replan),changed=!!s&&staffSig(s)!==book.replanSig;
  book.replan=null;closeBook();
  if(changed){withWayField(()=>replanPerson(s));toast(`${s.name} stellt sich um und macht ab jetzt das Neue.`)}}
// ---------------------------------------------------------------- Tafel: wer macht was
const avgItem=t=>{const its=taskItems(t);if(!its.length)return 1;let c=0;for(const it of its)c+=itemCost(t,it);return c/its.length};
const perStunde=(t,s)=>Math.round(60*rateOf(s,t.type)/normOf(avgItem(t))*10)/10;   // Sammelposten: Einheiten je Arbeitsstunde
const tempoText=s=>`Tempo ${Math.round(capOf(s))} %`;
function finishText(t,fin,from,u){
  const f=fin.get(t.id),d=TASKS[t.type];
  if(d.fixed){const w=effectiveWho(t);if(!w||w==='none')return `<i>${whoName(t)}</i>`;if(!f)return from>G.times.start?'<i>heute vorbei</i>':'<i class="warn">fällt aus</i>';return `bis ${unsureTxt(u)}${hm(f.end)}`}
  if(!crewOf(t).length)return '<i>offen</i>';
  if(!f)return '<i class="warn">kommt heute nicht dran</i>';
  if(f.left>0.01)return d.group?`<i class="warn">${Math.max(1,Math.round(f.left/normOf(avgItem(t))))} ${d.unit} bleiben</i>`:`<i class="warn">nicht fertig – ${Math.round(100*(1-f.left/normOf(singleCost(t))))} % getan</i>`;
  return 'fertig '+unsureTxt(u)+hm(f.end);
}
// ---------------------------------------------------------------- Zeitleiste (Paket 13): je Person eine Zeile, Balken proportional auf gemeinsamer Stundenachse
// Segmente aus dem Trockenlauf (planAll) – reine Darstellung, keine eigene Planung. Klick/Tipp auf Balken oder Namen wählt Person und (falls vorhanden) Aufgabe.
// Weg = hell gestreift (vorn im Segment; bei zusammengefassten Sammelposten nur die Summe der Wegminuten), Arbeit kräftig, feste Routine grün, Übliches/Pause/Heimweg/ruht hell.
const SEG_CLASS={fest:'sg-fest',work:'sg-work',std:'sg-std',heim:'sg-heim',pause:'sg-pause',frei:'sg-frei'};
const attrText=x=>String(x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
// Verfügbarkeit laut Plan (der Trockenlauf „nächste Woche“ kennt sie für die kommende Woche), sonst die der laufenden
const availIn=(pa,s)=>pa&&pa.avail&&s.id in pa.avail?pa.avail[s.id]:s.available;
function axisOf(pa){
  let t0=Infinity,t1=pa.ende||G.times.ende;
  for(const id in pa.plans)for(const e of pa.plans[id]){t0=Math.min(t0,e.from);t1=Math.max(t1,e.to)}
  if(!isFinite(t0))t0=G.times.start;
  t1=Math.max(Math.ceil(t1/60)*60,t0+60);return{t0,t1,span:t1-t0}}
function segHtml(e,ax,row,col,hl,u){
  const dur=e.to-e.from;if(dur<=0)return '';
  const p=100/ax.span,wk=e.walk?Math.min(dur,Math.round(e.walk)):0,title=`${unsureTxt(u)}${hm(e.from)}–${hm(e.to)} ${e.label}${wk?` (Weg ${wk} Min)`:''}`;
  return `<span class="sg ${SEG_CLASS[e.kind]||'sg-std'}${hl?' hl':''}${u===2?' unk':u===1?' ca':''}" style="left:${((e.from-ax.t0)*p).toFixed(2)}%;width:${(dur*p).toFixed(2)}%"${row>=0?` data-sr="${row}"`:''} data-sc="${col}" title="${attrText(title)}">${wk?`<i class="wk" style="width:${(wk/dur*100).toFixed(1)}%"></i>`:''}<em>${e.label}</em></span>`}
// Details der gewählten Aufgabe (bzw. im Appell der gewählten Person) in einer Zeile
function detailHtml(pa,list,sel,col,from,compact){
  const sp=staff[col];

function bookKey(e){
  if(G.phase==='plan'&&(e.code==='Escape'||e.code==='KeyN'||e.code==='KeyT')){planFinishAsk();return}   // Sonntagabend: Schließen = Planung abschließen (Bestätigung)
  if(e.code==='Escape'||e.code==='KeyN'){if(book.replan)finishReplan();else closeBook();return}
  if(/^Digit[1-9]$/.test(e.code)&&+e.code.slice(5)<=TABS.length){book.tab=+e.code.slice(5)-1;renderBook();return}
  if(e.code==='Tab'){book.tab=(book.tab+1)%TABS.length;renderBook();return}
  if(e.code==='KeyH'){if(toggleDayType())renderBook();return}
  if(book.tab===5){   // Gutskarte: Pfeile bewegen den Cursor (Umschalt = 5 Felder)
    const d=KEYDIR[e.code],k=e.shiftKey?5:1;
    if(d)karteWahl(book.kx+(d==='right'?k:d==='left'?-k:0),book.ky+(d==='down'?k:d==='up'?-k:0));
    return}
  if(book.tab!==0)return;
  const list=bookTasks(),n=list.length;if(!n)return;const t=list[book.sel],sp=staff[book.col];
  const d=KEYDIR[e.code];
  if(d==='up'||d==='down'){const k=d==='up'?-1:1;if(e.shiftKey){if(reorder(t,sp,k))book.sel=Math.max(0,bookTasks().indexOf(t))}else book.sel=clamp(book.sel+k,0,n-1)}
  else if(d==='left'||d==='right'){if(!book.replan)book.col=clamp(book.col+(d==='left'?-1:1),0,staff.length-1)}
  else if(e.code==='Space'||e.code==='KeyE')assignCell(t,sp);
  else if(e.code==='Delete'||e.code==='Backspace'||e.code==='KeyX'){
    if(boardMode()!=='edit')denyEdit(t,sp);
    else if(!TASKS[t.type].auto){removeTask(t);book.sel=clamp(book.sel,0,bookTasks().length-1)}}
  renderBook();
}

// Je älter das Wissen, desto blasser (CFG.karte), die alte Karte am blassesten. Auswahl: Pfeiltasten (Umschalt = 5 Felder, am Handy das Steuerkreuz) oder Klick/Antippen; Standort = roter Rahmen.
let kartSc=3;
function karteText(x,y){
  const i=idx(x,y),w=kartWo[i],k=kartKl[i],ort=where(x,y);
  if(!w)return `<b>${ort}</b>: unbekannt – hier warst du noch nie, und die alte Karte kennt die Stelle nicht.`;
  if(w<0)return `<b>${ort}</b>: ${KL_NAMEN[k]} – so steht es auf der alten Karte des Vorgängers (von vor Jahren, vielleicht längst anders).`;
  const d=weekNow()-w;
  return `<b>${ort}</b>: ${KL_NAMEN[k]} – zuletzt gesehen Woche ${w}${d===0?' (diese Woche)':d>CFG.karte.altWochen?' (lange her, vielleicht längst anders)':''}.`}
function karteHtml(){
  if(book.kx===undefined){book.kx=P.x;book.ky=P.y}
  const used=new Set();for(let i=0;i<N;i++)if(kartWo[i])used.add(kartKl[i]);

  return `<div class="rep"><small>Deine Gutskarte zeigt nur, was du weißt: was du selbst gesehen hast, wo deine Leute gearbeitet haben, und die alte Karte deines Vorgängers. Je blasser, desto länger her. Verändert sich etwas, steht es erst richtig drauf, wenn du wieder hinsiehst.</small></div>

function karteDraw(cv,sc){
  const g=cv.getContext('2d'),K=CFG.karte,wk=weekNow();
  g.globalAlpha=1;g.fillStyle='#d6c7a0';g.fillRect(0,0,W*sc,H*sc);

  rim((P.x-1)*sc,(P.y-1)*sc,3*sc,3*sc,'#d04648');rim((P.x-1)*sc+1,(P.y-1)*sc+1,3*sc-2,3*sc-2,'#d04648');   // Standort des Verwalters
  rim(book.kx*sc-2,book.ky*sc-2,sc+4,sc+4,'#2a1a10');rim(book.kx*sc-1,book.ky*sc-1,sc+2,sc+2,'#fff4dc')}   // Cursor
function karteRefresh(){

function karteBind(){

function karteWahl(x,y){book.kx=clamp(Math.round(x),0,W-1);book.ky=clamp(Math.round(y),0,H-1);karteRefresh()}

// ================================================================ Appell: morgendliche Arbeitsverteilung auf dem Hof
const appellEl=document.getElementById('appell');
const REPLIES={hannes:['Wird gemacht, Herr Verwalter.','Jawohl.','Geht klar.'],jost:['Mach ich.','Na dann – Axt raus.','Jo.'],grete:['Na gut.','Wird gemacht.','Aber erst die Hennen, gell?'],liese:['Sehr wohl.','Jawohl, Herr Verwalter.','Gern.']};
const FOODS=[['brot','Brot'],['eier','Eier'],['fleisch','Fleisch'],['beeren','Beeren']];
const eaters=()=>staff.filter(s=>G.week>=s.from);
function defaultMeal(){return FOODS.map(f=>f[0]).filter(k=>G.food[k]>0).sort((a,b)=>G.food[b]-G.food[a]).slice(0,2)}
// Wochenration: jede Person (und der Verwalter) braucht CFG.ration Portionen je Woche – ohne Speiseplan, automatisch aus den beiden reichlichsten Zutaten (defaultMeal).
// Wer leer ausgeht, ist die nächste Woche zu schwach zum Arbeiten. Reihenfolge beim Austeilen: wer kocht, isst zuerst.
// Warmes Essen: Hoftag mittags, Waldtag abends (Tempo-Bonus bei zwei Zutaten: Hoftag ab dem Mittag, Waldtag erst am nächsten Morgen, bonusNext); kalte Brotzeit als Rückfall.
const eatOrder=ppl=>{const c=cookOf();return [c,...['grete','liese','hannes','jost'].map(S)].filter((s,k,a)=>s&&ppl.includes(s)&&a.indexOf(s)===k)};
function serveMeal(){
  const sel=defaultMeal(),ppl=eaters(),mouths=ppl.length+1,rat=CFG.ration;let need=mouths*rat,got=0,k=0;const take={};
  let pool=sel.filter(f=>G.food[f]>0);
  while(need>0&&pool.length){const f=pool[k%pool.length];takeFood(f,1);take[f]=(take[f]||0)+1;need--;got++;k++;pool=pool.filter(x=>G.food[x]>0)}
  const fed=Math.floor(got/rat),order=eatOrder(ppl);
  order.forEach((s,i)=>{s.weakNext=i>=fed&&!s.weak});   // wer diese Woche schon ausgeruht hat, ist nächste Woche wieder dabei
  G.mealHungry=order.filter(s=>s.weakNext).map(s=>s.name);
  G.ateWithStaff=fed>order.length;if(G.ateWithStaff&&G.dayType!=='wald')G.kraft+=CFG.mealKraft;   // der Verwalter isst als Letzter; Kraft nützt nur, wenn danach noch gearbeitet wird
  const good=Object.keys(take).length>=2&&fed>0;
  if(G.dayType==='wald')G.bonusNext=good;else G.goodMeal=good;
  return take;
}
function cookMeal(cook){
  if(G.cooked)return;G.cooked=true;G.coldMeal=false;
  const take=serveMeal(),what=Object.keys(take).map(k=>FOODS.find(f=>f[0]===k)[1]),hof=G.dayType!=='wald',good=hof?G.goodMeal:G.bonusNext;
  const msg=`${cook?cook.name:'Die Köchin'} ruft zum ${hof?'Mittagessen':'Abendessen'}: ${what.length?what.join(' und '):'leider nichts – die Kammer ist leer'}.${G.mealHungry.length?' '+G.mealHungry.join(', ')+' geh'+(G.mealHungry.length>1?'en':'t')+' leer aus.':''}`;
  log(msg);if(G.state==='play'&&!ffMode){toast(msg,4500);

// Kalte Brotzeit aus haltbarem Vorrat: Brot, Beeren, notfalls Geräuchertes aus der Räucherkammer. need Portionen; liefert, was zusammenkam
function takeCold(need){
  let got=0,smoked=0;const take={};
  for(const k of ['brot','beeren']){const n=takeFood(k,Math.min(need,G.food[k]));if(n){take[k]=n;need-=n;got+=n}}
  while(need>0&&(G.smokedLeft>0||G.barnHares>0)){if(!G.smokedLeft){G.barnHares--;G.smokedLeft=CFG.meatPortion;smoked++}const n=Math.min(need,G.smokedLeft);G.smokedLeft-=n;need-=n;got+=n;take.geraeuchert=(take.geraeuchert||0)+n}
  return{got,smoked,take};
}
const coldWhat=take=>[take.brot?'Brot':null,take.beeren?'Beeren':null,take.geraeuchert?'Geräuchertes':null].filter(Boolean);

function coldMeal(){
  if(G.cooked)return;G.cooked=true;G.coldMeal=true;G.ateWithStaff=false;G.goodMeal=false;G.bonusNext=false;
  const ppl=eaters(),rat=CFG.ration,{got,smoked,take}=takeCold(ppl.length*rat);

  order.forEach((s,i)=>{s.weakNext=i>=fed&&!s.weak});
  G.mealHungry=order.filter(s=>s.weakNext).map(s=>s.name);
  const what=coldWhat(take);
  const msg=`Kein warmes Essen heute – ${what.length?'es gibt kalte Brotzeit: '+what.join(', '):'und auch nichts für eine Brotzeit'}.${smoked?` Dafür musste ${smoked>1?smoked+' geräucherte Hasen':'ein geräucherter Hase'} aus der Räucherkammer dran glauben.`:''}${G.mealHungry.length?' '+G.mealHungry.join(', ')+' geh'+(G.mealHungry.length>1?'en':'t')+' leer aus.':''}`;
  log(msg);if(G.state==='play'&&!ffMode)toast(msg,5000);

const rnd=Math.random;
function freeNear(x,y,r){const c=[];for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(!dx&&!dy)continue;const X=x+dx,Y=y+dy;if(!inb(X,Y))continue;const i=idx(X,Y);
  if(walkable(X,Y)&&!feat[i]&&ground[i]!==G_PATH&&ground[i]!==G_BRIDGE&&ground[i]!==G_FORD)c.push([X,Y])}return c.length?c[Math.floor(rnd()*c.length)]:null}
function gardenSpot(){for(let k=0;k<100;k++){const x=COOP[0]+Math.floor(rnd()*9)-4,y=COOP[1]+Math.floor(rnd()*6);if(inGarden(x,y)&&walkable(x,y))return[x,y]}return[COOP[0],COOP[1]+1]}
function spawnCritters(){
  const V=G.vis;V.hares=[];V.foxes=[];V.chickens=[];
  for(const b of burrows){if(!b.alive||b.n<=0)continue;for(let k=0;k<Math.min(3,b.n);k++){const s=freeNear(b.x,b.y,2);if(s)V.hares.push({x:s[0],y:s[1],tx:s[0],ty:s[1],hx:b.x,hy:b.y,face:rnd()<.5?1:-1,rest:rnd()*3,anim:rnd()*5,flee:false})}}
  for(const f of foxes){if(f.alive&&rnd()<0.5){const s=freeNear(f.den[0],f.den[1],1);if(s)V.foxes.push({x:s[0],y:s[1],face:rnd()<.5?1:-1,shown:true})}}
  for(let k=0;k<G.chickens;k++){const s=gardenSpot();V.chickens.push({x:s[0],y:s[1],tx:s[0],ty:s[1],face:1,rest:rnd()*3,peck:0})}
}
function critterPass(x,y){return inb(x,y)&&walkable(x,y)&&fkind[idx(x,y)]!==FK_GATE}
function stepTo(e,dt,sp){const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy),m=sp*dt;if(Math.abs(dx)>0.01)e.face=dx>0?1:-1;if(d<=m){e.x=e.tx;e.y=e.ty;return true}e.x+=dx/d*m;e.y+=dy/d*m;return false}
function updateCritters(dt){
  const V=G.vis;
  for(const h of V.hares){h.anim+=dt;
    if(h.rest>0){h.rest-=dt;if(dist(h.x,h.y,P.px,P.py)<3)h.rest=0;else continue}
    if(!stepTo(h,dt,h.flee?3.6:2.2))continue;h.x=Math.round(h.x);h.y=Math.round(h.y);
    const near=dist(h.x,h.y,P.px,P.py)<3.2;h.flee=near;
    if(!near&&rnd()<0.45){h.rest=0.6+rnd()*3;continue}
    let best=null,bs=-1e9;
    for(const [dx,dy] of DIRS){const nx=h.x+dx,ny=h.y+dy;if(!critterPass(nx,ny))continue;
      let s=rnd();if(near)s+=dist(nx,ny,P.px,P.py)*2;else s-=Math.max(0,dist(nx,ny,h.hx,h.hy)-3);if(s>bs){bs=s;best=[nx,ny]}}
    if(best){h.tx=best[0];h.ty=best[1]}else h.rest=1}
  for(const f of V.foxes)if(f.shown&&dist(f.x,f.y,P.px,P.py)<5){f.shown=false;SFX.bark()}
  for(const c of V.chickens){c.peck-=dt;if(c.rest>0){c.rest-=dt;continue}if(!stepTo(c,dt,1.2))continue;c.x=Math.round(c.x);c.y=Math.round(c.y);
    if(rnd()<0.5){c.rest=1+rnd()*3;if(rnd()<0.6)c.peck=0.6;continue}
    const o=DIRS.map(([dx,dy])=>[c.x+dx,c.y+dy]).filter(([x,y])=>inGarden(x,y)&&critterPass(x,y)&&dist(x,y,COOP[0],COOP[1])<7);
    if(o.length){const p=o[Math.floor(rnd()*o.length)];c.tx=p[0];c.ty=p[1]}}
}

    <tr><td>Essen</td><td>Brot ${G.food.brot} · Eier ${G.food.eier} · Fleisch ${G.food.fleisch} · Beeren ${G.food.beeren} · ${G.taler} Taler · schwach ${staff.filter(x=>x.weak).map(x=>x.name).join(',')||'–'}</td></tr>
    <tr><td>Hennen</td><td>${G.hensInside?'drinnen':'draußen'} · gefressen ${G.hensFoodOk?'ja':'nein'}</td></tr>
    <tr><td>Ziel</td><td>${scen.kind==='winter'?`Holz ${scen.wood}, Hasen ${scen.hareStock}`:scen.kind==='jagd'?`Hasen ${scen.hunt}–${scen.hunt*3}, Füchse ≥2`:`große Bäume ≥${scen.big}, Holz ${scen.wood}`}</td></tr></table>
    <h4>Verlauf</h4><canvas id="dbgChart" width="380" height="150"></canvas>
    <div><span style="color:#dad45e">Hasen</span> · <span style="color:#d27d2c">Füchse×5</span> · <span style="color:#6daa2c">große Bäume/10</span> · <span style="color:#b6e07a">Setzlinge/10</span> · <span style="color:#deeed6">hell/40</span> · <span style="color:#d04648">Hennen×5</span> · <span style="color:#597dce">- - Wachstum (Kurve)</span> · <span style="color:#d2aa99">- - Wurf (Kurve)</span></div>
    <h4>Letzte Woche (Naturschritte)</h4><div class="log">${G.dbg.log.slice(-80).join('\n')||'–'}</div>`;
  const c=document.getElementById('dbgChart').getContext('2d');c.fillStyle='#140c1c';c.fillRect(0,0,380,150);
  const ser=[['hares',1,'#dad45e'],['foxes',5,'#d27d2c'],['big',0.1,'#6daa2c'],['sap',0.1,'#b6e07a'],['bright',1/40,'#deeed6'],['chickens',5,'#d04648']];
  let max=10;for(const h of hist)for(const [k,f] of ser)max=Math.max(max,h[k]*f);
  for(const [k,f,col] of ser){c.strokeStyle=col;c.beginPath();hist.forEach((h,n)=>{const x=10+n*(360/Math.max(1,CFG.zeit.wochen)),y=140-h[k]*f/max*130;n?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}
  if(CFG.herbst){   // die Herbstkurve je Woche (gestrichelt, auf 1,5 skaliert): in Wochenmitte der Woche, in der sie wirkt
    c.setLineDash([3,3]);for(const [fn,col] of [[season,'#597dce'],[wurf,'#d2aa99']]){c.strokeStyle=col;c.beginPath();
      for(let w=1;w<=CFG.zeit.wochen;w++){const x=10+(w-0.5)*(360/Math.max(1,CFG.zeit.wochen)),y=140-fn(w)/1.5*130;w>1?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}
    c.setLineDash([])}
  if(G.wetter&&CFG.wetter){c.fillStyle='#8595a1';c.font='9px monospace';   // Wochenwetter unter dem Verlauf: t trocken · r Regen · s Sturm · f Frost, n Nebel
    for(let w=1;w<=CFG.zeit.wochen;w++)c.fillText(wetter(w)[0]+(wetterNebel(w)?'n':''),10+(w-0.5)*(360/Math.max(1,CFG.zeit.wochen))-4,148)}
}
function drawDebugLayers(x0,y0,x1,y1){
  const TS=T*SC,Ly=G.dbg.layers;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=idx(x,y),sx=x*TS-camX,sy=y*TS-camY;
    if(Ly.has('licht')){const l=light[i];ctx.fillStyle=`rgba(${Math.round(255*l)},${Math.round(210*l)},30,0.5)`;ctx.fillRect(sx,sy,TS,TS)}
    if(Ly.has('kronen')){let top=0;const c=covers[i];for(let k=0;k<c.length;k+=2)top=Math.max(top,c[k]);if(top){ctx.fillStyle=`hsla(${200-top*20},70%,50%,0.45)`;ctx.fillRect(sx,sy,TS,TS)}}
    if(Ly.has('geruch')&&scent[i]>0){ctx.fillStyle=`rgba(255,40,40,${Math.min(0.6,scent[i]/25)})`;ctx.fillRect(sx,sy,TS,TS)}
    if(Ly.has('kenntnis')){const kv=kenn[G.dbg.kenWho||'P'][i];if(kv){ctx.fillStyle=`rgba(60,200,255,${(0.1+0.5*kv/KN_MAX).toFixed(2)})`;ctx.fillRect(sx,sy,TS,TS)}}}
  ctx.font=`bold ${5*SC}px monospace`;
  if(Ly.has('reviere')){for(const b of burrows){if(!b.alive)continue;const cx=(b.x+0.5)*TS-camX,cy=(b.y+0.5)*TS-camY;
      ctx.strokeStyle='#dad45e';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,4.5*TS,0,7);ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(`${b.n}`,cx-4,cy-8)}
    for(const f of foxes){if(!f.alive)continue;const cx=(f.den[0]+0.5)*TS-camX,cy=(f.den[1]+0.5)*TS-camY;ctx.fillStyle='#ff9a3c';ctx.fillText(`F${f.id} H${f.hunger.toFixed(1)}`,cx-20,cy-8)}}
  if(Ly.has('wege'))for(const p of G.dbg.paths){ctx.strokeStyle=p.type==='fuchs'?(p.caught?'#ff4030':'#ffaa40'):(p.lost?'#8595a1':'#ffffff');ctx.lineWidth=2;ctx.setLineDash(p.lost?[4,4]:[]);
    ctx.beginPath();p.path.forEach(([x,y],k)=>{const px=(x+0.5)*TS-camX,py=(y+0.5)*TS-camY;k?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();ctx.setLineDash([])}
  if(Ly.has('auftraege'))for(const t of G.tasks){const c=crewOf(t);if(!c.length)continue;const [tx,ty]=taskPos(t),cx=(tx+0.5)*TS-camX,cy=(ty+0.5)*TS-camY;ctx.fillStyle='#ff00ff';ctx.fillText(c.map(id=>S(id).name[0]).join(''),cx-3,cy)}
}

// ================================================================ Touch-Steuerung (nur Fingerbedienung)
// Die Knöpfe senden dieselben Tastencodes wie die Tastatur – die Spiellogik bleibt unberührt.
// REGEL: Jede neue Taste im Spiel braucht hier eine Zeile (code = KeyboardEvent.code, in = Spielzustände, in denen der Knopf erscheint).
// mod:'shift' = Umschalter, der bei den Pfeilen Shift mitschickt (Reihenfolge ändern).
const TOUCH_TASTEN=[
  {label:'Aktion',code:'Space',big:true,in:['play','menu','card','book','appell']},
  {label:'✕',code:'Escape',in:['menu','card','book','appell']},
  {label:'Pflock',code:'KeyM',in:['play']},
  {label:'Buch',code:'KeyN',in:['play']},
  {label:'Heimgehen',code:'KeyT',in:['play']},
  {label:'Hof/Wald',code:'KeyH',in:['book']},
  {label:'Ton',code:'KeyL',in:['play']},
  {label:'Reiter',code:'Tab',in:['book']},
  {label:'Streichen',code:'KeyX',in:['book']},
  {label:'Fertig',code:'Enter',in:['appell']},
  {label:'⇧ Reihenfolge',mod:'shift',in:['book']},
];
const TOUCH_STEUERKREUZ_IN=['play','menu','book','appell'];
// Tastennamen in Spieltexten durch die Knopfnamen ersetzen (nur Touch; Reihenfolge zählt, Spezielles zuerst)
const TOUCH_TEXT=[
  [/\[Leertaste\]/g,'[Aktion]'],[/Leertaste/g,'Aktion'],[/\[N\]/g,'[Buch]'],[/\[T\]/g,'[Heimgehen]'],[/\[H\]/g,'[Hof/Wald]'],[/H Hof-\/Waldtag/g,'Hof/Wald-Knopf'],[/\[M\]/g,'[Pflock]'],[/\[L\]/g,'[Ton]'],[/\[Esc\]/g,'[✕]'],
  [/Esc schließen/g,'✕ schließen'],[/Esc fertig/g,'✕ fertig'],[/Shift\+↑↓/g,'⇧ + ↑↓'],[/Entf streichen/g,'Streichen'],[/1–\d Reiter/g,'Reiter-Knopf'],[/Enter:/g,'Fertig:'],
  [/WASD\/Pfeile laufen/g,'Steuerkreuz links: laufen'],
];
const TOUCH=matchMedia('(pointer:coarse)').matches||/[?&]touch\b/.test(location.search);
const tkPortrait=()=>TOUCH&&innerHeight>innerWidth;   // im Hochformat steht das Spiel still
let tkState,tkDir=null,tkShift=false,tkBtns=[],tkPager=null;
function tkSend(type,code){dispatchEvent(new KeyboardEvent(type,{code,key:code,shiftKey:tkShift,bubbles:true,cancelable:true}))}
function tkSetDir(d){if(d===tkDir)return;const C={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'};
  if(tkDir)tkSend('keyup',C[tkDir]);tkDir=d;if(d)tkSend('keydown',C[d]);document.getElementById('tk-dpad').dataset.d=d||''}
function touchSync(){if(!TOUCH)return;const s=G?G.state:null;if(s===tkState)return;tkState=s;
  tkSetDir(null);tkShift=false;if(s!=='card')tkPager=null;
  for(const b of tkBtns){b.el.style.display=b.in.includes(s)?'':'none';b.el.classList.remove('on')}
  document.getElementById('tk-dpad').style.display=TOUCH_STEUERKREUZ_IN.includes(s)?'':'none'}
// Tastenbelegungs-Hinweise (Legenden, Tastenkasten) fallen am Handy weg
function tkStrip(root){if(root.nodeType!==1)return;
  const hit=el=>el.matches('.keys,.legend')||(/^↑↓/.test(el.textContent.trim())&&el.textContent.length<220);
  if(hit(root)){root.remove();return}
  root.querySelectorAll('.keys,.legend,.cont,div').forEach(el=>{if(hit(el))el.remove()})}
// Karten ohne Scrollen: ist der Text länger als der Bildschirm, wird er in Seiten geteilt (Aktion oder Antippen = nächste Seite)
function tkPaginate(paper){
  if(G.state!=='card'||paper.dataset.pg)return;paper.dataset.pg='1';
  if(paper.scrollHeight<=paper.clientHeight+1)return;
  const cont=paper.querySelector(':scope>.cont'),blocks=[...paper.children].filter(c=>c!==cont),cs=getComputedStyle(paper);
  const room=paper.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-44;
  const R=blocks.map(b=>b.getBoundingClientRect()),pages=[];let cur=[],top=0;
  blocks.forEach((b,i)=>{if(cur.length&&R[i].bottom-top>room){pages.push(cur);cur=[]}if(!cur.length)top=R[i].top;cur.push(b)});
  pages.push(cur);
  if(pages.length<2)return;   // ein einzelner riesiger Block: Scrollen bleibt als Rückfall
  const tooBig=pages.some(pg=>pg.length===1&&R[blocks.indexOf(pg[0])].height>room);
  paper.style.overflowY=tooBig?'auto':'hidden';
  const ind=document.createElement('div');ind.className='cont';paper.appendChild(ind);
  let k=0;
  const show=()=>{blocks.forEach(b=>b.classList.toggle('tk-weg',!pages[k].includes(b)));const last=k===pages.length-1;
    if(cont)cont.classList.toggle('tk-weg',!last);ind.classList.toggle('tk-weg',last);ind.textContent=`[Aktion] weiterlesen (${k+1}/${pages.length})`;paper.scrollTop=0};
  const pager={paper,next(){if(k>=pages.length-1)return false;k++;show();return true}};
  paper.addEventListener('click',()=>{if(tkPager===pager)pager.next()});
  tkPager=pager;show()}
function tkTextNode(n){let v=n.nodeValue,o=v;for(const [re,r] of TOUCH_TEXT)v=v.replace(re,r);if(v!==o)n.nodeValue=v}
function tkTextTree(root){if(root.nodeType===3){tkTextNode(root);return}
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);for(let n=w.nextNode();n;n=w.nextNode())tkTextNode(n)}
if(TOUCH){
  document.documentElement.classList.add('touch');
  const pad=document.getElementById('tk-dpad'),small=document.getElementById('tk-small'),right=document.getElementById('tk-right');
  let ptr=null;
  const dirOf=e=>{const r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    if(Math.hypot(dx,dy)<r.width*0.14)return null;return Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')};
  pad.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();ptr=e.pointerId;pad.setPointerCapture(ptr);tkSetDir(dirOf(e))});
  pad.addEventListener('pointermove',e=>{if(e.pointerId===ptr)tkSetDir(dirOf(e))});
  for(const t of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(t,e=>{if(e.pointerId===ptr){ptr=null;tkSetDir(null)}});
  for(const t of TOUCH_TASTEN){
    const el=document.createElement('button');el.type='button';el.tabIndex=-1;el.className='tk'+(t.big?' big':'');el.textContent=t.label;
    (t.big?right:small).appendChild(el);tkBtns.push({el,in:t.in});
    if(t.mod){el.addEventListener('pointerdown',e=>{e.preventDefault();tkShift=!tkShift;el.classList.toggle('on',tkShift)});continue}
    let down=false;
    el.addEventListener('pointerdown',e=>{e.preventDefault();
      if(t.code==='Space'&&G.state==='card'&&tkPager&&tkPager.paper.isConnected&&tkPager.next())return;   // erst alle Seiten der Karte lesen
      el.setPointerCapture(e.pointerId);down=true;el.classList.add('down');tkSend('keydown',t.code)});
    for(const ev of ['pointerup','pointercancel'])el.addEventListener(ev,()=>{if(!down)return;down=false;el.classList.remove('down');tkSend('keyup',t.code)});
  }
  right.insertBefore(small,right.firstChild);   // kleine Knöpfe oben, große Aktion unten
  addEventListener('contextmenu',e=>e.preventDefault());
  new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')tkTextNode(m.target);else m.addedNodes.forEach(n=>{tkTextTree(n);tkStrip(n);if(n.nodeType===1&&n.classList.contains('paper'))tkPaginate(n)})}})
    .observe(document.body,{childList:true,subtree:true,characterData:true});
  tkTextTree(document.body);
  // Leitfaden: antippen klappt ihn auf/zu (anfangs zu)
  const gd=document.getElementById('guide');gd.classList.add('zu');gd.addEventListener('click',()=>gd.classList.toggle('zu'));
  // Vollbild (Android/iPad; iPhone kann das nicht – dort hilft „Zum Home-Bildschirm“)
  const fb=document.getElementById('tk-full'),de=document.documentElement,fsReq=de.requestFullscreen||de.webkitRequestFullscreen;
  const fsOn=()=>document.fullscreenElement||document.webkitFullscreenElement;
  if(fsReq){fb.style.display='block';
    fb.addEventListener('click',()=>{if(fsOn()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
      else{const r=fsReq.call(de);Promise.resolve(r).then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{})}});
    for(const ev of ['fullscreenchange','webkitfullscreenchange'])document.addEventListener(ev,()=>{fb.textContent=fsOn()?'Vollbild aus':'Vollbild'})}
}

// ================================================================ Hauptschleife
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);   // zuerst: ein Fehler unten darf die Schleife nicht anhalten
  const dt=tkPortrait()?0:Math.min(0.05,(now-last)/1000);last=now;
  if(G&&G.state==='play'){updatePlayer(dt);advanceDay(dt);updateStaff(dt);updateCritters(dt);try{ambience(dt)}catch(e){console.warn('Ton:',e.message)}
    if(G.phase==='abend'&&G.min>=CFG.zeit.schlafGrenze)fallAsleepOutside(false)}   // Schlafgrenze: das Einschlafen löst die Hauptschleife aus (nicht advanceDay/dayTick)
  else if(G&&G.state==='appell'){updateStaff(dt);updateCritters(dt)}
  touchSync();draw(now);hud();
  if(dbgOpen&&now-dbgT>1000){dbgT=now;refreshDebug()}
}
window.__dbg={get G(){return G},get P(){return P},stats,dbgDays,CFG,get trees(){return trees},get burrows(){return burrows},get foxes(){return foxes},get staff(){return staff},sleep,nightStep,weekStep};
newGame();
requestAnimationFrame(frame);
</script>
