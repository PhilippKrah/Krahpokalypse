<!DOCTYPE html>
<!--
  01 – Der Gutsverwalter (zweiter Wurf, Konzept: KONZEPT.md; erster Wurf: v1-foerster.html)
  Idee: Als junger Gutsverwalter hältst du zwölf Wochen ein lebendiges Waldgut im Gleichgewicht.
  Du beobachtest, markierst Aufgaben und teilst dein Personal ein; selbst anpacken kostet Kraft.
  Zwischen den Wochen rechnet die Natur (7 Naturschritte je Wochenschritt): Kronen wachsen ins Licht, Hasen wandern zu Lichtungen, Füchse streifen umher.
  Zeit: Eine Spieluhr in Spielminuten (G.min) mit festen Ticks, unabhängig von der Bildrate; alles kostet Minuten (Weg je Feld nach Gelände, Licht und Bewuchs über die Kostenkarte,
        Arbeit nach Objekt und Arbeitstempo der Person). Eine Woche = Sonntag (Inspektion, die Uhr rückt nur durch Handlungen vor, Dämmerung beendet ihn) → Planung an der Tafel →
        Werkwoche (Personal geht nach der Zeitleiste: Hinweg, Arbeit, Rückweg bis zur Heimkehr; Hoftag mit Mittagspause oder Waldtag ohne; der Plan ist nur zu lesen, Umplanen geht nur durch Ansprechen einer Person: nur ihr Plan, ab jetzt) → Wochenschritt der Natur.
        Heimgehen [T] rechnet denselben Tag ohne Darstellung bis der Verwalter daheim ist (Heimweg = kürzeste Route × 1,5); der Abend läuft bis in die Nacht, spätestens um 2 Uhr schläft
        er am Ort ein; der nächste Sonntag beginnt frühestens 8 Stunden nach dem Einschlafen. Am Sonntag arbeitet der Verwalter nicht selbst; Sonntagabend = nur der Planungsbildschirm. Die Tafel zeigt je Person einen proportionalen Zeitbalken (gemeinsame Stundenachse) über der Aufgabenliste. Alle Zeitwerte stehen in CFG.zeit (Spielstunde in Echtzeit, Wegzeiten, Normminuten je Arbeitspunkt, Mittag/Abend, Sonntag, Wochen).
  Ortskenntnis (Demo B2a): Jede Person (Verwalter, Personal) kennt jedes Feld des Waldes unterschiedlich gut (CFG.kenntnis); unbekanntes Gelände kostet Zeit (CFG.zeit.fremd, im Dunkeln mehr). Sie wächst durch Betreten, Arbeiten und (Verwalter) Sehen und sinkt nur, wo sich der Wald verändert hat. F2: Kartenebene „Kenntnis“ (je Person umschaltbar).
  Trampelpfade (Demo B2a, Paket 2): Wo oft gegangen wird (Verwalter und Personal, über Wochen), tritt sich in der Wochenhülle ein Pfad aus (kurzes Gras, schneller zu gehen, CFG.pfad); unbenutzt wächst er wieder zu. Aufgabe „Weg anlegen“ (Felder markieren wie Mähen, auf einem Pfad den ganzen Pfad ausbauen) macht Felder zum richtigen Weg.
  Gutskarte (Demo B2a, Paket 3): Notizbuch-Reiter „Karte“ (6): Farbflächen nur für Felder, die der Verwalter kennt (eigene Sicht, Arbeitsorte des Personals, alte Karte des Vorgängers), verblassend nach Alter (CFG.karte); Pfeiltasten oder Antippen zeigen „zuletzt gesehen Woche n“. Die Tafel setzt „ca.“ bzw. „?“ vor Zeiten, deren Ziel oder Route über altes bzw. unbekanntes Kartenwissen führt; die Rechnung bleibt exakt.
  Herbst (Demo B3, Paket 1): Herbstkurve je Woche (regeln.js herbst: Wachstum von Bäumen und Gras → 0 bis Woche 11, Hasenwurf ab Woche 6 kaum noch); Hennenhunger je Teilschritt (CFG.henHunger); Fuchsdruck steigt kausal (weniger Hasen → Stall). Verfügbarkeit des Personals aus einer Quelle (staffAvail) für Woche und Tafel.
  Wochenwetter (Demo B3, Paket 2): Jede Woche hat ein Wetter (trocken, Regen, Sturm, Frost; Nebel als Variante) aus einer Herbstkurve (CFG.wetter), einmal in newGame aus eigenem Seed-Strom gezogen (äußerer Auslöser, nicht R). Wirkung nur in der Werkwoche (Sonntag und Planung ohne):
        Regen macht Furt und Wasserrand teurer, Frost beendet die Beeren und erhöht den Heubedarf der Hennen, Sturm wird nur angekündigt, Nebel verkleinert den Sichtradius. Vorhersage am Sonntag (Morgenkarte, Hannes), HUD zeigt das Wetter in Worten.
  Laubfall (Demo B3, Paket 3): Ab Woche 9 fällt das Laub (CFG.laub: Birke früh, Buche mittel, Eiche spät): der Wald wird zum Gehen günstiger (darkAt, Baumartenanteile aus computeLight), der Sichtradius wächst (sichtLicht), Bodenschatten und Kronenebene werden durchsichtiger (Deckkraft); light[] (Ökologie) und Feldklassen bleiben unberührt.
  Steuerung: WASD/Pfeile laufen · Leertaste/E: Aktionen (untersuchen, selbst anpacken, Auftrag erteilen)
             M: Pflock-Modus (Mähfläche abstecken) · N: Notizbuch · T: heimgehen (in jeder Phase; vorher ein Fenster mit Dauer und Ankunft; in der Werkwoche wird der Rest des Tages ohne Zuschauen durchgerechnet; Abend: danach schlafen; Sonntagabend: Planung abschließen) · H: Hof-/Waldtag (Sonntag/Sonntagabend, an der Tafel) · F2: Debug/Balancing · Esc: schließen
  Touch (Handy/Tablet, nur Querformat, nur bei Fingerbedienung): Steuerkreuz + Knöpfe senden dieselben Tastencodes.
             REGEL: Jede neue Taste braucht eine Zeile in TOUCH_TASTEN (Abschnitt „Touch-Steuerung“) – sonst ist sie am Handy unerreichbar.
             Zum Testen am PC: index.html?touch
  Getestet wird: Trägt der Verwalter-Kreislauf (schauen → markieren → Wochenschritt → Folgen) mit impliziter
  Bewertung eine gemütliche Partie, und erzeugt das Licht-/Kronenmodell glaubwürdigen Wald?
  Balancing: alle Stellschrauben im Objekt CFG (live im Debug-Fenster änderbar).
  Wer was darf (Aufgaben, Rollen, Effektivität, Arbeitstempo, ab welcher Woche): rollen.js – Editor: tools/rollen-editor.html
-->

// ================================================================ Hilfen
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const idx=(x,y)=>y*W+x;
const inb=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
const hash=i=>((Math.imul(i+1,2654435761)>>>0)%10007)/10007;
const hash2=i=>((Math.imul(i+7,40503)>>>0)%9973)/9973;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function makeNoise(cell){
  const gw=Math.ceil(W/cell)+2, gh=Math.ceil(H/cell)+2, g=[];
  for(let i=0;i<gw*gh;i++)g.push(R());
  const s=t=>t*t*(3-2*t);
  return (x,y)=>{const fx=x/cell,fy=y/cell,ix=Math.floor(fx),iy=Math.floor(fy),tx=s(fx-ix),ty=s(fy-iy);
    const v=(a,b)=>g[b*gw+a];const a=v(ix,iy)+(v(ix+1,iy)-v(ix,iy))*tx,b=v(ix,iy+1)+(v(ix+1,iy+1)-v(ix,iy+1))*tx;return a+(b-a)*ty};
}
function pickWeighted(opts){let t=0;for(const o of opts)t+=o.w;let p=R()*t;for(const o of opts){p-=o.w;if(p<=0)return o}return opts[opts.length-1]}
function chance(x){return Math.floor(x)+(R()<x%1?1:0)}

// ================================================================ Bäume
function addTree(sp,x,y,h,giant){
  const t={id:nextId++,sp,x,y,giant:!!giant,h,hp:R()*0.5,crown:[],dead:false,deadDays:0,stress:0,bitten:0,alive:true};
  for(const i of trunkTiles(t))trunkAt[i]=t.id;
  if(h>=2)t.crown=trunkTiles(t).slice();
  trees.push(t);treeById.set(t.id,t);return t;
}
function trunkTiles(t){return t.giant?[idx(t.x,t.y),idx(t.x+1,t.y),idx(t.x,t.y+1),idx(t.x+1,t.y+1)]:[idx(t.x,t.y)]}
function crownR(t){return t.giant?CFG.giantRMax:Math.min(CFG.sp[t.sp].rMax,Math.floor((t.h-1)/2))}
function trunkCheb(t,x,y){
  if(!t.giant)return Math.max(Math.abs(x-t.x),Math.abs(y-t.y));
  const dx=x<t.x?t.x-x:x>t.x+1?x-t.x-1:0, dy=y<t.y?t.y-y:y>t.y+1?y-t.y-1:0;return Math.max(dx,dy);
}
function treeAt(i){const id=trunkAt[i];if(id<0)return null;const t=treeById.get(id);return t&&t.alive?t:null}
function killTree(t){t.alive=false;for(const i of trunkTiles(t))if(trunkAt[i]===t.id)trunkAt[i]=-1;t.crown=[]}
// Zusätzlich (Demo B3, Paket 3, nur Lesen für Sicht und Gehen): anteil[3i+k] = Anteil der Baumart k (LAUB_ARTEN: Birke, Buche, Eiche) an der Kronendeckung des Feldes (nach Deckkraft gewichtet, Summe 1; 0 ohne Krone),
// kronSum[k] = Deckkraft-Summe der Art über alle Kronenfelder (für die Deckkraft der Kronenebene). Wochenunabhängig: der Laubstand der Woche kommt erst in darkAt/sichtLicht dazu. light[], covers und feldKlasse bleiben Ökologie und unberührt.
const LAUB_ARTEN=['birke','buche','eiche'],LAUB_IDX={birke:0,buche:1,eiche:2},kronSum=[0,0,0];
function computeLight(){
  light.fill(1);anteil.fill(0);kronSum[0]=kronSum[1]=kronSum[2]=0;for(let i=0;i<N;i++)covers[i].length=0;
  for(const t of trees){if(!t.alive||t.dead)continue;const op=CFG.sp[t.sp].op*(t.h<=3?0.6:1),k=LAUB_IDX[t.sp];
    for(const c of t.crown){covers[c].push(t.h,op);light[c]*=1-op;anteil[c*3+k]+=op}kronSum[k]+=op*t.crown.length}
  for(let i=0,j=0;i<N;i++,j+=3){const s=anteil[j]+anteil[j+1]+anteil[j+2];if(s>0){anteil[j]/=s;anteil[j+1]/=s;anteil[j+2]/=s}}
  lightDirty=true;canopyDirty=true;
}
function lightAbove(i,h){let l=1;const c=covers[i];for(let k=0;k<c.length;k+=2)if(c[k]>h)l*=1-c[k+1];return l}
function growCrown(t){
  const r=crownR(t);if(r<=0)return;
  const opts=[],seen=new Set(t.crown);
  for(const c of t.crown){const cx=c%W,cy=(c/W)|0;
    for(const [dx,dy] of DIRS){const nx=cx+dx,ny=cy+dy;if(!inb(nx,ny))continue;const j=idx(nx,ny);
      if(seen.has(j))continue;seen.add(j);if(trunkCheb(t,nx,ny)>r||ground[j]===G_BLOCK||ground[j]===G_WATER||ground[j]===G_FORD||ground[j]===G_BRIDGE)continue;
      const l=lightAbove(j,t.h);opts.push({j,w:l*l+0.02})}}
  if(opts.length)t.crown.push(pickWeighted(opts).j);
}
function placeLying(x,y,L,age){
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>R()-0.5);
  for(const [dx,dy] of dirs){
    const tiles=[];let ok=true;
    for(let k=1;k<=L;k++){const X=x+dx*k,Y=y+dy*k;if(!inb(X,Y)){ok=false;break}const j=idx(X,Y);
      const t=treeAt(j);
      if((ground[j]!==G_FOREST&&ground[j]!==G_LAWN)||fkind[j]||lyingAt[j]>=0||(t&&t.h>=2)||feat[j]===F_BURROW||feat[j]===F_DEN||stumpAt[j]){ok=false;break}
      tiles.push(j)}
    if(!ok)continue;
    for(const j of tiles){const t=treeAt(j);if(t)killTree(t);if(feat[j]===F_HOLE||feat[j]===F_WOOD||feat[j]===F_HAY||feat[j]===F_TRAP)feat[j]=0}
    tiles.sort((a,b)=>a-b);
    const l={id:nextId++,tiles,dir:dx?'h':'v',age};logs.push(l);logById.set(l.id,l);for(const j of tiles)lyingAt[j]=l.id;return l;
  }
  return null;
}
function addPile(i,type,n){if(feat[i]===type)featN[i]=Math.min(20,featN[i]+n);else if(!feat[i]||feat[i]===F_HOLE){feat[i]=type;featN[i]=n}}
function fellTree(t){
  const ti=idx(t.x,t.y);killTree(t);
  if(t.h>=2){
    stumpAt[ti]=SPECIES.indexOf(t.sp)+1;stumpAge[ti]=0;
    const L=t.giant?3:t.h>=6?3:t.h>=4?2:0;
    if(L===0)addPile(ti,F_WOOD,1);
    else if(!placeLying(t.x,t.y,L,0))addPile(ti,F_WOOD,L*2);
  }
  computeLight();
}

// ================================================================ Weltgenerierung
function streamY(x){return Math.round(60+3*Math.sin(x/8)+1.5*Math.sin(x/3.7))}
const CLEARINGS=[{x:16,y:15,rx:6,ry:5},{x:80,y:13,rx:6,ry:6},{x:17,y:43,rx:5,ry:5},{x:79,y:45,rx:5,ry:4},{x:30,y:67,rx:4,ry:3}];
const GIANTS=[[24,27],[71,26],[63,67]];
function newGame(seed){
  const sd=seed??((Math.random()*1e9)|0);
  R=mulberry32(sd);
  nextId=1;alloc();
  // Anwesen
  for(let y=ESTATE.y0+1;y<ESTATE.y1;y++)for(let x=ESTATE.x0+1;x<ESTATE.x1;x++)ground[idx(x,y)]=G_LAWN;
  const setF=(x,y,k)=>{const i=idx(x,y);fkind[i]=k;fence[i]=3};
  for(let x=ESTATE.x0;x<=ESTATE.x1;x++){setF(x,ESTATE.y0,FK_H);setF(x,ESTATE.y1,FK_H)}
  for(let y=ESTATE.y0+1;y<ESTATE.y1;y++){setF(ESTATE.x0,y,FK_V);setF(ESTATE.x1,y,FK_V)}
  fkind[idx(ESTATE.gx,ESTATE.y1)]=FK_GATE;
  fence[idx(ESTATE.x0+3,ESTATE.y1)]=0;                         // eine Lücke für den Einstieg
  for(let y=ESTATE.y1+1;y<H;y++)ground[idx(ESTATE.gx,y)]=G_PATH; // Kutschenstraße
  for(let y=36;y<ESTATE.y1;y++)ground[idx(ESTATE.gx,y)]=G_PATH;  // Gartenweg
  for(let x=ESTATE.gx+1;x<=HOF[0];x++)ground[idx(x,HOF[1])]=G_PATH;
  // Bach
  for(let x=0;x<W;x++){const y=streamY(x);
    for(const yy of (x%7<3?[y,y+1]:[y])){if(!inb(x,yy))continue;const i=idx(x,yy);
      if(x===ESTATE.gx){ground[i]=G_BRIDGE;bridgeV[i]=1}else if(x===19||x===77)ground[i]=G_FORD;else ground[i]=G_WATER}}
  // Wasserrand für das Regenwetter (einmal hier, keine Nachbarsuche in tileCostFn): 2 = Furt, 1 = begehbares Feld mit Wasser/Furt in der Nachbarschaft (Stege und Wege sind fest, siehe tileCostFn)
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=idx(x,y),g=ground[i];if(g===G_FORD){nass[i]=2;continue}if(g===G_WATER||g===G_BLOCK)continue;
    for(let dy=-1;dy<=1&&!nass[i];dy++)for(let dx=-1;dx<=1;dx++){if(!inb(x+dx,y+dy))continue;const h=ground[idx(x+dx,y+dy)];if(h===G_WATER||h===G_FORD){nass[i]=1;break}}}
  const bank2=[34,streamY(34)-2];
  buildings=[
    {id:'haus',x:46,y:33,w:5,h:3,spr:'01-herrenhaus'},
    {id:'scheune',x:41,y:38,w:3,h:2,spr:'01-scheune'},
    {id:'stall',x:52,y:35,w:2,h:1,spr:'01-stall'},
    {id:'trog',x:54,y:35,w:1,h:1,spr:null},
    {id:'gesinde',x:51,y:46,w:3,h:2,spr:'01-huette'},
    {id:'hasenstall',x:44,y:39,w:2,h:1,spr:'01-hasenstall'},
    {id:'bank',x:45,y:47,w:1,h:1,spr:'01-objekte_8'},
    {id:'bank2',x:bank2[0],y:bank2[1],w:1,h:1,spr:'01-objekte_8'}
  ];
  buildings.forEach((b,k)=>{for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++){const i=idx(x,y);ground[i]=G_BLOCK;bmap[i]=k}});
  // Freiflächen
  const clear=new Uint8Array(N);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=idx(x,y);
    if(ground[i]!==G_FOREST||fkind[i])clear[i]=2;
    else if(inHofClearing(x,y))clear[i]=1;
    else if(Math.abs(x-ESTATE.gx)<=1&&y>ESTATE.y1)clear[i]=2;
    else if(dist(x,y,bank2[0],bank2[1])<2.5)clear[i]=1;
    else for(const c of CLEARINGS)if(((x-c.x)/c.rx)**2+((y-c.y)/c.ry)**2<=1)clear[i]=1;
  }
  // Riesen
  for(const [gx,gy] of GIANTS){for(let dy=-1;dy<=2;dy++)for(let dx=-1;dx<=2;dx++)if(inb(gx+dx,gy+dy))clear[idx(gx+dx,gy+dy)]=Math.max(clear[idx(gx+dx,gy+dy)],1);addTree('eiche',gx,gy,CFG.giantH,true)}
  // Wald
  const nSp=makeNoise(11),nDen=makeNoise(7);
  const order=[];for(let i=0;i<N;i++)order.push(i);
  for(let i=N-1;i>0;i--){const j=Math.floor(R()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  for(const i of order){
    if(clear[i])continue;const x=i%W,y=(i/W)|0;
    if(treeNear(x,y))continue;
    if(R()>0.45+nDen(x,y)*0.5)continue;
    let edge=99;for(const c of CLEARINGS)edge=Math.min(edge,dist(x,y,c.x,c.y)-Math.max(c.rx,c.ry));
    edge=Math.min(edge,Math.sqrt(((x-ESTATE.cx)/16)**2+((y-ESTATE.cy)/14)**2)*15-15);
    const ns=nSp(x,y);let sp;
    if(edge<4&&R()<0.6)sp='birke';else if(ns>0.58)sp='buche';else if(ns<0.38)sp=R()<0.8?'eiche':'birke';else sp=['eiche','buche','birke','buche'][ri(0,3)];
    const s=CFG.sp[sp];const h=R()<0.15?ri(2,3):ri(4,s.hMax);
    addTree(sp,x,y,h,false);
  }
  // Kronen vorwachsen lassen
  for(let it=0;it<34;it++){
    computeLight();
    for(const t of trees){if(t.h<2)continue;
      if(it>20&&t.crown.length>trunkTiles(t).length)t.crown=t.crown.filter((c,k)=>k<trunkTiles(t).length||lightAbove(c,t.h)>=CFG.crownDieLight||R()>0.5);
      if(R()<0.85)growCrown(t)}
  }

  // Unterwuchs, Gras

    else if(l>=CFG.litHalf){grass[i]=R()<0.3?1:0;gprog[i]=R()}

      const p=inHofClearing(x,y)?0.004:l>=0.6?0.02:l>=0.3?0.05:0.015;

  for(let i=0;i<N;i++){deco[i]=decoTarget(i);if(deco[i]===D_BUSCH)berry[i]=1}
  // Hasen in den Waldwiesen
  for(const c of CLEARINGS.slice(0,4)){
    for(let t=0;t<80;t++){const x=c.x+ri(-3,3),y=c.y+ri(-3,3);if(inb(x,y)&&burrowSiteOk(x,y,[])){addBurrow(x,y,ri(3,4),false);break}}

    if(inb(x,y)&&!inGarden(x,y)&&distFence(x,y)>=6&&burrowSiteOk(x,y,[])){addBurrow(x,y,2,false);break}}
  // Füchse im Dunkel
  for(let k=0;k<2;k++){const s=findDenSite();if(s>=0){feat[s]=F_DEN;foxes.push({id:nextId++,den:[s%W,(s/W)|0],hunger:R(),alive:true})}}
  // Personal, Spieler, Zustand
  staff=STAFF_DEF.map(d=>({...d,x:d.home[0],y:d.home[1],px:d.home[0],py:d.home[1],path:[],cur:null,state:'rest',dir:'down',anim:0,available:false,failed:[],agenda:[],wait:0,acc:0,skip:new Set()}));
  P={x:HOF[0],y:HOF[1],px:HOF[0],py:HOF[1],nx:HOF[0],ny:HOF[1],dir:'down',moving:false,mt:0,md:0.2,anim:0,mowTask:null};
  const kinds=['winter','jagd','holz'],kind=kinds[ri(0,2)];

     chickens:CFG.chickens,chickHunger:0,fed:true,coopClosed:true,hensInside:true,grazedOk:false,hensFoodOk:false,hutch:0,taler:CFG.startTaler,
     smokedLeft:0,food:{brot:CFG.startBrot*CFG.brotPortion,eier:CFG.startEier,fleisch:0,beeren:0},
     batches:{brot:[{n:CFG.startBrot*CFG.brotPortion,week:1}],eier:[{n:CFG.startEier,week:1}],fleisch:[],beeren:[]},tasks:[],insights:new Set(),letters:[],hist:[],guideDone:new Set(),
     night:freshNight(),dbg:{paths:[],log:[],layers:new Set()},vis:{hares:[],foxes:[],chickens:[]},pendingDisperse:[],talked:new Set()};
  G.wetter=CFG.wetter?wetterZiehen(sd):null;   // Wochenwetter: Tabelle aller Wochen, eigener Strom (nicht R)
  initKenntnis();initKarte();
  startStats=stats();
  scen={kind,wood:kind==='winter'?ri(25,35):ri(8,12),hareStock:ri(4,7),hunt:ri(20,30),big:Math.max(10,Math.round(startStats.big*(0.95+R()*0.1)))};

function distFence(x,y){const dx=Math.max(ESTATE.x0-x,0,x-ESTATE.x1),dy=Math.max(ESTATE.y0-y,0,y-ESTATE.y1);return Math.max(dx,dy)}
function treeNear(x,y){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if(inb(X,Y)&&trunkAt[idx(X,Y)]>=0)return true}return false}
function decoTarget(i){
  if(ground[i]!==G_FOREST||fkind[i])return 0;
  const l=light[i],h=hash(i);
  if(l<CFG.litMoss){if(h<0.12)return D_MOOS;if(h<0.15)return D_STEIN;
    if(h<0.34){const x=i%W,y=(i/W)|0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if(inb(X,Y)&&lyingAt[idx(X,Y)]>=0)return D_PILZE}}return 0}
  if(l<CFG.litMeadow){if(h<0.2)return D_FARN;if(h<0.3)return D_FARN2;if(h<0.36)return D_BUSCH;if(h<0.42)return D_LAUB;return 0}
  if(h<0.05)return D_BLUMEN;if(h<0.07)return D_STEIN;return 0;
}

// ================================================================ Nacht: Ökologie
function freshNight(){return{holes:0,fenceDug:0,newBurrows:0,gardenBurrow:0,foxCatch:0,chickFox:0,foxAtCoop:0,newFox:0,foxGone:0,
  verbiss:0,verbissTot:0,treesDied:0,logsFell:0,chickStarve:0,trapped:0,lost:0,sprouts:0,seedlings:0,darkBurrows:0}}
function log(s){G.dbg.log.push(`W${G.week}: ${s}`);if(G.dbg.log.length>400)G.dbg.log.shift()}
// Herbstkurve (regeln.js `herbst`, nur 01; je Woche ein Wert, nach der letzten gilt der letzte): wachs = Wachstum von Bäumen und Gras, wurf = Hasenwurf je Teilschritt.
// Ohne `herbst` (Golden Master, Wertesatz 02 im F2-Fenster) gilt die alte Kurve season0 → season1 über CFG.zeit.wochen für beide.
const herbstAt=(k,w)=>{const a=CFG.herbst&&CFG.herbst[k];return a?a[clamp(w-1,0,a.length-1)]:null};
const season=w=>herbstAt('wachs',w)??(CFG.season0+(CFG.season1-CFG.season0)*clamp((w-1)/(CFG.zeit.wochen-1),0,1));
const wurf=w=>herbstAt('wurf',w)??season(w);

// ---------------------------------------------------------------- Wochenwetter (Demo B3, Paket 2)
// ÄUSSERER AUSLÖSER (die gekennzeichnete Ausnahme zu „Systeme statt Zufall“): jede Woche hat genau ein Wetter (trocken · Regen · Sturm · Frost), Nebel ist eine Darstellungsvariante.
// Die Tabelle aller Wochen wird einmal in newGame gezogen, aus einem EIGENEN, vom Spielseed abgeleiteten Strom (mulberry32(seed^K)) – nicht aus R: R-Folge, Golden Master und Gleichheit bleiben unberührt.
// Je Woche genau zwei Werte (Art, Nebel), auch wenn die Woche fest trocken ist. Weder weekStep noch startWeek ziehen. Wahrscheinlichkeiten: CFG.wetter.abschnitte.
// Wirkung nur in der Werkwoche (wetterWirkt): der Sonntag (und der Sonntagabend/die Planung) bleibt ohne Wetterwirkung; seine Vorhersage nennt das Wetter der kommenden Werkwoche.
const WETTER_ARTEN=['trocken','regen','sturm','frost'],WETTER_STROM=0x57E77E2;
function wetterZiehen(seed){
  const S=mulberry32((seed^WETTER_STROM)|0),c=CFG.wetter,out={art:[],nebel:[]};
  for(let k=1;k<=CFG.zeit.wochen;k++){
    const u=S(),v=S(),ab=c.abschnitte.find(a=>k<=a.bis)||c.abschnitte[c.abschnitte.length-1];
    let art='trocken';
    if(k>c.trockenBis){let x=u*WETTER_ARTEN.reduce((t,n)=>t+ab[n],0);for(const n of WETTER_ARTEN){x-=ab[n];if(x<0){art=n;break}}}
    out.art.push(art);out.nebel.push(k>c.trockenBis&&art!=='sturm'&&v<ab.nebel?1:0)}
  return out}
const wetter=w=>G&&G.wetter&&CFG.wetter?G.wetter.art[clamp(w-1,0,G.wetter.art.length-1)]:'trocken';   // rein: die Tabelle, ohne CFG.wetter immer trocken
const wetterNebel=w=>G&&G.wetter&&CFG.wetter?G.wetter.nebel[clamp(w-1,0,G.wetter.nebel.length-1)]:0;
const wetterWirkt=()=>!!(G&&G.wetter&&CFG.wetter)&&G.phase!=='sonntag'&&G.phase!=='plan';   // Sonntag und Sonntagabend ohne Wirkung
const wetterJetzt=()=>wetterWirkt()?wetter(G.week):'trocken';
const wetterWort=w=>{const a=wetter(w),n=wetterNebel(w);return(a==='trocken'?(n?'Nebel':'trocken'):a==='regen'?'Regen':a==='sturm'?'Sturm':'Frost')+(a!=='trocken'&&n?' mit Nebel':'')};
// Hannes' Vorhersage (Sonntag: Morgenkarte und Gespräch) für die kommende Werkwoche
function wetterKnie(w){
  if(!(G&&G.wetter&&CFG.wetter))return '';
  const t={trocken:'Mein Knie sagt: eine trockene Woche.',regen:'Mein Knie sagt Regen. Dann sind Ufer und Furten matschig, und man braucht länger.',
    sturm:'Mein Knie sagt Sturm. Im Wald bleibt man da besser vorsichtig.',frost:'Mein Knie sagt Frost. Dann sind die Beeren hin, und die Hennen wollen mehr Heu.'}[wetter(w)];
  return t+(wetterNebel(w)?' Und Nebel, dick wie Milch.':'')}
// Frost: die Hennen brauchen mehr Heu je Fütterung
const heuBedarf=()=>G.chickens*CFG.chickenHay*(wetterJetzt()==='frost'?CFG.wetter.frostHeu:1);
// Laubfall (Demo B3, Paket 3): Laubstand je Baumart und Woche (1 = voll belaubt, CFG.laub.rest = kahl), linear von `von` bis `bis`; null ohne CFG.laub (Golden-Pfad) und solange noch alles belaubt. Gilt für Sicht und Gehen, nicht für das Ökologie-Licht.
// tileCostFn bindet die drei Faktoren einmal je Aufruf (darkAt: nur Array-Zugriffe); laubAt(i) = der nach Baumart gewichtete Laubstand eines Feldes (1 ohne Laubfall, 0 ohne Krone); laubDeck() = Mittel über alle Kronen (Deckkraft der Kronenebene).
function laubFaktoren(){
  const c=CFG.laub;if(!c)return null;const w=weekNow(),r=clamp(c.rest,0,1);
  const f=LAUB_ARTEN.map(n=>{const a=c.arten[n];return 1-(1-r)*clamp((w-a.von)/Math.max(1e-9,a.bis-a.von),0,1)});
  return f[0]===1&&f[1]===1&&f[2]===1?null:f}   // noch alles belaubt: wie ohne Laubfall (null, die Kosten bleiben bitgleich)
function laubAt(i){const lb=laubFaktoren();if(!lb)return 1;const a=i*3;return lb[0]*anteil[a]+lb[1]*anteil[a+1]+lb[2]*anteil[a+2]}
function laubDeck(){const lb=laubFaktoren();if(!lb)return 1;const s=kronSum[0]+kronSum[1]+kronSum[2];return s>0?(lb[0]*kronSum[0]+lb[1]*kronSum[1]+lb[2]*kronSum[2])/s:1}
// Sichtlicht: das Licht, aus dem sich der Sichtradius ergibt – die EINE Stelle für Kenntnis-Sicht (playerSeen) und gezeichneten Sichtkreis (drawCanopy). Laub × Nebel: l = Licht des Feldes (light[]), f = Laubstand dort (laubAt):
// im kahlen Wald wird der Schatten schwächer (1−(1−l)·f), Nebel verkleinert zusätzlich; f=1 (ohne Laubfall) lässt l unverändert.
const sichtLicht=(l,f=1)=>(f===1?l:1-(1-l)*f)*(wetterWirkt()&&wetterNebel(G.week)?CFG.wetter.nebelSicht:1);

// Wochenhülle: die Nacht der Werkwoche = CFG.ecoStepsPerWeek Naturschritte (Teilschritte, je einer = die frühere Nacht) in einem Wochenschritt.
// G.night summiert die Teilschritte; Verlauf (G.hist), Verderb (in Wochen), Log und Nachtwege gelten einmal je Woche. n = Zahl der Teilschritte (Golden-Master-Test: 1 = die frühere Nacht).
function weekStep(n=CFG.ecoStepsPerWeek){
  const s=season(G.week),wf=wurf(G.week);
  G.night=freshNight();G.dbg.paths=[];G.dbg.log=[];
  // Ortskenntnis, feste Reihenfolge (Gate-Auflage 5): 1. Werkwochen-Diff (was die Arbeit der Woche verändert hat: Fällung, Weg …) → 2. Zuwachs aus dem Wochenpuffer (wer dort gearbeitet oder gegangen ist,
  // hat die Veränderung gesehen) → Trittzähler → Trampelpfade (pfadWeek) → Naturschritte → Bewuchs auf Pfaden weg (pfadClean) → 3. Nacht-Diff (Wuchsstufen, Licht, Stümpfe, neue/zugewachsene Pfade). Nicht Teil des Teilschritts nightStep (Golden Master).
  // Frost in der Nacht der Werkwoche (Wochenwetter, Paket 2): die Beeren erfrieren und tragen für den Rest des Herbstes nicht mehr (nightStep: kein Nachwachsen); ohne CFG.wetter (Golden-Pfad) nichts
  if(wetter(G.week)==='frost'&&!G.frostSeit){G.frostSeit=G.week;for(let i=0;i<N;i++)if(berry[i]){berry[i]=0;berryT[i]=0}log('Frost: die Beeren sind erfroren')}
  klDiff();knWeek();pfadWeek();
  for(let k=0;k<n;k++)nightStep(s,wf);
  pfadClean();klDiff();
  spoilFood();
  G.hist.push(stats());
}
// Ein Naturschritt (Teilschritt): Wachstum, Vermehrung, Nachtwege; wirkt auf G.night (die Woche), keine eigene Buchführung
function nightStep(s=season(G.week),wf=wurf(G.week)){
  growTrees(s);
  seedTrees(s);
  stumpsAndLogs();
  compactTrees();
  computeLight();
  groundStep(s);
  hareStep(wf);
  trapStep();
  foxStep();
  chickenStep();
}

function growTrees(season){
  computeLight();
  for(const t of trees){
    if(!t.alive)continue;
    const sp=CFG.sp[t.sp],ti=idx(t.x,t.y);
    if(t.dead){t.deadDays++;if(t.deadDays>=CFG.snagFallDays){killTree(t);if(t.h>=5&&placeLying(t.x,t.y,t.h>=6?3:2,2))G.night.logsFell++;log(`Tote ${SPNAME[t.sp]} (${t.x},${t.y}) stürzt um`)}continue}
    const top=t.h<=1?light[ti]:lightAbove(ti,t.h);
    let vit=top;
    if(t.h>=2&&t.crown.length){let s=0;for(const c of t.crown)s+=lightAbove(c,t.h);vit=s/t.crown.length}
    if(vit<sp.need*0.5)t.stress++;else t.stress=Math.max(0,t.stress-1);
    if(t.h<=1){if(t.stress>=2&&R()<CFG.sapDieP){killTree(t);continue}}
    else if(t.stress>=CFG.treeStressDie&&!t.giant){
      if(t.h<=3){killTree(t);G.night.treesDied++;continue}
      t.dead=true;t.crown=[];G.night.treesDied++;log(`${SPNAME[t.sp]} (${t.x},${t.y}) stirbt im Schatten`);continue}
    const hMax=t.giant?CFG.giantH:sp.hMax;
    if(t.h<hMax&&top>=sp.need)t.hp+=season/sp.hDays*(0.5+0.5*top);
    if(t.bitten>0){t.hp-=0.4;t.bitten--}
    if(t.hp<0)t.hp=0;
    while(t.hp>=1&&t.h<hMax){t.h++;t.hp-=1;if(t.h===2&&!t.crown.length)t.crown=trunkTiles(t).slice()}
    if(t.h>=2){
      const base=trunkTiles(t).length;
      if(t.crown.length>base)t.crown=t.crown.filter((c,k)=>k<base||lightAbove(c,t.h)>=CFG.crownDieLight||R()>CFG.crownDieP);
      if(R()<sp.crownP*season)growCrown(t);
    }
  }
}
function germOk(j){const g=ground[j];return (g===G_FOREST||g===G_LAWN)&&!fkind[j]&&trunkAt[j]<0&&lyingAt[j]<0&&!stumpAt[j]&&feat[j]!==F_BURROW&&feat[j]!==F_DEN}
function bigTrunkNear(x,y){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if(!inb(X,Y))continue;const t=treeAt(idx(X,Y));if(t&&t.h>=4)return true}return false}
function seedTrees(season){
  computeLight();
  const births=[];
  for(const t of trees){
    if(!t.alive||t.dead||t.h<4)continue;const sp=CFG.sp[t.sp];
    for(let k=chance(sp.seeds*season);k>0;k--){
      const d=t.sp==='birke'?ri(2,10):t.sp==='eiche'?(R()<0.1?ri(4,14):ri(1,3)):ri(1,3);
      const a=R()*Math.PI*2,x=Math.round(t.x+Math.cos(a)*d),y=Math.round(t.y+Math.sin(a)*d);
      if(!inb(x,y))continue;const j=idx(x,y);
      if(!germOk(j)||light[j]<sp.need*0.8)continue;
      let p=sp.germ*season*0.6;if(bigTrunkNear(x,y))p*=CFG.rootComp;
      if(R()<p)births.push([t.sp,x,y]);
    }
  }
  for(const [s,x,y] of births)if(germOk(idx(x,y))&&trees.length<CFG.maxTrees){addTree(s,x,y,1,false);G.night.seedlings++}
}
function stumpsAndLogs(){
  for(let i=0;i<N;i++){if(!stumpAt[i])continue;stumpAge[i]++;
    if(stumpAge[i]>=CFG.stumpDays&&trunkAt[i]<0&&light[i]>=0.25&&stumpAge[i]<=12){
      addTree(SPECIES[stumpAt[i]-1],i%W,(i/W)|0,1,false);stumpAt[i]=0;G.night.sprouts++;log(`Stumpf (${i%W},${(i/W)|0}) treibt aus`)}
    else if(stumpAge[i]>14)stumpAt[i]=0}
  for(const l of logs)l.age++;
  for(const l of logs.filter(l=>l.age>CFG.logRotDays)){for(const j of l.tiles)lyingAt[j]=-1;logs.splice(logs.indexOf(l),1);logById.delete(l.id)}
}
function compactTrees(){trees=trees.filter(t=>t.alive);treeById=new Map(trees.map(t=>[t.id,t]))}

function groundStep(s){
  for(let i=0;i<N;i++){
    const g=ground[i];
    if((g===G_FOREST||g===G_LAWN)&&!fkind[i]){
      const l=light[i];let d;
      if(l>=CFG.litMeadow)d=s/CFG.grassDays*(g===G_LAWN?0.55:1);
      else if(l>=CFG.litHalf)d=grass[i]>1?-0.5:grass[i]===1?0:s/CFG.grassDays*0.5;
      else d=-0.4;
      const t=treeAt(i);if(t&&t.h>=2)d=-0.5;
      gprog[i]+=d;
      if(gprog[i]>=1){if(grass[i]<2){grass[i]++;gprog[i]-=1}else gprog[i]=1}
      else if(gprog[i]<0){if(grass[i]>0){grass[i]--;gprog[i]+=1}else gprog[i]=0}
      const tgt=decoTarget(i);if(deco[i]!==tgt&&R()<0.3)deco[i]=tgt;
      if(deco[i]===D_BUSCH&&!berry[i]&&!G.frostSeit&&++berryT[i]>=CFG.berryRegrow){berry[i]=1;berryT[i]=0}
    }
    if(feat[i]===F_HOLE&&g!==G_LAWN){featAge[i]++;if(featAge[i]>=CFG.holeDays)feat[i]=0}
    if(track[i]){trackAge[i]++;if(trackAge[i]>=CFG.trackDays)track[i]=0}
  }
}

// ---------------------------------------------------------------- Hasen
function habitable(j){const g=ground[j];if((g!==G_FOREST&&g!==G_LAWN)||fkind[j])return false;const t=treeAt(j);return !(t&&t.h>=2)}
function addBurrow(x,y,n,garden){const b={id:nextId++,x,y,n,alive:true,empty:0,food:0,garden:!!garden};feat[idx(x,y)]=F_BURROW;burrows.push(b);return b}
function burrowSiteOk(x,y,extra){
  const j=idx(x,y);if(!habitable(j)||feat[j]||trunkAt[j]>=0||lyingAt[j]>=0||stumpAt[j]||ground[j]===G_PATH)return false;
  if(light[j]<CFG.burrowLight)return false;
  const garden=inGarden(x,y);let bright=0;
  for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const X=x+dx,Y=y+dy;if(inb(X,Y)&&habitable(idx(X,Y))&&light[idx(X,Y)]>=0.6)bright++}
  if(bright<CFG.burrowBright)return false;
  const sp=garden?3:CFG.burrowSpacing;
  for(const b of burrows)if(b.alive&&Math.max(Math.abs(b.x-x),Math.abs(b.y-y))<sp)return false;
  for(const b of extra)if(Math.max(Math.abs(b.x-x),Math.abs(b.y-y))<sp)return false;
  return true;
}
function harePassTile(j){const g=ground[j];if(g===G_BLOCK||g===G_WATER)return false;const t=treeAt(j);return !(t&&t.h>=2)}
function disperse(from,k,newB){
  let x=from.x,y=from.y,dx=0,dy=0;const path=[[x,y]],seen=new Set([idx(x,y)]);
  for(let s=0;s<CFG.disperseSteps;s++){
    const opts=[];
    for(const [ddx,ddy] of DIRS){const nx=x+ddx,ny=y+ddy;if(!inb(nx,ny))continue;const j=idx(nx,ny);if(!harePassTile(j))continue;
      let w=(light[j]*light[j]+0.03)*(ddx===dx&&ddy===dy?1.8:1)*(seen.has(j)?0.15:1);opts.push({x:nx,y:ny,j,w})}
    if(!opts.length)break;
    const o=pickWeighted(opts);
    if(fkind[o.j]===FK_GATE)continue;
    if((fkind[o.j]===FK_H||fkind[o.j]===FK_V)&&fence[o.j]>0){
      if(R()<0.35){fence[o.j]--;track[o.j]=TR_ERDE;trackAge[o.j]=0;G.night.fenceDug++;if(!fence[o.j])log(`Abwanderer graben den Zaun (${o.x},${o.y}) durch`)}
      continue}
    dx=o.x-x;dy=o.y-y;x=o.x;y=o.y;seen.add(o.j);path.push([x,y]);
    if(s%2===0&&!track[o.j]){track[o.j]=TR_HARE;trackAge[o.j]=0}
    if(s>=5&&burrowSiteOk(x,y,newB)){
      const nb={id:nextId++,x,y,n:k,alive:true,empty:0,food:0,garden:inGarden(x,y)};feat[o.j]=F_BURROW;newB.push(nb);
      G.dbg.paths.push({type:'hase',path});G.night.newBurrows++;if(nb.garden)G.night.gardenBurrow++;
      log(`${k} Hasen ziehen von (${from.x},${from.y}) los und gründen Bau (${x},${y})${nb.garden?' – IM GARTEN':''}`);return}
  }
  G.dbg.paths.push({type:'hase',path,lost:true});G.night.lost+=k;
  log(`${k} Hasen aus (${from.x},${from.y}) finden keine Lichtung und verlieren sich`);
}
function hareStep(wurf){
  const newB=[];
  for(const p of G.pendingDisperse)disperse(p,p.n,newB);
  G.pendingDisperse=[];
  for(const b of burrows){
    if(!b.alive)continue;
    const bi=idx(b.x,b.y);
    if(feat[bi]!==F_BURROW){b.alive=false;continue}
    let bright=0,food=0;const near=[];
    for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const x=b.x+dx,y=b.y+dy;if(!inb(x,y))continue;const j=idx(x,y);
      const t=treeAt(j);
      if(t&&t.h<=2&&b.n>0){food+=1.5;if(R()<Math.min(0.6,b.n*CFG.verbissP)){t.bitten=2;t.hp-=0.5;if(t.h===1&&R()<0.25){killTree(t);G.night.verbissTot++}else G.night.verbiss++}}
      if(!habitable(j))continue;const l=light[j];
      if(Math.max(Math.abs(dx),Math.abs(dy))<=3&&l>=0.6)bright++;
      if(l>=0.55){food+=grass[j]*0.8+0.3;near.push(j)}}
    b.food=food;
    if(!b.garden&&bright<CFG.burrowBright*0.6){
      log(`Bau (${b.x},${b.y}) ist zugewachsen und zu dunkel – ${b.n} Hasen ziehen aus`);G.night.darkBurrows++;
      if(b.n>0)disperse(b,b.n,newB);b.n=0;b.alive=false;feat[bi]=0;continue}
    if(b.n<=0){b.empty++;if(b.empty>=3){b.alive=false;feat[bi]=0;log(`Bau (${b.x},${b.y}) verfällt`)}continue}
    b.empty=0;
    for(let k=0;k<b.n&&near.length;k++)gprog[near[ri(0,near.length-1)]]-=0.25;
    for(let k=chance(b.n*CFG.holesPerHare*(b.garden?2:1));k>0&&near.length;k--){const j=near[ri(0,near.length-1)];
      if(!feat[j]&&trunkAt[j]<0&&lyingAt[j]<0&&ground[j]!==G_PATH){feat[j]=F_HOLE;featAge[j]=0;G.night.holes++}}
    for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++){const x=b.x+dx,y=b.y+dy;if(!inb(x,y))continue;const j=idx(x,y);
      if((fkind[j]===FK_H||fkind[j]===FK_V)&&fence[j]>0&&R()<b.n*CFG.fenceDigPerHare){fence[j]--;track[j]=TR_ERDE;trackAge[j]=0;G.night.fenceDug++;
        if(!fence[j])log(`Hasen aus Bau (${b.x},${b.y}) graben den Zaun (${x},${y}) durch`)}}
    const per=food/Math.max(1,b.n);let births=0,deaths=0;
    if(b.n>=2&&per>=CFG.hareFoodNeed)births=chance(b.n*CFG.hareBirth*Math.min(1.5,per/CFG.hareFoodNeed)*wurf);
    if(per<1.2)deaths=Math.ceil(b.n*0.2);
    b.n=Math.max(0,b.n+births-deaths);
    const cap=clamp(Math.floor(food/CFG.hareCapFood),2,CFG.hareMaxBurrow);
    log(`Bau (${b.x},${b.y})${b.garden?' [Garten]':''}: ${b.n} Hasen · Futter ${food.toFixed(0)} · +${births} −${deaths} · Platz ${cap}`);
    if(b.n>cap){const k=b.n-cap;b.n=cap;disperse(b,k,newB)}
    for(let k=0;k<Math.min(3,b.n)&&near.length;k++){const j=near[ri(0,near.length-1)];if(!track[j]){track[j]=TR_HARE;trackAge[j]=0}}
  }
  burrows.push(...newB);
  burrows=burrows.filter(b=>b.alive);
}
function trapStep(){
  for(let i=0;i<N;i++){if(feat[i]!==F_TRAP)continue;const x=i%W,y=(i/W)|0;let best=null;
    for(const b of burrows){if(!b.alive||b.n<=0)continue;const d=Math.max(Math.abs(b.x-x),Math.abs(b.y-y));if(d<=3&&(!best||d<best.d))best={b,d}}
    if(best&&R()<0.35*best.b.n/(best.b.n+2)){best.b.n--;feat[i]=F_TRAPFULL;G.night.trapped++;log(`Falle (${x},${y}) fängt einen Hasen`)}}
}

// ---------------------------------------------------------------- Füchse
function foxPass(j,f){const g=ground[j];if(g===G_BLOCK||g===G_WATER)return false;const t=treeAt(j);if(t&&t.h>=2)return false;
  if(fkind[j]===FK_GATE||((fkind[j]===FK_H||fkind[j]===FK_V)&&fence[j]>0))return f.hunger>=CFG.foxJumpHunger;return true}
function findDenSite(){
  for(let i=0;i<N;i++)if(feat[i]===F_DEN&&!foxes.some(f=>f.alive&&idx(f.den[0],f.den[1])===i))return i;
  for(let t=0;t<5000;t++){const i=ri(0,N-1),x=i%W,y=(i/W)|0;
    if(ground[i]!==G_FOREST||fkind[i]||trunkAt[i]>=0||lyingAt[i]>=0||feat[i]||stumpAt[i])continue;
    if(light[i]>=CFG.denLight||dist(x,y,ESTATE.cx,ESTATE.cy)<18)continue;
    if(foxes.some(f=>f.alive&&dist(f.den[0],f.den[1],x,y)<12))continue;
    if(!burrows.some(b=>b.alive&&dist(b.x,b.y,x,y)<13))continue;
    return i}
  return -1;
}
function foxStep(){
  scent.fill(0);
  for(const b of burrows){if(!b.alive||b.n<=0)continue;
    for(let dy=-16;dy<=16;dy++)for(let dx=-16;dx<=16;dx++){const x=b.x+dx,y=b.y+dy;if(!inb(x,y))continue;const d=Math.hypot(dx,dy);if(d>16)continue;scent[idx(x,y)]+=b.n*(1-d/16)}}
  for(const f of foxes)if(f.alive)foxWalk(f);
  foxes=foxes.filter(f=>f.alive);
  const hares=burrows.reduce((a,b)=>a+(b.alive?b.n:0),0);
  if(hares/(foxes.length+1)>CFG.haresPerFox&&foxes.length<CFG.maxFoxes){
    const s=findDenSite();
    if(s>=0){feat[s]=F_DEN;foxes.push({id:nextId++,den:[s%W,(s/W)|0],hunger:1,alive:true});G.night.newFox++;log(`Ein Fuchs wandert ein und bezieht den Bau (${s%W},${(s/W)|0})`)}
  }
}
function foxWalk(f){
  const budget=CFG.foxBaseSteps+f.hunger*CFG.foxHungerSteps;
  let [x,y]=f.den,dx=0,dy=0;const path=[[x,y]],seen=new Set();
  // Zum Stall zieht es ihn nur, wenn er daheim kaum Beute wittert – oder der Hunger übermächtig wird
  const raid=G.chickens>0&&f.hunger>=CFG.foxRaidHunger&&(scent[idx(f.den[0],f.den[1])]<2||R()<0.15*(f.hunger-1));
  let caught=false;
  for(let s=0;s<budget&&!caught;s++){
    const toCoop=raid&&s>budget*0.35;
    const opts=[];
    for(const [ddx,ddy] of DIRS){const nx=x+ddx,ny=y+ddy;if(!inb(nx,ny))continue;const j=idx(nx,ny);if(!foxPass(j,f))continue;
      let w;
      if(toCoop)w=dist(nx,ny,COOP[0],COOP[1])<dist(x,y,COOP[0],COOP[1])?3:0.4;
      else w=(scent[j]+0.4)*(1.3-light[j]*0.6);
      w*=(ddx===dx&&ddy===dy?1.6:1)*(seen.has(j)?0.2:1);
      opts.push({x:nx,y:ny,j,w})}
    if(!opts.length)break;
    const o=pickWeighted(opts);dx=o.x-x;dy=o.y-y;x=o.x;y=o.y;seen.add(o.j);path.push([x,y]);
    if(s%2===0&&!track[o.j]&&ground[o.j]!==G_BRIDGE){track[o.j]=TR_FOX;trackAge[o.j]=0}
    for(const b of burrows){if(!b.alive||b.n<=0||Math.abs(b.x-x)>2||Math.abs(b.y-y)>2)continue;
      let tall=0,cnt=0;for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++){if(!inb(b.x+xx,b.y+yy))continue;cnt++;if(grass[idx(b.x+xx,b.y+yy)]===2)tall++}
      const p=CFG.foxCatch*b.n/(b.n+2)*(1-0.5*tall/Math.max(1,cnt));
      if(R()<p){b.n--;f.hunger=0;caught=true;track[o.j]=TR_FELL;trackAge[o.j]=0;G.night.foxCatch++;log(`Fuchs ${f.id} reißt bei Bau (${b.x},${b.y}) einen Hasen (nach ${s} Schritten)`);break}}
    if(!caught&&toCoop&&Math.abs(x-COOP[0])<=1&&Math.abs(y-COOP[1])<=1){
      const c=idx(COOP[0],COOP[1]);
      if(!G.coopClosed&&G.chickens>0){G.chickens--;f.hunger=0;caught=true;track[c]=TR_FEDERN;trackAge[c]=0;G.night.chickFox++;log(`Fuchs ${f.id} holt eine Henne aus dem offenen Stall!`)}
      else{G.night.foxAtCoop++;track[c]=TR_FOX;trackAge[c]=0;log(`Fuchs ${f.id} streicht um den verschlossenen Stall`)}
      break}
  }
  G.dbg.paths.push({type:'fuchs',path,caught});
  if(!caught){f.hunger++;
    if(f.hunger>=CFG.foxLeaveHunger){f.alive=false;G.night.foxGone++;log(`Fuchs ${f.id} zieht hungrig fort`)}
    else log(`Fuchs ${f.id} geht leer aus (Hunger ${f.hunger.toFixed(1)}, ${path.length} Schritte)`)}
}
// Vorräte: Zu- und Abgänge laufen über Chargen, damit Altes zuerst verbraucht wird und verderben kann
function addFood(k,n,week){if(n<=0)return;G.food[k]+=n;G.batches[k].push({n,week:week||G.week})}
function takeFood(k,n){let got=0;const b=G.batches[k];while(n>0&&b.length){const x=Math.min(n,b[0].n);b[0].n-=x;n-=x;got+=x;if(!b[0].n)b.shift()}G.food[k]-=got;return got}
function spoilsWeek(k){return G.batches[k].filter(b=>G.week-b.week+1>=CFG.spoil[k]).reduce((a,b)=>a+b.n,0)}   // Portionen, die mit dem Wochenschritt verderben
function spoilFood(){const sp={};
  for(const k of Object.keys(G.batches)){let lost=0;G.batches[k]=G.batches[k].filter(b=>{if(G.week-b.week+1>=CFG.spoil[k]){lost+=b.n;return false}return true});
    if(lost){G.food[k]-=lost;sp[k]=lost;log(`${lost} Portionen ${k} verdorben`)}}
  G.night.spoiled=sp}
function graze(units){const tiles=[];
  for(let dy=-8;dy<=8;dy++)for(let dx=-8;dx<=8;dx++){const x=COOP[0]+dx,y=COOP[1]+dy;if(!inb(x,y))continue;const i=idx(x,y);
    if((ground[i]===G_LAWN||ground[i]===G_FOREST)&&!fkind[i]&&grass[i]>=1)tiles.push(i)}
  for(let k=tiles.length-1;k>0;k--){const j=Math.floor(R()*(k+1));[tiles[k],tiles[j]]=[tiles[j],tiles[k]]}
  for(const i of tiles){while(units>0&&grass[i]>0){grass[i]--;gprog[i]=0.3;units--}if(units<=0)break}
  return units<=0}
function chickenStep(){
  const n=G.night;
  if(G.chickens>0){if(!G.hensFoodOk){G.chickHunger+=CFG.henHunger;if(G.chickHunger>=2){G.chickens--;n.chickStarve++;G.chickHunger=1;log('Eine Henne ist verhungert')}}else G.chickHunger=0}
  if(G.coopClosed){G.hensInside=true;G.grazedOk=false}
  else{G.hensInside=false;G.grazedOk=G.chickens>0&&graze(G.chickens*CFG.henGrass);
    if(G.grazedOk){addFood('eier',G.chickens,G.week+1);n.eggs=(n.eggs||0)+G.chickens;log(`Die Hennen schlafen draußen, fressen Gras und legen ${G.chickens} Eier`)}else if(G.chickens>0){n.grassShort=true;log('Die Hennen finden draußen nicht genug Gras')}}
}

// ---------------------------------------------------------------- Kennzahlen (nur intern / Debug)
function stats(){
  const s={week:G?G.week:1,hares:0,burrows:0,gardenHares:0,foxes:0,chickens:G?G.chickens:CFG.chickens,sap:0,young:0,big:0,giants:0,
    birke:0,eiche:0,buche:0,dead:0,bright:0,dark:0,hofBright:0,hofSaplings:0,gHoles:0,gTall:0,gPlants:0,fBroken:0,fDamaged:0,
    logs:logs.length,wood:G?G.barnWood:0,hay:G?G.barnHay:0,avgLight:0};
  for(const b of burrows)if(b.alive){s.burrows++;s.hares+=b.n;if(b.garden)s.gardenHares+=b.n}
  s.foxes=foxes.filter(f=>f.alive).length;
  for(const t of trees){if(!t.alive)continue;if(t.dead){s.dead++;continue}
    if(t.h<=1)s.sap++;else if(t.h<=3)s.young++;else{s.big++;s[t.sp]++}if(t.giant)s.giants++;
    if(t.h<=3&&inHofClearing(t.x,t.y)&&!inGarden(t.x,t.y))s.hofSaplings++;
    if(inGarden(t.x,t.y))s.gPlants++}
  let lsum=0,lc=0;
  for(let i=0;i<N;i++){const x=i%W,y=(i/W)|0,g=ground[i];
    if(g===G_FOREST&&!fkind[i]){lsum+=light[i];lc++;if(light[i]>=CFG.litMeadow){s.bright++;if(inHofClearing(x,y))s.hofBright++}else if(light[i]<CFG.litMoss)s.dark++}
    if(g===G_LAWN){if(feat[i]===F_HOLE)s.gHoles++;if(grass[i]===2)s.gTall++}
    if(fkind[i]===FK_H||fkind[i]===FK_V){if(fence[i]<=0)s.fBroken++;else if(fence[i]<3)s.fDamaged++}}
  s.avgLight=lc?lsum/lc:0;
  return s;
}

// ================================================================ Aufgaben (Kategorien)
const TASKS={
  maehen:   {label:'Wiese mähen',group:true,unit:'Felder'},

  flicken:  {label:'Zaun flicken',group:true,auto:true,unit:'Stellen'},
  setzlinge:{label:'Jungpflanzen ziehen',group:true,unit:'Pflanzen'},
  loecher:  {label:'Löcher zuschütten',group:true,unit:'Löcher'},
  weg:      {label:'Weg anlegen',group:true,unit:'Felder'},
  faellen:  {label:'Fällen'},
  zerlegen: {label:'Stamm zerlegen'},
  roden:    {label:'Stumpf roden'},
  bau:      {label:'Bau zuschütten'},
  falle:    {label:'Falle stellen'},

};
// Wer was darf und wie schnell, aus rollen.js: who[id] = Zeitfaktor (Effektivität 100 % → 1, 50 % → 2)
for(const [k,d] of Object.entries(TASKS)){const r=RL.aufgaben[k]||{personen:{}};d.who={};
  for(const [id,e] of Object.entries(r.personen||{}))if(e>0&&RL.personen[id])d.who[id]=100/e;
  d.ueblich=d.fixed&&r.ueblich&&d.who[r.ueblich]?r.ueblich:null;d.nurJung=r.nurJung||[]}
const isHen=t=>t.type==='fuettern'||t.type==='einsperren';
const routineOwner=t=>TASKS[t.type].fixed?TASKS[t.type].ueblich:null;
function effectiveWho(t){return t.who===null&&routineOwner(t)?routineOwner(t):t.who}
function whoName(t){const w=effectiveWho(t);
  if(w==='none')return t.type==='einsperren'?'niemand – bleiben draußen':t.type==='kochen'?'niemand – nur Brotzeit':'niemand';
  if(!w)return 'niemand';return S(w).name+(t.who===null?' (üblich)':'')}
// Zuständigkeit: feste Aufgaben haben genau eine Person (who), alle anderen eine Mannschaft (crew).
// Sammelposten dürfen mehrere bekommen (sie teilen sich die Arbeit), Einzelaufgaben höchstens eine.
function crewOf(t){if(TASKS[t.type].fixed){const w=effectiveWho(t);return w&&w!=='none'?[w]:[]}return t.crew||(t.crew=[])}
const assigned=(t,id)=>crewOf(t).includes(id);
function toggleAssign(t,id){if(!t||!canDo(t.type,id,t))return;
  if(TASKS[t.type].fixed){const own=routineOwner(t)===id;if(effectiveWho(t)===id)t.who=own?'none':null;else t.who=own?null:id}
  else if(TASKS[t.type].group)t.crew=assigned(t,id)?t.crew.filter(x=>x!==id):[...crewOf(t),id];
  else{const old=crewOf(t)[0];t.crew=old===id?[]:[id];if(old&&old!==id)toast(`${taskTitle(t)}: jetzt ${S(id).name} statt ${S(old).name}.`)}
  if(assigned(t,id))guide('assign')}
const S=id=>staff.find(s=>s.id===id);
const mult=(type,who)=>TASKS[type].who[who];
function fellCost(tr){return tr.giant?CFG.cost.riese:tr.h>=6?CFG.cost.baumAlt:tr.h>=4?CFG.cost.baum:tr.h>=2?CFG.cost.jungbaum:CFG.cost.setzling}
function canDo(type,who,t){if(mult(type,who)===undefined)return false;
  if(type==='faellen'&&TASKS.faellen.nurJung.includes(who)){const tr=t&&treeById.get(t.ref);if(!tr||tr.h>3)return false}return true}
function walkable(x,y){
  if(!inb(x,y))return false;const i=idx(x,y),g=ground[i];
  if(g===G_BLOCK||g===G_WATER)return false;
  const tid=trunkAt[i];if(tid>=0){const t=treeById.get(tid);if(t&&t.alive&&t.h>=2)return false}   // = treeAt(i), ohne Funktionsaufruf (heiß: Wegsuche)
  if(lyingAt[i]>=0)return false;
  if(fkind[i]===FK_H||fkind[i]===FK_V)return fence[i]<=0;
  return true;
}
// ---------------------------------------------------------------- Ortskenntnis (Demo B2a, Paket 1)
// Kenntnis je Person und Feld, 0..1 – gespeichert als Byte 0..255 (KN_MAX) in kenn[key] ('P' = Verwalter, sonst die Personal-ID); Weltzustand (sim-test-Fingerabdruck: kenn, knBuf, klSnap).
// Wirkung nur über fremdheit(who,i) = 1 − Kenntnis → Kostenkarte (CFG.zeit.fremd). Alles ohne R: Startwerte und Zuwachs sind reine Funktionen des Weltzustands.
// Zuwachs: Verwalter an der Schrittstelle (updatePlayer → playerSeen: Betreten + Sehen, Sichtradius in Feldern aus light[] des eigenen Feldes; auch am Sonntag, nie aus draw/G.lp; Versetzen schreibt nichts).
//   Personal tagsüber nur in den Wochenpuffer knBuf[id] (Bit 1 betreten, Bit 2 gearbeitet; personTick, nur !dry – der Trockenlauf schreibt nichts), wirksam erst in der Wochenhülle (knWeek): ab der nächsten Woche.
// Abbau nur, wo sich das Feld verändert hat: Klassen-Diff der feldKlasse gegen den Schnappschuss klSnap (klDiff, zweimal je Wochenhülle, siehe weekStep) – keine Haken in nightStep/growTrees/applyJob.
const KN_MAX=255;
const WHO_KEYS=['P',...STAFF_DEF.map(d=>d.id)];   // Personen mit Ortskenntnis; Index = Slot der Distanzfelder (wayField), ein weiterer Slot für „keine Person“
let whoMissing=0;   // Aufrufe der Kostenkarte ohne gültige Person (Diagnose im sim-test, muss 0 bleiben; so ein Aufruf rechnet mit voller Kenntnis)
const KN_VOLL=new Uint8Array(N).fill(KN_MAX),knTmp=new Uint8Array(N);   // reine Hilfsarrays (kein Weltzustand): „alles bekannt“ · Arbeitsfeld von knWeek
function whoKey(who){if(who===P)return 'P';if(who&&WHO_KEYS.includes(who.id))return who.id;whoMissing++;return null}
const whoSlot=who=>{const k=whoKey(who);return k===null?WHO_KEYS.length:WHO_KEYS.indexOf(k)};
const kennOf=who=>{const k=whoKey(who);return k===null?KN_VOLL:kenn[k]};
// Feldklassen: die einzige Wahrheit dafür, was an einem Feld „so oder so“ ist (Kenntnis-Abbau; Paket 3: Gutskarte und alte Karte). KL_UNBEKANNT (Karte, Paket 3) ist schon vergeben.
const KL_UNBEKANNT=0,KL_WIESE=1,KL_WALD_HELL=2,KL_WALD_DUNKEL=3,KL_WASSER=4,KL_FURT=5,KL_GEBAEUDE=6,KL_WEG=7,KL_PFAD=8,KL_JUNGBAUM=9,KL_BAUM=10,KL_STUMPF=11,KL_TOTHOLZ=12,KL_RASEN=13;
const klLicht=c=>c>=KL_WIESE&&c<=KL_WALD_DUNKEL;   // Klassen, die nur das Licht unterscheidet (kleine Veränderung)
function feldKlasse(i){
  const g=ground[i];
  if(g===G_WATER)return KL_WASSER;
  if(g===G_FORD||g===G_BRIDGE)return KL_FURT;
  if(g===G_BLOCK||fkind[i])return KL_GEBAEUDE;

function stdItems(s){

  if(s.id==='liese'){const garden=[];
    for(let y=ESTATE.y0+1;y<ESTATE.y1;y++)for(let x=ESTATE.x0+1;x<ESTATE.x1;x++){const i=idx(x,y);

// Nächste Arbeit für s im Fenster bis zur Heimkehr b (Minute): Zugeteiltes in Listenreihenfolge, danach das Übliche. Ein Posten kommt nur in Frage, wenn
// Hinweg (ab dem Ort des letzten Auftrags, nach Kostenkarte) + Arbeit + Rückweg bis b passen; Objekte dürfen angefangen werden (Fortschritt bleibt),
// Fläche/Sammelposten arbeiten Feld für Feld, was nicht mehr passt, bleibt als Restfeld stehen. Mehrfachbesetzung: jedes Feld nur einmal vergeben (G.claimed).
// Rückweg nach Distanzfeld zur Bezugsminute b − rueckRef (gegen Ende des Fensters, dunkler als jetzt). Aufruf innerhalb withWayField, ohne Weltänderung.
function pickWork(s,b){
  const now=G.min,ref=b-CFG.zeit.rueckRef,sx=Math.round(s.x),sy=Math.round(s.y),key=(t,it)=>t.id+':'+it;
  const back=(x,y)=>wayBackMinutes(x,y,ref,s);
  const route=(x,y)=>{const p=findPath(sx,sy,x,y,s);return p&&{path:p,min:pathMinutes(p,now,s)}};
  const fail=(t,k)=>{s.skip.add(k);if(t&&!s.failed.includes(t))s.failed.push(t)};
  for(const t of staffTasks(s,false)){
    const d=TASKS[t.type];if(d.fixed)continue;
    const rate=rateOf(s,t.type);
    if(d.group){
      const its=taskItems(t).filter(it=>itemTile(t,it)>=0&&!G.claimed.has(key(t,it))&&!s.skip.has(key(t,it))&&!(dry&&dry.done.has(key(t,it))));
      for(const it of nearestFirst(its,[sx,sy],it=>itemTile(t,it)).slice(0,3)){
        const j=itemTile(t,it),x=j%W,y=(j/W)|0,r=route(x,y);

        const norm=normOf(itemCost(t,it));

    } else {
      if(!validTask(t)||s.skip.has(key(t,'*')))continue;
      const r=route(t.x,t.y);if(!r){fail(t,key(t,'*'));continue}
      const left=normOf(singleCost(t))-t.done,stop=b-back(t.x,t.y);
      if(left>0&&stop-(now+r.min)>=Math.min(CFG.zeit.minArbeit,left/rate))return{kind:'single',task:t,x:t.x,y:t.y,path:r.path,left,rate,stop}
    }
  }
  const stdRate=capOf(s)/100;
  for(const j of stdItems(s).filter(j=>!s.skip.has('s:'+j.name+j.x+','+j.y)).slice(0,3)){
    const r=route(j.x,j.y);if(!r){s.skip.add('s:'+j.name+j.x+','+j.y);continue}
    const norm=normOf(j.pts);
    if(now+r.min+norm/stdRate+back(j.x,j.y)<=b){const {pts,...leg}=j;return{...leg,path:r.path,left:norm,rate:stdRate}}
  }
  return null;
}
// ---------------------------------------------------------------- Wirkung
function applyJob(s,j){
  if(dry){dryApply(s,j);return}
  switch(j.kind){
    case 'fuettern':{const need=heuBedarf();if(G.barnHay>=need){G.barnHay-=need;G.hensFoodOk=true}else G.hayShort=true;j.task.doneWeek=G.week;break}
    case 'einsperren':G.coopClosed=true;j.task.doneWeek=G.week;break;
    case 'markt':s.away=true;s.awayUntil=G.times.mittag;G.marketOut=true;break;
    case 'kochen':j.task.doneWeek=G.week;cookMeal(s);break;
    case 'item':if(G.tasks.includes(j.task))applyItem(j.task,j.item);break;
    case 'single':{const t=j.task;if(!G.tasks.includes(t))break;if(!validTask(t)){removeTask(t);break}
      if(applySingle(t))removeTask(t);else{if(!s.failed.includes(t))s.failed.push(t);s.skip.add(t.id+':*');t.done=normOf(singleCost(t))-0.01}
      break}
    case 'routine':{const i=idx(j.x,j.y);
      if(j.name==='einholen'){if(feat[i]===F_WOOD||feat[i]===F_HAY||feat[i]===F_TRAPFULL)collectPile(i)}
      else if(j.name==='loch'){if(feat[i]===F_HOLE)feat[i]=0}
      else if(j.name==='setzling'){const t=treeAt(i);if(t&&t.h<=3){killTree(t);computeLight()}}
      else if(j.name==='rasen'){grass[i]=0;gprog[i]=0}
      else if(j.name==='zerlegen'){const l=logById.get(j.log);if(l){cutLog(l);G.tasks.filter(t=>t.type==='zerlegen'&&t.ref===l.id).forEach(removeTask)}}
      break}
  }
}
// ---------------------------------------------------------------- Gehen
// Günstigste Route nach Kostenkarte (A*); Pfad = Feldindizes ohne Startfeld wie bisher, null = unerreichbar. who = Person (Ortskenntnis, B2).
function findPath(sx,sy,tx,ty,who){
  sx=Math.round(sx);sy=Math.round(sy);
  const goal=new Set(),direct=walkable(tx,ty);
  if(direct)goal.add(idx(tx,ty));
  else for(const [dx,dy] of DIRS)if(walkable(tx+dx,ty+dy))goal.add(idx(tx+dx,ty+dy));
  if(!goal.size)return null;
  const start=idx(sx,sy);if(goal.has(start))return [];
  const hit=pfRun(start,costFn(clockMinute(),who),goal,tx,ty,direct?0:1,false);
  if(hit<0)return null;
  const path=[];for(let k=hit;k!==start;k=pfPrev[k])path.push(k);
  return path.reverse();
}
function faceTo(s,x,y){const dx=x-s.x,dy=y-s.y;if(Math.abs(dx)>Math.abs(dy))s.dir=dx>0?'right':'left';else if(dy)s.dir=dy>0?'down':'up'}
// Ein Tick Gehen: s.acc sammelt Spielminuten; ein Feld ist abgelaufen, wenn dessen Kosten (Kostenkarte zur aktuellen Minute) gesammelt sind. true = angekommen.
function followPath(s){
  if(!s.path.length)return true;
  s.acc+=1;
  while(s.path.length){
    const n=s.path[0];let c=cost(n,clockMinute(),s);if(!(c<Infinity))c=CFG.zeit.minBoden;   // inzwischen versperrte Felder wie bisher durchqueren
    if(s.acc<c-1e-9)return false;
    s.acc-=c;faceTo(s,n%W,(n/W)|0);s.x=n%W;s.y=(n/W)|0;s.path.shift();
    if(!dry&&trittW[n]<255)trittW[n]++;   // Trittzähler (Paket 2): nur der echte Schritt, nie der Trockenlauf
  }
  s.acc=0;return true;
}
function goTo(s,x,y){const p=findPath(s.x,s.y,x,y,s);s.cur=null;s.acc=0;
  if(p&&p.length){s.path=p;s.state='walk'}else{s.path=[];s.state='rest';s.wait=G.min+30}}
const LINE=[[49,49],[50,49],[51,49],[52,49]],PLAYER_LINE=[50,51];
const lineSpot=s=>LINE[staff.indexOf(s)];
const near=(s,p)=>Math.abs(s.x-p[0])+Math.abs(s.y-p[1])<=1;
const atHome=s=>near(s,lineSpot(s));   // in der Reihe am Hof (Mittagspause, Warten auf eine feste Spanne am Hof)
const goHome=s=>goTo(s,...lineSpot(s));
// Bereitschaftsplatz, wenn nichts passt: in der Reihe am Hof (Hoftag vor Mittag, Mittagspause, feste Spanne steht noch an), sonst das eigene Zuhause
function standby(s){const hof=G.dayType!=='wald'&&G.min<G.times.mittag;return hof||G.phase==='mittag'||s.agenda.some(a=>!a.done)?lineSpot(s):s.home}
function arrive(s){if(s.cur){s.state='work';faceTo(s,s.cur.x,s.cur.y)}else{s.state='rest';s.dir='down'}}
// ---------------------------------------------------------------- Ein Tick je Person
function startLeg(s,j){const {path,...leg}=j;
  if(leg.kind==='item')G.claimed.add(leg.task.id+':'+leg.item);
  s.cur=leg;s.path=path;s.acc=0;s.state=path.length?'walk':'work';if(!path.length)faceTo(s,leg.x,leg.y)}
function endLeg(s){const c=s.cur;if(c&&c.kind==='item'&&!dry)G.claimed.delete(c.task.id+':'+c.item);s.cur=null;s.state='rest'}
function startCommit(s,c){
  if(c.type==='markt'){c.done=true;applyJob(s,{kind:'markt',task:c.task});return}
  const miss=()=>{c.done=true;if(!s.failed.includes(c.task))s.failed.push(c.task);decide(s)};
  if(G.min>=c.end)return miss();   // zu spät dran (z. B. abends nicht mehr rechtzeitig daheim): die Abendarbeit fällt aus
  const p=findPath(s.x,s.y,c.x,c.y,s);if(!p)return miss();
  s.cur={kind:c.type,task:c.task,x:c.x,y:c.y,left:c.dur,ag:c};s.path=p;s.acc=0;s.state=p.length?'walk':'work';if(!p.length)faceTo(s,c.x,c.y);
}
// s ist frei (daheim oder mit erledigtem Auftrag): was kommt als Nächstes? Feste Spanne, Arbeit im Fenster bis zur nächsten Heimkehr, sonst heim und warten.
function decide(s){
  const T=G.times,now=G.min;
  if(G.phase==='mittag'){if(atHome(s))s.wait=T.wiederAb;else goHome(s);return}
  const c=s.agenda.find(a=>!a.done);
  if(c&&now>=c.go){startCommit(s,c);return}
  const hof=G.dayType!=='wald'&&now<T.mittag;
  let b=c?c.go:T.ende;if(hof)b=Math.min(b,T.mittag);
  const j=pickWork(s,b);
  if(j){startLeg(s,j);return}
  const spot=standby(s);
  if(!near(s,spot)){goTo(s,...spot);return}
  s.wait=Math.min(c?c.go:Infinity,hof?T.mittag:Infinity,now+60);   // später neu schauen (neue Haufen, nächste Spanne)
}
function workTick(s){
  const c=s.cur;if(!c){s.state='rest';return}
  const t=c.task;
  if(c.kind==='single'){
    if(!G.tasks.includes(t)||!validTask(t)){if(!dry&&G.tasks.includes(t))removeTask(t);endLeg(s);return}
    t.done+=c.rate;
    if(t.done>=normOf(singleCost(t))-1e-6){applyJob(s,c);endLeg(s)}
    else if(G.min+1>=c.stop)endLeg(s);   // Zeit um, Rückweg: der Fortschritt bleibt am Objekt
  } else if(c.kind==='item'||c.kind==='routine'){
    if(c.kind==='item'&&!G.tasks.includes(t)){endLeg(s);return}
    c.left-=c.rate;if(c.left<=1e-6){applyJob(s,c);endLeg(s)}
  } else {c.left-=1;if(c.left<=0){applyJob(s,c);c.ag.done=true;endLeg(s)}}
}
function personTick(s){
  if(!s.available)return;
  if(s.away){if(G.min>=s.awayUntil)marketReturn();return}
  if(s.state==='walk'){if(followPath(s))arrive(s)}
  else if(s.state==='work')workTick(s);
  if(!dry)knNote(s);   // Ortskenntnis: nur Wochenpuffer, nie im Trockenlauf
  if(s.state==='rest'&&G.phase!=='abend'&&G.min>=s.wait)withWayField(()=>decide(s));
}
// ---------------------------------------------------------------- Der Tag
// Wochenablauf: Sonntag (Inspektion, G.phase 'sonntag') → Sonntagabend (Planen, 'plan') → Werkwoche (Appell, Tag, Mittag, Abend) → Nacht (weekStep) → nächste Woche.
// Am Sonntag steht die Uhr: sie rückt nur durch Handlungen des Spielers vor (Gehen nach der Kostenkarte, Untersuchen, Reden … – sundayAdvance); mit dem Sonnenuntergang endet
// der Sonntag (endSunday: Heimweg automatisch, Montag ohne Kraft). Das Personal tickt nur in der Werkwoche; am Sonntag steht es daheim.
// Sonntagsbeginn (reine Funktion): Sonnenaufgang, aber frühestens schlafMin nach dem Einschlafen (sleepMin = Minute seit Mitternacht des Werktags, auch über 1440); ohne Schlaf (Woche 1) Sonnenaufgang
function sundayStart(auf,sleepMin){return sleepMin==null?auf:Math.max(auf,sleepMin+CFG.zeit.schlafMin-1440)}
// Einzige Stelle, die den Schlafzustand setzt (Weltzustand): alle Wege in die Nacht laufen über nextWeek; startWeek liest ihn und setzt ihn zurück
function setSleep(min,pos){G.sleepMin=min;G.sleepPos=pos}
// Verfügbarkeit einer Person in Woche w (eine Quelle für startWeek und den Trockenlauf „nächste Woche“): ab Woche s.from und nicht zu schwach
const staffAvail=(s,w,weak)=>w>=s.from&&!weak;
function startWeek(first,quiet){
  const sl=G.sleepMin,sp=G.sleepPos;setSleep(null,null);
  G.state='play';G.phase='sonntag';G.times=dayTimes();G.min=sundayStart(G.times.start,sl);G.frozen=null;G.claimed=new Set();
  G.kraft=CFG.kraft;G.enjoyed=false;G.coopClosed=false;
  G.hensFoodOk=!G.hensInside&&G.grazedOk;G.hayShort=false;G.marketOut=false;G.goodMeal=false;G.ateWithStaff=false;G.cooked=false;
  G.tasks=G.tasks.filter(validTask);ensureAutoTasks();
  staff.forEach(s=>{s.weak=!!s.weakNext;s.weakNext=false;s.away=false;s.available=staffAvail(s,G.week,s.weak);s.cur=null;s.path=[];s.state='rest';s.failed=[];s.agenda=[];s.wait=0;s.acc=0;s.skip=new Set();
    s.x=s.home[0];s.y=s.home[1];s.px=s.x;s.py=s.y;s.dir='down'});
  spawnCritters();computeLight();tickAcc=0;
  if(sp){P.x=P.nx=sp[0];P.y=P.ny=sp[1];P.px=P.x;P.py=P.y;P.dir='down';P.moving=false}   // der Verwalter wacht dort auf, wo er eingeschlafen ist (Hof oder unterwegs)
  if(quiet)return;
  if(!sp){P.x=P.nx=PLAYER_LINE[0];P.y=P.ny=PLAYER_LINE[1];P.px=P.x;P.py=P.y;P.dir='up';P.moving=false}   // Woche 1: Ankunft auf dem Hof
  showMorning(first);
}
// Sonntag: eine Handlung kostet m Spielminuten. Ab Sonnenuntergang ist der Sonntag vorbei (öffnet eine Handlung noch eine Karte, endet er nach dem Schließen).
function sundayAdvance(m){
  if(G.phase!=='sonntag'||!(m>0))return;
  G.min+=m;
  if(G.min<G.times.ende)return;
  G.min=G.times.ende;
  if(G.state==='card')G.afterCard=()=>endSunday(true);else endSunday(true);
}
// Ende des Sonntags: forced = Dämmerung (Heimweg automatisch, Montag ohne Kraft), sonst freiwillig heimgegangen (arrive = Ankunftsminute; nach Sonnenuntergang ⇒ Montag ohne Kraft).
// Danach Sonntagabend: nur der Planungsbildschirm (das Notizbuch), Planen kostet nichts, die Uhr steht, keine Bewegung.
function endSunday(forced,quiet,arrive){
  if(G.phase!=='sonntag')return;
  if(P.mowTask)toggleMow();
  const late=arrive!==undefined&&arrive>G.times.ende;
  G.phase='plan';G.min=Math.max(arrive===undefined?G.min:arrive,G.times.ende);G.exhausted=!!forced||late;
  P.x=P.nx=HOF[0];P.y=P.ny=HOF[1];P.px=P.x;P.py=P.y;P.dir='down';P.moving=false;

  openBook();
}
// Heimweg des Verwalters: kürzeste Route vom logischen Feld P.x/P.y zum Hof nach der Kostenkarte zur jetzigen Uhrzeit, × (1 + heimAufschlag); arrive = Ankunftsminute
function homeTrip(){
  const m=clockMinute(),route=wayBackMinutes(P.x,P.y,m,P),dur=route*(1+CFG.zeit.heimAufschlag);
  return{route,dur,arrive:m+Math.ceil(dur)}}
// Montag: Planung abgeschlossen, die Werkwoche beginnt mit dem kurzen Appell („Los!“) auf dem Hof. quiet: sofort Tick 0 (Debug).
function startWorkday(quiet){
  if(G.phase!=='plan')return;
  G.phase='appell';G.state='play';G.kraft=G.exhausted?0:G.kraft;G.exhausted=false;G.enjoyed=false;G.min=G.times.start;G.frozen=null;G.claimed=new Set();
  G.goodMeal=!!G.bonusNext;G.bonusNext=false;   // gute Küche vom Waldtag-Abend wirkt bis zum Mittag (noonOutside)
  G.tasks=G.tasks.filter(validTask);ensureAutoTasks();
  staff.forEach((s,k)=>{s.x=LINE[k][0];s.y=LINE[k][1];s.px=s.x;s.py=s.y;s.dir='down';s.cur=null;s.path=[];s.state='rest';s.agenda=[];s.wait=0;s.acc=0;s.skip=new Set();s.failed=[]});
  tickAcc=0;
  if(quiet){beginDay();return}
  P.x=P.nx=PLAYER_LINE[0];P.y=P.ny=PLAYER_LINE[1];P.px=P.x;P.py=P.y;P.dir='up';P.moving=false;
  startAppell();
}
// Tick 0: die Leute stehen in der Reihe, der Plan ist verteilt (Appell vorbei)
function beginDay(){
  G.phase='tag';G.min=G.times.start;G.claimed=new Set();tickAcc=0;freezePlans();
  withWayField(()=>{for(const s of staff){s.agenda=s.available?buildAgenda(s,false,G.min):[];s.wait=0}});
}
function marketReturn(){
  if(!G.marketOut)return;G.marketOut=false;const l=staff.find(s=>s.away)||S('liese');l.away=false;l.x=ESTATE.gx;l.y=H-2;l.px=l.x;l.py=l.y;l.cur=null;l.path=[];l.acc=0;l.state='rest';l.wait=0;

}
function lunchStart(){
  G.phase='mittag';if(!G.cooked)coldMeal();   // wer kocht, hat bis jetzt gekocht (cookMeal setzt G.cooked); sonst kalte Brotzeit
  if(!ffMode&&G.state==='play')toast('Mittagspause. Wer am Nachmittag etwas anderes tun soll, den sprichst du an: „Umplanen“.',4200)}
function lunchEnd(){

function endOfDay(){

// Ereignisse an den festen Zeitpunkten (nach dem Tick, G.min ist schon die nächste Minute)
function dayEvents(){
  const T=G.times;
  if(G.phase==='tag'){
    if(G.dayType!=='wald'&&G.min===T.mittag)lunchStart();
    else if(G.dayType==='wald'&&G.min===T.mittag)noonOutside();
    else if(G.min>=T.ende&&(G.min>=T.spaet||staff.every(s=>!s.available||(!s.away&&s.state==='rest'))))endOfDay();   // Abendgrenze und alle daheim, sonst harte Spätgrenze
  } else if(G.phase==='mittag'&&G.min>=T.wiederAb)lunchEnd();
}
// Ein Tick: jede Person für die Minute G.min, dann Uhr weiter. false = die Uhr steht (am Abend an der Schlafgrenze; das Einschlafen löst die Hauptschleife aus, nicht der Tick).
function dayTick(){
  if(G.phase==='abend'&&G.min>=CFG.zeit.schlafGrenze)return false;
  for(const s of staff)personTick(s);
  G.min++;dayEvents();return true;
}
function advanceDay(dt){
  if(G.phase==='sonntag'||G.phase==='plan'||G.phase==='appell')return;   // Sonntag/Planung: die Uhr steht; Appell: Tick 0 steht noch aus
  tickAcc+=dt*60/CFG.zeit.stundeSek;

}
// Kern von Heimgehen [T] (früher „Tag beenden“): dieselben Ticks wie im Spiel, ohne Darstellung, bis der Abend beginnt (Ergebnis = sichtbares Durchspielen)
function finishDayTicks(){
  if(G.phase==='appell')beginDay();

  tickAcc=0;
}
// Heimgehen [T] in jeder Phase: Fenster mit Dauer, Aufschlag und Ankunftszeit (die Ankunft bucht die Uhr), dann playerHome
function homeAsk(){
  const ph=G.phase,z=CFG.zeit;
  if(ph==='plan'){planFinishAsk();return}
  if(!['sonntag','appell','tag','mittag','abend'].includes(ph)){toast('Jetzt geht es nicht heim.');return}
  const t=homeTrip(),pct=Math.round(z.heimAufschlag*100),far=t.arrive>z.schlafGrenze;
  let txt=`Heimgehen? Der kürzeste Weg zum Hof dauert ${Math.round(t.route)} Min, dazu ${pct} % für den sicheren Weg: ${Math.round(t.dur)} Min. Du kommst um ${hm(t.arrive)} an.`;
  if(ph==='sonntag')txt+=t.arrive>G.times.ende?' Das ist nach Sonnenuntergang – am Montag fehlt dir die Kraft.':' Danach planst du die Werkwoche.';
  else if(far)txt+=` Das ist nach ${hm(z.schlafGrenze)} Uhr: Du schläfst unterwegs ein und wachst dort auf.`;
  else if(ph==='abend')txt+=' Danach gehst du schlafen; der Sonntag beginnt frühestens 8 Stunden später.';
  else txt+=' Der Rest des Tages wird bis zum Abend ohne Zuschauen durchgerechnet; dann bist du daheim.';
  confirmCard(txt,()=>playerHome())}
// Heimgehen ausführen. Sonntag: heim, Sonntagabend. Werkwoche tagsüber: Kern wie früher „Tag beenden“ (finishDayTicks), dann Abend-Ticks bis zur Ankunft, der Verwalter steht am Hof.
// Abend: dazu schlafen. Ankunft nach der Schlafgrenze: Einschlafen an der Grenze am Ausgangsort (kein Versetzen an den Hof).
function playerHome(quiet){
  const t=homeTrip(),z=CFG.zeit,ph=G.phase;
  if(ph==='sonntag'){endSunday(false,quiet,t.arrive);return}
  if(ph==='plan')return;
  finishDayTicks();
  const ziel=Math.min(t.arrive,z.schlafGrenze);
  ffMode=true;try{for(let n=0;G.phase==='abend'&&G.min<ziel&&n<4000;n++)if(!dayTick())break}finally{ffMode=false}
  tickAcc=0;
  if(t.arrive>z.schlafGrenze){fallAsleepOutside(quiet);return}
  P.x=P.nx=HOF[0];P.y=P.ny=HOF[1];P.px=P.x;P.py=P.y;P.dir='down';P.moving=false;
  if(ph==='abend')nextWeek(quiet,G.min,HOF.slice());
  else if(!quiet)toast('Du bist daheim. Es ist Abend.');
}
// Schlafgrenze erreicht (Hauptschleife) oder der Heimweg reicht nicht mehr bis dahin: der Verwalter schläft dort ein, wo er steht
function fallAsleepOutside(quiet){
  if(!quiet)toast(`Es ist tief in der Nacht (${hm(CFG.zeit.schlafGrenze)} Uhr): Du schläfst auf der Stelle ein.`,5000);
  nextWeek(quiet,CFG.zeit.schlafGrenze,[P.x,P.y]);
}
// Sonntagabend: das Notizbuch ist der Planungsbildschirm; Schließen (Esc/N) oder T fragt, ob die Planung abgeschlossen ist (Esc = nein: zurück zum Bildschirm)
function planFinishAsk(){
  closeBook();

  G.afterCard=()=>{if(G.phase==='plan')openBook()};
}
// Schlafen führt zum jeweils nächsten Abschnitt: Sonntag → Sonntagabend → Werkwoche (Appell); in der Werkwoche zur Nacht (Wochenschritt) und zum nächsten Sonntag
function sleep(){
  if(G.phase==='sonntag'){endSunday(false);return}
  if(G.phase==='plan'){startWorkday();return}
  nextWeek();
}
// Rest der Werkwoche, Nacht (weekStep) und der Sonntag der nächsten Woche; nach der letzten Woche kehrt der Baron zurück.
// sleepMin/sleepPos = Einschlafzeit (Minute seit Mitternacht des Werktags) und -ort; ohne Angabe (Gesindehaus, dbgDays) schläft er jetzt (tagsüber: am Abendbeginn) auf dem Hof.
function nextWeek(quiet,sleepMin,sleepPos){
  if(P.mowTask)toggleMow();
  finishDayTicks();setSleep(sleepMin===undefined?G.min:sleepMin,sleepPos||HOF.slice());weekStep();G.week++;
  if(G.week>CFG.zeit.wochen){showEnding();return}
  startWeek(false,quiet);
}
function dbgDays(k){   // Debug: k ganze Wochen überspringen (Sonntag und Planung ohne Zutun, Werkwoche mit dem Zugeteilten)
  for(let n=0;n<k;n++){
    if(G.state==='end')return;
    if(G.phase==='sonntag')endSunday(false,true);
    if(G.phase==='plan')startWorkday(true);
    nextWeek(n<k-1);
  }
  if(G.state==='card'){} // Sonntagskarte der letzten Woche bleibt stehen
}
// Nur Darstellung (kein Weltzustand): Laufanimation, Zwischenposition zwischen zwei Feldern, Hackgeräusch
function updateStaff(dt){
  for(const s of staff){if(!s.available||s.away)continue;s.anim+=dt;
    let px=s.x,py=s.y;
    if(s.state==='walk'&&s.path.length){const n=s.path[0],nx=n%W,ny=(n/W)|0;let c=cost(n,clockMinute(),s);if(!(c<Infinity))c=CFG.zeit.minBoden;
      const f=clamp((s.acc+tickAcc)/c,0,1);px=s.x+(nx-s.x)*f;py=s.y+(ny-s.y)*f}
    s.px=px;s.py=py;
    if(s.state==='work'&&s.cur&&s.cur.kind==='single'&&s.cur.task.type==='faellen'&&(s.anim%0.5)<dt)SFX.chop()}
}
// ---------------------------------------------------------------- Zeitleiste für die Tafel: Trockenlauf (Anzeige = Ausführung)
// planAll lässt dieselben Funktionen laufen wie der Tag (personTick/decide/pickWork/followPath/lunchEnd, Ticks zu je einer Minute) auf einem Wegwerfzustand:
// Personen stehen in der Reihe, Fortschritt (t.done), Posten, Claims und Agenden sind virtuell, applyJob wirkt nicht auf die Welt (dryApply), danach wird alles
// zurückgesetzt. Bei unveränderter Welt ist die Vorhersage damit das Ergebnis des Tages. Planung ab `from`: T.start (ganzer Tag, nach dem Appell oder abends als
// „morgen früh“) bzw. T.wiederAb (Hoftag, Nachmittag). Das Ergebnis wird zwischengespeichert, solange sich Zuteilung, Tageszustand und Welt-Stand nicht ändern.
// Ergebnis: plans[id] = [{from,to,kind:'fest'|'work'|'std'|'heim'|'pause'|'frei',task,label,walk?}], finish: Aufgaben-ID → {end: Minute, left: Restarbeit in Normminuten},
// home[id] = voraussichtliche Heimkehr, warn = Warnungen (Abendarbeit fällt aus, Heimkehr nach Einbruch der Dunkelheit)
const mealGood=()=>cooksToday(true)&&defaultMeal().filter(k=>G.food[k]>0).length>=2;   // gute Küche: wer kocht, hat mindestens zwei Zutaten
// Der Kartenstand (kartWo/kartKl) gehört bewusst NICHT in den Schlüssel: „ca.“/„?“ liest ihn beim Rendern (segUnsure) aus Route und Ziel im Ergebnis, das Ergebnis selbst bleibt vom Kartenwissen unabhängig.
function planKey(from,jetzt){
  const rp=jetzt&&book.replan?book.replan+':'+book.replanSig+':'+staffSig(S(book.replan)):'';
  return [from,jetzt,rp,JSON.stringify(G.frozen),G.week,G.phase,G.min,G.dayType,G.times.start,G.marketOut,G.cooked,G.goodMeal,G.bonusNext,JSON.stringify(G.food),
    staff.map(s=>s.available+':'+s.weakNext).join(),
    G.tasks.map(t=>[t.id,t.type,(t.crew||[]).join('+'),t.who,t.done,t.items?t.items.length:'',t.doneWeek].join('/')).join(';')].join('|')}
// jetzt (nur Werkwoche tagsüber): „ab jetzt“ vom Ist-Zustand aller Personen (Tafel in der Werkwoche, Umplanen), sonst Tagesbeginn bzw. Nachmittag wie bisher
function planAll(from,live,fresh,jetzt){
  jetzt=!!jetzt&&(G.phase==='tag'||G.phase==='mittag');
  from=jetzt?G.min:Math.max(from,G.times.start);const key=planKey(from,jetzt);
  if(!fresh&&planCache&&planCache.key===key)return planCache.res;
  const res=withWayField(()=>dryRun(from,jetzt));planCache={key,res};return res}
// Wirkung eines Auftrags im Trockenlauf: nur Merkzeichen (Posten erledigt, Aufwand erreicht), die Welt bleibt unberührt
function dryApply(s,j){
  switch(j.kind){
    case 'item':dry.done.add(j.task.id+':'+j.item);break;
    case 'single':j.task.done=normOf(singleCost(j.task));break;
    case 'routine':s.skip.add('s:'+j.name+j.x+','+j.y);break;
    case 'markt':s.away=true;s.awayUntil=G.times.mittag;dry.markt.set(s.id,j.task);break;
    case 'fuettern':case 'einsperren':j.task.doneWeek=G.week;break;   // wie im Spiel (buildAgenda nach der Mittagspause plant sie nicht noch einmal); dryRun setzt es zurück
    case 'kochen':dry.cooked=true;if(G.dayType!=='wald')G.goodMeal=mealGood();j.task.doneWeek=G.week;break;   // Waldtag: gute Küche wirkt erst am nächsten Morgen (bonusNext)
  }
}
const DRY_FIELDS=['x','y','dir','state','cur','path','acc','wait','away','awayUntil','skip','failed','agenda','available','weak'];
// Betriebsart „ab jetzt“ (jetzt): alle Personen vom Ist-Zustand (Tiefenkopie von cur/path/agenda/skip/failed, G.claimed und G.frozen als Kopie, G.phase bleibt tag/mittag);
// ist ein Umplanen offen und hat sich der Plan der Person geändert, bekommt nur sie replanPerson – genau das, was beim Schließen der Tafel wirklich geschieht.
function dryRun(from,jetzt){
  const keep={min:G.min,phase:G.phase,claimed:G.claimed,frozen:G.frozen,week:G.week,times:G.times,goodMeal:G.goodMeal,hasBacklog:'gardenBacklog' in G,backlog:G.gardenBacklog,done:G.tasks.map(t=>t.done),doneWeek:G.tasks.map(t=>t.doneWeek)};
  const tomorrow=!jetzt&&from===G.times.start&&(G.phase==='abend'||G.phase==='mittag'||(G.phase==='tag'&&G.min>G.times.start));   // Tafel nach dem Appell: gilt ab morgen früh
  if(tomorrow){G.week++;G.times=dayTimes();from=G.times.start}   // Sonnenstand und diese Woche Erledigtes (doneWeek) wie in der nächsten Werkwoche
  const T=G.times,hof=G.dayType!=='wald',plans={},finish=new Map(),home={},warn=[],lastWork=new Map(),failed=new Set();
  const saved=staff.map(s=>DRY_FIELDS.map(f=>[f,Object.prototype.hasOwnProperty.call(s,f),s[f]]));
  if(tomorrow)for(const s of staff){s.weak=!!s.weakNext;s.available=staffAvail(s,G.week,s.weak)}   // „morgen früh“ = nächste Woche: wer dann dazukommt (Jost) oder zu schwach ist, wie es startWeek setzt (wird unten zurückgesetzt)
  const live=staff.filter(s=>s.available),rec=new Map(live.map(s=>[s.id,{segs:[],act:null,seg:null}]));
  const harvest=last=>{for(const s of live)for(const a of s.agenda){
    if(a.done&&!s.failed.includes(a.task))finish.set(a.task.id,{end:a.end,left:0});
    else if(a.done||last)failed.add(a.task.id+'|'+s.name)}};
  const close=(r,m)=>{const g=r.seg;if(!g)return;g.to=m;r.seg=null;if(g.to<=g.from)return;
    const p=r.segs[r.segs.length-1];
    if(p&&p.task===g.task&&p.kind===g.kind&&(g.kind==='work'||g.kind==='std')&&g.from-p.to<=1){p.to=g.to;p.walk+=g.walk;if(g.rt)p.rt=(p.rt||[]).concat(g.rt);if(g.zt)p.zt=(p.zt||[]).concat(g.zt)}else r.segs.push(g)};
  const observe=(s,r,m)=>{
    const c=s.cur,act=s.away?'markt':c||(s.state==='walk'?'heim':null);
    if(act!==r.act){close(r,m);r.act=act;
      if(act==='markt')r.seg={from:m,kind:'fest',task:dry.markt.get(s.id)||null,label:'unterwegs zum Markt',walk:0};
      else if(act==='heim')r.seg={from:m,kind:'heim',task:null,label:'Heimweg',walk:0};
      else if(act&&act.ag)r.seg={from:m,kind:'fest',task:act.task,label:taskTitle(act.task),walk:0};
      else if(act&&act.kind==='routine')r.seg={from:m,kind:'std',task:null,label:stdLabel(s),walk:0};
      else if(act)r.seg={from:m,kind:'work',task:act.task,label:taskTitle(act.task),walk:0}}
    if(r.seg&&r.seg.kind!=='heim'&&s.state==='walk'&&!s.away)r.seg.walk++;
    if(r.seg&&!s.away){   // Route (gegangene Felder) und Ziel (Arbeitsort) je Segment für „ca./?“ der Tafel: nur Feldnummern, kein Weltzugriff
      if(s.state==='walk'){const q=r.seg.rt||(r.seg.rt=[]),k=idx(Math.round(s.x),Math.round(s.y));if(q[q.length-1]!==k)q.push(k)}
      else if(s.state==='work'&&s.cur&&s.cur.x!==undefined){const q=r.seg.zt||(r.seg.zt=[]),k=idx(s.cur.x,s.cur.y);if(q[q.length-1]!==k)q.push(k)}}};
  try{
    dry={done:new Set(),cooked:false,markt:new Map()};
    if(jetzt){
      G.frozen=Object.fromEntries(Object.entries(keep.frozen||{}).map(([k,v])=>[k,v.slice()]));G.claimed=new Set(keep.claimed);
      for(const s of live){const orig=s.agenda,ag=orig.map(a=>({...a})),c=s.cur;
        s.agenda=ag;s.cur=c?(c.ag?{...c,ag:ag[orig.indexOf(c.ag)]}:{...c}):null;s.path=s.path.slice();s.skip=new Set(s.skip);s.failed=s.failed.slice()}
      const rp=book.replan&&S(book.replan);
      if(rp&&rp.available&&staffSig(rp)!==book.replanSig)replanPerson(rp);
    } else {
      G.frozen=null;G.claimed=new Set();G.phase='tag';G.min=from;
      G.goodMeal=from>T.start?(G.cooked?keep.goodMeal:mealGood()):(tomorrow||keep.phase==='sonntag'||keep.phase==='plan'?!!G.bonusNext:keep.goodMeal);   // Tagesbeginn: gute Küche vom Waldtag-Abend (bonusNext)
      for(const s of live){const [x,y]=lineSpot(s);s.x=x;s.y=y;s.dir='down';s.state='rest';s.cur=null;s.path=[];s.acc=0;s.wait=0;s.away=false;s.skip=new Set();s.failed=[];s.agenda=buildAgenda(s,false,from)}
    }
    for(let n=0;n<2500;n++){
      if(G.phase==='abend'&&(G.min>=T.dunkel||live.every(s=>s.away||s.state==='rest')))break;
      const m=G.min;
      for(const s of live){
        if(s.away&&m>=s.awayUntil){s.away=false;s.x=ESTATE.gx;s.y=H-2;s.cur=null;s.path=[];s.acc=0;s.state='rest';s.wait=0}   // wie marketReturn, ohne Wirkung auf die Welt
        const c=s.cur;if(s.state==='work'&&c&&c.task&&(c.kind==='single'||c.kind==='item'))lastWork.set(c.task.id,m+1);
        personTick(s);observe(s,rec.get(s.id),m)}
      G.min++;
      if(G.phase==='tag'){
        if(hof&&G.min===T.mittag){G.phase='mittag';if(!G.cooked&&!dry.cooked)G.goodMeal=false}   // wie lunchStart: wer nicht gekocht hat, bringt kalte Brotzeit
        else if(!hof&&G.min===T.mittag)G.goodMeal=false;   // wie noonOutside: die Brotzeit draußen beendet den Bonus vom Vorabend
        else if(G.min>=T.ende&&(G.min>=T.spaet||live.every(s=>s.away||s.state==='rest'))){   // wie endOfDay
          harvest(true);G.phase='abend';G.frozen=null;
          for(const s of live){if(s.away)continue;if(s.cur)endLeg(s);goTo(s,s.home[0],s.home[1]);if(s.state==='rest')s.wait=Infinity}}
      } else if(G.phase==='mittag'&&G.min>=T.wiederAb){harvest(false);lunchEnd()}
    }
    const endMin=G.min;
    for(const s of live){const r=rec.get(s.id);close(r,endMin);r.act=null}
    for(const s of live)if(!s.away&&s.state==='walk')warn.push(`${s.name} kommt voraussichtlich erst nach Einbruch der Dunkelheit heim – die Abendarbeit fällt aus.`);
    for(const k of failed){const [id,who]=k.split('|'),t=G.tasks.find(t=>t.id==id);if(t)warn.push(`${taskTitle(t)}: ${who} schafft das heute nicht rechtzeitig.`)}
    for(const t of G.tasks){const d=TASKS[t.type];if(d.fixed||!lastWork.has(t.id))continue;
      let left=0;
      if(d.group){for(const it of taskItems(t))if(!dry.done.has(t.id+':'+it))left+=normOf(itemCost(t,it))}
      else left=Math.max(0,normOf(singleCost(t))-t.done);
      finish.set(t.id,{end:lastWork.get(t.id),left})}
    for(const s of staff){
      if(!s.available){plans[s.id]=[{from,to:T.ende,kind:'frei',task:null,label:s.weak?'zu schwach – hat nichts gegessen':`ab Woche ${s.from}`}];continue}
      const segs=rec.get(s.id).segs.slice();
      if(hof&&from<=T.mittag)segs.push({from:T.mittag,to:T.wiederAb,kind:'pause',task:null,label:'Mittagspause',walk:0});
      segs.sort((a,b)=>a.from-b.from);plans[s.id]=segs;home[s.id]=segs.length?segs[segs.length-1].to:null}
    return{plans,finish,home,warn,ende:T.ende,week:G.week,avail:Object.fromEntries(staff.map(s=>[s.id,s.available])),weak:Object.fromEntries(staff.map(s=>[s.id,s.weak]))}
  } finally {
    dry=null;
    G.min=keep.min;G.phase=keep.phase;G.claimed=keep.claimed;G.frozen=keep.frozen;G.week=keep.week;G.times=keep.times;G.goodMeal=keep.goodMeal;if(keep.hasBacklog)G.gardenBacklog=keep.backlog;else delete G.gardenBacklog;
    G.tasks.forEach((t,k)=>{if(keep.done[k]!==undefined)t.done=keep.done[k];if(keep.doneWeek[k]!==undefined)t.doneWeek=keep.doneWeek[k];else delete t.doneWeek});
    staff.forEach((s,k)=>{for(const [f,had,v] of saved[k]){if(had)s[f]=v;else delete s[f]}});
  }
}
// Wer kocht heute? (feste Aufgabe „kochen“, üblich laut rollen.js)
function cookOf(){const t=G.tasks.find(t=>t.type==='kochen'),w=t&&effectiveWho(t);return w&&w!=='none'?S(w):null}
function cooksToday(live){const c=cookOf();return !!(c&&c.available&&staffTasks(c,live).some(t=>t.type==='kochen'))}
function planWarnings(live){const w=[];
  const ein=G.tasks.find(t=>t.type==='einsperren'),fu=G.tasks.find(t=>t.type==='fuettern');
  if(ein&&visibleTask(ein)){if(ein.who==='none')w.push('Die Hühner bleiben nachts draußen – Eier, aber Fuchsgefahr.');else{const s=S(effectiveWho(ein));if(!s||!s.available)w.push('Niemand sperrt die Hühner abends ein.')}}
  if(fu&&visibleTask(fu)){const s=effectiveWho(fu)==='none'?null:S(effectiveWho(fu));if(!s||!s.available)w.push('Niemand füttert die Hühner.')}
  const ko=G.tasks.find(t=>t.type==='kochen');
  if(ko&&visibleTask(ko)&&!cooksToday(live)){const c=cookOf();w.push(`${c?c.name+' kocht heute nicht':'Heute kocht niemand'} – es gibt nur kalte Brotzeit (Brot, Beeren, notfalls Geräuchertes).`)}
  for(const x of planAll(G.times.start,live).warn)if(!w.includes(x))w.push(x);
  return w}

function facing(){const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[P.dir];return[P.x+d[0],P.y+d[1]]}
function subjectAt(x,y){
  if(!inb(x,y))return null;const i=idx(x,y);
  const npc=staff.find(s=>s.available&&!s.away&&Math.round(s.x)===x&&Math.round(s.y)===y);if(npc)return{kind:'npc',s:npc};
  if(bmap[i]>=0)return{kind:'bau',b:buildings[bmap[i]]};
  const t=treeAt(i);if(t)return{kind:'baum',t};
  if(lyingAt[i]>=0)return{kind:'stamm',l:logById.get(lyingAt[i])};
  if(stumpAt[i])return{kind:'stumpf'};
  if(feat[i])return{kind:'feat',f:feat[i]};
  if(fkind[i])return{kind:'zaun'};
  if(track[i])return{kind:'spur',tr:track[i]};
  if(ground[i]===G_WATER||ground[i]===G_FORD||ground[i]===G_BRIDGE)return{kind:'wasser'};
  if(grass[i]>=1&&light[i]>=0.55&&ground[i]!==G_PATH)return{kind:'gras'};
  if(deco[i])return{kind:'deko',d:deco[i]};
  return{kind:'boden'};
}

    case 'gras':{title=grass[i]===2?'Hohes Gras':'Wiese';ex(grass[i]===2?'Hohes, saftiges Gras. Hier kommt man nur mühsam voran.':'Eine helle Wiese.','gras');

        toast(`Notiert unter „Wiese mähen“ (${taskItems(t).length} Felder).`)}})}

      if(!feat[i]&&walkable(x,y)&&ground[i]!==G_PATH){

  }
