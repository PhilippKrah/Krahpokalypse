<!--
  01 – Der Gutsverwalter (zweiter Wurf, Konzept: KONZEPT.md; erster Wurf: v1-foerster.html)
  Idee: Als junger Gutsverwalter hältst du zwölf Wochen ein lebendiges Waldgut im Gleichgewicht.
  Du beobachtest, markierst Aufgaben und teilst dein Personal ein; selbst anpacken kostet Kraft.
  Zwischen den Wochen rechnet die Natur (7 Naturschritte je Wochenschritt): Kronen wachsen ins Licht, Hasen wandern zu Lichtungen, Füchse streifen umher.
  Zeit: Eine Spieluhr in Spielminuten (G.min) mit festen Ticks, unabhängig von der Bildrate; alles kostet Minuten (Weg je Feld nach Gelände, Licht und Bewuchs über die Kostenkarte,
        Arbeit nach Objekt und Arbeitstempo der Person). Eine Woche = Sonntag (Inspektion, die Uhr rückt nur durch Handlungen vor, Dämmerung beendet ihn) → Planung an der Tafel →
        Werkwoche (Personal geht nach der Zeitleiste: Hinweg, Arbeit, Rückweg bis zur Heimkehr; Hoftag mit Mittagspause oder Waldtag ohne; der Plan ist nur zu lesen, Umplanen geht nur durch Ansprechen einer Person: nur ihr Plan, ab jetzt) → Wochenschritt der Natur.
        Heimgehen [T] rechnet denselben Tag ohne Darstellung bis der Verwalter daheim ist (Heimweg = kürzeste Route × 1,5); der Abend läuft bis in die Nacht, spätestens um 2 Uhr schläft
        er am Ort ein; der nächste Sonntag beginnt frühestens 8 Stunden nach dem Einschlafen. Am Sonntag arbeitet der Verwalter nicht selbst; Sonntagabend = nur der Planungsbildschirm. Die Tafel zeigt je Person einen proportionalen Zeitbalken (gemeinsame Stundenachse) über der Aufgabenliste. Alle Zeitwerte stehen in CFG.zeit (Spielstunde in Echtzeit, Wegzeiten, Normminuten je Arbeitspunkt, Mittag/Abend, Sonntag, Wochen).
  Ortskenntnis (Demo B2a): Jede Person (Verwalter, Personal) kennt jedes Feld des Waldes unterschiedlich gut (CFG.kenntnis); unbekanntes Gelände kostet Zeit (CFG.zeit.fremd, im Dunkeln mehr). Sie wächst durch Betreten, Arbeiten und (Verwalter) Sehen – je Feld höchstens einmal je Tag (Verwalter) bzw. je Woche (Personal), jeder weitere Besuchstag bringt weniger –, sinkt, wo sich der Wald verändert hat, und verblasst ohne Besuch (ab 3 Wochen, nie unter die Hälfte des Höchststands und nie unter das Startwissen). F2: Kartenebenen „Kenntnis“ (je Person umschaltbar) und „Trampelpfade“.
  Trampelpfade (Demo B2a, Paket 2): Wo oft gegangen wird (Verwalter und Personal, über Wochen), tritt sich in der Wochenhülle ein Pfad aus (kurzes Gras, schneller zu gehen, CFG.pfad); unbenutzt wächst er wieder zu. Aufgabe „Weg anlegen“ (Felder markieren wie Mähen, auf einem Pfad den ganzen Pfad ausbauen) macht Felder zum richtigen Weg.
  Gutskarte (Demo B2a, Paket 3): Notizbuch-Reiter „Karte“ (6): Farbflächen nur für Felder, die der Verwalter kennt (eigene Sicht, im Gespräch ergänzte Beobachtungen des Personals, alte Karte des Vorgängers), verblassend nach Alter (CFG.karte); Pfeiltasten oder Antippen zeigen „zuletzt gesehen Woche n“. Die Tafel setzt „ca.“ bzw. „?“ vor Zeiten, deren Ziel oder Route über altes bzw. unbekanntes Kartenwissen führt; die Rechnung bleibt exakt.
  Gespräche und Beobachtungen (Demo B2b, Paket 2): Am Sonntag stehen die Leute an ihren Sonntagsorten (Hannes am Bach, Grete am Gesindehaus, Jost am Holzplatz, Liese im Garten; aus der Karte abgeleitet, nur Position). Was sie in der Werkwoche gesehen haben (Zeichen, Schäden, Beeren, Orte),
        merken sie sich (knWeek, höchstens 5 Dinge, je Ort das Neueste) und erzählen es nur im Gespräch dort, je nach Figur (rollen.js: Hannes alles von sich aus, Grete auf „Nachfragen“, Liese die neuesten Dinge mit dem Lieblingsthema zuerst, Jost nur bei guter Laune); erst dann ergänzt sich die Gutskarte.
        Lieblingsbereich = größerer Wahrnehmungsumkreis für passende Arten. Die Morgenkarte meldet nur den Hof. Untersuchen meldet, was sich gegenüber der Gutskarte verändert hat („ist neu“). Das Wissen der Woche steht als Liste (knWiss: Art, Feld, Woche, Quelle) bereit.
  Zeichen und Frühwarnung (Demo B2b, Paket 3): Specht (toter/kranker Baum), Häher (Fuchs in der Nähe), Krähen (Riss, Federn) und Fuchsfährten ergeben sich aus dem Weltzustand (zeichenQuellen, ohne Zufall). Der Verwalter hört sie im Hörradius (CFG.zeichen.hoer, Regen/Sturm dämpfen),
        sieht Fährten im Sichtkreis; Meldung mit Himmelsrichtung, Ton, Wissensliste (gehört/gesehen) und Gutskarten-Notiz als Text/Farbe. Das Personal nimmt sie nur in der Wochenhülle wahr und erzählt sie am Sonntag. Fuchs-Vorstufe: der hungrige Fuchs zieht eine Woche lang zum Hof (Fährte, Häher), der Überfall folgt erst in der Woche danach.
  Gebietsauftrag (Demo B2b, Paket 4): „Beeren sammeln“ ist kein Flächenauftrag mehr, sondern ein Gebiet: im Menü (Leertaste) markierst du nur einen Fixpunkt (die Stelle, an der du stehst; gespeichert wird die Erwartung, wie viele reife Sträucher du dort siehst). Die Person geht hin, findet
        den Punkt leicht über Weg oder Pfad, bei genug Licht zur Ankunftsminute, mit eigener Ortskenntnis oder an einer Wegmarke – sonst sucht sie (kostet Zeit) oder gibt im Dunkeln auf – und sammelt im Radius um den Punkt (abhängig von Licht und Kenntnis, CFG.gebiet); der Ertrag ist, was dort wirklich wächst.
        Der Auftrag ist danach erledigt (auch nach Aufgeben). Die Rückmeldung mit Grund erzählt sie am Sonntag („Das war mir zu dunkel“, „Da kenne ich mich nicht gut aus“, „Da war kaum noch was“ gegen die gespeicherte Erwartung). Wegmarken setzt du nur am Sonntag im Menü („Wegmarke setzen“, kostet Zeit,
        höchstens CFG.gebiet.markenMax, gezeichnet als Pflock, G.marken); die Tafel rechnet das Gebiet mit denselben Funktionen vor wie der Tag (Wegmarken und die Beeren im Radius stehen im Zwischenspeicher-Schlüssel).
  Weg zeigen (Demo B2b, Paket 5): In der Werkwoche tagsüber sprichst du eine Person an (Leertaste, Menü; am Handy dasselbe Menü): „Weg zeigen“ – sie geht mit dir (Bewegung in Ticks, nach ihrer eigenen Kostenkarte) und arbeitet in der Zeit nicht; dieselbe Option entlässt sie.
        Es endet auch mit Heimgehen [T], am Hoftag zum Mittag und am Feierabend (dann plant sie neu ab Ort und Uhrzeit wie beim Umplanen); nicht startbar während einer festen Spanne (Füttern, Kochen, Einsperren). Die Felder ihrer Route heben ihre Ortskenntnis stark (CFG.kenntnis.gezeigt), wirksam ab der nächsten Woche; die Tafel zeigt „geht mit dem Verwalter“.
  Herbst (Demo B3, Paket 1): Herbstkurve je Woche (regeln.js herbst: Wachstum von Bäumen und Gras → 0 bis Woche 11, Hasenwurf ab Woche 6 kaum noch); Hennenhunger je Teilschritt (CFG.henHunger); Fuchsdruck steigt kausal (weniger Hasen → Stall). Verfügbarkeit des Personals aus einer Quelle (staffAvail) für Woche und Tafel.
  Wochenwetter (Demo B3, Paket 2): Jede Woche hat ein Wetter (trocken, Regen, Sturm, Frost; Nebel als Variante) aus einer Herbstkurve (CFG.wetter), einmal in newGame aus eigenem Seed-Strom gezogen (äußerer Auslöser, nicht R). Wirkung nur in der Werkwoche (Sonntag und Planung ohne):
        Regen macht Furt und Wasserrand teurer, Frost beendet die Beeren und erhöht den Heubedarf der Hennen, Sturm wird nur angekündigt, Nebel verkleinert den Sichtradius. Vorhersage am Sonntag (Morgenkarte, Hannes), HUD zeigt das Wetter in Worten. B7 P3: Wetter auch als Bild (stimmung: Regen/Sturm, Nebel, Reif, Schnee ab Woche 12; Lichtbahnen in Kronenlücken, Morgendunst am Bach), nur Darstellung.
  Laubfall (Demo B3, Paket 3): Ab Woche 9 fällt das Laub (CFG.laub: Birke früh, Buche mittel, Eiche spät): der Wald wird zum Gehen günstiger (darkAt, Baumartenanteile aus computeLight), der Sichtradius wächst (sichtLicht), der Bodenschatten wird schwächer; light[] (Ökologie) und Feldklassen bleiben unberührt. B7 P2: Kronen färben sich je Art und werden licht und kahl (kronenBild, nur Darstellung), darunter Laubteppich.
  Ortsgeräusche und Tierreaktionen (Demo B7, Paket 6, nur Darstellung): Kauz, Hirschröhren, Wind/Regen nach Wetter, knarrendes Totholz; Hasen ducken sich im hohen Gras, Stillstehen scheucht nicht, Singvögel flattern auf (CFG.ort).
  Gutskarten-Symbole und Zeichen-Tiere (Demo B7, Paket 4): Gebäude, Furt/Brücke, bekannte Baue und Zeichen-Notizen als Symbole (kartSymbole); Specht, Häher, Krähen an den Zeichenquellen (zeichenTiere, nur Darstellung).
  Grafik (Demo B7, Paket 1): 32-px-Stil mit eigener 64-Farben-Palette (_assets/assets/01-foerster.palette.json); der Atlas hat doppelte Auflösung (AF=2 Atlaspixel je Weltpixel), das Weltmaß bleibt T=16.
        Zoom: Bildschirmkachel 32 oder 64 px (SC=AF·1 oder AF·2), mindestens 20×12 Felder sichtbar; Kamera auf ganze Atlaspixel gerundet, Kronen-Zwischenspeicher in Atlasauflösung.
  Steuerung: WASD/Pfeile laufen · Leertaste/E: Aktionen (untersuchen, selbst anpacken, Auftrag erteilen)
             M: Pflock-Modus (Mähfläche abstecken) · N: Notizbuch · T: heimgehen (in jeder Phase; vorher ein Fenster mit Dauer und Ankunft; in der Werkwoche wird der Rest des Tages ohne Zuschauen durchgerechnet; Abend: danach schlafen; Sonntagabend: Planung abschließen) · H: Hof-/Waldtag (Sonntag/Sonntagabend, an der Tafel) · F: Laterne (ab Woche 9 aus der Scheune) · L: Ton · F2: Debug/Balancing · Esc: schließen
  Touch (Handy/Tablet, nur Querformat, nur bei Fingerbedienung): Steuerkreuz + Knöpfe senden dieselben Tastencodes.
             REGEL: Jede neue Taste braucht eine Zeile in TOUCH_TASTEN (Abschnitt „Touch-Steuerung“) – sonst ist sie am Handy unerreichbar.
             Zum Testen am PC: index.html?touch
  Getestet wird: Trägt der Verwalter-Kreislauf (schauen → markieren → Wochenschritt → Folgen) mit impliziter
  Bewertung eine gemütliche Partie, und erzeugt das Licht-/Kronenmodell glaubwürdigen Wald?
  Balancing: alle Stellschrauben im Objekt CFG (live im Debug-Fenster änderbar).
  Wer was darf (Aufgaben, Rollen, Effektivität, Arbeitstempo, ab welcher Woche) und die Figuren (Mitteilsamkeit, Lieblingsbereich, Gedächtnis, Sonntagsort): rollen.js – Editor: tools/rollen-editor.html
-->

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

const hash2=i=>((Math.imul(i+7,40503)>>>0)%9973)/9973;

function makeNoise(cell){
  const gw=Math.ceil(W/cell)+2, gh=Math.ceil(H/cell)+2, g=[];
  for(let i=0;i<gw*gh;i++)g.push(R());
  const s=t=>t*t*(3-2*t);
  return (x,y)=>{const fx=x/cell,fy=y/cell,ix=Math.floor(fx),iy=Math.floor(fy),tx=s(fx-ix),ty=s(fy-iy);
    const v=(a,b)=>g[b*gw+a];const a=v(ix,iy)+(v(ix+1,iy)-v(ix,iy))*tx,b=v(ix,iy+1)+(v(ix+1,iy+1)-v(ix,iy+1))*tx;return a+(b-a)*ty};
}
function pickWeighted(opts){let t=0;for(const o of opts)t+=o.w;let p=R()*t;for(const o of opts){p-=o.w;if(p<=0)return o}return opts[opts.length-1]}

function crownR(t){return t.giant?CFG.giantRMax:Math.min(CFG.sp[t.sp].rMax,Math.floor((t.h-1)/2))}
function trunkCheb(t,x,y){
  if(!t.giant)return Math.max(Math.abs(x-t.x),Math.abs(y-t.y));
  const dx=x<t.x?t.x-x:x>t.x+1?x-t.x-1:0, dy=y<t.y?t.y-y:y>t.y+1?y-t.y-1:0;return Math.max(dx,dy);

// Zusätzlich (Demo B3, Paket 3, nur Lesen für Sicht und Gehen): anteil[3i+k] = Anteil der Baumart k (LAUB_ARTEN: Birke, Buche, Eiche) an der Kronendeckung des Feldes (nach Deckkraft gewichtet, Summe 1; 0 ohne Krone),
// Wochenunabhängig: der Laubstand der Woche kommt erst in darkAt/sichtLicht (und als Bild in renderCanopyCache/Laubteppich) dazu. light[], covers und feldKlasse bleiben Ökologie und unberührt.
const LAUB_ARTEN=['birke','buche','eiche'],LAUB_IDX={birke:0,buche:1,eiche:2};
function computeLight(){
  light.fill(1);anteil.fill(0);for(let i=0;i<N;i++)covers[i].length=0;
  for(const t of trees){if(!t.alive||t.dead)continue;const op=CFG.sp[t.sp].op*(t.h<=3?0.6:1),k=LAUB_IDX[t.sp];
    for(const c of t.crown){covers[c].push(t.h,op);light[c]*=1-op;anteil[c*3+k]+=op}}
  for(let i=0,j=0;i<N;i++,j+=3){const s=anteil[j]+anteil[j+1]+anteil[j+2];if(s>0){anteil[j]/=s;anteil[j+1]/=s;anteil[j+2]/=s}}
  lightDirty=true;canopyDirty=true;
}
function lightAbove(i,h){let l=1;const c=covers[i];for(let k=0;k<c.length;k+=2)if(c[k]>h)l*=1-c[k+1];return l}

  const r=crownR(t);if(r<=0)return;

  for(const c of t.crown){const cx=c%W,cy=(c/W)|0;
    for(const [dx,dy] of DIRS){const nx=cx+dx,ny=cy+dy;if(!inb(nx,ny))continue;const j=idx(nx,ny);
      if(seen.has(j))continue;seen.add(j);if(trunkCheb(t,nx,ny)>r||ground[j]===G_BLOCK||ground[j]===G_WATER||ground[j]===G_FORD||ground[j]===G_BRIDGE)continue;
      const l=lightAbove(j,t.h);opts.push({j,w:l*l+0.02})}}
  if(opts.length)t.crown.push(pickWeighted(opts).j);
}
function placeLying(x,y,L,age){
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>R()-0.5);
  for(const [dx,dy] of dirs){
    const tiles=[];let ok=true;
    for(let k=1;k<=L;k++){const X=x+dx*k,Y=y+dy*k;if(!inb(X,Y)){ok=false;break}const j=idx(X,Y);
      const t=treeAt(j);
      if((ground[j]!==G_FOREST&&ground[j]!==G_LAWN)||fkind[j]||lyingAt[j]>=0||(t&&t.h>=2)||feat[j]===F_BURROW||feat[j]===F_DEN||stumpAt[j]){ok=false;break}
      tiles.push(j)}
    if(!ok)continue;
    for(const j of tiles){const t=treeAt(j);if(t)killTree(t);if(feat[j]===F_HOLE||feat[j]===F_WOOD||feat[j]===F_HAY||feat[j]===F_TRAP)feat[j]=0}
    tiles.sort((a,b)=>a-b);

  }

}

const WETTER_ARTEN=['trocken','regen','sturm','frost'],WETTER_STROM=0x57E77E2;
function wetterZiehen(seed){
  const S=mulberry32((seed^WETTER_STROM)|0),c=CFG.wetter,out={art:[],nebel:[]};
  for(let k=1;k<=CFG.zeit.wochen;k++){
    const u=S(),v=S(),ab=c.abschnitte.find(a=>k<=a.bis)||c.abschnitte[c.abschnitte.length-1];

    if(k>c.trockenBis){let x=u*WETTER_ARTEN.reduce((t,n)=>t+ab[n],0);for(const n of WETTER_ARTEN){x-=ab[n];if(x<0){art=n;break}}}

  return out}

const wetterNebel=w=>G&&G.wetter&&CFG.wetter?G.wetter.nebel[clamp(w-1,0,G.wetter.nebel.length-1)]:0;
const wetterWirkt=()=>!!(G&&G.wetter&&CFG.wetter)&&G.phase!=='sonntag'&&G.phase!=='plan';   // Sonntag und Sonntagabend ohne Wirkung

const wetterWort=w=>{const a=wetter(w),n=wetterNebel(w);return(a==='trocken'?(n?'Nebel':'trocken'):a==='regen'?'Regen':a==='sturm'?'Sturm':'Frost')+(a!=='trocken'&&n?' mit Nebel':'')};
// Hannes' Vorhersage (Sonntag: Morgenkarte und Gespräch) für die kommende Werkwoche
function wetterKnie(w){

const heuBedarf=()=>G.chickens*CFG.chickenHay*(wetterJetzt()==='frost'?CFG.wetter.frostHeu:1);
// Laubfall (Demo B3, Paket 3): Laubstand je Baumart und Woche (1 = voll belaubt, CFG.laub.rest = kahl), linear von `von` bis `bis`; null ohne CFG.laub (Golden-Pfad) und solange noch alles belaubt. Gilt für Sicht und Gehen, nicht für das Ökologie-Licht.
// tileCostFn bindet die drei Faktoren einmal je Aufruf (darkAt: nur Array-Zugriffe); laubAt(i) = der nach Baumart gewichtete Laubstand eines Feldes (1 ohne Laubfall, 0 ohne Krone).
function laubFaktoren(){
  const c=CFG.laub;if(!c)return null;const w=weekNow(),r=clamp(c.rest,0,1);
  const f=LAUB_ARTEN.map(n=>{const a=c.arten[n];return 1-(1-r)*clamp((w-a.von)/Math.max(1e-9,a.bis-a.von),0,1)});
  return f[0]===1&&f[1]===1&&f[2]===1?null:f}   // noch alles belaubt: wie ohne Laubfall (null, die Kosten bleiben bitgleich)
function laubAt(i){const lb=laubFaktoren();if(!lb)return 1;const a=i*3;return lb[0]*anteil[a]+lb[1]*anteil[a+1]+lb[2]*anteil[a+2]}
// Kronenbild (Demo B7, Paket 2, nur Darstellung): je Baumart [Färbung 0..1 aus CFG.laub.farbe, Laubfall 0..1 aus laubFaktoren]; null ohne CFG.laub (Golden-Pfad: grün und voll).
function kronenBild(){const c=CFG.laub;if(!c)return null;const w=weekNow(),lb=laubFaktoren(),r=clamp(c.rest,0,1);
  return LAUB_ARTEN.map((n,k)=>{const f=c.farbe&&c.farbe[n];return [f?clamp((w-f[0])/Math.max(1e-9,f[1]-f[0]),0,1):0,lb?(1-lb[k])/Math.max(1e-9,1-r):0]})}
// Sichtlicht: das Licht, aus dem sich der Sichtradius ergibt – die EINE Stelle für Kenntnis-Sicht (playerSeen) und gezeichneten Sichtkreis (drawCanopy). Laub × Nebel: l = Licht des Feldes (light[]), f = Laubstand dort (laubAt):
// im kahlen Wald wird der Schatten schwächer (1−(1−l)·f), Nebel verkleinert zusätzlich; f=1 (ohne Laubfall) lässt l unverändert.
// Laterne (B7 P5): G.laterne undefined = keine, 0 = aus, 1 = an. Nur für den Verwalter (playerSeen, Sichtkreis, Zeichen-Tiere) – das Personal (gebietLicht) sieht ohne sie; beide Radien bleiben gleich.
const laterneLicht=v=>G&&G.laterne===1&&CFG.laterne?Math.max(v,CFG.laterne.licht*(wetterWirkt()&&wetterNebel(G.week)?CFG.wetter.nebelSicht:1)):v;
const sichtLicht=(l,f=1)=>(f===1?l:1-(1-l)*f)*(wetterWirkt()&&wetterNebel(G.week)?CFG.wetter.nebelSicht:1);

// Wochenhülle: die Nacht der Werkwoche = CFG.ecoStepsPerWeek Naturschritte (Teilschritte, je einer = die frühere Nacht) in einem Wochenschritt.
// G.night summiert die Teilschritte; Verlauf (G.hist), Verderb (in Wochen), Log und Nachtwege gelten einmal je Woche. n = Zahl der Teilschritte (Golden-Master-Test: 1 = die frühere Nacht).
function weekStep(n=CFG.ecoStepsPerWeek){
  const s=season(G.week),wf=wurf(G.week);
  G.night=freshNight();G.dbg.paths=[];G.dbg.log=[];
  // Ortskenntnis, feste Reihenfolge (Gate-Auflage 5): 1. Werkwochen-Diff (was die Arbeit der Woche verändert hat: Fällung, Weg …) → 2. Zuwachs aus dem Wochenpuffer (wer dort gearbeitet oder gegangen ist,
  // hat die Veränderung gesehen) → Verfall (knVerfall) → Trittzähler → Trampelpfade (pfadWeek) → Naturschritte → Bewuchs auf Pfaden weg (pfadClean) → 3. Nacht-Diff (Wuchsstufen, Licht, Stümpfe, neue/zugewachsene Pfade). Nicht Teil des Teilschritts nightStep (Golden Master).
  // Frost in der Nacht der Werkwoche (Wochenwetter, Paket 2): die Beeren erfrieren und tragen für den Rest des Herbstes nicht mehr (nightStep: kein Nachwachsen); ohne CFG.wetter (Golden-Pfad) nichts
  if(wetter(G.week)==='frost'&&!G.frostSeit){G.frostSeit=G.week;for(let i=0;i<N;i++)if(berry[i]){berry[i]=0;berryT[i]=0}log('Frost: die Beeren sind erfroren')}
  klDiff();knWeek();knVerfall();pfadWeek();fuchsWoche();   // fuchsWoche: die Fuchs-Vorstufe der Vorwoche gilt für diese Wochenhülle (nach knWeek, damit das Personal die Zeichen der Vorstufe noch sieht)
  for(let k=0;k<n;k++)nightStep(s,wf);
  pfadClean();klDiff();
  spoilFood();
  G.hist.push(stats());
}
// Ein Naturschritt (Teilschritt): Wachstum, Vermehrung, Nachtwege; wirkt auf G.night (die Woche), keine eigene Buchführung
function nightStep(s=season(G.week),wf=wurf(G.week)){
  growTrees(s);
  seedTrees(s);
  stumpsAndLogs();
  compactTrees();
  computeLight();
  groundStep(s);
  hareStep(wf);
  trapStep();
  foxStep();
  chickenStep();
}

function growTrees(season){
  computeLight();
  for(const t of trees){
    if(!t.alive)continue;
    const sp=CFG.sp[t.sp],ti=idx(t.x,t.y);
    if(t.dead){t.deadDays++;if(t.deadDays>=CFG.snagFallDays){killTree(t);if(t.h>=5&&placeLying(t.x,t.y,t.h>=6?3:2,2))G.night.logsFell++;log(`Tote ${SPNAME[t.sp]} (${t.x},${t.y}) stürzt um`)}continue}
    const top=t.h<=1?light[ti]:lightAbove(ti,t.h);
    let vit=top;
    if(t.h>=2&&t.crown.length){let s=0;for(const c of t.crown)s+=lightAbove(c,t.h);vit=s/t.crown.length}
    if(vit<sp.need*0.5)t.stress++;else t.stress=Math.max(0,t.stress-1);
    if(t.h<=1){if(t.stress>=2&&R()<CFG.sapDieP){killTree(t);continue}}
    else if(t.stress>=CFG.treeStressDie&&!t.giant){
      if(t.h<=3){killTree(t);G.night.treesDied++;continue}
      t.dead=true;t.crown=[];G.night.treesDied++;log(`${SPNAME[t.sp]} (${t.x},${t.y}) stirbt im Schatten`);continue}
    const hMax=t.giant?CFG.giantH:sp.hMax;
    if(t.h<hMax&&top>=sp.need)t.hp+=season/sp.hDays*(0.5+0.5*top);
    if(t.bitten>0){t.hp-=0.4;t.bitten--}
    if(t.hp<0)t.hp=0;
    while(t.hp>=1&&t.h<hMax){t.h++;t.hp-=1;if(t.h===2&&!t.crown.length)t.crown=trunkTiles(t).slice()}
    if(t.h>=2){
      const base=trunkTiles(t).length;
      if(t.crown.length>base)t.crown=t.crown.filter((c,k)=>k<base||lightAbove(c,t.h)>=CFG.crownDieLight||R()>CFG.crownDieP);
      if(R()<sp.crownP*season)growCrown(t);
    }
  }
}
function germOk(j){const g=ground[j];return (g===G_FOREST||g===G_LAWN)&&!fkind[j]&&trunkAt[j]<0&&lyingAt[j]<0&&!stumpAt[j]&&feat[j]!==F_BURROW&&feat[j]!==F_DEN}
function bigTrunkNear(x,y){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if(!inb(X,Y))continue;const t=treeAt(idx(X,Y));if(t&&t.h>=4)return true}return false}
function seedTrees(season){
  computeLight();
  const births=[];
  for(const t of trees){
    if(!t.alive||t.dead||t.h<4)continue;const sp=CFG.sp[t.sp];
    for(let k=chance(sp.seeds*season);k>0;k--){
      const d=t.sp==='birke'?ri(2,10):t.sp==='eiche'?(R()<0.1?ri(4,14):ri(1,3)):ri(1,3);
      const a=R()*Math.PI*2,x=Math.round(t.x+Math.cos(a)*d),y=Math.round(t.y+Math.sin(a)*d);
      if(!inb(x,y))continue;const j=idx(x,y);
      if(!germOk(j)||light[j]<sp.need*0.8)continue;
      let p=sp.germ*season*0.6;if(bigTrunkNear(x,y))p*=CFG.rootComp;
      if(R()<p)births.push([t.sp,x,y]);
    }
  }
  for(const [s,x,y] of births)if(germOk(idx(x,y))&&trees.length<CFG.maxTrees){addTree(s,x,y,1,false);G.night.seedlings++}
}
function stumpsAndLogs(){
  for(let i=0;i<N;i++){if(!stumpAt[i])continue;stumpAge[i]++;
    if(stumpAge[i]>=CFG.stumpDays&&trunkAt[i]<0&&light[i]>=0.25&&stumpAge[i]<=12){
      addTree(SPECIES[stumpAt[i]-1],i%W,(i/W)|0,1,false);stumpAt[i]=0;G.night.sprouts++;log(`Stumpf (${i%W},${(i/W)|0}) treibt aus`)}
    else if(stumpAge[i]>14)stumpAt[i]=0}
  for(const l of logs)l.age++;
  for(const l of logs.filter(l=>l.age>CFG.logRotDays)){for(const j of l.tiles)lyingAt[j]=-1;logs.splice(logs.indexOf(l),1);logById.delete(l.id)}
}
function compactTrees(){trees=trees.filter(t=>t.alive);treeById=new Map(trees.map(t=>[t.id,t]))}

function groundStep(s){
  for(let i=0;i<N;i++){
    const g=ground[i];
    if((g===G_FOREST||g===G_LAWN)&&!fkind[i]){
      const l=light[i];let d;
      if(l>=CFG.litMeadow)d=s/CFG.grassDays*(g===G_LAWN?0.55:1);
      else if(l>=CFG.litHalf)d=grass[i]>1?-0.5:grass[i]===1?0:s/CFG.grassDays*0.5;
      else d=-0.4;
      const t=treeAt(i);if(t&&t.h>=2)d=-0.5;
      gprog[i]+=d;
      if(gprog[i]>=1){if(grass[i]<2){grass[i]++;gprog[i]-=1}else gprog[i]=1}
      else if(gprog[i]<0){if(grass[i]>0){grass[i]--;gprog[i]+=1}else gprog[i]=0}
      const tgt=decoTarget(i);if(deco[i]!==tgt&&R()<0.3)deco[i]=tgt;
      if(deco[i]===D_BUSCH&&!berry[i]&&!G.frostSeit&&++berryT[i]>=CFG.berryRegrow){berry[i]=1;berryT[i]=0}
    }
    if(feat[i]===F_HOLE&&g!==G_LAWN){featAge[i]++;if(featAge[i]>=CFG.holeDays)feat[i]=0}
    if(track[i]){trackAge[i]++;if(trackAge[i]>=CFG.trackDays)track[i]=0}
  }
}

// ---------------------------------------------------------------- Hasen
function habitable(j){const g=ground[j];if((g!==G_FOREST&&g!==G_LAWN)||fkind[j])return false;const t=treeAt(j);return !(t&&t.h>=2)}
function addBurrow(x,y,n,garden){const b={id:nextId++,x,y,n,alive:true,empty:0,food:0,garden:!!garden};feat[idx(x,y)]=F_BURROW;burrows.push(b);return b}
function burrowSiteOk(x,y,extra){
  const j=idx(x,y);if(!habitable(j)||feat[j]||trunkAt[j]>=0||lyingAt[j]>=0||stumpAt[j]||ground[j]===G_PATH)return false;
  if(light[j]<CFG.burrowLight)return false;
  const garden=inGarden(x,y);let bright=0;
  for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const X=x+dx,Y=y+dy;if(inb(X,Y)&&habitable(idx(X,Y))&&light[idx(X,Y)]>=0.6)bright++}
  if(bright<CFG.burrowBright)return false;
  const sp=garden?3:CFG.burrowSpacing;
  for(const b of burrows)if(b.alive&&Math.max(Math.abs(b.x-x),Math.abs(b.y-y))<sp)return false;
  for(const b of extra)if(Math.max(Math.abs(b.x-x),Math.abs(b.y-y))<sp)return false;
  return true;
}
function harePassTile(j){const g=ground[j];if(g===G_BLOCK||g===G_WATER)return false;const t=treeAt(j);return !(t&&t.h>=2)}
function disperse(from,k,newB){
  let x=from.x,y=from.y,dx=0,dy=0;const path=[[x,y]],seen=new Set([idx(x,y)]);
  for(let s=0;s<CFG.disperseSteps;s++){
    const opts=[];
    for(const [ddx,ddy] of DIRS){const nx=x+ddx,ny=y+ddy;if(!inb(nx,ny))continue;const j=idx(nx,ny);if(!harePassTile(j))continue;
      let w=(light[j]*light[j]+0.03)*(ddx===dx&&ddy===dy?1.8:1)*(seen.has(j)?0.15:1);opts.push({x:nx,y:ny,j,w})}
    if(!opts.length)break;
    const o=pickWeighted(opts);
    if(fkind[o.j]===FK_GATE)continue;
    if((fkind[o.j]===FK_H||fkind[o.j]===FK_V)&&fence[o.j]>0){
      if(R()<0.35){fence[o.j]--;track[o.j]=TR_ERDE;trackAge[o.j]=0;G.night.fenceDug++;if(!fence[o.j])log(`Abwanderer graben den Zaun (${o.x},${o.y}) durch`)}
      continue}
    dx=o.x-x;dy=o.y-y;x=o.x;y=o.y;seen.add(o.j);path.push([x,y]);
    if(s%2===0&&!track[o.j]){track[o.j]=TR_HARE;trackAge[o.j]=0}
    if(s>=5&&burrowSiteOk(x,y,newB)){
      const nb={id:nextId++,x,y,n:k,alive:true,empty:0,food:0,garden:inGarden(x,y)};feat[o.j]=F_BURROW;newB.push(nb);
      G.dbg.paths.push({type:'hase',path});G.night.newBurrows++;if(nb.garden)G.night.gardenBurrow++;
      log(`${k} Hasen ziehen von (${from.x},${from.y}) los und gründen Bau (${x},${y})${nb.garden?' – IM GARTEN':''}`);return}
  }
  G.dbg.paths.push({type:'hase',path,lost:true});G.night.lost+=k;
  log(`${k} Hasen aus (${from.x},${from.y}) finden keine Lichtung und verlieren sich`);
}
function hareStep(wurf){
  const newB=[];
  for(const p of G.pendingDisperse)disperse(p,p.n,newB);
  G.pendingDisperse=[];
  for(const b of burrows){
    if(!b.alive)continue;
    const bi=idx(b.x,b.y);
    if(feat[bi]!==F_BURROW){b.alive=false;continue}
    let bright=0,food=0;const near=[];
    for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const x=b.x+dx,y=b.y+dy;if(!inb(x,y))continue;const j=idx(x,y);
      const t=treeAt(j);
      if(t&&t.h<=2&&b.n>0){food+=1.5;if(R()<Math.min(0.6,b.n*CFG.verbissP)){t.bitten=2;t.hp-=0.5;if(t.h===1&&R()<0.25){killTree(t);G.night.verbissTot++}else G.night.verbiss++}}
      if(!habitable(j))continue;const l=light[j];
      if(Math.max(Math.abs(dx),Math.abs(dy))<=3&&l>=0.6)bright++;
      if(l>=0.55){food+=grass[j]*0.8+0.3;near.push(j)}}
    b.food=food;
    if(!b.garden&&bright<CFG.burrowBright*0.6){
      log(`Bau (${b.x},${b.y}) ist zugewachsen und zu dunkel – ${b.n} Hasen ziehen aus`);G.night.darkBurrows++;
      if(b.n>0)disperse(b,b.n,newB);b.n=0;b.alive=false;feat[bi]=0;continue}
    if(b.n<=0){b.empty++;if(b.empty>=3){b.alive=false;feat[bi]=0;log(`Bau (${b.x},${b.y}) verfällt`)}continue}
    b.empty=0;
    for(let k=0;k<b.n&&near.length;k++)gprog[near[ri(0,near.length-1)]]-=0.25;
    for(let k=chance(b.n*CFG.holesPerHare*(b.garden?2:1));k>0&&near.length;k--){const j=near[ri(0,near.length-1)];
      if(!feat[j]&&trunkAt[j]<0&&lyingAt[j]<0&&ground[j]!==G_PATH){feat[j]=F_HOLE;featAge[j]=0;G.night.holes++}}
    for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++){const x=b.x+dx,y=b.y+dy;if(!inb(x,y))continue;const j=idx(x,y);
      if((fkind[j]===FK_H||fkind[j]===FK_V)&&fence[j]>0&&R()<b.n*CFG.fenceDigPerHare){fence[j]--;track[j]=TR_ERDE;trackAge[j]=0;G.night.fenceDug++;
        if(!fence[j])log(`Hasen aus Bau (${b.x},${b.y}) graben den Zaun (${x},${y}) durch`)}}
    const per=food/Math.max(1,b.n);let births=0,deaths=0;
    if(b.n>=2&&per>=CFG.hareFoodNeed)births=chance(b.n*CFG.hareBirth*Math.min(1.5,per/CFG.hareFoodNeed)*wurf);
    if(per<1.2)deaths=Math.ceil(b.n*0.2);
    b.n=Math.max(0,b.n+births-deaths);
    const cap=clamp(Math.floor(food/CFG.hareCapFood),2,CFG.hareMaxBurrow);
    log(`Bau (${b.x},${b.y})${b.garden?' [Garten]':''}: ${b.n} Hasen · Futter ${food.toFixed(0)} · +${births} −${deaths} · Platz ${cap}`);
    if(b.n>cap){const k=b.n-cap;b.n=cap;disperse(b,k,newB)}
    for(let k=0;k<Math.min(3,b.n)&&near.length;k++){const j=near[ri(0,near.length-1)];if(!track[j]){track[j]=TR_HARE;trackAge[j]=0}}
  }
  burrows.push(...newB);
  burrows=burrows.filter(b=>b.alive);
}
function trapStep(){
  for(let i=0;i<N;i++){if(feat[i]!==F_TRAP)continue;const x=i%W,y=(i/W)|0;let best=null;
    for(const b of burrows){if(!b.alive||b.n<=0)continue;const d=Math.max(Math.abs(b.x-x),Math.abs(b.y-y));if(d<=3&&(!best||d<best.d))best={b,d}}
    if(best&&R()<0.35*best.b.n/(best.b.n+2)){best.b.n--;feat[i]=F_TRAPFULL;G.night.trapped++;log(`Falle (${x},${y}) fängt einen Hasen`)}}
}

// ---------------------------------------------------------------- Füchse
function foxPass(j,f){const g=ground[j];if(g===G_BLOCK||g===G_WATER)return false;const t=treeAt(j);if(t&&t.h>=2)return false;
  if(fkind[j]===FK_GATE||((fkind[j]===FK_H||fkind[j]===FK_V)&&fence[j]>0))return f.hunger>=CFG.foxJumpHunger;return true}
function findDenSite(){
  for(let i=0;i<N;i++)if(feat[i]===F_DEN&&!foxes.some(f=>f.alive&&idx(f.den[0],f.den[1])===i))return i;
  for(let t=0;t<5000;t++){const i=ri(0,N-1),x=i%W,y=(i/W)|0;
    if(ground[i]!==G_FOREST||fkind[i]||trunkAt[i]>=0||lyingAt[i]>=0||feat[i]||stumpAt[i])continue;
    if(light[i]>=CFG.denLight||dist(x,y,ESTATE.cx,ESTATE.cy)<18)continue;
    if(foxes.some(f=>f.alive&&dist(f.den[0],f.den[1],x,y)<12))continue;
    if(!burrows.some(b=>b.alive&&dist(b.x,b.y,x,y)<13))continue;
    return i}
  return -1;
}
function foxStep(){
  scent.fill(0);
  for(const b of burrows){if(!b.alive||b.n<=0)continue;
    for(let dy=-16;dy<=16;dy++)for(let dx=-16;dx<=16;dx++){const x=b.x+dx,y=b.y+dy;if(!inb(x,y))continue;const d=Math.hypot(dx,dy);if(d>16)continue;scent[idx(x,y)]+=b.n*(1-d/16)}}
  for(const f of foxes)if(f.alive)foxWalk(f);
  foxes=foxes.filter(f=>f.alive);
  const hares=burrows.reduce((a,b)=>a+(b.alive?b.n:0),0);
  if(hares/(foxes.length+1)>CFG.haresPerFox&&foxes.length<CFG.maxFoxes){
    const s=findDenSite();
    if(s>=0){feat[s]=F_DEN;foxes.push({id:nextId++,den:[s%W,(s/W)|0],hunger:1,alive:true});G.night.newFox++;log(`Ein Fuchs wandert ein und bezieht den Bau (${s%W},${(s/W)|0})`)}
  }
}
// Fuchs-Vorstufe (Demo B2b, Paket 3, Gate-Auflage 14): wer in Woche k hungrig zum Stall will (raidWunsch), zieht erst „zum Hof“ (f.vorNeu = k, Wartestellung ohne Jagd und Hunger) und legt eine Fährte Richtung Stall;
// der Überfall (raid) gilt nur mit der Vorstufe der Vorwoche (f.vor === G.week − 1). Ohne Zufall (die Fährte läuft gierig am Abstand zum Stall entlang); ohne CFG.zeichen.vorstufe (Golden-Pfad) wie vorher.
function fuchsFaehrte(f,V){
  const path=[],seen=new Set();let x=f.den[0],y=f.den[1];seen.add(idx(x,y));
  for(let s=0;s<V.maxSchritte&&dist(x,y,COOP[0],COOP[1])>V.bisHof;s++){
    let best=-1,bd=Infinity,bx=0,by=0;
    for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const j=idx(nx,ny);if(seen.has(j)||!foxPass(j,f))continue;const d=dist(nx,ny,COOP[0],COOP[1]);if(d<bd){bd=d;best=j;bx=nx;by=ny}}
    if(best<0)break;seen.add(best);x=bx;y=by;path.push(best)}
  const lay=path.slice(-V.laenge);
  for(let k=0;k<lay.length;k+=2){const j=lay[k];if(ground[j]===G_BRIDGE||track[j]===TR_FELL||track[j]===TR_FEDERN)continue;track[j]=TR_FOX;trackAge[j]=0}
  f.vorFeld=lay.length?lay[lay.length-1]:idx(f.den[0],f.den[1])}
function fuchsWoche(){if(!(CFG.zeichen&&CFG.zeichen.vorstufe))return;for(const f of foxes){f.vor=f.vorNeu||0;f.vorNeu=0}}
function foxWalk(f){
  const budget=CFG.foxBaseSteps+f.hunger*CFG.foxHungerSteps;
  let [x,y]=f.den,dx=0,dy=0;const path=[[x,y]],seen=new Set();
  // Zum Stall zieht es ihn nur, wenn er daheim kaum Beute wittert – oder der Hunger übermächtig wird
  const raidWunsch=G.chickens>0&&f.hunger>=CFG.foxRaidHunger&&(scent[idx(f.den[0],f.den[1])]<2||R()<0.15*(f.hunger-1));
  const V=CFG.zeichen&&CFG.zeichen.vorstufe;let raid=raidWunsch;
  if(V&&raidWunsch){f.vorNeu=G.week;fuchsFaehrte(f,V);raid=f.vor>0&&f.vor===G.week-1;   // Vorstufe (Auflage 14): Zeichen jetzt, Überfall erst in der Folgewoche
    if(!raid){log(`Fuchs ${f.id} zieht zum Hof (Vorstufe, Fährte Richtung Stall)`);return}}
  let caught=false;
  for(let s=0;s<budget&&!caught;s++){
    const toCoop=raid&&s>budget*0.35;
    const opts=[];
    for(const [ddx,ddy] of DIRS){const nx=x+ddx,ny=y+ddy;if(!inb(nx,ny))continue;const j=idx(nx,ny);if(!foxPass(j,f))continue;
      let w;
      if(toCoop)w=dist(nx,ny,COOP[0],COOP[1])<dist(x,y,COOP[0],COOP[1])?3:0.4;
      else w=(scent[j]+0.4)*(1.3-light[j]*0.6);
      w*=(ddx===dx&&ddy===dy?1.6:1)*(seen.has(j)?0.2:1);
      opts.push({x:nx,y:ny,j,w})}
    if(!opts.length)break;
    const o=pickWeighted(opts);dx=o.x-x;dy=o.y-y;x=o.x;y=o.y;seen.add(o.j);path.push([x,y]);
    if(s%2===0&&!track[o.j]&&ground[o.j]!==G_BRIDGE){track[o.j]=TR_FOX;trackAge[o.j]=0}
    for(const b of burrows){if(!b.alive||b.n<=0||Math.abs(b.x-x)>2||Math.abs(b.y-y)>2)continue;
      let tall=0,cnt=0;for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++){if(!inb(b.x+xx,b.y+yy))continue;cnt++;if(grass[idx(b.x+xx,b.y+yy)]===2)tall++}
      const p=CFG.foxCatch*b.n/(b.n+2)*(1-0.5*tall/Math.max(1,cnt));
      if(R()<p){b.n--;f.hunger=0;caught=true;track[o.j]=TR_FELL;trackAge[o.j]=0;G.night.foxCatch++;log(`Fuchs ${f.id} reißt bei Bau (${b.x},${b.y}) einen Hasen (nach ${s} Schritten)`);break}}
    if(!caught&&toCoop&&Math.abs(x-COOP[0])<=1&&Math.abs(y-COOP[1])<=1){
      const c=idx(COOP[0],COOP[1]);
      if(!G.coopClosed&&G.chickens>0){G.chickens--;f.hunger=0;caught=true;track[c]=TR_FEDERN;trackAge[c]=0;G.night.chickFox++;log(`Fuchs ${f.id} holt eine Henne aus dem offenen Stall!`)}
      else{G.night.foxAtCoop++;track[c]=TR_FOX;trackAge[c]=0;log(`Fuchs ${f.id} streicht um den verschlossenen Stall`)}
      break}
  }
  if(V&&caught)f.vorNeu=0;   // satt: keine Vorstufe für die nächste Woche
  G.dbg.paths.push({type:'fuchs',path,caught});
  if(!caught){f.hunger++;
    if(f.hunger>=CFG.foxLeaveHunger){f.alive=false;G.night.foxGone++;log(`Fuchs ${f.id} zieht hungrig fort`)}
    else log(`Fuchs ${f.id} geht leer aus (Hunger ${f.hunger.toFixed(1)}, ${path.length} Schritte)`)}
}
// Vorräte: Zu- und Abgänge laufen über Chargen, damit Altes zuerst verbraucht wird und verderben kann
function addFood(k,n,week){if(n<=0)return;G.food[k]+=n;G.batches[k].push({n,week:week||G.week})}
function takeFood(k,n){let got=0;const b=G.batches[k];while(n>0&&b.length){const x=Math.min(n,b[0].n);b[0].n-=x;n-=x;got+=x;if(!b[0].n)b.shift()}G.food[k]-=got;return got}
function spoilsWeek(k){return G.batches[k].filter(b=>G.week-b.week+1>=CFG.spoil[k]).reduce((a,b)=>a+b.n,0)}   // Portionen, die mit dem Wochenschritt verderben
function spoilFood(){const sp={};
  for(const k of Object.keys(G.batches)){let lost=0;G.batches[k]=G.batches[k].filter(b=>{if(G.week-b.week+1>=CFG.spoil[k]){lost+=b.n;return false}return true});
    if(lost){G.food[k]-=lost;sp[k]=lost;log(`${lost} Portionen ${k} verdorben`)}}
  G.night.spoiled=sp}
function graze(units){const tiles=[];
  for(let dy=-8;dy<=8;dy++)for(let dx=-8;dx<=8;dx++){const x=COOP[0]+dx,y=COOP[1]+dy;if(!inb(x,y))continue;const i=idx(x,y);
    if((ground[i]===G_LAWN||ground[i]===G_FOREST)&&!fkind[i]&&grass[i]>=1)tiles.push(i)}
  for(let k=tiles.length-1;k>0;k--){const j=Math.floor(R()*(k+1));[tiles[k],tiles[j]]=[tiles[j],tiles[k]]}
  for(const i of tiles){while(units>0&&grass[i]>0){grass[i]--;gprog[i]=0.3;units--}if(units<=0)break}
  return units<=0}
function chickenStep(){
  const n=G.night;
  if(G.chickens>0){if(!G.hensFoodOk){G.chickHunger+=CFG.henHunger;if(G.chickHunger>=2){G.chickens--;n.chickStarve++;G.chickHunger=1;log('Eine Henne ist verhungert')}}else G.chickHunger=0}
  if(G.coopClosed){G.hensInside=true;G.grazedOk=false}
  else{G.hensInside=false;G.grazedOk=G.chickens>0&&graze(G.chickens*CFG.henGrass);
    if(G.grazedOk){addFood('eier',G.chickens,G.week+1);n.eggs=(n.eggs||0)+G.chickens;log(`Die Hennen schlafen draußen, fressen Gras und legen ${G.chickens} Eier`)}else if(G.chickens>0){n.grassShort=true;log('Die Hennen finden draußen nicht genug Gras')}}
}

  const s={week:G?G.week:1,hares:0,burrows:0,gardenHares:0,foxes:0,chickens:G?G.chickens:CFG.chickens,sap:0,young:0,big:0,giants:0,
    birke:0,eiche:0,buche:0,dead:0,bright:0,dark:0,hofBright:0,hofSaplings:0,gHoles:0,gTall:0,gPlants:0,fBroken:0,fDamaged:0,
    logs:logs.length,wood:G?G.barnWood:0,hay:G?G.barnHay:0,avgLight:0};
  for(const b of burrows)if(b.alive){s.burrows++;s.hares+=b.n;if(b.garden)s.gardenHares+=b.n}
  s.foxes=foxes.filter(f=>f.alive).length;
  for(const t of trees){if(!t.alive)continue;if(t.dead){s.dead++;continue}
    if(t.h<=1)s.sap++;else if(t.h<=3)s.young++;else{s.big++;s[t.sp]++}if(t.giant)s.giants++;

    if(inGarden(t.x,t.y))s.gPlants++}
  let lsum=0,lc=0;

    if(g===G_LAWN){if(feat[i]===F_HOLE)s.gHoles++;if(grass[i]===2)s.gTall++}
    if(fkind[i]===FK_H||fkind[i]===FK_V){if(fence[i]<=0)s.fBroken++;else if(fence[i]<3)s.fDamaged++}}

}

function fellCost(tr){return tr.giant?CFG.cost.riese:tr.h>=6?CFG.cost.baumAlt:tr.h>=4?CFG.cost.baum:tr.h>=2?CFG.cost.jungbaum:CFG.cost.setzling}

function walkable(x,y){

// ---------------------------------------------------------------- Ortskenntnis (Demo B2a, Paket 1)
// Kenntnis je Person und Feld, 0..1 – gespeichert als Byte 0..255 (KN_MAX) in kenn[key] ('P' = Verwalter, sonst die Personal-ID); Weltzustand (sim-test-Fingerabdruck: kenn, knBuf, klSnap).
// Wirkung nur über fremdheit(who,i) = 1 − Kenntnis → Kostenkarte (CFG.zeit.fremd). Alles ohne R: Startwerte und Zuwachs sind reine Funktionen des Weltzustands.
// Zuwachs: Verwalter an der Schrittstelle (updatePlayer → playerSeen: Betreten + Sehen, Sichtradius in Feldern aus light[] des eigenen Feldes; auch am Sonntag, nie aus draw/G.lp; Versetzen schreibt nichts).
// Grind-Grenze (Demo B2b, Paket 1): ein Feld zählt je Person höchstens einmal je Tag (knTag: Sonntag/Sonntagabend = 2·Woche, Werktag samt Abend = 2·Woche + 1; Personal: einmal je Woche aus dem Wochenpuffer) – Hin-und-her im selben Gang bringt nichts;
//   jeder weitere Besuchstag (nur Betreten/Arbeiten) bringt weniger (CFG.kenntnis.ertrag^Besuchszahl). Sehen setzt nur den „letzten Besuch“ (einmal je Tag, bis sehenMax). Verlauf je Person und Feld in knV[key] (bet/seh = letzter Tag Betreten/Sehen, cnt = Besuchszahl,
//   max = Höchststand, min = Startkenntnis): Weltzustand, sim-test-Fingerabdruck. Verfall in der Wochenhülle (knVerfall): nie anheben, nie unter max(min, verfallMin × max); klDiff skaliert max und min mit.
//   Personal tagsüber nur in den Wochenpuffer knBuf[id] (Bit 1 betreten, Bit 2 gearbeitet, Bit 4 Holzarbeit; personTick, nur !dry – der Trockenlauf schreibt nichts), wirksam erst in der Wochenhülle (knWeek): ab der nächsten Woche.
// Abbau nur, wo sich das Feld verändert hat: Klassen-Diff der feldKlasse gegen den Schnappschuss klSnap (klDiff, zweimal je Wochenhülle, siehe weekStep) – keine Haken in nightStep/growTrees/applyJob.
const KN_MAX=255;
const knTag=()=>G?2*G.week+(G.phase==='sonntag'||G.phase==='plan'?0:1):1;   // Besuchstag des Verwalters: Sonntag (samt Sonntagabend) gerade, Werktag (inkl. Abend bis 2 Uhr) ungerade
const WHO_KEYS=['P',...STAFF_DEF.map(d=>d.id)];   // Personen mit Ortskenntnis; Index = Slot der Distanzfelder (wayField), ein weiterer Slot für „keine Person“
let whoMissing=0;   // Aufrufe der Kostenkarte ohne gültige Person (Diagnose im sim-test, muss 0 bleiben; so ein Aufruf rechnet mit voller Kenntnis)
const KN_VOLL=new Uint8Array(N).fill(KN_MAX),knTmp=new Uint8Array(N);   // reine Hilfsarrays (kein Weltzustand): „alles bekannt“ · Arbeitsfeld von knWeek
function whoKey(who){if(who===P)return 'P';if(who&&WHO_KEYS.includes(who.id))return who.id;whoMissing++;return null}
const whoSlot=who=>{const k=whoKey(who);return k===null?WHO_KEYS.length:WHO_KEYS.indexOf(k)};
const kennOf=who=>{const k=whoKey(who);return k===null?KN_VOLL:kenn[k]};
// Feldklassen: die einzige Wahrheit dafür, was an einem Feld „so oder so“ ist (Kenntnis-Abbau; Paket 3: Gutskarte und alte Karte). KL_UNBEKANNT (Karte, Paket 3) ist schon vergeben.
const KL_UNBEKANNT=0,KL_WIESE=1,KL_WALD_HELL=2,KL_WALD_DUNKEL=3,KL_WASSER=4,KL_FURT=5,KL_GEBAEUDE=6,KL_WEG=7,KL_PFAD=8,KL_JUNGBAUM=9,KL_BAUM=10,KL_STUMPF=11,KL_TOTHOLZ=12,KL_RASEN=13;
const klLicht=c=>c>=KL_WIESE&&c<=KL_WALD_DUNKEL;   // Klassen, die nur das Licht unterscheidet (kleine Veränderung)
function feldKlasse(i){
  const g=ground[i];
  if(g===G_WATER)return KL_WASSER;
  if(g===G_FORD||g===G_BRIDGE)return KL_FURT;
  if(g===G_BLOCK||fkind[i])return KL_GEBAEUDE;
  if(g===G_PATH)return KL_WEG;
  if(pfad[i]>0)return KL_PFAD;
  const t=treeAt(i);if(t&&t.h>=2)return t.h>=4?KL_BAUM:KL_JUNGBAUM;   // Keimlinge (h 1) sind Unterwuchs: sie zählen zur Lichtklasse
  if(stumpAt[i])return KL_STUMPF;
  if(lyingAt[i]>=0)return KL_TOTHOLZ;
  if(g===G_LAWN)return KL_RASEN;
  const l=light[i];return l>=CFG.litMeadow?KL_WIESE:l>=CFG.litHalf?KL_WALD_HELL:KL_WALD_DUNKEL}
// Startkenntnis (newGame, ohne R) und Schnappschuss der Klassen
function initKenntnis(){
  const K=CFG.kenntnis,st=K.start,byte=v=>Math.round(clamp(v,0,1)*KN_MAX);
  const inEstate=(x,y)=>x>=ESTATE.x0&&x<=ESTATE.x1&&y>=ESTATE.y0&&y<=ESTATE.y1;
  for(let i=0;i<N;i++)klSnap[i]=feldKlasse(i);
  const stamp=(kn,x,y,r,v)=>{const b=byte(v);   // v im Umkreis r (Felder, Kreis), zum Rand auf die Hälfte abfallend; höhere vorhandene Werte bleiben
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const d2=dx*dx+dy*dy;if(d2>r*r||!inb(x+dx,y+dy))continue;
      const j=idx(x+dx,y+dy),w=Math.round(b*(1-0.5*Math.sqrt(d2)/(r+1)));if(kn[j]<w)kn[j]=w}};
  for(const key of WHO_KEYS){const s=st[key],kn=kenn[key];if(!s)continue;
    for(let i=0;i<N;i++){const x=i%W,y=(i/W)|0,g=ground[i];
      if(s.hof&&(inEstate(x,y)||dist(x,y,HOF[0],HOF[1])<=st.hofR))kn[i]=Math.max(kn[i],byte(s.hof));
      if(s.gelaende&&inHofClearing(x,y))kn[i]=Math.max(kn[i],byte(s.gelaende));
      if(s.wasser&&(g===G_WATER||g===G_FORD||g===G_BRIDGE))stamp(kn,x,y,st.wasserR,s.wasser);
      if(s.wege&&g===G_PATH)stamp(kn,x,y,st.wegR,s.wege);
      if(s.holz&&(stumpAt[i]||lyingAt[i]>=0))stamp(kn,x,y,st.holzR,s.holz);
      if(s.dorf&&g===G_PATH&&y>ESTATE.y1)stamp(kn,x,y,st.dorfR,s.dorf)}
    knV[key].min.set(kn);knV[key].max.set(kn)}   // Startwissen = Untergrenze des Verfalls; Höchststand beginnt dort
}
// Abbau: Felder, deren Klasse sich seit dem Schnappschuss geändert hat, verlieren für ALLE Personen einen Teil der Kenntnis (Lichtklassen weniger); Schnappschuss nachziehen. Rückgabe: Zahl geänderter Felder.
function klDiff(){
  const K=CFG.kenntnis,fh=1-K.abbau,fl=1-K.abbauLicht,fp=1-K.abbauPfad,all=[];for(const k of WHO_KEYS)all.push(kenn[k],knV[k].max,knV[k].min);let n=0;   // Höchststand und Startkenntnis werden mit abgebaut (die Verfall-Untergrenze bleibt ≤ Kenntnis)
  for(let i=0;i<N;i++){const c=feldKlasse(i),o=klSnap[i];if(c===o)continue;
    klSnap[i]=c;n++;const f=c===KL_PFAD||o===KL_PFAD?fp:klLicht(c)&&klLicht(o)?fl:fh;
    for(const a of all)a[i]=Math.floor(a[i]*f)}
  return n}
// Wochenhülle: Zuwachs des Personals aus dem Wochenpuffer (Bit 1 betreten, Bit 2 gearbeitet, Bit 4 Holzarbeit, Bit 8 gezeigt = mit dem Verwalter gegangen) mit Umkreis; jedes Feld höchstens einmal je Woche und Person (Maximum der Quellen), Puffer leeren.
// Vor den Naturschritten (Gate-Auflage 9) wird hier auch beobachtet (beobachte: Gedächtnis je Person) – die Gutskarte (kartWo/kartKl) schreibt das Gespräch (kartMelde), nie diese Funktion.
function knWeek(){
  const K=CFG.kenntnis,gB=Math.round(K.betreten*KN_MAX),gA=Math.round(K.arbeit*KN_MAX),gZ=Math.round(K.gezeigt*KN_MAX),T=knTmp,tag=2*G.week+1;
  const stamp=(x,y,r,v)=>{for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(!inb(x+dx,y+dy))continue;const j=idx(x+dx,y+dy);if(T[j]<v)T[j]=v}};
  let feats=null;   // auffällige Felder, erst bei der ersten Person mit Marken
  for(const s of staff){const buf=knBuf[s.id],kn=kenn[s.id],marks=[];let holz=false;
    for(let i=0;i<N;i++){const b=buf[i];if(!b)continue;buf[i]=0;const x=i%W,y=(i/W)|0;
      if(b&1)stamp(x,y,K.radiusBetreten,gB);
      if(b&2)stamp(x,y,K.radiusArbeit,gA);
      if(b&8)stamp(x,y,K.radiusGezeigt,gZ);   // „gezeigt“ (Weg zeigen, Paket 5)
      if(b&4)holz=true;marks.push(i,b)}
    beobachte(s,marks,marks.length?feats||(feats=beobFelder()):[]);launeWoche(s,holz);   // Beobachtungen und Stimmung der Woche (Weltzustand vor den Naturschritten)
    const V=knV[s.id];   // Besuch je Feld: abnehmender Ertrag nach früheren Besuchswochen, Höchststand mitführen
    for(let i=0;i<N;i++)if(T[i]){kn[i]=Math.min(KN_MAX,kn[i]+Math.round(T[i]*Math.pow(K.ertrag,V.cnt[i])));T[i]=0;V.bet[i]=tag;if(V.cnt[i]<255)V.cnt[i]++;if(kn[i]>V.max[i])V.max[i]=kn[i]}}
}
// Verfall (Wochenhülle, nach knWeek): ohne Besuch seit verfallAb Wochen −verfall je Woche; hebt nie an, bleibt über max(Startkenntnis, verfallMin × Höchststand). Ohne CFG.kenntnis.verfall (Golden-Pfad) nichts.
function knVerfall(){
  const K=CFG.kenntnis;if(!K.verfall)return;
  const v=Math.round(K.verfall*KN_MAX);
  for(const key of WHO_KEYS){const kn=kenn[key],V=knV[key];
    for(let i=0;i<N;i++){const k=kn[i];if(!k)continue;
      const boden=Math.max(V.min[i],Math.floor(Math.max(V.max[i],k)*K.verfallMin));
      if(k<=boden||G.week-(Math.max(V.bet[i],V.seh[i])>>1)<K.verfallAb)continue;
      kn[i]=Math.max(boden,k-v)}}}
// Personal, ein Tick (nur !dry): Standort und Arbeitsort in den Wochenpuffer
function knNote(s){
  const b=knBuf[s.id];b[idx(Math.round(s.x),Math.round(s.y))]|=s.folgt?9:1;   // Bit 8: gezeigt (Weg zeigen)
  const c=s.cur;if(s.state==='work'&&c)b[idx(c.x,c.y)]|=c.task&&BEOB_HOLZ.includes(c.task.type)?6:2}
// Verwalter an der Schrittstelle (updatePlayer, Schritt fertig; auch am Sonntag): Betreten des Feldes + Sehen im lichtabhängigen Sichtkreis (Felder), Sehen nur bis sehenMax
function playerSeen(){
  const K=CFG.kenntnis,kn=kenn.P,V=knV.P,i0=idx(P.x,P.y),wk=weekNow(),tag=knTag();
  if(trittW[i0]<255)trittW[i0]++;   // Trittzähler (Paket 2): jeder Schritt des Verwalters; wirksam erst in der Wochenhülle (pfadWeek)
  if(V.bet[i0]!==tag){   // Betreten: je Feld höchstens einmal je Tag, jeder frühere Besuchstag senkt den Ertrag
    kn[i0]=Math.min(KN_MAX,kn[i0]+Math.round(Math.round(K.betreten*KN_MAX)*Math.pow(K.ertrag,V.cnt[i0])));
    V.bet[i0]=tag;if(V.cnt[i0]<255)V.cnt[i0]++;if(kn[i0]>V.max[i0])V.max[i0]=kn[i0]}
  const r=K.sehenR*(K.sehenMin+(1-K.sehenMin)*laterneLicht(sichtLicht(light[i0],laubAt(i0)))),ri=Math.ceil(r),cap=Math.round(K.sehenMax*KN_MAX),add=Math.round(K.sehen*KN_MAX);
  let sp=null;   // nächste Fuchsfährte im Sichtkreis (Zeichen, Paket 3)
  for(let dy=-ri;dy<=ri;dy++)for(let dx=-ri;dx<=ri;dx++){
    if(dx*dx+dy*dy>r*r||!inb(P.x+dx,P.y+dy))continue;
    const j=idx(P.x+dx,P.y+dy);
    const cl=feldKlasse(j),vor=kartKl[j];if(kartWo[j]!==0&&vor!==cl&&!(klLicht(cl)&&klLicht(vor)))knNeu.set(j,vor);   // „ist neu“ (Untersuchen): echte Veränderung gegenüber dem bisherigen Kartenstand, nur Lichtwechsel nicht
    kartWo[j]=wk;kartKl[j]=cl;   // Gutskarte (Paket 3): was er jetzt sieht, ist aktuell
    if(track[j]&&zeichenFuchsSpur(track[j])&&(!sp||dx*dx+dy*dy<sp.d))sp={j,d:dx*dx+dy*dy};
    if(V.seh[j]===tag)continue;V.seh[j]=tag;   // Sehen: je Feld höchstens einmal je Tag (setzt auch den „letzten Besuch“ für den Verfall)
    if(kn[j]<cap){kn[j]=Math.min(cap,kn[j]+add);if(kn[j]>V.max[j])V.max[j]=kn[j]}}
  if(CFG.zeichen)zeichenWahrnehmen(sp)   // Zeichen: Hören im Hörradius, Fährten im Sichtkreis (derselbe Schritt)
}
// ---------------------------------------------------------------- Gutskarte (Demo B2a, Paket 3)
// Kartenwissen des Verwalters, Weltzustand (sim-test-Fingerabdruck): kartWo[i] = Woche, in der er das Feld zuletzt gesehen hat (Int16; 0 = unbekannt, negativ = alte Karte des Vorgängers),
// kartKl[i] = die damals gesehene Feldklasse (feldKlasse, dieselben KL_*-Codes wie beim Kenntnis-Abbau). Sie bleibt veraltet, bis er wieder hinsieht (Fällung, Zuwachsen …).
// Quellen: Sicht des Verwalters (playerSeen, an der Schrittstelle, auch am Sonntag), Erzähltes im Gespräch (kartMelde, nur wo die Beobachtung neuer ist als der Eintrag; Demo B2b, Paket 2), die alte Karte als Startzustand (initKarte, ohne R).
// Nur lesend: Tafel („ca.“/„?“, kartStufe) und Notizbuch-Reiter „Karte“; der Trockenlauf schreibt nichts.
const KARTE_ALT=-1;
const KL_NAMEN=['unbekannt','Wiese','Wald (hell)','Wald (dunkel)','Wasser','Furt oder Brücke','Gebäude oder Zaun','Weg','Trampelpfad','Jungwuchs','Hochwald','Baumstumpf','Totholz','Rasen'];
// ---------------------------------------------------------------- Beobachtungen und Gespräche (Demo B2b, Paket 2)
// Das Personal sieht in der Werkwoche mehr, als der Verwalter je erfährt. Wahrnehmung: CFG.beob.radius Felder um jedes betretene oder bearbeitete Feld (Wochenpuffer knBuf), für die Arten des Lieblingsbereichs (rollen.js: lieblings) lieblingPlus mehr.
// In der Wochenhülle (knWeek, VOR den Naturschritten – Gate-Auflage 9) entsteht je Person eine Liste typisierter Beobachtungen {k, art, feld, woche, kl, …}: Art = Auffälliges (beobArt: toter Baum, umgestürzter Baum, Bau, Spur, Beeren, Loch) oder „ort“ (hier war ich);
// kl (bei „ort“ kls, ein kleiner Umkreis) = Feldklasse zum Beobachtungszeitpunkt – das Gespräch liest feldKlasse nie. Gedächtnis knMem[id]: je Art und Ort (Zelle) das Neueste, höchstens fig.gedaechtnis Dinge, Älteres verblasst.
// Am Sonntag erzählt die Person im Gespräch (talk, nur G.phase 'sonntag') nach ihrer Figur (fig.mitteil, rollen.js; ohne Zufall): alles = von sich aus alles (Hannes) · nachfrage = nur über „Nachfragen“ (Grete) · luecke = die neuesten fig.zahl Dinge, Lieblingsthema zuerst (Liese) ·
// laune = alles, aber nur bei guter Laune aus dem Zustand der Woche (G.laune: gut gegessen, nichts liegengeblieben, Holzarbeit gehabt; Jost). Erzähltes ergänzt die Gutskarte nur, wo die Beobachtung neuer ist (kartWo; Auflage 10), kommt in die Wissensliste knWiss
// (Art, Feld, Woche, Quelle „Gespräch“ oder „Untersuchen“ – Grundlage für das Beobachtungsbuch, B2c) und verlässt das Gedächtnis. Weltzustand (sim-test-Fingerabdruck): knMem, knWiss, knNeu, G.laune. Alles ohne R, Worte statt Zahlen.
const BEOB_HOLZ=['faellen','zerlegen','roden'];   // Holzarbeit (Joschs Laune; Bit 4 im Wochenpuffer)
const TR_TXT={[TR_HARE]:'Hasenspuren gesehen',[TR_FOX]:'eine Fuchsfährte gesehen',[TR_FELL]:'Fellreste gefunden – da hat der Fuchs Beute gemacht',[TR_ERDE]:'aufgewühlte Erde gesehen',[TR_FEDERN]:'Federn und Pfotenabdrücke gefunden'};
const KOMPASS=['östlich','südöstlich','südlich','südwestlich','westlich','nordwestlich','nördlich','nordöstlich'];
// Was an Feld j auffällt (Art oder null) – reine Funktion des Weltzustands
function beobArt(j){
  const tid=trunkAt[j];if(tid>=0){const t=treeById.get(tid);if(t&&t.alive&&t.dead)return 'baumtot'}
  if(lyingAt[j]>=0)return 'baumliegt';
  const f=feat[j];if(f===F_BURROW)return 'hasenbau';if(f===F_DEN)return 'fuchsbau';if(f===F_HOLE)return 'loch';
  if(track[j])return 'spur';
  if(berry[j])return 'beeren';
  return null}
const beobZelle=(j,z)=>Math.floor((j%W)/z)+','+Math.floor(((j/W)|0)/z);
const beobPrio=(e,lieb)=>e.art==='auftrag'?-1:lieb.includes(e.art)?0:e.art!=='ort'?1:e.w?2:3;   // wer behalten wird, wenn das Gedächtnis voll ist: Lieblingsarten, Zeichen und Schäden, Arbeitsorte, bloß begangene Orte
const beobKls=f=>{const r=CFG.karte.personalR,x=f%W,y=(f/W)|0,o=[];for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)o.push(inb(x+dx,y+dy)?feldKlasse(idx(x+dx,y+dy)):0);return o};
// Wochenhülle, eine Person: aus ihren Wegen und Arbeitsorten (marks = Feld, Bit, …) die neuen Beobachtungen, ins Gedächtnis mischen (je Schlüssel das Neueste), auf fig.gedaechtnis kürzen.
// feats = alle auffälligen Felder der Welt (Feld, Art, …; einmal je Wochenhülle aus beobFelder); die Reichweite einer Person ist die Aufweitung ihrer Marken um den Umkreis (zwei Stempelfelder: normal, Lieblingsbereich).
const BEOB_N0=new Uint8Array(N),BEOB_N1=new Uint8Array(N),BEOB_N2=new Uint8Array(N);   // reine Hilfsarrays (kein Weltzustand)
function beobFelder(){const f=[];for(let j=0;j<N;j++){const a=beobArt(j);if(a)f.push(j,a)}if(CFG.zeichen)zeichenQuellen((j,a)=>f.push(j,a));return f}
function beobachte(s,marks,feats){
  const B=CFG.beob,wk=weekNow(),fig=s.fig,lieb=fig.lieblings,R0=B.radius,R1=B.radius+B.lieblingPlus,cand=new Map(),n0=BEOB_N0,n1=BEOB_N1,n2=BEOB_N2,R2=CFG.zeichen?CFG.zeichen.personalR:0;
  const stamp=(arr,x,y,r)=>{for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(dx*dx+dy*dy<=r*r&&inb(x+dx,y+dy))arr[idx(x+dx,y+dy)]=1};
  const lr=lieb.length>0;
  for(let m=0;m<marks.length;m+=2){const i=marks[m],b=marks[m+1],x=i%W,y=(i/W)|0;
    if(!inHofClearing(x,y)){const k='ort:'+beobZelle(i,B.ortZelle),o=cand.get(k),w=b&2?1:0;   // Orte am Hof gehören zum Alltag
      if(!o)cand.set(k,{k,art:'ort',feld:i,woche:wk,w});else if(w>o.w){o.w=1;o.feld=i}}
    stamp(n0,x,y,R0);if(lr)stamp(n1,x,y,R1);stamp(n2,x,y,R2)}
  for(let m=0;m<feats.length;m+=2){const j=feats[m],art=feats[m+1];
    if(!(ZEICHEN_ARTEN.includes(art)?n2[j]:lr&&lieb.includes(art)?n1[j]:n0[j]))continue;   // Hörbares (Specht, Häher, Krähen) reicht personalR weit, sonst Umkreis bzw. Lieblingsbereich
    const X=j%W,Y=(j/W)|0,tr=art==='spur'?track[j]:0;
    if(inHofClearing(X,Y)&&(art==='hasenbau'||art==='beeren'||tr===TR_HARE))continue;   // Alltag am Hof (Hasenspuren, Bau, Sträucher) ist keine Neuigkeit; Fährten, Löcher und Schäden schon
    const k=art+tr+':'+beobZelle(j,B.zelle),o=cand.get(k);
    if(!o)cand.set(k,tr?{k,art,feld:j,woche:wk,n:1,tr}:{k,art,feld:j,woche:wk,n:1});else if(o.n<99)o.n++}
  n0.fill(0);n2.fill(0);if(lr)n1.fill(0);
  const all=new Map(knMem[s.id].map(e=>[e.k,e]));
  for(const e of cand.values())all.set(e.k,e);
  const list=[...all.values()].sort((a,b)=>b.woche-a.woche||beobPrio(a,lieb)-beobPrio(b,lieb)||a.feld-b.feld);
  list.length=Math.min(list.length,fig.gedaechtnis);
  for(const e of list)if(e.kl===undefined){e.kl=feldKlasse(e.feld);if(e.art==='ort')e.kls=beobKls(e.feld)}   // Feldklasse zum Zeitpunkt der Beobachtung (nur die behaltenen)
  knMem[s.id]=list}
// ---------------------------------------------------------------- Zeichen und Frühwarnung (Demo B2b, Paket 3)
// Zeichen = reine Funktion des Weltzustands, ohne R und ohne G.dbg.paths (Gate-Auflage 13): kranker oder toter Baum → Specht (am Stamm) · Fuchs in der Nähe (Bau eines lebenden Fuchses; in der Vorstufe auch das Hof-Ende seiner Fährte, f.vorFeld) → Häher · Riss oder Federn (track Fell/Federn) → Krähen.
// Fährten sind `track` selbst (Art „spur“). Das Personal nimmt Zeichen nur in der Wochenhülle wahr (beobFelder → beobachte: knBuf-Umkreis CFG.zeichen.personalR, als knMem-Art); der Verwalter an der Schrittstelle (playerSeen → zeichenWahrnehmen, auch am Sonntag):
// Hörbares im Hörradius CFG.zeichen.hoer × Wetter (nicht sichtLicht), Fährten im Sichtkreis (sichtLicht). Meldung = Text mit Himmelsrichtung + Ton (SFX, nur Darstellung) + Eintrag in knWiss (Quelle „gehört“/„gesehen“) + Notiz auf der Gutskarte (G.kartZ, nur Text/Farbe);
// Wiederholungssperre G.zSag: je Art und Zelle höchstens einmal je Tag (knTag), je Schritt eine hörbare Meldung und eine Fährte. Weltzustand (sim-test-Fingerabdruck): G.kartZ, G.zSag, f.vor/vorNeu/vorFeld der Füchse.
const ZEICHEN_ARTEN=['specht','haeher','kraehen'];
const KOMPASS_N=['Osten','Südosten','Süden','Südwesten','Westen','Nordwesten','Norden','Nordosten'];
const ZEICHEN_WORT={specht:'ein Specht gehört',haeher:'ein Häher gehört',kraehen:'Krähen gehört',spur:'eine Fuchsfährte gesehen'};
// Kartensymbole (B7 P4): Frame-Nummer in 01-karte und Name in der Legende; Zeichen-Arten (specht, haeher, kraehen, spur) wie ZEICHEN_WORT
const KSYM={hof:0,gesinde:1,bank:2,furt:3,bruecke:4,hasenbau:5,fuchsbau:6,specht:7,haeher:8,kraehen:9,spur:10};
const KSYM_WORT={hof:'Gutshaus',gesinde:'Gesindehaus',bank:'Bank',furt:'Furt',bruecke:'Brücke',hasenbau:'Hasenbau',fuchsbau:'Fuchsbau'};
const zeichenFuchsSpur=tr=>tr===TR_FOX||tr===TR_FELL||tr===TR_FEDERN;
// cb(Feld, Art, Warnung): alle Zeichenquellen der Welt – oder nur die im Quadrat ±r um (x0,y0) (nur ein Filter: das Ergebnis dort ist dasselbe; spart dem Schritt des Verwalters die ganze Karte)
function zeichenQuellen(cb,x0,y0,r){
  const Z=CFG.zeichen,all=r===undefined,xa=all?0:Math.max(0,x0-r),xb=all?W-1:Math.min(W-1,x0+r),ya=all?0:Math.max(0,y0-r),yb=all?H-1:Math.min(H-1,y0+r);
  for(const t of trees)if(t.alive&&t.h>=2&&t.x>=xa&&t.x<=xb&&t.y>=ya&&t.y<=yb&&(t.dead||t.stress>=Z.krankStress))cb(idx(t.x,t.y),'specht',false);
  for(const f of foxes){if(!f.alive)continue;cb(idx(f.den[0],f.den[1]),'haeher',false);if(f.vorNeu>0&&f.vorNeu===G.week-1&&f.vorFeld>=0)cb(f.vorFeld,'haeher',true)}
  for(let y=ya;y<=yb;y++)for(let x=xa;x<=xb;x++){const j=idx(x,y);if(track[j]===TR_FELL||track[j]===TR_FEDERN)cb(j,'kraehen',false)}}
const zeichenOrt=(x0,y0,j)=>{const x=j%W,y=(j/W)|0;return x===x0&&y===y0?'Hier':'Im '+KOMPASS_N[(Math.round(Math.atan2(y-y0,x-x0)/(Math.PI/4))+8)%8]};
function zeichenText(art,ort,warn,tr){
  switch(art){
    case 'specht':return `${ort} klopft ein Specht.`;
    case 'haeher':return warn?`${ort} warnt ein Häher lautstark – ein Fuchs scheint zum Hof zu ziehen.`:`${ort} schimpft ein Häher.`;
    case 'kraehen':return `${ort} kreisen Krähen und krächzen.`;
    default:return `${ort} ${tr===TR_FELL?'liegen Fellreste – da hat der Fuchs Beute gemacht':tr===TR_FEDERN?'liegen Federn und Pfotenabdrücke':'ist eine Fuchsfährte zu erkennen'}.`}}
function zeichenMelden(art,j,warn,tr,quelle,vol){
  const Z=CFG.zeichen,key=(art==='spur'?'spur'+tr:art+(warn?'!':''))+':'+beobZelle(j,Z.zelle),tag=knTag();
  if(G.zSag[key]===tag)return;G.zSag[key]=tag;
  toast(zeichenText(art,zeichenOrt(P.x,P.y,j),warn,tr),4200);
  if(vol&&SFX[art])SFX[art](vol);   // Darstellung (Web Audio, Math.random erlaubt)
  wissen(tr?{art,feld:j,woche:G.week,tr}:{art,feld:j,woche:G.week},quelle)}
// An der Schrittstelle (playerSeen): das nächste noch nicht gemeldete hörbare Zeichen im Hörradius × Wetter, und die nächste Fuchsfährte im Sichtkreis (sp = {j})
function zeichenWahrnehmen(sp){
  const Z=CFG.zeichen,tag=knTag(),fk=Z.wetter[wetterJetzt()]??1;let best=null;
  zeichenQuellen((j,art,warn)=>{const rad=Z.hoer[art]*fk,d=dist(P.x,P.y,j%W,(j/W)|0);
    if(d>rad||(best&&d>=best.d)||G.zSag[art+(warn?'!':'')+':'+beobZelle(j,Z.zelle)]===tag)return;
    best={j,art,warn,d,vol:Math.max(0.2,1-d/rad)}},P.x,P.y,Math.max(Z.hoer.specht,Z.hoer.haeher,Z.hoer.kraehen));
  if(best)zeichenMelden(best.art,best.j,best.warn,0,'gehört',best.vol);
  if(sp)zeichenMelden('spur',sp.j,false,track[sp.j],'gesehen',0)}
// Gutskarte: Zeichen-Notiz (Farbfläche und Symbol aus 01-karte, B7 P4); je Art und Zelle das Neueste, höchstens CFG.zeichen.kartMax
function kartZeichen(e){
  if(!(ZEICHEN_ARTEN.includes(e.art)||(e.art==='spur'&&zeichenFuchsSpur(e.tr))))return;
  const Z=CFG.zeichen,k=e.art+':'+beobZelle(e.feld,Z.zelle),L=G.kartZ,i=L.findIndex(z=>z.k===k);
  if(i>=0){if(L[i].woche>e.woche)return;L.splice(i,1)}
  L.push({k,art:e.art,feld:e.feld,woche:e.woche});if(L.length>Z.kartMax)L.shift()}
// Stimmung der Woche aus dem Zustand (Wochenhülle, vor den Naturschritten): gut gegessen · nichts liegengeblieben · Holzarbeit gehabt
function launeWoche(s,holz){
  const ld=G.lastDay||{failed:[]};
  G.laune[s.id]={essen:!(G.mealHungry||[]).includes(s.name)&&!!(G.goodMeal||G.bonusNext),last:ld.failed.some(f=>f.who===s.name),holz}}
const launeGut=s=>{const l=G.laune[s.id];return !l||(l.essen?1:0)+(l.last?0:1)+(l.holz?1:0)>=CFG.beob.launeMin}
const launeText=s=>{const l=G.laune[s.id];return !l.essen?'Mit leerem Magen red ich nicht viel.':l.last?'Mir steht die Arbeit bis zum Hals – später.':'Ohne Axt in der Hand red ich nicht gern.'}
// Worte statt Zahlen: wo, grob (Garten / am Hof / ein Stück … vom Hof / weit … vom Hof)
function ortWort(f){const x=f%W,y=(f/W)|0;
  if(inGarden(x,y))return 'im Garten';
  const dx=x-ESTATE.cx,dy=y-ESTATE.cy,d=Math.hypot(dx,dy);
  if(d<15)return 'am Hof';
  const r=KOMPASS[(Math.round(Math.atan2(dy,dx)/(Math.PI/4))+8)%8];
  return d<28?`ein Stück ${r} vom Hof`:`weit ${r} vom Hof`}
const mengeWort=(n,eins,paar,viele)=>n>=4?viele:n>=2?paar:eins;
function beobText(e){
  const o=ortWort(e.feld),O=o[0].toUpperCase()+o.slice(1);
  switch(e.art){
    case 'ort':return e.w?`${O} habe ich gearbeitet.`:`${O} bin ich langgekommen.`;
    case 'baumtot':return `${O} habe ich einen Baum gesehen, der abstirbt.`;
    case 'baumliegt':return `${O} habe ich einen umgestürzten Baum gesehen.`;
    case 'hasenbau':return `${O} habe ich einen Hasenbau gesehen.`;
    case 'fuchsbau':return `${O} habe ich einen Fuchsbau gesehen.`;
    case 'spur':return `${O} habe ich ${TR_TXT[e.tr]||'Spuren gesehen'}.`;
    case 'beeren':return `${O} habe ich ${mengeWort(e.n,'einen Strauch mit reifen Beeren','ein paar Sträucher mit reifen Beeren','viele Sträucher voller reifer Beeren')} gesehen.`;
    case 'specht':return `${O} habe ich einen Specht klopfen gehört.`;

    case 'auftrag':return auftragText(e,o,O);

    default:return `${O} ist mir etwas aufgefallen.`}}
// Rückmeldung zu einem Gebietsauftrag (Beeren), mit Grund in Worten – o = Ort klein, O = Ort groß geschrieben
function auftragText(e,o,O){
  const m=mengeWort(e.n,'ein paar Beeren','eine Schürze voll Beeren','einen ganzen Korb Beeren'),fund=e.n?`nur ${m} gefunden`:'nichts gefunden',such=e.such?' Es hat gedauert, bis ich die Stelle gefunden habe.':'';

    case 'fremd':return e.auf?`Da kenne ich mich gar nicht aus: ${o} habe ich die Beeren nicht gefunden.`:`Da kenne ich mich nicht gut aus: ${o} habe ich ${fund}, den Rest habe ich nicht gefunden.${such}`;
    case 'kaum':return `Da war kaum noch was: ${o} habe ich ${e.n?'nur '+m:'fast nichts'} gefunden.${such}`;
    case 'zeit':return e.n?`${O} habe ich ${m} gepflückt, mehr habe ich vor dem Heimweg nicht geschafft.${such}`:`${O} bin ich nicht mehr zum Pflücken gekommen, die Zeit war um.${such}`;
    default:return `${O} habe ich ${m} gepflückt.${such}`}}
// Gutskarte aus einer Beobachtung ergänzen – nur, wo ihre Woche neuer ist als der Karteneintrag (kein feldKlasse, nur die damals gemerkte Klasse); Rückgabe: Zahl geänderter Felder
function kartMelde(e){
  let n=0;
  if(e.kls){const r=CFG.karte.personalR,x=e.feld%W,y=(e.feld/W)|0;let k=0;
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const kl=e.kls[k++];if(!kl||!inb(x+dx,y+dy))continue;const j=idx(x+dx,y+dy);if(e.woche>kartWo[j]){kartWo[j]=e.woche;kartKl[j]=kl;n++}}}
  else if(e.woche>kartWo[e.feld]){kartWo[e.feld]=e.woche;kartKl[e.feld]=e.kl;n++}
  return n}
// Wissensliste des Verwalters (diese Woche): typisiert, Quelle „Gespräch“ oder „Untersuchen“; B2c baut das Beobachtungsbuch darauf
function wissen(e,quelle,von){
  kartZeichen(e);
  if(knWiss.length>=CFG.beob.wissenMax||knWiss.some(w=>w.art===e.art&&w.feld===e.feld&&w.woche===e.woche&&w.quelle===quelle))return;
  const w={art:e.art,feld:e.feld,woche:e.woche,quelle};if(von)w.von=von;if(e.tr)w.tr=e.tr;if(e.grund)w.grund=e.grund;if(e.n)w.n=e.n;if(e.w)w.w=e.w;if(e.neu)w.neu=true;
  knWiss.push(w)}
// Was die Person jetzt erzählt: {list} | {brummt} (Jost bei schlechter Laune) | null (nichts)
function erzaehlWahl(s,nachfrage){
  const mem=knMem[s.id],fig=s.fig,lieb=fig.lieblings;

}
function validTask(t){
  if(TASKS[t.type].fixed)return true;

  const i=idx(t.x,t.y);

    case 'faellen':{const tr=treeById.get(t.ref);return !!(tr&&tr.alive)}

    if(t.type==='fuettern')return G.hensInside&&G.chickens>0;if(t.type==='einsperren')return G.chickens>0;if(t.type==='kochen')return true;return Object.keys(d.who).some(id=>S(id).available)||G.marketOut}
  return validTask(t)&&(!d.group||taskItems(t).length>0)}
function taskPos(t){if(t.type==='markt')return[ESTATE.gx,H-2];if(isHen(t))return COOP;if(t.type==='kochen')return HOF;if(!TASKS[t.type].group)return[t.x,t.y];const its=taskItems(t);if(!its.length)return HOF;
  let sx=0,sy=0;for(const it of its){const j=itemTile(t,it);sx+=j%W;sy+=(j/W)|0}return[Math.round(sx/its.length),Math.round(sy/its.length)]}
function where(x,y){
  if(inGarden(x,y))return 'im Garten';

  if(d<15)return 'am Hof';
  const ns=dy<-d*0.4?'nord':dy>d*0.4?'süd':'',ew=dx>d*0.4?'östlich':dx<-d*0.4?'westlich':'';

}
function treeDesc(tr){if(!tr)return 'Baum';const size=tr.giant?'Riesen-':tr.h>=6?'alte ':tr.h>=4?'':tr.h>=2?'junge ':'';
  return tr.h<=1?`${SPNAME[tr.sp]}nsetzling`:`${size}${SPNAME[tr.sp]}`}
function taskTitle(t){

function addTask(type,x,y,ref,extra){const t={id:nextId++,type,x,y,ref,who:null,crew:[],done:0,items:[],...(extra||{})};G.tasks.push(t);return t}
function removeTask(t){const k=G.tasks.indexOf(t);if(k>=0)G.tasks.splice(k,1)}

function ensureAutoTasks(){for(const k of Object.keys(TASKS))if(TASKS[k].auto)groupTask(k)}
function markedAt(x,y){const i=idx(x,y),tr=treeAt(i),lg=lyingAt[i];
