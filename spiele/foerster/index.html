// ================================================================ Wirkungen
function cutLog(l){for(const j of l.tiles){lyingAt[j]=-1;addPile(j,F_WOOD,2)}logs.splice(logs.indexOf(l),1);logById.delete(l.id)}
function collectPile(i){if(feat[i]===F_WOOD)G.barnWood+=featN[i];else if(feat[i]===F_HAY)G.barnHay+=featN[i];else if(feat[i]===F_TRAPFULL){G.traps++;if(G.hutch<CFG.hutchCap)G.hutch++;else G.pendingDisperse.push({x:i%W,y:(i/W)|0,n:1})}feat[i]=0;featN[i]=0}
function fillFeat(i){const x=i%W,y=(i/W)|0;
  if(feat[i]===F_BURROW){const b=burrows.find(b=>b.alive&&b.x===x&&b.y===y);if(b){b.alive=false;if(b.n>0)G.pendingDisperse.push({x,y,n:b.n});log(`Hasenbau (${x},${y}) zugeschüttet – ${b.n} Hasen müssen weiterziehen`)}}
  if(feat[i]===F_DEN){for(const f of foxes)if(f.alive&&f.den[0]===x&&f.den[1]===y){f.alive=false;log(`Fuchsbau (${x},${y}) zugeschüttet – der Fuchs verlässt das Revier`)}}
  feat[i]=0;featN[i]=0}
function mowTile(j){const g=grass[j];if(!g)return;grass[j]=0;gprog[j]=0;
  if(ground[j]===G_LAWN)return;
  G.hayAcc=(G.hayAcc||0)+(g===2?1:0.35);if(G.hayAcc>=1){const n=Math.floor(G.hayAcc);G.hayAcc-=n;addPile(j,F_HAY,n)}}
function applySingle(t){
  const i=idx(t.x,t.y);
  switch(t.type){
    case 'faellen':{const tr=treeById.get(t.ref);if(tr&&tr.alive){fellTree(tr);log(`${treeDesc(tr)} (${tr.x},${tr.y}) gefällt`)}break}
    case 'zerlegen':{const l=logById.get(t.ref);if(l)cutLog(l);break}
    case 'roden':stumpAt[i]=0;break;
    case 'bau':fillFeat(i);break;
    case 'falle':if(G.traps>0){feat[i]=F_TRAP;G.traps--}else return false;break;
  }
  return true;
}
function applyItem(t,it){
  switch(t.type){
    case 'maehen':mowTile(it);break;
    case 'einholen':if(feat[it]===F_WOOD||feat[it]===F_HAY||feat[it]===F_TRAPFULL)collectPile(it);break;
    case 'flicken':if(fence[it]<3){if(G.barnWood>0){G.barnWood--;fence[it]=3}else G.noWood=true}break;
    case 'setzlinge':{const tr=treeById.get(it);if(tr&&tr.alive){killTree(tr);computeLight()}break}
    case 'loecher':if(feat[it]===F_HOLE)feat[it]=0;break;
    case 'weg':if(wegOk(it))wegLegen(it);break;
  }
  if(!TASKS[t.type].auto){t.items=t.items.filter(x=>x!==it);if(!t.items.length)removeTask(t)}
}

// ================================================================ Personal: Zeitleiste, Ticks, Tageslauf
// Tick = eine Spielminute (G.min = Minuten seit Mitternacht). Die Hauptschleife rechnet Echtzeit in Ticks um (advanceDay); Heimgehen/„Tag beenden“ (finishDayTicks)
// treibt dieselben Ticks ohne Darstellung bis zum Abend. Nichts bewegt sich oder wirkt außerhalb von dayTick; Tick 0 = Tagesbeginn nach dem Appell (beginDay).
// Wahrheitsquelle der Zeitleiste: die Zuteilung (t.crew bzw. t.who, Reihenfolge = Reihenfolge in G.tasks; beim Tagesbeginn und nach der Mittagspause in G.frozen
// eingefroren) plus G.dayType. Die Zeitleiste einer Person ist daraus abgeleitet (buildAgenda: feste Spannen, pickWork: Arbeit im Fenster bis zur nächsten
// Heimkehr) und kein zweiter Datenbestand; planAll rechnet sie für die Tafel als Trockenlauf mit denselben Funktionen vor (Anzeige = Ausführung).
// Arbeit rechnet in Minuten: Arbeitsminuten = Kosten (Punkte) × punktNorm × Effektivitätsfaktor × 100 / Tempo der Person (Küchen-Bonus: Tempo + mealBonus Prozentpunkte).
// Fortschritt t.done in Normminuten (Referenzperson: Tempo 100 %, Effektivität 100 %). Wege laufen als Ticks und werden nicht vom Arbeitsbudget abgezogen.
// Verfügbare Zeit = bis zur nächsten Heimkehr (abends immer, mittags nur am Hoftag) minus Rückweg; Hinweg ab dem Ort des letzten Auftrags.
let dry=null,planCache=null;   // dry: nur während planAll (Trockenlauf, siehe dryRun); planCache: letztes Ergebnis der Tafel (nur Darstellung, kein Weltzustand)
let ffMode=false,tickAcc=0;   // ffMode: Heimgehen (finishDayTicks) rechnet ohne Darstellung (keine Meldungen); tickAcc: Echtzeit-Rest der Hauptschleife (nur Darstellung, kein Weltzustand)
const hm=m=>`${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(Math.floor(m%60)).padStart(2,'0')}`;   // über Mitternacht modulo 24
const normOf=pts=>pts*CFG.zeit.punktNorm;   // Arbeitspunkte → Normminuten
function capOf(s){return CFG.tempo[s.id]+(G.goodMeal&&!s.weakNext?CFG.mealBonus:0)}
const rateOf=(s,type)=>capOf(s)/(100*((type&&mult(type,s.id))||1));   // Normminuten Fortschritt je Arbeitsminute
// Eckzeiten des Tages (Minuten seit Mitternacht): Arbeitszeit von Sonnenaufgang bis -untergang, Mittagspause nur am Hoftag, harte Spätgrenze und Dunkelheit danach
function dayTimes(){const z=CFG.zeit,s=sunTimes(weekNow()),ende=Math.round(s.unter*60),mit=Math.round(z.mittag*60);
  return{start:Math.round(s.auf*60),mittag:mit,wiederAb:mit+z.mittagMin,ende,spaet:ende+z.spaetMin,dunkel:ende+z.abendMin}}
function stdLabel(s){return{hannes:'einholen am Hof',jost:'Stämme am Hof zerlegen',grete:'Hof & Hühner',liese:'Haus & Garten'}[s.id]}
// Beim Appell (und nach der Mittagspause) wird der Plan festgelegt; Änderungen dazwischen gelten ab der nächsten Verteilung
function staffTasks(s,live){const base=!live&&G.frozen?(G.frozen[s.id]||[]).map(id=>G.tasks.find(t=>t.id===id)).filter(Boolean):G.tasks.filter(t=>assigned(t,s.id));
  return base.filter(t=>visibleTask(t)&&canDo(t.type,s.id,t))}
function freezePlans(){G.frozen={};for(const s of staff)G.frozen[s.id]=G.tasks.filter(t=>assigned(t,s.id)).map(t=>t.id)}
// Umplanen (Paket 12): s bekommt ab jetzt (G.min) den neuen Plan – nur s. Die Zuteilung (G.tasks) ist schon geändert (eine Wahrheitsquelle); hier folgen G.frozen[s.id] und die Ausführung:
// laufender Weg/Auftrag endet (Objekt: Fortschritt t.done bleibt; Sammelposten: Claim frei, das angefangene Feld verfällt), s.path leer, Agenda neu ab dem Ort von s.
// Feste Spannen (Hinweg oder Durchführung von füttern/kochen/einsperren) sind nicht unterbrechbar: die Änderung greift danach. Läuft auch im Trockenlauf (dryRun, ab jetzt) auf der Kopie.
const staffSig=s=>G.tasks.filter(t=>assigned(t,s.id)).map(t=>t.id).join();
function replanPerson(s){
  s.folgt=false;   // Weg zeigen endet mit jedem Umplanen (Entlassen, [T], Hoftag-Mittag, Abend: folgeEnde)
  if(G.frozen)G.frozen[s.id]=G.tasks.filter(t=>assigned(t,s.id)).map(t=>t.id);
  const c=s.cur,fest=c&&c.ag;
  if(!fest){
    if(c&&c.kind==='item')G.claimed.delete(c.task.id+':'+c.item);
    s.cur=null;s.path=[];s.acc=0;s.state='rest';s.wait=0}
  s.failed=s.failed.filter(t=>assigned(t,s.id));
  const ag=buildAgenda(s,false,G.min);
  s.agenda=fest?[c.ag,...ag.filter(a=>a.task!==c.task)].sort((a,b)=>a.go-b.go):ag}
// Feste Spannen einer Person (Zeitpunkte, an denen sie an einem Ort sein muss): Markt (Vormittag, unterwegs), Füttern (zuerst), Kochen (Hoftag: bis zum Mittag; Waldtag: bis zum Abend),
// Einsperren (abends). go = frühester Aufbruch, start = Arbeitsbeginn am Ort, end = start + dur. Hinweg zum Stall: Distanzfeld der Person zur Mittagsminute (Aufruf innerhalb withWayField), auf die Abendminute hochgerechnet (Kosten skalieren mit dayFactor).
function buildAgenda(s,live,from){
  const T=G.times,z=CFG.zeit,hof=G.dayType!=='wald',ag=[];
  const list=staffTasks(s,live).filter(t=>TASKS[t.type].fixed&&t.doneWeek!==G.week);
  const mk=list.find(t=>t.type==='markt'),fu=list.find(t=>t.type==='fuettern'),ko=list.find(t=>t.type==='kochen'),ei=list.find(t=>t.type==='einsperren');
  const add=(type,t,x,y,start,dur,hin=0)=>ag.push({type,task:t,x,y,start,dur,end:start+dur,go:start-hin,done:false});
  const marktDa=mk&&!G.marketOut&&from<T.mittag;
  if(marktDa)add('markt',mk,ESTATE.gx,H-1,from,T.mittag-from);
  if(fu)add('fuettern',fu,COOP[0]+2,COOP[1],marktDa?T.mittag:from,z.fuetternMin);
  let eiGo=T.ende;
  if(ei){const start=T.ende-z.einsperrenMin,hin=wayMinutes(COOP[0],COOP[1],T.mittag,s)*dayFactor(T.ende-30)/dayFactor(T.mittag);add('einsperren',ei,COOP[0],COOP[1],start,z.einsperrenMin,hin);eiGo=start-hin}
  if(ko){const end=hof?T.mittag:eiGo,start=end-z.kochenMin;if(start-z.anreiseMin>=from)add('kochen',ko,HOF[0],HOF[1],start,z.kochenMin,z.anreiseMin)}
  return ag.sort((a,b)=>a.go-b.go)}
// ---------------------------------------------------------------- Arbeit wählen
function pathMinutes(path,minute,who){const cf=costFn(minute,who),mb=CFG.zeit.minBoden;let m=0;for(const i of path){const c=cf(i);m+=c<Infinity?c:mb}return m}
function nearestFirst(items,pos,tileOf,tie){const rest=items.slice(),out=[];let [x,y]=pos;
  while(rest.length){let bi=0,bd=1e9;for(let k=0;k<rest.length;k++){const j=tileOf(rest[k]);const d=dist(x,y,j%W,(j/W)|0);if(d<bd||(tie&&d===bd&&j<tileOf(rest[bi]))){bd=d;bi=k}}
    const it=rest.splice(bi,1)[0];out.push(it);const j=tileOf(it);x=j%W;y=(j/W)|0}return out}
// Das Übliche, wenn nichts Zugeteiltes mehr passt (Reihenfolge = Wichtigkeit bzw. nächstgelegen zuerst)
function stdItems(s){
  if(s.id==='grete')return[];
  const near=[Math.round(s.x),Math.round(s.y)];
  if(s.id==='hannes'){const its=[];for(let i=0;i<N;i++){const f=feat[i];if((f===F_WOOD||f===F_HAY)&&dist(i%W,(i/W)|0,HOF[0],HOF[1])<=16||f===F_TRAPFULL&&dist(i%W,(i/W)|0,HOF[0],HOF[1])<=30)its.push(i)}
    return nearestFirst(its,near,i=>i).map(i=>({kind:'routine',name:'einholen',x:i%W,y:(i/W)|0,pts:CFG.cost.einholen}))}
  if(s.id==='jost'){const out=[];for(const l of logs){const j=l.tiles[0];if(dist(j%W,(j/W)|0,HOF[0],HOF[1])>16)continue;out.push({kind:'routine',name:'zerlegen',log:l.id,x:j%W,y:(j/W)|0,pts:CFG.cost.zerlegen*l.tiles.length})}return out}
  if(s.id==='liese'){const garden=[];
    for(let y=ESTATE.y0+1;y<ESTATE.y1;y++)for(let x=ESTATE.x0+1;x<ESTATE.x1;x++){const i=idx(x,y);
      if(feat[i]===F_HOLE)garden.push({p:3,x,y,pts:CFG.cost.loch,name:'loch'});
      const t=treeAt(i);if(t&&t.h<=3)garden.push({p:2,x,y,pts:CFG.cost.setzling,name:'setzling'});
      if(grass[i]===2&&ground[i]===G_LAWN)garden.push({p:1,x,y,pts:CFG.cost.rasen,name:'rasen'})}
    garden.sort((a,b)=>b.p-a.p);G.gardenBacklog=garden.length;
    return garden.map(g=>({kind:'routine',...g}))}
  return[];
}
// Nächste Arbeit für s im Fenster bis zur Heimkehr b (Minute): Zugeteiltes in Listenreihenfolge, danach das Übliche. Ein Posten kommt nur in Frage, wenn
// Hinweg (ab dem Ort des letzten Auftrags, nach Kostenkarte) + Arbeit + Rückweg bis b passen; Objekte dürfen angefangen werden (Fortschritt bleibt),
// Fläche/Sammelposten arbeiten Feld für Feld, was nicht mehr passt, bleibt als Restfeld stehen. Mehrfachbesetzung: jedes Feld nur einmal vergeben (G.claimed).
// Rückweg nach Distanzfeld zur Bezugsminute b − rueckRef (gegen Ende des Fensters, dunkler als jetzt). Aufruf innerhalb withWayField, ohne Weltänderung.
function pickWork(s,b){
  const now=G.min,ref=b-CFG.zeit.rueckRef,sx=Math.round(s.x),sy=Math.round(s.y),key=(t,it)=>t.id+':'+it;
  const back=(x,y)=>wayBackMinutes(x,y,ref,s);
  const route=(x,y)=>{const p=findPath(sx,sy,x,y,s);return p&&{path:p,min:pathMinutes(p,now,s)}};
  const fail=(t,k)=>{s.skip.add(k);if(t&&!s.failed.includes(t))s.failed.push(t)};
  for(const t of staffTasks(s,false)){
    const d=TASKS[t.type];if(d.fixed)continue;
    const rate=rateOf(s,t.type);
    if(d.gebiet){   // Gebietsauftrag: Hinweg zum Fixpunkt; Finden, Radius und Sammeln entscheidet erst gebietTick bei der Ankunft (Licht zur Ankunftsminute)
      if(!validTask(t)||s.skip.has(key(t,'*'))||(dry&&dry.done.has(key(t,'*'))))continue;
      const r=route(t.x,t.y);if(!r){fail(t,key(t,'*'));continue}
      if(now+r.min+CFG.gebiet.minArbeit+back(t.x,t.y)<=b)return{kind:'gebiet',task:t,x:t.x,y:t.y,fx:t.x,fy:t.y,path:r.path,left:0,rate,b};
      continue}
    if(d.group){
      const its=taskItems(t).filter(it=>itemTile(t,it)>=0&&!G.claimed.has(key(t,it))&&!s.skip.has(key(t,it))&&!(dry&&dry.done.has(key(t,it))));
      for(const it of nearestFirst(its,[sx,sy],it=>itemTile(t,it)).slice(0,3)){
        const j=itemTile(t,it),x=j%W,y=(j/W)|0,r=route(x,y);
        if(!r){fail(t,key(t,it));continue}
        const norm=normOf(itemCost(t,it));
        if(now+r.min+norm/rate+back(x,y)<=b)return{kind:'item',task:t,item:it,x,y,path:r.path,left:norm,rate}}
    } else {
      if(!validTask(t)||s.skip.has(key(t,'*')))continue;
      const r=route(t.x,t.y);if(!r){fail(t,key(t,'*'));continue}
      const left=normOf(singleCost(t))-t.done,stop=b-back(t.x,t.y);
      if(left>0&&stop-(now+r.min)>=Math.min(CFG.zeit.minArbeit,left/rate))return{kind:'single',task:t,x:t.x,y:t.y,path:r.path,left,rate,stop}
    }
  }
  const stdRate=capOf(s)/100;
  for(const j of stdItems(s).filter(j=>!s.skip.has('s:'+j.name+j.x+','+j.y)).slice(0,3)){
    const r=route(j.x,j.y);if(!r){s.skip.add('s:'+j.name+j.x+','+j.y);continue}
    const norm=normOf(j.pts);
    if(now+r.min+norm/stdRate+back(j.x,j.y)<=b){const {pts,...leg}=j;return{...leg,path:r.path,left:norm,rate:stdRate}}
  }
  return null;
}
// ---------------------------------------------------------------- Gebietsauftrag (Demo B2b, Paket 4)
// Auftragsart „Gebiet“ (KONZEPT §5.0): markiert wird nur der Fixpunkt (t.x, t.y), dazu die Erwartung t.erw (reife Sträucher im Umkreis CFG.gebiet.rMax beim Markieren). Ablauf (gebietTick; ein Auftrag = ein Gang, einmalig, auch nach Aufgeben):
// Ankunft → gebietFinden (Weg/Pfad am Fixpunkt, Wegmarke, eigene Kenntnis, Licht zur Ankunftsminute; sonst Suchen auf Zeit oder Aufgeben) → gebietRadius (Licht, Kenntnis) → die Sträucher im Radius nearestFirst (Index als Gleichstand), je Strauch Gehen und Pflücken, solange
// Hinweg + Arbeit + Rückweg ins Fenster passen. Reine Funktionen des Weltzustands (G.marken, kenn, pfad, light, Wetter), ohne R; der Trockenlauf merkt sich nur in dry.done (Schlüssel „t.id:*“ = Auftrag erledigt, „b<Feld>“ = Strauch gepflückt) und setzt es zurück.
// Rückmeldung mit Grund (gebietMelde → Gedächtnis der Person, Art „auftrag“, erzählt sie am Sonntag): gepflückt · „zu dunkel“ · „kenne mich nicht aus“ · „kaum noch was“ (gegen t.erw) · Zeit um. Wegmarken G.marken (Weltzustand): Feldnummern, Sonntag per Menü.
const gebietLicht=(i,minute)=>daylight(minute)*sichtLicht(light[i],laubAt(i));
const gebietMarke=(x,y,r)=>G.marken.some(m=>dist(m%W,(m/W)|0,x,y)<=r);
function gebietWeg(x,y,r){for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(dx*dx+dy*dy>r*r||!inb(x+dx,y+dy))continue;const j=idx(x+dx,y+dy);if(ground[j]===G_PATH||pfad[j]>0)return true}return false}
// Findet who den Fixpunkt (x,y) zur Minute? direkt (via weg|marke|kenntnis|licht) · sucht (min Minuten, grund dunkel|fremd = was fehlt mehr) · auf (zu dunkel, nach min Minuten Suchen)
function gebietFinden(who,x,y,minute){
  const C=CFG.gebiet,i=idx(x,y),licht=gebietLicht(i,minute),kn=kennOf(who)[i]/KN_MAX;
  const via=gebietWeg(x,y,C.wegR)?'weg':gebietMarke(x,y,C.markeR)?'marke':kn>=C.findKenn?'kenntnis':licht>=C.findLicht?'licht':null;
  if(via)return{art:'direkt',min:0,via,licht,kn};
  if(licht<C.suchLicht)return{art:'auf',min:C.aufMin,grund:'dunkel',licht,kn};
  return{art:'sucht',min:Math.round(C.suchMin*(1-kn)*Math.min(2,C.findLicht/Math.max(licht,1e-6))),grund:licht/C.findLicht<kn/C.findKenn?'dunkel':'fremd',licht,kn}}
// Wie weit reicht die Runde um den Fixpunkt? Licht (zur Minute) und eigene Kenntnis dort; lf/kf = die beiden Faktoren (der kleinere ist der Grund, wenn Sträucher außerhalb bleiben)
function gebietRadius(who,x,y,minute){
  const C=CFG.gebiet,i=idx(x,y),lf=clamp(gebietLicht(i,minute)/C.lichtVoll,C.lichtMin,1),kf=C.kennMin+(1-C.kennMin)*kennOf(who)[i]/KN_MAX;
  return{r:Math.max(C.rMin,C.rMax*lf*kf),lf,kf}}
// reife Sträucher im Kreis r um (x,y), aufsteigend nach Feldnummer
function gebietBeeren(x,y,r){const o=[],ri=Math.floor(r);
  for(let dy=-ri;dy<=ri;dy++)for(let dx=-ri;dx<=ri;dx++){if(dx*dx+dy*dy>r*r||!inb(x+dx,y+dy))continue;const j=idx(x+dx,y+dy);if(deco[j]===D_BUSCH&&berry[j])o.push(j)}
  return o}
const gebietVorrat=(x,y)=>gebietBeeren(x,y,CFG.gebiet.rMax).length;
const markGebiet=(type,x,y)=>addTask(type,x,y,null,{erw:gebietVorrat(x,y)});   // Erwartung = was beim Markieren im Umkreis stand
const beerenSig=t=>{const l=gebietBeeren(t.x,t.y,CFG.gebiet.rMax);return t.id+':'+l.length+':'+l.reduce((a,j)=>a+j,0)};   // Signatur der Beeren im Radius (planKey)
// Ein Tick am Gebiet. c = s.cur: ph 0 Ankunft, 1 Suchen (such Minuten), 2 nächsten Strauch wählen, 3 pflücken (left), Ende über gebietEnde. Nur Zahlen ändern sich; c.f, c.R und c.liste bleiben unverändert (Tiefenkopie im Trockenlauf „ab jetzt“).
function gebietTick(s,c){
  const t=c.task,C=CFG.gebiet;
  if(!G.tasks.includes(t)||(dry&&dry.done.has(t.id+':*'))){endLeg(s);return}
  if(!c.ph){c.f=gebietFinden(s,c.fx,c.fy,G.min);c.ph=1;c.such=c.f.min;c.suchGes=c.f.min}   // Ankunft: finden oder suchen
  if(c.ph===1){
    if(c.such>0){c.such--;return}
    const f=c.f,fit=withWayField(()=>G.min+wayBackMinutes(c.fx,c.fy,c.b-CFG.zeit.rueckRef,s)+C.minArbeit<=c.b);
    if(f.art==='auf'||!fit){gebietEnde(s,c,{n:0,auf:true,grund:f.grund||'dunkel',such:c.suchGes>0});return}
    const R=gebietRadius(s,c.fx,c.fy,G.min);
    c.R=R;c.vorrat=gebietVorrat(c.fx,c.fy);c.liste=nearestFirst(gebietBeeren(c.fx,c.fy,R.r),[c.fx,c.fy],j=>j,true);c.imR=c.liste.length;c.k=0;c.n=0;c.ph=2}
  if(c.ph===3){
    c.left-=c.rate;
    if(c.left<=1e-6){const j=c.item;if(berry[j]&&!(dry&&dry.done.has('b'+j))){applyJob(s,{kind:'beere',task:t,item:j});c.n++}c.k++;c.ph=2}}
  if(c.ph===2){
    withWayField(()=>{const ref=c.b-CFG.zeit.rueckRef,norm=normOf(CFG.cost.beeren);
      while(c.k<c.liste.length){const j=c.liste[c.k],x=j%W,y=(j/W)|0;
        if(!berry[j]||(dry&&dry.done.has('b'+j))){c.k++;continue}   // inzwischen gepflückt
        const p=findPath(s.x,s.y,x,y,s);if(!p){c.k++;continue}
        if(G.min+pathMinutes(p,G.min,s)+norm/c.rate+wayBackMinutes(x,y,ref,s)>c.b)break;   // passt nicht mehr: die Runde ist zu Ende
        c.x=x;c.y=y;c.item=j;c.left=norm;c.ph=3;s.path=p;s.acc=0;s.state=p.length?'walk':'work';if(!p.length)faceTo(s,x,y);return}
      c.ph=4});
    if(c.ph===4){const kaum=c.vorrat<=t.erw*C.kaum;
      gebietEnde(s,c,{n:c.n,such:c.suchGes>0,grund:kaum?'kaum':c.imR<c.vorrat?(c.R.lf<c.R.kf?'dunkel':'fremd'):c.n<c.imR?'zeit':'ok'})}}}
function gebietEnde(s,c,res){applyJob(s,{kind:'gebiet',task:c.task,res});endLeg(s)}
// Rückmeldung ins Gedächtnis der Person (nur echt, nie im Trockenlauf): sie erzählt sie am Sonntag; die Feldklasse wird jetzt gemerkt (das Gespräch liest feldKlasse nie)
function gebietMelde(s,t,res){
  const f=idx(t.x,t.y),e={k:'auftrag:'+t.id,art:'auftrag',feld:f,woche:G.week,grund:res.grund,n:res.n,kl:feldKlasse(f)};
  if(res.auf)e.auf=1;if(res.such)e.such=1;
  knMem[s.id]=knMem[s.id].filter(x=>x.k!==e.k);knMem[s.id].push(e)}
// ---------------------------------------------------------------- Wirkung
function applyJob(s,j){
  if(dry){dryApply(s,j);return}
  switch(j.kind){
    case 'fuettern':{const need=heuBedarf();if(G.barnHay>=need){G.barnHay-=need;G.hensFoodOk=true}else G.hayShort=true;j.task.doneWeek=G.week;break}
    case 'einsperren':G.coopClosed=true;j.task.doneWeek=G.week;break;
    case 'markt':s.away=true;s.awayUntil=G.times.mittag;G.marketOut=true;break;
    case 'kochen':j.task.doneWeek=G.week;cookMeal(s);break;
    case 'item':if(G.tasks.includes(j.task))applyItem(j.task,j.item);break;
    case 'beere':{const i=j.item;if(berry[i]){berry[i]=0;berryT[i]=0;addFood('beeren',CFG.berryPortion)}break}
    case 'gebiet':if(G.tasks.includes(j.task)){removeTask(j.task);gebietMelde(s,j.task,j.res)}break;   // einmalig: erledigt, auch nach Aufgeben
    case 'single':{const t=j.task;if(!G.tasks.includes(t))break;if(!validTask(t)){removeTask(t);break}
      if(applySingle(t))removeTask(t);else{if(!s.failed.includes(t))s.failed.push(t);s.skip.add(t.id+':*');t.done=normOf(singleCost(t))-0.01}
      break}
    case 'routine':{const i=idx(j.x,j.y);
      if(j.name==='einholen'){if(feat[i]===F_WOOD||feat[i]===F_HAY||feat[i]===F_TRAPFULL)collectPile(i)}
      else if(j.name==='loch'){if(feat[i]===F_HOLE)feat[i]=0}
      else if(j.name==='setzling'){const t=treeAt(i);if(t&&t.h<=3){killTree(t);computeLight()}}
      else if(j.name==='rasen'){grass[i]=0;gprog[i]=0}
      else if(j.name==='zerlegen'){const l=logById.get(j.log);if(l){cutLog(l);G.tasks.filter(t=>t.type==='zerlegen'&&t.ref===l.id).forEach(removeTask)}}
      break}
  }
}
// ---------------------------------------------------------------- Gehen
// Günstigste Route nach Kostenkarte (A*); Pfad = Feldindizes ohne Startfeld wie bisher, null = unerreichbar. who = Person (Ortskenntnis, B2).
function findPath(sx,sy,tx,ty,who){
  sx=Math.round(sx);sy=Math.round(sy);
  const goal=new Set(),direct=walkable(tx,ty);
  if(direct)goal.add(idx(tx,ty));
  else for(const [dx,dy] of DIRS)if(walkable(tx+dx,ty+dy))goal.add(idx(tx+dx,ty+dy));
  if(!goal.size)return null;
  const start=idx(sx,sy);if(goal.has(start))return [];
  const hit=pfRun(start,costFn(clockMinute(),who),goal,tx,ty,direct?0:1,false);
  if(hit<0)return null;
  const path=[];for(let k=hit;k!==start;k=pfPrev[k])path.push(k);
  return path.reverse();
}
function faceTo(s,x,y){const dx=x-s.x,dy=y-s.y;if(Math.abs(dx)>Math.abs(dy))s.dir=dx>0?'right':'left';else if(dy)s.dir=dy>0?'down':'up'}
// Ein Tick Gehen: s.acc sammelt Spielminuten; ein Feld ist abgelaufen, wenn dessen Kosten (Kostenkarte zur aktuellen Minute) gesammelt sind. true = angekommen.
function followPath(s){
  if(!s.path.length)return true;
  s.acc+=1;
  while(s.path.length){
    const n=s.path[0];let c=cost(n,clockMinute(),s);if(!(c<Infinity))c=CFG.zeit.minBoden;   // inzwischen versperrte Felder wie bisher durchqueren
    if(s.acc<c-1e-9)return false;
    s.acc-=c;faceTo(s,n%W,(n/W)|0);s.x=n%W;s.y=(n/W)|0;s.path.shift();
    if(!dry&&trittW[n]<255)trittW[n]++;   // Trittzähler (Paket 2): nur der echte Schritt, nie der Trockenlauf
  }
  s.acc=0;return true;
}
function goTo(s,x,y){const p=findPath(s.x,s.y,x,y,s);s.cur=null;s.acc=0;
  if(p&&p.length){s.path=p;s.state='walk'}else{s.path=[];s.state='rest';s.wait=G.min+30}}
const LINE=[[49,49],[50,49],[51,49],[52,49]],PLAYER_LINE=[50,51];
const lineSpot=s=>LINE[staff.indexOf(s)];
const near=(s,p)=>Math.abs(s.x-p[0])+Math.abs(s.y-p[1])<=1;
const atHome=s=>near(s,lineSpot(s));   // in der Reihe am Hof (Mittagspause, Warten auf eine feste Spanne am Hof)
const goHome=s=>goTo(s,...lineSpot(s));
// Bereitschaftsplatz, wenn nichts passt: in der Reihe am Hof (Hoftag vor Mittag, Mittagspause, feste Spanne steht noch an), sonst das eigene Zuhause
function standby(s){const hof=G.dayType!=='wald'&&G.min<G.times.mittag;return hof||G.phase==='mittag'||s.agenda.some(a=>!a.done)?lineSpot(s):s.home}
function arrive(s){if(s.cur){s.state='work';faceTo(s,s.cur.x,s.cur.y)}else{s.state='rest';s.dir='down'}}
// ---------------------------------------------------------------- Ein Tick je Person
function startLeg(s,j){const {path,...leg}=j;
  if(leg.kind==='item')G.claimed.add(leg.task.id+':'+leg.item);
  s.cur=leg;s.path=path;s.acc=0;s.state=path.length?'walk':'work';if(!path.length)faceTo(s,leg.x,leg.y)}
function endLeg(s){const c=s.cur;if(c&&c.kind==='item'&&!dry)G.claimed.delete(c.task.id+':'+c.item);s.cur=null;s.state='rest'}
function startCommit(s,c){
  if(c.type==='markt'){c.done=true;applyJob(s,{kind:'markt',task:c.task});return}
  const miss=()=>{c.done=true;if(!s.failed.includes(c.task))s.failed.push(c.task);decide(s)};
  if(G.min>=c.end)return miss();   // zu spät dran (z. B. abends nicht mehr rechtzeitig daheim): die Abendarbeit fällt aus
  const p=findPath(s.x,s.y,c.x,c.y,s);if(!p)return miss();
  s.cur={kind:c.type,task:c.task,x:c.x,y:c.y,left:c.dur,ag:c};s.path=p;s.acc=0;s.state=p.length?'walk':'work';if(!p.length)faceTo(s,c.x,c.y);
}
// s ist frei (daheim oder mit erledigtem Auftrag): was kommt als Nächstes? Feste Spanne, Arbeit im Fenster bis zur nächsten Heimkehr, sonst heim und warten.
function decide(s){
  const T=G.times,now=G.min;
  if(G.phase==='mittag'){if(atHome(s))s.wait=T.wiederAb;else goHome(s);return}
  const c=s.agenda.find(a=>!a.done);
  if(c&&now>=c.go){startCommit(s,c);return}
  const hof=G.dayType!=='wald'&&now<T.mittag;
  let b=c?c.go:T.ende;if(hof)b=Math.min(b,T.mittag);
  const j=pickWork(s,b);
  if(j){startLeg(s,j);return}
  const spot=standby(s);
  if(!near(s,spot)){goTo(s,...spot);return}
  s.wait=Math.min(c?c.go:Infinity,hof?T.mittag:Infinity,now+60);   // später neu schauen (neue Haufen, nächste Spanne)
}
function workTick(s){
  const c=s.cur;if(!c){s.state='rest';return}
  const t=c.task;
  if(c.kind==='single'){
    if(!G.tasks.includes(t)||!validTask(t)){if(!dry&&G.tasks.includes(t))removeTask(t);endLeg(s);return}
    t.done+=c.rate;
    if(t.done>=normOf(singleCost(t))-1e-6){applyJob(s,c);endLeg(s)}
    else if(G.min+1>=c.stop)endLeg(s);   // Zeit um, Rückweg: der Fortschritt bleibt am Objekt
  } else if(c.kind==='gebiet'){gebietTick(s,c)
  } else if(c.kind==='item'||c.kind==='routine'){
    if(c.kind==='item'&&!G.tasks.includes(t)){endLeg(s);return}
    c.left-=c.rate;if(c.left<=1e-6){applyJob(s,c);endLeg(s)}
  } else {c.left-=1;if(c.left<=0){applyJob(s,c);c.ag.done=true;endLeg(s)}}
}
// Weg zeigen (Demo B2b, Paket 5; Gate-Auflagen 19, 20): In der Werkwoche (G.phase 'tag') spricht der Verwalter eine Person an: „Weg zeigen“ – sie folgt ihm (s.folgt), bis er sie entlässt (gleiche Option) oder der Tag es beendet:
// Heimgehen [T], Hoftag-Mittag, Abend. Bewegung nur in personTick (folgenTick, Ticks; sie geht nach ihrer eigenen Kostenkarte), ihr Plan ruht; jedes Ende ist replanPerson (Agenda neu ab Ort und Uhrzeit wie beim Umplanen).
// Nicht startbar während einer festen Spanne (s.cur.ag). Die Felder ihrer Route landen mit Pufferbit 8 im Wochenpuffer (knNote) und heben ihre Kenntnis erst ab der nächsten Woche stark (knWeek, CFG.kenntnis.gezeigt). Weltzustand: s.folgt (staff im Fingerabdruck), im Trockenlauf DRY_FIELDS.
const folgeKann=s=>G.phase==='tag'&&s.available&&!s.away&&!s.folgt&&!(s.cur&&s.cur.ag);
function folgenStart(s){
  const c=s.cur;if(c&&c.kind==='item')G.claimed.delete(c.task.id+':'+c.item);   // wie replanPerson: laufender Auftrag endet (Objekt: Fortschritt bleibt, Sammelposten: Claim frei, Gebiet beginnt später neu)
  s.cur=null;s.path=[];s.acc=0;s.state='rest';s.wait=0;s.folgt=true}
function folgeEnde(s){if(s.folgt)withWayField(()=>replanPerson(s))}
function folgeAlle(){for(const s of staff)folgeEnde(s)}
// Ein Tick: weiter als folgAbstand (Manhattan) vom Verwalter (P.x/P.y, die Schrittstelle): Weg zu seinem Feld suchen (neu nur, wenn er sich vom Wegende entfernt hat) und gehen; sonst stehen und ihn ansehen
function folgenTick(s){
  if(Math.abs(s.x-P.x)+Math.abs(s.y-P.y)<=CFG.kenntnis.folgAbstand){s.path=[];s.acc=0;s.state='rest';faceTo(s,P.x,P.y);return}
  const e=s.path.length?s.path[s.path.length-1]:-1;
  if(e<0||dist(e%W,(e/W)|0,P.x,P.y)>1){const p=findPath(s.x,s.y,P.x,P.y,s);if(!p||!p.length){s.path=[];s.acc=0;s.state='rest';return}s.path=p}
  s.state='walk';followPath(s)}
function personTick(s){
  if(!s.available)return;
  if(s.away){if(G.min>=s.awayUntil)marketReturn();return}
  if(s.folgt){folgenTick(s);if(!dry)knNote(s);return}   // Weg zeigen: nur hier (Tick-Hoheit) folgt die Person dem Verwalter
  if(s.state==='walk'){if(followPath(s))arrive(s)}
  else if(s.state==='work')workTick(s);
  if(!dry)knNote(s);   // Ortskenntnis: nur Wochenpuffer, nie im Trockenlauf
  if(s.state==='rest'&&G.phase!=='abend'&&G.min>=s.wait)withWayField(()=>decide(s));
}
// ---------------------------------------------------------------- Der Tag
// Wochenablauf: Sonntag (Inspektion, G.phase 'sonntag') → Sonntagabend (Planen, 'plan') → Werkwoche (Appell, Tag, Mittag, Abend) → Nacht (weekStep) → nächste Woche.
// Am Sonntag steht die Uhr: sie rückt nur durch Handlungen des Spielers vor (Gehen nach der Kostenkarte, Untersuchen, Reden … – sundayAdvance); mit dem Sonnenuntergang endet
// der Sonntag (endSunday: Heimweg automatisch, Montag ohne Kraft). Das Personal tickt nur in der Werkwoche; am Sonntag steht es an seinem Sonntagsort (sonntagsorte, nur Position) und erzählt im Gespräch.
// Sonntagsbeginn (reine Funktion): Sonnenaufgang, aber frühestens schlafMin nach dem Einschlafen (sleepMin = Minute seit Mitternacht des Werktags, auch über 1440); ohne Schlaf (Woche 1) Sonnenaufgang
function sundayStart(auf,sleepMin){return sleepMin==null?auf:Math.max(auf,sleepMin+CFG.zeit.schlafMin-1440)}
// Einzige Stelle, die den Schlafzustand setzt (Weltzustand): alle Wege in die Nacht laufen über nextWeek; startWeek liest ihn und setzt ihn zurück
function setSleep(min,pos){G.sleepMin=min;G.sleepPos=pos}
// Verfügbarkeit einer Person in Woche w (eine Quelle für startWeek und den Trockenlauf „nächste Woche“): ab Woche s.from und nicht zu schwach
const staffAvail=(s,w,weak)=>w>=s.from&&!weak;
function startWeek(first,quiet){
  const sl=G.sleepMin,sp=G.sleepPos;setSleep(null,null);
  G.state='play';G.phase='sonntag';G.times=dayTimes();G.min=sundayStart(G.times.start,sl);G.frozen=null;G.claimed=new Set();
  G.kraft=CFG.kraft;G.enjoyed=false;G.coopClosed=false;
  G.hensFoodOk=!G.hensInside&&G.grazedOk;G.hayShort=false;G.marketOut=false;G.goodMeal=false;G.ateWithStaff=false;G.cooked=false;
  G.tasks=G.tasks.filter(validTask);ensureAutoTasks();
  knWiss.length=0;knNeu.clear();G.zSag={};   // Wissensliste und „ist neu“ gelten für die Woche; Zeichen dürfen wieder gemeldet werden
  staff.forEach(s=>{s.weak=!!s.weakNext;s.weakNext=false;s.away=false;s.available=staffAvail(s,G.week,s.weak);s.cur=null;s.path=[];s.state='rest';s.failed=[];s.agenda=[];s.wait=0;s.acc=0;s.skip=new Set();s.folgt=false;
    s.x=s.home[0];s.y=s.home[1];s.px=s.x;s.py=s.y;s.dir='down'});
  spawnCritters();computeLight();tickAcc=0;
  if(sp){P.x=P.nx=sp[0];P.y=P.ny=sp[1];P.px=P.x;P.py=P.y;P.dir='down';P.moving=false}   // der Verwalter wacht dort auf, wo er eingeschlafen ist (Hof oder unterwegs)
  sonntagsorte();   // Sonntagsorte: nur Position (Gate-Auflage 11), nach dem Verwalter, damit niemand auf ihm steht
  if(quiet)return;
  if(!sp){P.x=P.nx=PLAYER_LINE[0];P.y=P.ny=PLAYER_LINE[1];P.px=P.x;P.py=P.y;P.dir='up';P.moving=false}   // Woche 1: Ankunft auf dem Hof
  showMorning(first);
}
// Sonntag: eine Handlung kostet m Spielminuten. Ab Sonnenuntergang ist der Sonntag vorbei (öffnet eine Handlung noch eine Karte, endet er nach dem Schließen).
function sundayAdvance(m){
  if(G.phase!=='sonntag'||!(m>0))return;
  G.min+=m;
  if(G.min<G.times.ende)return;
  G.min=G.times.ende;
  if(G.state==='card')G.afterCard=()=>endSunday(true);else endSunday(true);
}
// Ende des Sonntags: forced = Dämmerung (Heimweg automatisch, Montag ohne Kraft), sonst freiwillig heimgegangen (arrive = Ankunftsminute; nach Sonnenuntergang ⇒ Montag ohne Kraft).
// Danach Sonntagabend: nur der Planungsbildschirm (das Notizbuch), Planen kostet nichts, die Uhr steht, keine Bewegung.
function endSunday(forced,quiet,arrive){
  if(G.phase!=='sonntag')return;
  if(P.mowTask)toggleMow();
  const late=arrive!==undefined&&arrive>G.times.ende;
  G.phase='plan';G.min=Math.max(arrive===undefined?G.min:arrive,G.times.ende);G.exhausted=!!forced||late;
  P.x=P.nx=HOF[0];P.y=P.ny=HOF[1];P.px=P.x;P.py=P.y;P.dir='down';P.moving=false;
  closeMenu();
  if(quiet)return;
  openBook();
}
// Heimweg des Verwalters: kürzeste Route vom logischen Feld P.x/P.y zum Hof nach der Kostenkarte zur jetzigen Uhrzeit, × (1 + heimAufschlag); arrive = Ankunftsminute
function homeTrip(){
  const m=clockMinute(),route=wayBackMinutes(P.x,P.y,m,P),dur=route*(1+CFG.zeit.heimAufschlag);
  return{route,dur,arrive:m+Math.ceil(dur)}}
// Montag: Planung abgeschlossen, die Werkwoche beginnt mit dem kurzen Appell („Los!“) auf dem Hof. quiet: sofort Tick 0 (Debug).
function startWorkday(quiet){
  if(G.phase!=='plan')return;
  G.phase='appell';G.state='play';G.kraft=G.exhausted?0:G.kraft;G.exhausted=false;G.enjoyed=false;G.min=G.times.start;G.frozen=null;G.claimed=new Set();
  G.goodMeal=!!G.bonusNext;G.bonusNext=false;   // gute Küche vom Waldtag-Abend wirkt bis zum Mittag (noonOutside)
  G.tasks=G.tasks.filter(validTask);ensureAutoTasks();
  staff.forEach((s,k)=>{s.x=LINE[k][0];s.y=LINE[k][1];s.px=s.x;s.py=s.y;s.dir='down';s.cur=null;s.path=[];s.state='rest';s.agenda=[];s.wait=0;s.acc=0;s.skip=new Set();s.failed=[];s.folgt=false});
  tickAcc=0;

// Tick 0: die Leute stehen in der Reihe, der Plan ist verteilt (Appell vorbei)
function beginDay(){
  G.phase='tag';G.min=G.times.start;G.claimed=new Set();tickAcc=0;freezePlans();
  withWayField(()=>{for(const s of staff){s.agenda=s.available?buildAgenda(s,false,G.min):[];s.wait=0}});
}
function marketReturn(){
  if(!G.marketOut)return;G.marketOut=false;const l=staff.find(s=>s.away)||S('liese');l.away=false;l.x=ESTATE.gx;l.y=H-2;l.px=l.x;l.py=l.y;l.cur=null;l.path=[];l.acc=0;l.state='rest';l.wait=0;

}
function lunchStart(){

// Ereignisse an den festen Zeitpunkten (nach dem Tick, G.min ist schon die nächste Minute)
function dayEvents(){

  if(G.phase==='tag'){
    if(G.min>=T.ende)folgeAlle();   // Abend: Weg zeigen endet
    if(G.dayType!=='wald'&&G.min===T.mittag)lunchStart();
    else if(G.dayType==='wald'&&G.min===T.mittag)noonOutside();
    else if(G.min>=T.ende&&(G.min>=T.spaet||staff.every(s=>!s.available||(!s.away&&s.state==='rest'))))endOfDay();   // Abendgrenze und alle daheim, sonst harte Spätgrenze
  } else if(G.phase==='mittag'&&G.min>=T.wiederAb)lunchEnd();

// Ein Tick: jede Person für die Minute G.min, dann Uhr weiter. false = die Uhr steht (am Abend an der Schlafgrenze; das Einschlafen löst die Hauptschleife aus, nicht der Tick).
function dayTick(){

}
function advanceDay(dt){
  if(G.phase==='sonntag'||G.phase==='plan'||G.phase==='appell')return;   // Sonntag/Planung: die Uhr steht; Appell: Tick 0 steht noch aus
  tickAcc+=dt*60/CFG.zeit.stundeSek;

}
// Kern von Heimgehen [T] (früher „Tag beenden“): dieselben Ticks wie im Spiel, ohne Darstellung, bis der Abend beginnt (Ergebnis = sichtbares Durchspielen)

  tickAcc=0;

// Heimgehen [T] in jeder Phase: Fenster mit Dauer, Aufschlag und Ankunftszeit (die Ankunft bucht die Uhr), dann playerHome
function homeAsk(){
  const ph=G.phase,z=CFG.zeit;

  if(!['sonntag','appell','tag','mittag','abend'].includes(ph)){toast('Jetzt geht es nicht heim.');return}
  const t=homeTrip(),pct=Math.round(z.heimAufschlag*100),far=t.arrive>z.schlafGrenze;
  let txt=`Heimgehen? Der kürzeste Weg zum Hof dauert ${Math.round(t.route)} Min, dazu ${pct} % für den sicheren Weg: ${Math.round(t.dur)} Min. Du kommst um ${hm(t.arrive)} an.`;
  if(ph==='sonntag')txt+=t.arrive>G.times.ende?' Das ist nach Sonnenuntergang – am Montag fehlt dir die Kraft.':' Danach planst du die Werkwoche.';
  else if(far)txt+=` Das ist nach ${hm(z.schlafGrenze)} Uhr: Du schläfst unterwegs ein und wachst dort auf.`;
  else if(ph==='abend')txt+=' Danach gehst du schlafen; der Sonntag beginnt frühestens 8 Stunden später.';
  else txt+=' Der Rest des Tages wird bis zum Abend ohne Zuschauen durchgerechnet; dann bist du daheim.';

// Heimgehen ausführen. Sonntag: heim, Sonntagabend. Werkwoche tagsüber: Kern wie früher „Tag beenden“ (finishDayTicks), dann Abend-Ticks bis zur Ankunft, der Verwalter steht am Hof.
// Abend: dazu schlafen. Ankunft nach der Schlafgrenze: Einschlafen an der Grenze am Ausgangsort (kein Versetzen an den Hof).
function playerHome(quiet){
  const t=homeTrip(),z=CFG.zeit,ph=G.phase;
  if(ph==='sonntag'){endSunday(false,quiet,t.arrive);return}
  if(ph==='plan')return;
  finishDayTicks();
  const ziel=Math.min(t.arrive,z.schlafGrenze);
  ffMode=true;try{for(let n=0;G.phase==='abend'&&G.min<ziel&&n<4000;n++)if(!dayTick())break}finally{ffMode=false}
  tickAcc=0;
  if(t.arrive>z.schlafGrenze){fallAsleepOutside(quiet);return}
  P.x=P.nx=HOF[0];P.y=P.ny=HOF[1];P.px=P.x;P.py=P.y;P.dir='down';P.moving=false;
  if(ph==='abend')nextWeek(quiet,G.min,HOF.slice());

// Schlafgrenze erreicht (Hauptschleife) oder der Heimweg reicht nicht mehr bis dahin: der Verwalter schläft dort ein, wo er steht
function fallAsleepOutside(quiet){
  if(!quiet)toast(`Es ist tief in der Nacht (${hm(CFG.zeit.schlafGrenze)} Uhr): Du schläfst auf der Stelle ein.`,5000);

// Sonntagabend: das Notizbuch ist der Planungsbildschirm; Schließen (Esc/N) oder T fragt, ob die Planung abgeschlossen ist (Esc = nein: zurück zum Bildschirm)
function planFinishAsk(){
  closeBook();

  G.afterCard=()=>{if(G.phase==='plan')openBook()};
}
// Schlafen führt zum jeweils nächsten Abschnitt: Sonntag → Sonntagabend → Werkwoche (Appell); in der Werkwoche zur Nacht (Wochenschritt) und zum nächsten Sonntag
function sleep(){
  if(G.phase==='sonntag'){endSunday(false);return}

// Rest der Werkwoche, Nacht (weekStep) und der Sonntag der nächsten Woche; nach der letzten Woche kehrt der Baron zurück.
// sleepMin/sleepPos = Einschlafzeit (Minute seit Mitternacht des Werktags) und -ort; ohne Angabe (Gesindehaus, dbgDays) schläft er jetzt (tagsüber: am Abendbeginn) auf dem Hof.

function dbgDays(k){   // Debug: k ganze Wochen überspringen (Sonntag und Planung ohne Zutun, Werkwoche mit dem Zugeteilten)
  for(let n=0;n<k;n++){

// Nur Darstellung (kein Weltzustand): Laufanimation, Zwischenposition zwischen zwei Feldern, Hackgeräusch
function updateStaff(dt){
  for(const s of staff){if(!s.available||s.away)continue;s.anim+=dt;
    let px=s.x,py=s.y;
    if(s.state==='walk'&&s.path.length){const n=s.path[0],nx=n%W,ny=(n/W)|0;let c=cost(n,clockMinute(),s);if(!(c<Infinity))c=CFG.zeit.minBoden;
      const f=clamp((s.acc+tickAcc)/c,0,1);px=s.x+(nx-s.x)*f;py=s.y+(ny-s.y)*f}
    s.px=px;s.py=py;

// ---------------------------------------------------------------- Zeitleiste für die Tafel: Trockenlauf (Anzeige = Ausführung)
// planAll lässt dieselben Funktionen laufen wie der Tag (personTick/decide/pickWork/followPath/lunchEnd, Ticks zu je einer Minute) auf einem Wegwerfzustand:
// Personen stehen in der Reihe, Fortschritt (t.done), Posten, Claims und Agenden sind virtuell, applyJob wirkt nicht auf die Welt (dryApply), danach wird alles
// zurückgesetzt. Bei unveränderter Welt ist die Vorhersage damit das Ergebnis des Tages. Planung ab `from`: T.start (ganzer Tag, nach dem Appell oder abends als
// „morgen früh“) bzw. T.wiederAb (Hoftag, Nachmittag). Das Ergebnis wird zwischengespeichert, solange sich Zuteilung, Tageszustand und Welt-Stand nicht ändern.
// Ergebnis: plans[id] = [{from,to,kind:'fest'|'work'|'std'|'heim'|'folgt'|'pause'|'frei',task,label,walk?}], finish: Aufgaben-ID → {end: Minute, left: Restarbeit in Normminuten},
// home[id] = voraussichtliche Heimkehr, warn = Warnungen (Abendarbeit fällt aus, Heimkehr nach Einbruch der Dunkelheit)
const mealGood=()=>cooksToday(true)&&defaultMeal().filter(k=>G.food[k]>0).length>=2;   // gute Küche: wer kocht, hat mindestens zwei Zutaten
// Der Kartenstand (kartWo/kartKl) gehört bewusst NICHT in den Schlüssel: „ca.“/„?“ liest ihn beim Rendern (segUnsure) aus Route und Ziel im Ergebnis, das Ergebnis selbst bleibt vom Kartenwissen unabhängig.
function planKey(from,jetzt){
  const rp=jetzt&&book.replan?book.replan+':'+book.replanSig+':'+staffSig(S(book.replan)):'';
  return [from,jetzt,rp,JSON.stringify(G.frozen),G.week,G.phase,G.min,G.dayType,G.times.start,G.marketOut,G.cooked,G.goodMeal,G.bonusNext,JSON.stringify(G.food),
    staff.map(s=>s.available+':'+s.weakNext+':'+!!s.folgt).join(),staff.some(s=>s.folgt)?P.x+','+P.y:'',   // Weg zeigen: wer folgt und wohin (der Verwalter steht im Trockenlauf still)
    G.tasks.map(t=>[t.id,t.type,(t.crew||[]).join('+'),t.who,t.done,t.items?t.items.length:'',t.doneWeek].join('/')).join(';'),
    G.marken.join(),G.tasks.filter(t=>TASKS[t.type].gebiet).map(beerenSig).join()].join('|')}   // Wegmarken und je Gebiet die Beeren im Radius (Auflage 17): beides ändert Finden und Ertrag
// jetzt (nur Werkwoche tagsüber): „ab jetzt“ vom Ist-Zustand aller Personen (Tafel in der Werkwoche, Umplanen), sonst Tagesbeginn bzw. Nachmittag wie bisher
function planAll(from,live,fresh,jetzt){
  jetzt=!!jetzt&&(G.phase==='tag'||G.phase==='mittag');
  from=jetzt?G.min:Math.max(from,G.times.start);const key=planKey(from,jetzt);
  if(!fresh&&planCache&&planCache.key===key)return planCache.res;
  const res=withWayField(()=>dryRun(from,jetzt));planCache={key,res};return res}
// Wirkung eines Auftrags im Trockenlauf: nur Merkzeichen (Posten erledigt, Aufwand erreicht), die Welt bleibt unberührt
function dryApply(s,j){
  switch(j.kind){
    case 'item':dry.done.add(j.task.id+':'+j.item);break;
    case 'beere':dry.done.add('b'+j.item);break;
    case 'gebiet':dry.done.add(j.task.id+':*');break;
    case 'single':j.task.done=normOf(singleCost(j.task));break;
    case 'routine':s.skip.add('s:'+j.name+j.x+','+j.y);break;
    case 'markt':s.away=true;s.awayUntil=G.times.mittag;dry.markt.set(s.id,j.task);break;
    case 'fuettern':case 'einsperren':j.task.doneWeek=G.week;break;   // wie im Spiel (buildAgenda nach der Mittagspause plant sie nicht noch einmal); dryRun setzt es zurück
    case 'kochen':dry.cooked=true;if(G.dayType!=='wald')G.goodMeal=mealGood();j.task.doneWeek=G.week;break;   // Waldtag: gute Küche wirkt erst am nächsten Morgen (bonusNext)
  }
}
const DRY_FIELDS=['x','y','dir','state','cur','path','acc','wait','away','awayUntil','skip','failed','agenda','available','weak','folgt'];
// Betriebsart „ab jetzt“ (jetzt): alle Personen vom Ist-Zustand (Tiefenkopie von cur/path/agenda/skip/failed, G.claimed und G.frozen als Kopie, G.phase bleibt tag/mittag);
// ist ein Umplanen offen und hat sich der Plan der Person geändert, bekommt nur sie replanPerson – genau das, was beim Schließen der Tafel wirklich geschieht.
function dryRun(from,jetzt){
  const keep={min:G.min,phase:G.phase,claimed:G.claimed,frozen:G.frozen,week:G.week,times:G.times,goodMeal:G.goodMeal,hasBacklog:'gardenBacklog' in G,backlog:G.gardenBacklog,done:G.tasks.map(t=>t.done),doneWeek:G.tasks.map(t=>t.doneWeek)};
  const tomorrow=!jetzt&&from===G.times.start&&(G.phase==='abend'||G.phase==='mittag'||(G.phase==='tag'&&G.min>G.times.start));   // Tafel nach dem Appell: gilt ab morgen früh
  if(tomorrow){G.week++;G.times=dayTimes();from=G.times.start}   // Sonnenstand und diese Woche Erledigtes (doneWeek) wie in der nächsten Werkwoche
  const T=G.times,hof=G.dayType!=='wald',plans={},finish=new Map(),home={},warn=[],lastWork=new Map(),failed=new Set();
  const saved=staff.map(s=>DRY_FIELDS.map(f=>[f,Object.prototype.hasOwnProperty.call(s,f),s[f]]));
  if(tomorrow)for(const s of staff){s.weak=!!s.weakNext;s.available=staffAvail(s,G.week,s.weak)}   // „morgen früh“ = nächste Woche: wer dann dazukommt (Jost) oder zu schwach ist, wie es startWeek setzt (wird unten zurückgesetzt)
  const live=staff.filter(s=>s.available),rec=new Map(live.map(s=>[s.id,{segs:[],act:null,seg:null}]));
  const harvest=last=>{for(const s of live)for(const a of s.agenda){
    if(a.done&&!s.failed.includes(a.task))finish.set(a.task.id,{end:a.end,left:0});
    else if(a.done||last)failed.add(a.task.id+'|'+s.name)}};
  const close=(r,m)=>{const g=r.seg;if(!g)return;g.to=m;r.seg=null;if(g.to<=g.from)return;
    const p=r.segs[r.segs.length-1];
    if(p&&p.task===g.task&&p.kind===g.kind&&(g.kind==='work'||g.kind==='std')&&g.from-p.to<=1){p.to=g.to;p.walk+=g.walk;if(g.rt)p.rt=(p.rt||[]).concat(g.rt);if(g.zt)p.zt=(p.zt||[]).concat(g.zt)}else r.segs.push(g)};
  const observe=(s,r,m)=>{
    const c=s.cur,act=s.away?'markt':s.folgt?'folgt':c||(s.state==='walk'?'heim':null);
    if(act!==r.act){close(r,m);r.act=act;
      if(act==='markt')r.seg={from:m,kind:'fest',task:dry.markt.get(s.id)||null,label:'unterwegs zum Markt',walk:0};
      else if(act==='heim')r.seg={from:m,kind:'heim',task:null,label:'Heimweg',walk:0};
      else if(act==='folgt')r.seg={from:m,kind:'folgt',task:null,label:'geht mit dem Verwalter',walk:0};
      else if(act&&act.ag)r.seg={from:m,kind:'fest',task:act.task,label:taskTitle(act.task),walk:0};
      else if(act&&act.kind==='routine')r.seg={from:m,kind:'std',task:null,label:stdLabel(s),walk:0};
      else if(act)r.seg={from:m,kind:'work',task:act.task,label:taskTitle(act.task),walk:0}}
    if(r.seg&&r.seg.kind!=='heim'&&r.seg.kind!=='folgt'&&s.state==='walk'&&!s.away)r.seg.walk++;
    if(r.seg&&!s.away&&r.seg.kind!=='folgt'){   // Route (gegangene Felder) und Ziel (Arbeitsort) je Segment für „ca./?“ der Tafel: nur Feldnummern, kein Weltzugriff
      if(s.state==='walk'){const q=r.seg.rt||(r.seg.rt=[]),k=idx(Math.round(s.x),Math.round(s.y));if(q[q.length-1]!==k)q.push(k)}
      else if(s.state==='work'&&s.cur&&s.cur.x!==undefined){const q=r.seg.zt||(r.seg.zt=[]),k=idx(s.cur.x,s.cur.y);if(q[q.length-1]!==k)q.push(k)}}};
  try{
    dry={done:new Set(),cooked:false,markt:new Map()};
    if(jetzt){
      G.frozen=Object.fromEntries(Object.entries(keep.frozen||{}).map(([k,v])=>[k,v.slice()]));G.claimed=new Set(keep.claimed);
      for(const s of live){const orig=s.agenda,ag=orig.map(a=>({...a})),c=s.cur;
        s.agenda=ag;s.cur=c?(c.ag?{...c,ag:ag[orig.indexOf(c.ag)]}:{...c}):null;s.path=s.path.slice();s.skip=new Set(s.skip);s.failed=s.failed.slice()}
      const rp=book.replan&&S(book.replan);
      if(rp&&rp.available&&staffSig(rp)!==book.replanSig)replanPerson(rp);
    } else {
      G.frozen=null;G.claimed=new Set();G.phase='tag';G.min=from;
      G.goodMeal=from>T.start?(G.cooked?keep.goodMeal:mealGood()):(tomorrow||keep.phase==='sonntag'||keep.phase==='plan'?!!G.bonusNext:keep.goodMeal);   // Tagesbeginn: gute Küche vom Waldtag-Abend (bonusNext)
      for(const s of live){const [x,y]=lineSpot(s);s.x=x;s.y=y;s.dir='down';s.state='rest';s.cur=null;s.path=[];s.acc=0;s.wait=0;s.away=false;s.folgt=false;s.skip=new Set();s.failed=[];s.agenda=buildAgenda(s,false,from)}
    }
    for(let n=0;n<2500;n++){
      if(G.phase==='abend'&&(G.min>=T.dunkel||live.every(s=>s.away||s.state==='rest')))break;
      const m=G.min;
      for(const s of live){
        if(s.away&&m>=s.awayUntil){s.away=false;s.x=ESTATE.gx;s.y=H-2;s.cur=null;s.path=[];s.acc=0;s.state='rest';s.wait=0}   // wie marketReturn, ohne Wirkung auf die Welt
        const c=s.cur;if(s.state==='work'&&c&&c.task&&(c.kind==='single'||c.kind==='item'||c.kind==='gebiet'))lastWork.set(c.task.id,m+1);
        personTick(s);observe(s,rec.get(s.id),m)}
      G.min++;
      if(G.phase==='tag'){
        if(G.min>=T.ende)folgeAlle();   // wie dayEvents: Weg zeigen endet am Abend
        if(hof&&G.min===T.mittag){G.phase='mittag';folgeAlle();if(!G.cooked&&!dry.cooked)G.goodMeal=false}   // wie lunchStart: wer nicht gekocht hat, bringt kalte Brotzeit
        else if(!hof&&G.min===T.mittag)G.goodMeal=false;   // wie noonOutside: die Brotzeit draußen beendet den Bonus vom Vorabend
        else if(G.min>=T.ende&&(G.min>=T.spaet||live.every(s=>s.away||s.state==='rest'))){   // wie endOfDay
          harvest(true);G.phase='abend';G.frozen=null;
          for(const s of live){if(s.away)continue;if(s.cur)endLeg(s);goTo(s,s.home[0],s.home[1]);if(s.state==='rest')s.wait=Infinity}}
      } else if(G.phase==='mittag'&&G.min>=T.wiederAb){harvest(false);lunchEnd()}
    }
    const endMin=G.min;
    for(const s of live){const r=rec.get(s.id);close(r,endMin);r.act=null}
    for(const s of live)if(!s.away&&s.state==='walk')warn.push(`${s.name} kommt voraussichtlich erst nach Einbruch der Dunkelheit heim – die Abendarbeit fällt aus.`);
    for(const k of failed){const [id,who]=k.split('|'),t=G.tasks.find(t=>t.id==id);if(t)warn.push(`${taskTitle(t)}: ${who} schafft das heute nicht rechtzeitig.`)}
    for(const t of G.tasks){const d=TASKS[t.type];if(d.fixed||!lastWork.has(t.id))continue;
      let left=0;
      if(d.group){for(const it of taskItems(t))if(!dry.done.has(t.id+':'+it))left+=normOf(itemCost(t,it))}
      else if(d.gebiet)left=dry.done.has(t.id+':*')?0:normOf(singleCost(t));
      else left=Math.max(0,normOf(singleCost(t))-t.done);
      finish.set(t.id,{end:lastWork.get(t.id),left})}
    for(const s of staff){
      if(!s.available){plans[s.id]=[{from,to:T.ende,kind:'frei',task:null,label:s.weak?'zu schwach – hat nichts gegessen':`ab Woche ${s.from}`}];continue}
      const segs=rec.get(s.id).segs.slice();
      if(hof&&from<=T.mittag)segs.push({from:T.mittag,to:T.wiederAb,kind:'pause',task:null,label:'Mittagspause',walk:0});
      segs.sort((a,b)=>a.from-b.from);plans[s.id]=segs;home[s.id]=segs.length?segs[segs.length-1].to:null}
    return{plans,finish,home,warn,ende:T.ende,week:G.week,avail:Object.fromEntries(staff.map(s=>[s.id,s.available])),weak:Object.fromEntries(staff.map(s=>[s.id,s.weak]))}
  } finally {

    staff.forEach((s,k)=>{for(const [f,had,v] of saved[k]){if(had)s[f]=v;else delete s[f]}});
  }
}

function cooksToday(live){const c=cookOf();return !!(c&&c.available&&staffTasks(c,live).some(t=>t.type==='kochen'))}
function planWarnings(live){const w=[];
  const ein=G.tasks.find(t=>t.type==='einsperren'),fu=G.tasks.find(t=>t.type==='fuettern');
  if(ein&&visibleTask(ein)){if(ein.who==='none')w.push('Die Hühner bleiben nachts draußen – Eier, aber Fuchsgefahr.');else{const s=S(effectiveWho(ein));if(!s||!s.available)w.push('Niemand sperrt die Hühner abends ein.')}}
  if(fu&&visibleTask(fu)){const s=effectiveWho(fu)==='none'?null:S(effectiveWho(fu));if(!s||!s.available)w.push('Niemand füttert die Hühner.')}
  const ko=G.tasks.find(t=>t.type==='kochen');

function facing(){const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[P.dir];return[P.x+d[0],P.y+d[1]]}
function subjectAt(x,y){
  if(!inb(x,y))return null;const i=idx(x,y);
  const npc=staff.find(s=>s.available&&!s.away&&Math.round(s.x)===x&&Math.round(s.y)===y);if(npc)return{kind:'npc',s:npc};
  if(bmap[i]>=0)return{kind:'bau',b:buildings[bmap[i]]};
  const t=treeAt(i);if(t)return{kind:'baum',t};
  if(lyingAt[i]>=0)return{kind:'stamm',l:logById.get(lyingAt[i])};
  if(stumpAt[i])return{kind:'stumpf'};
  if(feat[i])return{kind:'feat',f:feat[i]};
  if(fkind[i])return{kind:'zaun'};
  if(track[i])return{kind:'spur',tr:track[i]};
  if(ground[i]===G_WATER||ground[i]===G_FORD||ground[i]===G_BRIDGE)return{kind:'wasser'};
  if(grass[i]>=1&&light[i]>=0.55&&ground[i]!==G_PATH)return{kind:'gras'};
  if(deco[i])return{kind:'deko',d:deco[i]};
  return{kind:'boden'};
}

function mowArea(x,y,max){const out=[],seen=new Set([idx(x,y)]),q=[[x,y]];
  while(q.length&&out.length<max){const [cx,cy]=q.shift();const i=idx(cx,cy);if(grass[i]>=1&&light[i]>=0.55&&ground[i]!==G_PATH&&!fkind[i]){out.push(i);
    for(const [dx,dy] of DIRS){const nx=cx+dx,ny=cy+dy;if(inb(nx,ny)&&!seen.has(idx(nx,ny))){seen.add(idx(nx,ny));q.push([nx,ny])}}}}
  return out}
function toggleMow(){

}
function addMowTile(i){if(!P.mowTask||grass[i]<1||ground[i]===G_PATH||fkind[i])return;const t=groupTask('maehen');if(t.items.includes(i))return;t.items.push(i);SFX.peg()}

  else line='„Gleich geht\'s los.“';

  if(w&&w.list){showCard(erzaehlen(s,w.list,line),'[Leertaste] weiter');return}

}

  else if(n.fenceDug>2)h='Am Zaun wird gegraben, Herr Verwalter.';

  else if(G.barnWood<1&&st.fDamaged+st.fBroken>0)h='Für den Zaun ist kein Holz mehr in der Scheune.';

  else if(G.coldMeal&&G.week>1&&!(G.mealHungry&&G.mealHungry.length))l='Letzte Woche gab\'s nur kalte Brotzeit. Satt sind wir, aber Freude macht das keine.';

  for(const g of [['haus','Das Anwesen'],['wunsch','Mein Wunsch'],['wald','Der Wald']])
    for(const i of items.filter(i=>i.group===g[0]))html+=`<li class="${i.v>=0.6?'good':'bad'}">${g[1]}: ${i.v>=0.6?i.good:i.bad}</li>`;
  html+='</ul>';
  const hints=[];
  if(lost&&G.hist.some(h=>h.hares<8))hints.push('Wo der Fuchs keine Hasen findet, holt er sich die Hennen – wenn der Stall offen steht.');
  if(lost)hints.push('Grete schließt den Stall nur, wenn ihr am Abend noch Kraft bleibt.');
  if(s.gardenHares||s.fBroken)hints.push('Hasen wandern zum Licht. Die größte Lichtung ist der Hof – oder eine, die man ihnen anderswo schafft.');
  if(s.hofBright<startStats.hofBright*0.85)hints.push('Birken fliegen auf jede helle Fläche. Wer die Hofwiese nicht pflegt, verliert sie.');
  if(s.big<startStats.big*0.8)hints.push('Jede Fällung bringt Licht – und mit dem Licht kommen Gras und Hasen.');
  if(hints.length)html+=`<h3>Randnotizen</h3><ul>${hints.slice(0,4).map(h=>`<li>${h}</li>`).join('')}</ul>`;
  html+=`<div style="text-align:center;margin-top:12px"><button onclick="hideCard(true);newGame()">Neue Anstellung (neues Spiel)</button></div>`;
  showCard(html,null);
}

function toggleDayType(){if(!['sonntag','plan'].includes(G.phase)){toast('Hof- oder Waldtag legst du am Sonntag fest (Notizbuch [N], [H]).');return false}G.dayType=G.dayType==='wald'?'hof':'wald';return true}

function boardMode(){return G.phase==='sonntag'||G.phase==='plan'?'edit':book.replan&&boardLive()?'person':'read'}
function canEdit(t,s){

function assignCell(t,s){if(!t||!s||!canDo(t.type,s.id,t))return false;if(!canEdit(t,s)){denyEdit(t,s);return false}toggleAssign(t,s.id);return true}
// Reihenfolge ändern: Sonntag global (moveTask); Umplanen nur innerhalb der Liste der Person und nur zwischen Aufgaben ohne andere Zugeteilte (andere Listen bleiben so unberührt)

// ---------------------------------------------------------------- Tafel: wer macht was
const avgItem=t=>{const its=taskItems(t);if(!its.length)return 1;let c=0;for(const it of its)c+=itemCost(t,it);return c/its.length};
const perStunde=(t,s)=>Math.round(60*rateOf(s,t.type)/normOf(avgItem(t))*10)/10;   // Sammelposten: Einheiten je Arbeitsstunde

function finishText(t,fin,from,u){

  if(d.fixed){const w=effectiveWho(t);if(!w||w==='none')return `<i>${whoName(t)}</i>`;if(!f)return from>G.times.start?'<i>heute vorbei</i>':'<i class="warn">fällt aus</i>';return `bis ${unsureTxt(u)}${hm(f.end)}`}

  return 'fertig '+unsureTxt(u)+hm(f.end);
}
// ---------------------------------------------------------------- Zeitleiste (Paket 13): je Person eine Zeile, Balken proportional auf gemeinsamer Stundenachse
// Segmente aus dem Trockenlauf (planAll) – reine Darstellung, keine eigene Planung. Klick/Tipp auf Balken oder Namen wählt Person und (falls vorhanden) Aufgabe.
// Weg = hell gestreift (vorn im Segment; bei zusammengefassten Sammelposten nur die Summe der Wegminuten), Arbeit kräftig, feste Routine grün, Übliches/Pause/Heimweg/ruht hell.
const SEG_CLASS={fest:'sg-fest',work:'sg-work',std:'sg-std',heim:'sg-heim',folgt:'sg-pause',pause:'sg-pause',frei:'sg-frei'};
const attrText=x=>String(x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

const availIn=(pa,s)=>pa&&pa.avail&&s.id in pa.avail?pa.avail[s.id]:s.available;
function axisOf(pa){
  let t0=Infinity,t1=pa.ende||G.times.ende;
  for(const id in pa.plans)for(const e of pa.plans[id]){t0=Math.min(t0,e.from);t1=Math.max(t1,e.to)}
  if(!isFinite(t0))t0=G.times.start;
  t1=Math.max(Math.ceil(t1/60)*60,t0+60);return{t0,t1,span:t1-t0}}
function segHtml(e,ax,row,col,hl,u){
  const dur=e.to-e.from;if(dur<=0)return '';
  const p=100/ax.span,wk=e.walk?Math.min(dur,Math.round(e.walk)):0,title=`${unsureTxt(u)}${hm(e.from)}–${hm(e.to)} ${e.label}${wk?` (Weg ${wk} Min)`:''}`;
  return `<span class="sg ${SEG_CLASS[e.kind]||'sg-std'}${hl?' hl':''}${u===2?' unk':u===1?' ca':''}" style="left:${((e.from-ax.t0)*p).toFixed(2)}%;width:${(dur*p).toFixed(2)}%"${row>=0?` data-sr="${row}"`:''} data-sc="${col}" title="${attrText(title)}">${wk?`<i class="wk" style="width:${(wk/dur*100).toFixed(1)}%"></i>`:''}<em>${e.label}</em></span>`}

function detailHtml(pa,list,sel,col,from,compact){

  return `<div class="tl-det"><b>${taskTitle(t)}</b> <small>${where(...taskPos(t))}</small> · ${whoName(t)} · ${finishText(t,pa.finish,from,taskUnsure(pa,t))}${when?` · ${sp.name}: ${when}`:''}</div>`}
function timelineHtml(pa,list,sel,col,from,compact){

    const segs=pa.plans[s.id].map(e=>segHtml(e,ax,e.task&&rowOf.has(e.task.id)?rowOf.get(e.task.id):-1,c,!!(T&&e.task&&e.task.id===T.id),segUnsure(e,pa.week))).join('');

    <div class="rep"><b>Scheune</b>: ${G.barnWood} Holz · ${G.barnHay} Heu · ${G.barnHares} Hasen im Rauch (für den Baron) · ${G.traps} Fallen<br><b>Hasenstall</b>: ${G.hutch} von ${CFG.hutchCap}</div>

function bookKey(e){
  if(G.phase==='plan'&&(e.code==='Escape'||e.code==='KeyN'||e.code==='KeyT')){planFinishAsk();return}   // Sonntagabend: Schließen = Planung abschließen (Bestätigung)
  if(e.code==='Escape'||e.code==='KeyN'){if(book.replan)finishReplan();else closeBook();return}
  if(/^Digit[1-9]$/.test(e.code)&&+e.code.slice(5)<=TABS.length){book.tab=+e.code.slice(5)-1;renderBook();return}
  if(e.code==='Tab'){book.tab=(book.tab+1)%TABS.length;renderBook();return}
  if(e.code==='KeyH'){if(toggleDayType())renderBook();return}
  if(book.tab===5){   // Gutskarte: Pfeile bewegen den Cursor (Umschalt = 5 Felder)
    const d=KEYDIR[e.code],k=e.shiftKey?5:1;
    if(d)karteWahl(book.kx+(d==='right'?k:d==='left'?-k:0),book.ky+(d==='down'?k:d==='up'?-k:0));
    return}
  if(book.tab!==0)return;
  const list=bookTasks(),n=list.length;if(!n)return;const t=list[book.sel],sp=staff[book.col];
  const d=KEYDIR[e.code];
  if(d==='up'||d==='down'){const k=d==='up'?-1:1;if(e.shiftKey){if(reorder(t,sp,k))book.sel=Math.max(0,bookTasks().indexOf(t))}else book.sel=clamp(book.sel+k,0,n-1)}
  else if(d==='left'||d==='right'){if(!book.replan)book.col=clamp(book.col+(d==='left'?-1:1),0,staff.length-1)}
  else if(e.code==='Space'||e.code==='KeyE')assignCell(t,sp);
  else if(e.code==='Delete'||e.code==='Backspace'||e.code==='KeyX'){
    if(boardMode()!=='edit')denyEdit(t,sp);
    else if(!TASKS[t.type].auto){removeTask(t);book.sel=clamp(book.sel,0,bookTasks().length-1)}}
  renderBook();
}

// Je älter das Wissen, desto blasser (CFG.karte), die alte Karte am blassesten. Auswahl: Pfeiltasten (Umschalt = 5 Felder, am Handy das Steuerkreuz) oder Klick/Antippen; Standort = roter Rahmen.
let kartSc=3;
function karteText(x,y){return karteText0(x,y)+karteZNotiz(x,y)}
// Zeichen-Notizen (Paket 3): im 3×3-Umkreis des gewählten Feldes
function karteZNotiz(x,y){
  return G.kartZ.filter(z=>Math.abs(z.feld%W-x)<=1&&Math.abs(((z.feld/W)|0)-y)<=1).map(z=>` <i>Notiert: ${ZEICHEN_WORT[z.art]} (Woche ${z.woche}).</i>`).join('')}
const ksymHtml=n=>`<canvas class="ksym" data-s="${n}" width="20" height="20"></canvas>`;
function karteZLegende(){const u=new Set(kartSymbole().map(e=>e[0]));return Object.keys(KSYM).filter(n=>u.has(n)).map(n=>`<span>${ksymHtml(n)}${KSYM_WORT[n]||ZEICHEN_WORT[n]}</span>`).join('')}
function ksymMalen(root){for(const c of root.querySelectorAll('canvas.ksym')){const f=FR['01-karte_'+KSYM[c.dataset.s]],g=c.getContext('2d');if(!f||!g)continue;g.imageSmoothingEnabled=false;g.clearRect(0,0,20,20);g.drawImage(atlas,f[0],f[1],f[2],f[3],0,0,20,20)}}
function karteText0(x,y){
  const i=idx(x,y),w=kartWo[i],k=kartKl[i],ort=where(x,y);
  if(!w)return `<b>${ort}</b>: unbekannt – hier warst du noch nie, und die alte Karte kennt die Stelle nicht.`;

  const d=weekNow()-w;
  return `<b>${ort}</b>: ${KL_NAMEN[k]} – zuletzt gesehen Woche ${w}${d===0?' (diese Woche)':d>CFG.karte.altWochen?' (lange her, vielleicht längst anders)':''}.`}
function karteHtml(){
  if(book.kx===undefined){book.kx=P.x;book.ky=P.y}
  const used=new Set();for(let i=0;i<N;i++)if(kartWo[i])used.add(kartKl[i]);
  const leg=[...used].sort((a,b)=>a-b).map(k=>`<span><i style="background:${CFG.karte.farben[k]}"></i>${KL_NAMEN[k]}</span>`).join('');
  return `<div class="rep"><small>Deine Gutskarte zeigt nur, was du weißt: was du selbst gesehen hast, wo deine Leute gearbeitet haben, und die alte Karte deines Vorgängers. Je blasser, desto länger her. Verändert sich etwas, steht es erst richtig drauf, wenn du wieder hinsiehst.</small></div>
    <div class="kwrap"><canvas id="karte"></canvas></div><div class="rep" id="karteInfo">${karteText(book.kx,book.ky)}</div><div class="klegend">${leg}${karteZLegende()}<span><i class="kst"></i>dein Standort</span></div>

function karteDraw(cv,sc){
  const g=cv.getContext('2d'),K=CFG.karte,wk=weekNow();
  g.globalAlpha=1;g.fillStyle='#d6c7a0';g.fillRect(0,0,W*sc,H*sc);
  let fs=null,al=-1;
  for(let i=0;i<N;i++){const w=kartWo[i];if(!w)continue;
    const a=w<0?K.alteAlpha:Math.max(K.alphaMin,1-(1-K.alphaMin)*Math.min(1,(wk-w)/K.verblassen));
    if(a!==al){g.globalAlpha=a;al=a}
    const c=K.farben[kartKl[i]];if(c!==fs){g.fillStyle=c;fs=c}
    g.fillRect((i%W)*sc,((i/W)|0)*sc,sc,sc)}
  g.globalAlpha=1;
  for(const z of G.kartZ){   // Zeichen-Notizen: Farbfläche (Symbol darüber, s. u.), blasser mit dem Alter
    const s=3*sc,x=(z.feld%W)*sc-sc,y=((z.feld/W)|0)*sc-sc;
    g.globalAlpha=Math.max(K.alphaMin,1-(1-K.alphaMin)*Math.min(1,(wk-z.woche)/K.verblassen));g.fillStyle=CFG.zeichen.farben[z.art];g.fillRect(x,y,s,s);
    g.globalAlpha=1}
  g.imageSmoothingEnabled=false;const k=Math.max(1,Math.floor(sc/2));   // Symbole aus dem Atlas, ganzzahlig: 10 Atlaspixel × k
  for(const [n,i,a] of kartSymbole()){const f=FR['01-karte_'+KSYM[n]];if(!f)continue;g.globalAlpha=a;
    g.drawImage(atlas,f[0],f[1],f[2],f[3],Math.round((i%W+0.5)*sc-f[2]*k/2),Math.round((((i/W)|0)+0.5)*sc-f[3]*k/2),f[2]*k,f[3]*k)}
  g.globalAlpha=1;
  const rim=(x0,y0,w,h,col)=>{g.fillStyle=col;g.fillRect(x0,y0,w,1);g.fillRect(x0,y0+h-1,w,1);g.fillRect(x0,y0,1,h);g.fillRect(x0+w-1,y0,1,h)};
  rim((P.x-1)*sc,(P.y-1)*sc,3*sc,3*sc,'#d04648');rim((P.x-1)*sc+1,(P.y-1)*sc+1,3*sc-2,3*sc-2,'#d04648');   // Standort des Verwalters
  rim(book.kx*sc-2,book.ky*sc-2,sc+4,sc+4,'#2a1a10');rim(book.kx*sc-1,book.ky*sc-1,sc+2,sc+2,'#fff4dc')}   // Cursor
// Kartensymbole (B7 P4): [Name, Feld, Deckkraft] – nur Bekanntes: Gebäude, Furt und Brücke auf Feldern, die die Karte kennt (kartWo), Baue aus dem Wissen des Verwalters (knWiss: Untersuchen, Gespräch), Zeichen-Notizen (G.kartZ); blasser mit dem Alter wie die Felder
function kartSymbole(){const K=CFG.karte,wk=weekNow(),al=w=>w<0?K.alteAlpha:Math.max(K.alphaMin,1-(1-K.alphaMin)*Math.min(1,(wk-w)/K.verblassen)),o=[];
  for(const b of buildings){const n=b.id==='haus'?'hof':b.id==='gesinde'?'gesinde':/^bank/.test(b.id)?'bank':null;if(!n)continue;const i=idx(b.x+(b.w>>1),b.y+(b.h>>1));if(kartWo[i])o.push([n,i,al(kartWo[i])])}
  const fu=[];for(let i=0;i<N;i++){if(!kartWo[i]||kartKl[i]!==KL_FURT)continue;const x=i%W,y=(i/W)|0;if(fu.some(j=>Math.max(Math.abs(j%W-x),Math.abs(((j/W)|0)-y))<6))continue;fu.push(i);o.push([ground[i]===G_BRIDGE?'bruecke':'furt',i,al(kartWo[i])])}
  const bau=new Set();for(const e of knWiss)if((e.art==='hasenbau'||e.art==='fuchsbau')&&!bau.has(e.feld)){bau.add(e.feld);o.push([e.art,e.feld,al(e.woche)])}

// ================================================================ Appell: morgendliche Arbeitsverteilung auf dem Hof
const appellEl=document.getElementById('appell');
const REPLIES={hannes:['Wird gemacht, Herr Verwalter.','Jawohl.','Geht klar.'],jost:['Mach ich.','Na dann – Axt raus.','Jo.'],grete:['Na gut.','Wird gemacht.','Aber erst die Hennen, gell?'],liese:['Sehr wohl.','Jawohl, Herr Verwalter.','Gern.']};
const FOODS=[['brot','Brot'],['eier','Eier'],['fleisch','Fleisch'],['beeren','Beeren']];
const eaters=()=>staff.filter(s=>G.week>=s.from);
function defaultMeal(){return FOODS.map(f=>f[0]).filter(k=>G.food[k]>0).sort((a,b)=>G.food[b]-G.food[a]).slice(0,2)}
// Wochenration: jede Person (und der Verwalter) braucht CFG.ration Portionen je Woche – ohne Speiseplan, automatisch aus den beiden reichlichsten Zutaten (defaultMeal).
// Wer leer ausgeht, ist die nächste Woche zu schwach zum Arbeiten. Reihenfolge beim Austeilen: wer kocht, isst zuerst.
// Warmes Essen: Hoftag mittags, Waldtag abends (Tempo-Bonus bei zwei Zutaten: Hoftag ab dem Mittag, Waldtag erst am nächsten Morgen, bonusNext); kalte Brotzeit als Rückfall.
const eatOrder=ppl=>{const c=cookOf();return [c,...['grete','liese','hannes','jost'].map(S)].filter((s,k,a)=>s&&ppl.includes(s)&&a.indexOf(s)===k)};
function serveMeal(){
  const sel=defaultMeal(),ppl=eaters(),mouths=ppl.length+1,rat=CFG.ration;let need=mouths*rat,got=0,k=0;const take={};
  let pool=sel.filter(f=>G.food[f]>0);
  while(need>0&&pool.length){const f=pool[k%pool.length];takeFood(f,1);take[f]=(take[f]||0)+1;need--;got++;k++;pool=pool.filter(x=>G.food[x]>0)}
  const fed=Math.floor(got/rat),order=eatOrder(ppl);
  order.forEach((s,i)=>{s.weakNext=i>=fed&&!s.weak});   // wer diese Woche schon ausgeruht hat, ist nächste Woche wieder dabei
  G.mealHungry=order.filter(s=>s.weakNext).map(s=>s.name);
  G.ateWithStaff=fed>order.length;if(G.ateWithStaff&&G.dayType!=='wald')G.kraft+=CFG.mealKraft;   // der Verwalter isst als Letzter; Kraft nützt nur, wenn danach noch gearbeitet wird
  const good=Object.keys(take).length>=2&&fed>0;
  if(G.dayType==='wald')G.bonusNext=good;else G.goodMeal=good;
  return take;
}
function cookMeal(cook){
  if(G.cooked)return;G.cooked=true;G.coldMeal=false;
  const take=serveMeal(),what=Object.keys(take).map(k=>FOODS.find(f=>f[0]===k)[1]),hof=G.dayType!=='wald',good=hof?G.goodMeal:G.bonusNext;
  const msg=`${cook?cook.name:'Die Köchin'} ruft zum ${hof?'Mittagessen':'Abendessen'}: ${what.length?what.join(' und '):'leider nichts – die Kammer ist leer'}.${G.mealHungry.length?' '+G.mealHungry.join(', ')+' geh'+(G.mealHungry.length>1?'en':'t')+' leer aus.':''}`;
  log(msg);if(G.state==='play'&&!ffMode){toast(msg,4500);
    const gk=good?(hof?' Gute Küche – alle packen am Nachmittag kräftiger an.':' Gute Küche – morgen früh packen alle kräftiger an.'):'';
    if(G.ateWithStaff)toast(`Du isst mit deinen Leuten.${hof?` (+${CFG.mealKraft} Kraft)`:''}${gk}`,4500);
    else if(good)toast(`${gk.trim()} Für dich ist nichts übrig.`,4500)}
}
// Kalte Brotzeit aus haltbarem Vorrat: Brot, Beeren, notfalls Geräuchertes aus der Räucherkammer. need Portionen; liefert, was zusammenkam
function takeCold(need){
  let got=0,smoked=0;const take={};
  for(const k of ['brot','beeren']){const n=takeFood(k,Math.min(need,G.food[k]));if(n){take[k]=n;need-=n;got+=n}}
  while(need>0&&(G.smokedLeft>0||G.barnHares>0)){if(!G.smokedLeft){G.barnHares--;G.smokedLeft=CFG.meatPortion;smoked++}const n=Math.min(need,G.smokedLeft);G.smokedLeft-=n;need-=n;got+=n;take.geraeuchert=(take.geraeuchert||0)+n}
  return{got,smoked,take};
}
const coldWhat=take=>[take.brot?'Brot':null,take.beeren?'Beeren':null,take.geraeuchert?'Geräuchertes':null].filter(Boolean);
// Kocht niemand, gibt es statt des warmen Essens kalte Brotzeit (Wochenration aus haltbarem Vorrat).
// Macht satt (keine Schwäche), bringt aber weder Kraft noch Küchen-Bonus.
function coldMeal(){
  if(G.cooked)return;G.cooked=true;G.coldMeal=true;G.ateWithStaff=false;G.goodMeal=false;G.bonusNext=false;
  const ppl=eaters(),rat=CFG.ration,{got,smoked,take}=takeCold(ppl.length*rat);
  const fed=Math.floor(got/rat),order=eatOrder(ppl);
  order.forEach((s,i)=>{s.weakNext=i>=fed&&!s.weak});
  G.mealHungry=order.filter(s=>s.weakNext).map(s=>s.name);
  const what=coldWhat(take);
  const msg=`Kein warmes Essen heute – ${what.length?'es gibt kalte Brotzeit: '+what.join(', '):'und auch nichts für eine Brotzeit'}.${smoked?` Dafür musste ${smoked>1?smoked+' geräucherte Hasen':'ein geräucherter Hase'} aus der Räucherkammer dran glauben.`:''}${G.mealHungry.length?' '+G.mealHungry.join(', ')+' geh'+(G.mealHungry.length>1?'en':'t')+' leer aus.':''}`;
  log(msg);if(G.state==='play'&&!ffMode)toast(msg,5000);
}
// Waldtag, Mittag: keine Heimkehr, jede Person hat Brotzeit draußen dabei (CFG.brotzeit Portionen haltbarer Vorrat); der Bonus der Küche vom Vorabend endet
function noonOutside(){

  const msg=`Brotzeit draußen: ${what.length?what.join(', '):'nichts im Vorrat'}${got<need?` – für ${need-got} Portion${need-got>1?'en':''} fehlt der haltbare Vorrat`:''}.${smoked?' Ein geräucherter Hase musste dran glauben.':''}`;

}

// ================================================================ Tiere als Darstellung (tagsüber ohne Wirkung)
const rnd=Math.random;
function freeNear(x,y,r){const c=[];for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(!dx&&!dy)continue;const X=x+dx,Y=y+dy;if(!inb(X,Y))continue;const i=idx(X,Y);
  if(walkable(X,Y)&&!feat[i]&&ground[i]!==G_PATH&&ground[i]!==G_BRIDGE&&ground[i]!==G_FORD)c.push([X,Y])}return c.length?c[Math.floor(rnd()*c.length)]:null}
function gardenSpot(){for(let k=0;k<100;k++){const x=COOP[0]+Math.floor(rnd()*9)-4,y=COOP[1]+Math.floor(rnd()*6);if(inGarden(x,y)&&walkable(x,y))return[x,y]}return[COOP[0],COOP[1]+1]}
// Singvögel (B7 P6, nur Darstellung): ein Schwarm = 3–5 Vögel um eine Wiesenstelle; kommt der Verwalter gehend nahe, fliegen sie auf und lassen sich anderswo nieder
function wieseFrei(){for(let k=0;k<60;k++){const x=Math.floor(rnd()*W),y=Math.floor(rnd()*H),i=idx(x,y);if(walkable(x,y)&&(ground[i]===G_LAWN||(ground[i]===G_FOREST&&light[i]>=CFG.litMeadow))&&dist(x,y,P.px,P.py)>8)return[x,y]}return null}
function schwarm([x,y]){const n=3+Math.floor(rnd()*3),b=[];for(let k=0;k<n;k++)b.push({ox:(rnd()-0.5)*1.6,oy:(rnd()-0.5)*1.2,vx:0,vy:0,f:rnd()<.5?1:-1});return{x,y,b,fl:0}}
function spawnCritters(){
  const V=G.vis;V.hares=[];V.foxes=[];V.chickens=[];V.voegel=[];
  if(CFG.ort)for(let k=0;k<CFG.ort.voegel.schwaerme;k++){const s=wieseFrei();if(s)V.voegel.push(schwarm(s))}   // B7 P6: Singvögel auf Wiesen (Darstellung)
  for(const b of burrows){if(!b.alive||b.n<=0)continue;for(let k=0;k<Math.min(3,b.n);k++){const s=freeNear(b.x,b.y,2);if(s)V.hares.push({x:s[0],y:s[1],tx:s[0],ty:s[1],hx:b.x,hy:b.y,face:rnd()<.5?1:-1,rest:rnd()*3,anim:rnd()*5,flee:false})}}
  for(const f of foxes){if(f.alive&&rnd()<0.5){const s=freeNear(f.den[0],f.den[1],1);if(s)V.foxes.push({x:s[0],y:s[1],face:rnd()<.5?1:-1,shown:true})}}
  for(let k=0;k<G.chickens;k++){const s=gardenSpot();V.chickens.push({x:s[0],y:s[1],tx:s[0],ty:s[1],face:1,rest:rnd()*3,peck:0})}
}
function critterPass(x,y){return inb(x,y)&&walkable(x,y)&&fkind[idx(x,y)]!==FK_GATE}
function stepTo(e,dt,sp){const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy),m=sp*dt;if(Math.abs(dx)>0.01)e.face=dx>0?1:-1;if(d<=m){e.x=e.tx;e.y=e.ty;return true}e.x+=dx/d*m;e.y+=dy/d*m;return false}
function updateCritters(dt){
  const V=G.vis;
  for(const h of V.hares){h.anim+=dt;
    const H=CFG.ort?CFG.ort.hase:{scheu:3,still:1.6},d=dist(h.x,h.y,P.px,P.py),scheu=d<(P.moving?H.scheu:H.still);   // B7 P6: wer still steht, scheucht nichts auf
    const gi=idx(Math.round(h.x),Math.round(h.y));if(scheu&&d>=H.still&&!h.flee&&grass[gi]===2&&(ground[gi]===G_FOREST||ground[gi]===G_LAWN)){h.duck=true;h.rest=0.4;continue}   // im hohen Gras drückt er sich
    h.duck=false;
    if(h.rest>0){h.rest-=dt;if(scheu)h.rest=0;else continue}
    if(!stepTo(h,dt,h.flee?3.6:2.2))continue;h.x=Math.round(h.x);h.y=Math.round(h.y);
    const near=dist(h.x,h.y,P.px,P.py)<(P.moving?3.2:(CFG.ort?CFG.ort.hase.still:1.6));h.flee=near;
    if(!near&&rnd()<0.45){h.rest=0.6+rnd()*3;continue}
    let best=null,bs=-1e9;
    for(const [dx,dy] of DIRS){const nx=h.x+dx,ny=h.y+dy;if(!critterPass(nx,ny))continue;
      let s=rnd();if(near)s+=dist(nx,ny,P.px,P.py)*2;else s-=Math.max(0,dist(nx,ny,h.hx,h.hy)-3);if(s>bs){bs=s;best=[nx,ny]}}
    if(best){h.tx=best[0];h.ty=best[1]}else h.rest=1}
  for(const f of V.foxes)if(f.shown&&dist(f.x,f.y,P.px,P.py)<5){f.shown=false;SFX.bark()}
  if(V.voegel)for(let k=0;k<V.voegel.length;k++){const w=V.voegel[k];
    if(!w.fl){if(P.moving&&dist(w.x,w.y,P.px,P.py)<CFG.ort.voegel.scheu){w.fl=2.5;for(const v of w.b){const a=Math.atan2(w.y+v.oy-P.py,w.x+v.ox-P.px)+(rnd()-0.5);v.vx=Math.cos(a)*4;v.vy=Math.sin(a)*2-3;v.f=v.vx>0?1:-1}SFX.bird()}continue}
    w.fl-=dt;for(const v of w.b){v.ox+=v.vx*dt;v.oy+=v.vy*dt}if(w.fl<=0){const s=wieseFrei();V.voegel[k]=s?schwarm(s):w;if(!s)w.fl=0}}
  for(const c of V.chickens){c.peck-=dt;if(c.rest>0){c.rest-=dt;continue}if(!stepTo(c,dt,1.2))continue;c.x=Math.round(c.x);c.y=Math.round(c.y);
    if(rnd()<0.5){c.rest=1+rnd()*3;if(rnd()<0.6)c.peck=0.6;continue}
    const o=DIRS.map(([dx,dy])=>[c.x+dx,c.y+dy]).filter(([x,y])=>inGarden(x,y)&&critterPass(x,y)&&dist(x,y,COOP[0],COOP[1])<7);
    if(o.length){const p=o[Math.floor(rnd()*o.length)];c.tx=p[0];c.ty=p[1]}}
}

function stepDuration(x,y){const z=CFG.zeit;return cost(idx(x,y),clockMinute(),P)*z.stundeSek/60*z.laufDauer}
function updatePlayer(dt){
  P.anim+=dt;
  if(G.phase==='plan')return;   // Sonntagabend: nur der Planungsbildschirm, keine Bewegung
  if(P.moving){P.mt+=dt;const k=Math.min(1,P.mt/P.md);P.px=P.x+(P.nx-P.x)*k;P.py=P.y+(P.ny-P.y)*k;
    if(k>=1){P.moving=false;P.x=P.nx;P.y=P.ny;playerSeen();if(P.mowTask)addMowTile(idx(P.x,P.y));
      if(staff.some(s=>s.id==='hannes'&&s.state==='work'&&dist(s.x,s.y,P.x,P.y)<5))guide('watch')}
    return}
  // Kurzer Druck in eine neue Richtung dreht nur; erst Halten läuft los
  const held=currentDir(),tap=tapDir;tapDir=null;let dir=null;
  if(held){if(held!==P.dir){P.dir=held;P.turnWait=CFG.turnHold;return}if(P.turnWait>0){P.turnWait-=dt;return}dir=held}
  else{P.turnWait=0;if(tap){if(tap!==P.dir){P.dir=tap;return}dir=tap}}

    if(walkable(fx,fy)&&!staff.some(s=>s.available&&Math.round(s.x)===fx&&Math.round(s.y)===fy)){const cm=G.phase==='sonntag'?cost(idx(fx,fy),clockMinute(),P):0;P.nx=fx;P.ny=fy;P.mt=0;P.md=stepDuration(fx,fy);P.moving=true;sundayAdvance(cm)}}   // Sonntag: jeder Schritt kostet seine Spielminuten
}

function audioInit(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);ambInit()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f0,f1,dur,type,vol,delay=0){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(master);o.start(t);o.stop(t+dur+0.05)}
function noise(dur,freq,q,vol,type,delay=0){if(!AC)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type=type;f.frequency.value=freq;f.Q.value=q;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f).connect(g).connect(master);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05)}

  pick(){tone(600,950,0.07,'triangle',0.07)},peg(){tone(900,700,0.03,'square',0.025)},

  bird(){const n=2+Math.floor(Math.random()*4),b=2200+Math.random()*1800;for(let k=0;k<n;k++)tone(b*(1+Math.random()*.2),b*(1.3+Math.random()*.4),0.05+Math.random()*0.05,'sine',0.022,k*0.1)},

function ambInit(){

    const g=AC.createGain();g.gain.value=0;s.connect(f).connect(g).connect(master);s.start(0,Math.random());return{f,g}};
  amb={wind:loop('lowpass',380,0.6),bach:loop('bandpass',1500,0.8),bach2:loop('bandpass',520,1.4),regen:loop('highpass',2600,0.5),t:0};
}
function ambience(dt){
  if(!AC||!amb)return;amb.t+=dt;
  let n=0,water=99;
  for(let dy=-7;dy<=7;dy+=2)for(let dx=-7;dx<=7;dx+=2){const X=P.x+dx,Y=P.y+dy;if(inb(X,Y)&&covers[idx(X,Y)].length)n++}
  for(let dy=-9;dy<=9;dy++)for(let dx=-9;dx<=9;dx++){const X=P.x+dx,Y=P.y+dy;if(inb(X,Y)){const g=ground[idx(X,Y)];if(g===G_WATER||g===G_FORD||g===G_BRIDGE)water=Math.min(water,Math.hypot(dx,dy))}}
  const dens=Math.min(1,n/45),evening=G.min/60>=sunTimes(weekNow()).unter-0.5,now=AC.currentTime;
  const gust=0.6+0.4*Math.sin(amb.t*0.23)*Math.sin(amb.t*0.071+1);

  const w=water<99?Math.max(0,1-water/9)**2:0,ripple=0.7+0.3*Math.sin(amb.t*3.1)*Math.sin(amb.t*1.7);
  amb.bach.g.gain.setTargetAtTime(CFG.ambBach*w*ripple,now,0.3);amb.bach2.g.gain.setTargetAtTime(CFG.ambBach*0.6*w,now,0.5);
  const rate=dens*(evening?0.15:1);if(Math.random()<rate*dt*0.9)SFX.bird();
  if(evening&&Math.random()<dt*1.6)SFX.cricket();
  if(O){const h=G.min/60,st=sunTimes(weekNow()),dunkel=h>=st.unter-0.5||h<st.auf+0.5;   // Ortsgeräusche (B7 P6), Zufall nur für den Zeitpunkt

    if((gust>0.85||art==='sturm')&&Math.random()<dt*O.knarren*(art==='sturm'?2:1)&&totholzNah(6))SFX.knarren(art==='sturm'?1:0.6)}
}

function groundFrame(i,wf){

let lastHud='',lastGuide='';
function hud(){
  if(!G)return;
  const hh=Math.floor(G.min/60)%24,mm=Math.floor(G.min%60/10)*10;
  const k='●'.repeat(Math.max(0,G.kraft))+'○'.repeat(Math.max(0,CFG.kraft-G.kraft));
  const sun=G.phase==='sonntag',pl=G.phase==='plan',vor=G.wetter&&CFG.wetter?' · Vorhersage Werkwoche: '+wetterWort(G.week):'';   // Sonntag/Planung: nur die Vorhersage, die Werkwoche zeigt das Wetter
  const s=`Woche ${Math.min(G.week,CFG.zeit.wochen)} · ${WEEK_PHASE[G.phase]||''} · ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}${sun?'':' · '+(G.dayType==='wald'?'Waldtag':'Hoftag')}${wetterWirkt()?' · '+wetterWort(G.week):''}<br>${sun?`Tageslicht bis ${hm(G.times.ende)}${vor}`:pl?'Planen im Notizbuch [N]'+vor:'Kraft '+k}`+
    (P.mowTask?`<br><span style="color:#dad45e">Pflock-Modus: ${taskItems(groupTask('maehen')).length} Felder · [M] beenden</span>`:'')+
    `<br><small style="color:#8595a1">[Leertaste] Aktion · [N] Notizbuch · [M] Pflöcke · [T] ${pl?'Planung abschließen':G.phase==='abend'?'Heimgehen und schlafen':'Heimgehen'} · [L] Ton${G.laterne!==undefined?' · [F] Laterne':''}</small>`;
  if(s!==lastHud){hudEl.innerHTML=s;lastHud=s}
  let ht='';
  if(G.state==='play'){const [fx,fy]=facing();const sub=subjectAt(fx,fy);
    if(sub&&sub.kind!=='boden'){const m=buildOptions(sub,fx,fy);if(m.title)ht=`[Leertaste] ${m.title}`}}
  if(hintEl.textContent!==ht)hintEl.textContent=ht;
  let gs='';const gl=GUIDE[G.week];
  if(gl&&G.state!=='end')gs=`<b>Leitfaden – Woche ${G.week}</b><br>`+gl.map(([id,t])=>G.guideDone.has(G.week+':'+id)?`<span class="ok">✓ ${t}</span>`:`· ${t}`).join('<br>');
  if(gs!==lastGuide){guideEl.innerHTML=gs;guideEl.style.display=gs?'block':'none';lastGuide=gs}
}

function applyOeko(k){const src=k==='02'?window.REGELN_02:window.REGELN_01;if(!src){toast('02-waldchronik/regeln.js nicht gefunden');return}
  if(k==='02')delete CFG.herbst;   // der Wertesatz 02 kennt die Herbstkurve nicht: season0 → season1 (Rückfall); „01“ holt sie unten wieder
  for(const key of Object.keys(window.REGELN_01)){if(!(key in src)||(k==='02'&&key==='herbst'))continue;
    if(key==='sp'){for(const sp of SPECIES)if(src.sp[sp])for(const kk of Object.keys(CFG.sp[sp]))if(kk in src.sp[sp])CFG.sp[sp][kk]=src.sp[sp][kk]}
    else CFG[key]=JSON.parse(JSON.stringify(src[key]))}
  oekoSet=k;toast(`Ökologie-Werte ${k} aktiv – voll wirksam ab „Neues Spiel“`)}
const LAYERS=[['licht','Licht'],['kronen','Kronenhöhe'],['geruch','Geruch'],['reviere','Baue & Füchse'],['wege','Nachtwege'],['auftraege','Aufträge'],['kenntnis','Kenntnis'],['pfad','Trampelpfade']];

function cfgInputs(){
  const rows=[];
  for(const [k,v] of Object.entries(CFG)){
    if(typeof v==='number')rows.push(`<tr><td>${k}</td><td><input data-k="${k}" value="${v}"></td></tr>`);
    else if(k==='sp')for(const [s,o] of Object.entries(v))for(const [kk,vv] of Object.entries(o))rows.push(`<tr><td>sp.${s}.${kk}</td><td><input data-k="sp.${s}.${kk}" value="${vv}"></td></tr>`);
    else if(k==='tempo'||k==='cost'||k==='spoil')for(const [s,vv] of Object.entries(v))rows.push(`<tr><td>${k}.${s}</td><td><input data-k="${k}.${s}" value="${vv}"></td></tr>`);
  }
  return `<details><summary>CFG live ändern</summary><table>${rows.join('')}</table></details>`;
}

function drawDebugLayers(x0,y0,x1,y1){
