<!--
  01 – Der Gutsverwalter (zweiter Wurf, Konzept: KONZEPT.md; erster Wurf: v1-foerster.html)
  Idee: Als junger Gutsverwalter hältst du drei Wochen ein lebendiges Waldgut im Gleichgewicht.
  Du beobachtest, markierst Aufgaben und teilst dein Personal ein; selbst anpacken kostet Kraft.
  Nachts rechnet die Natur: Kronen wachsen ins Licht, Hasen wandern zu Lichtungen, Füchse streifen umher.
  Steuerung: WASD/Pfeile laufen · Leertaste/E: Aktionen (untersuchen, selbst anpacken, Auftrag erteilen)
             M: Pflock-Modus (Mähfläche abstecken) · N: Notizbuch · F2: Debug/Balancing · Esc: schließen
  Touch (Handy/Tablet, nur Querformat, nur bei Fingerbedienung): Steuerkreuz + Knöpfe senden dieselben Tastencodes.
             REGEL: Jede neue Taste braucht eine Zeile in TOUCH_TASTEN (Abschnitt „Touch-Steuerung“) – sonst ist sie am Handy unerreichbar.
             Zum Testen am PC: index.html?touch
  Getestet wird: Trägt der Verwalter-Kreislauf (schauen → markieren → Nacht → Folgen) mit impliziter
  Bewertung eine gemütliche Partie, und erzeugt das Licht-/Kronenmodell glaubwürdigen Wald?
  Balancing: alle Stellschrauben im Objekt CFG (live im Debug-Fenster änderbar).
  Wer was darf (Aufgaben, Rollen, Effektivität, Pensum): rollen.js – Editor: tools/rollen-editor.html
-->

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const idx=(x,y)=>y*W+x;
const inb=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
const hash=i=>((Math.imul(i+1,2654435761)>>>0)%10007)/10007;
const hash2=i=>((Math.imul(i+7,40503)>>>0)%9973)/9973;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function makeNoise(cell){
  const gw=Math.ceil(W/cell)+2, gh=Math.ceil(H/cell)+2, g=[];
  for(let i=0;i<gw*gh;i++)g.push(R());
  const s=t=>t*t*(3-2*t);
  return (x,y)=>{const fx=x/cell,fy=y/cell,ix=Math.floor(fx),iy=Math.floor(fy),tx=s(fx-ix),ty=s(fy-iy);
    const v=(a,b)=>g[b*gw+a];const a=v(ix,iy)+(v(ix+1,iy)-v(ix,iy))*tx,b=v(ix,iy+1)+(v(ix+1,iy+1)-v(ix,iy+1))*tx;return a+(b-a)*ty};
}
function pickWeighted(opts){let t=0;for(const o of opts)t+=o.w;let p=R()*t;for(const o of opts){p-=o.w;if(p<=0)return o}return opts[opts.length-1]}
function chance(x){return Math.floor(x)+(R()<x%1?1:0)}

const TR_HARE=1,TR_FOX=2,TR_FELL=3,TR_ERDE=4,TR_FEDERN=5;
const FK_H=1,FK_V=2,FK_GATE=3;
const D_FARN=1,D_FARN2=2,D_BUSCH=3,D_PILZE=4,D_BLUMEN=5,D_STEIN=6,D_MOOS=7,D_LAUB=8;
const ESTATE={x0:40,y0:30,x1:56,y1:44,gx:48,cx:48,cy:41};

const inGarden=(x,y)=>x>ESTATE.x0&&x<ESTATE.x1&&y>ESTATE.y0&&y<ESTATE.y1;
const inHofClearing=(x,y)=>((x-ESTATE.cx)/16)**2+((y-ESTATE.cy)/(y>ESTATE.cy?15:14))**2<=1;
const WEEKDAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const STAFF_DEF=[
  {id:'hannes',spr:'01-hannes',home:[50,49]},
  {id:'jost',spr:'01-jost',home:[54,49]},
  {id:'grete',spr:'01-grete',home:[54,37]},
  {id:'liese',spr:'01-liese',home:[45,37]}

let berry,berryT,ground,grass,gprog,light,feat,featN,featAge,track,trackAge,fence,fkind,bmap,trunkAt,lyingAt,stumpAt,stumpAge,deco,scent,covers,bridgeV;
let trees,treeById,logs,logById,burrows,foxes,buildings,staff,P,G,scen,startStats,nextId=1,lightDirty=true,canopyDirty=true;

function alloc(){
  ground=new Uint8Array(N);grass=new Uint8Array(N);gprog=new Float32Array(N);light=new Float32Array(N).fill(1);
  feat=new Uint8Array(N);featN=new Uint8Array(N);featAge=new Uint8Array(N);track=new Uint8Array(N);trackAge=new Uint8Array(N);
  fence=new Int8Array(N);fkind=new Uint8Array(N);bmap=new Int16Array(N).fill(-1);trunkAt=new Int32Array(N).fill(-1);
  lyingAt=new Int32Array(N).fill(-1);stumpAt=new Uint8Array(N);stumpAge=new Uint8Array(N);deco=new Uint8Array(N);
  scent=new Float32Array(N);berry=new Uint8Array(N);berryT=new Uint8Array(N);bridgeV=new Uint8Array(N);covers=[];for(let i=0;i<N;i++)covers.push([]);
  trees=[];treeById=new Map();logs=[];logById=new Map();burrows=[];foxes=[];
}

// ================================================================ Bäume
function addTree(sp,x,y,h,giant){
  const t={id:nextId++,sp,x,y,giant:!!giant,h,hp:R()*0.5,crown:[],dead:false,deadDays:0,stress:0,bitten:0,alive:true};
  for(const i of trunkTiles(t))trunkAt[i]=t.id;
  if(h>=2)t.crown=trunkTiles(t).slice();
  trees.push(t);treeById.set(t.id,t);return t;
}
function trunkTiles(t){return t.giant?[idx(t.x,t.y),idx(t.x+1,t.y),idx(t.x,t.y+1),idx(t.x+1,t.y+1)]:[idx(t.x,t.y)]}
function crownR(t){return t.giant?CFG.giantRMax:Math.min(CFG.sp[t.sp].rMax,Math.floor((t.h-1)/2))}
function trunkCheb(t,x,y){
  if(!t.giant)return Math.max(Math.abs(x-t.x),Math.abs(y-t.y));
  const dx=x<t.x?t.x-x:x>t.x+1?x-t.x-1:0, dy=y<t.y?t.y-y:y>t.y+1?y-t.y-1:0;return Math.max(dx,dy);
}
function treeAt(i){const id=trunkAt[i];if(id<0)return null;const t=treeById.get(id);return t&&t.alive?t:null}
function killTree(t){t.alive=false;for(const i of trunkTiles(t))if(trunkAt[i]===t.id)trunkAt[i]=-1;t.crown=[]}
function computeLight(){
  light.fill(1);for(let i=0;i<N;i++)covers[i].length=0;
  for(const t of trees){if(!t.alive||t.dead)continue;const op=CFG.sp[t.sp].op*(t.h<=3?0.6:1);
    for(const c of t.crown){covers[c].push(t.h,op);light[c]*=1-op}}
  lightDirty=true;canopyDirty=true;
}
function lightAbove(i,h){let l=1;const c=covers[i];for(let k=0;k<c.length;k+=2)if(c[k]>h)l*=1-c[k+1];return l}
function growCrown(t){
  const r=crownR(t);if(r<=0)return;
  const opts=[],seen=new Set(t.crown);
  for(const c of t.crown){const cx=c%W,cy=(c/W)|0;
    for(const [dx,dy] of DIRS){const nx=cx+dx,ny=cy+dy;if(!inb(nx,ny))continue;const j=idx(nx,ny);
      if(seen.has(j))continue;seen.add(j);if(trunkCheb(t,nx,ny)>r||ground[j]===G_BLOCK||ground[j]===G_WATER||ground[j]===G_FORD||ground[j]===G_BRIDGE)continue;
      const l=lightAbove(j,t.h);opts.push({j,w:l*l+0.02})}}
  if(opts.length)t.crown.push(pickWeighted(opts).j);
}
function placeLying(x,y,L,age){
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>R()-0.5);
  for(const [dx,dy] of dirs){
    const tiles=[];let ok=true;
    for(let k=1;k<=L;k++){const X=x+dx*k,Y=y+dy*k;if(!inb(X,Y)){ok=false;break}const j=idx(X,Y);
      const t=treeAt(j);
      if((ground[j]!==G_FOREST&&ground[j]!==G_LAWN)||fkind[j]||lyingAt[j]>=0||(t&&t.h>=2)||feat[j]===F_BURROW||feat[j]===F_DEN||stumpAt[j]){ok=false;break}
      tiles.push(j)}
    if(!ok)continue;
    for(const j of tiles){const t=treeAt(j);if(t)killTree(t);if(feat[j]===F_HOLE||feat[j]===F_WOOD||feat[j]===F_HAY||feat[j]===F_TRAP)feat[j]=0}
    tiles.sort((a,b)=>a-b);
    const l={id:nextId++,tiles,dir:dx?'h':'v',age};logs.push(l);logById.set(l.id,l);for(const j of tiles)lyingAt[j]=l.id;return l;
  }
  return null;
}
function addPile(i,type,n){if(feat[i]===type)featN[i]=Math.min(20,featN[i]+n);else if(!feat[i]||feat[i]===F_HOLE){feat[i]=type;featN[i]=n}}
function fellTree(t){
  const ti=idx(t.x,t.y);killTree(t);
  if(t.h>=2){
    stumpAt[ti]=SPECIES.indexOf(t.sp)+1;stumpAge[ti]=0;
    const L=t.giant?3:t.h>=6?3:t.h>=4?2:0;
    if(L===0)addPile(ti,F_WOOD,1);
    else if(!placeLying(t.x,t.y,L,0))addPile(ti,F_WOOD,L*2);
  }
  computeLight();
}

// ================================================================ Weltgenerierung
function streamY(x){return Math.round(60+3*Math.sin(x/8)+1.5*Math.sin(x/3.7))}
const CLEARINGS=[{x:16,y:15,rx:6,ry:5},{x:80,y:13,rx:6,ry:6},{x:17,y:43,rx:5,ry:5},{x:79,y:45,rx:5,ry:4},{x:30,y:67,rx:4,ry:3}];
const GIANTS=[[24,27],[71,26],[63,67]];
function newGame(seed){
  R=mulberry32(seed??((Math.random()*1e9)|0));
  nextId=1;alloc();
  // Anwesen
  for(let y=ESTATE.y0+1;y<ESTATE.y1;y++)for(let x=ESTATE.x0+1;x<ESTATE.x1;x++)ground[idx(x,y)]=G_LAWN;
  const setF=(x,y,k)=>{const i=idx(x,y);fkind[i]=k;fence[i]=3};
  for(let x=ESTATE.x0;x<=ESTATE.x1;x++){setF(x,ESTATE.y0,FK_H);setF(x,ESTATE.y1,FK_H)}
  for(let y=ESTATE.y0+1;y<ESTATE.y1;y++){setF(ESTATE.x0,y,FK_V);setF(ESTATE.x1,y,FK_V)}
  fkind[idx(ESTATE.gx,ESTATE.y1)]=FK_GATE;
  fence[idx(ESTATE.x0+3,ESTATE.y1)]=0;                         // eine Lücke für den Einstieg
  for(let y=ESTATE.y1+1;y<H;y++)ground[idx(ESTATE.gx,y)]=G_PATH; // Kutschenstraße
  for(let y=36;y<ESTATE.y1;y++)ground[idx(ESTATE.gx,y)]=G_PATH;  // Gartenweg
  for(let x=ESTATE.gx+1;x<=HOF[0];x++)ground[idx(x,HOF[1])]=G_PATH;
  // Bach
  for(let x=0;x<W;x++){const y=streamY(x);
    for(const yy of (x%7<3?[y,y+1]:[y])){if(!inb(x,yy))continue;const i=idx(x,yy);
      if(x===ESTATE.gx){ground[i]=G_BRIDGE;bridgeV[i]=1}else if(x===19||x===77)ground[i]=G_FORD;else ground[i]=G_WATER}}
  const bank2=[34,streamY(34)-2];
  buildings=[
    {id:'haus',x:46,y:33,w:5,h:3,spr:'01-herrenhaus'},
    {id:'scheune',x:41,y:38,w:3,h:2,spr:'01-scheune'},
    {id:'stall',x:52,y:35,w:2,h:1,spr:'01-stall'},
    {id:'trog',x:54,y:35,w:1,h:1,spr:null},
    {id:'gesinde',x:51,y:46,w:3,h:2,spr:'01-huette'},
    {id:'hasenstall',x:44,y:39,w:2,h:1,spr:'01-hasenstall'},
    {id:'bank',x:45,y:47,w:1,h:1,spr:'01-objekte_8'},
    {id:'bank2',x:bank2[0],y:bank2[1],w:1,h:1,spr:'01-objekte_8'}
  ];
  buildings.forEach((b,k)=>{for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++){const i=idx(x,y);ground[i]=G_BLOCK;bmap[i]=k}});
  // Freiflächen
  const clear=new Uint8Array(N);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=idx(x,y);
    if(ground[i]!==G_FOREST||fkind[i])clear[i]=2;
    else if(inHofClearing(x,y))clear[i]=1;
    else if(Math.abs(x-ESTATE.gx)<=1&&y>ESTATE.y1)clear[i]=2;
    else if(dist(x,y,bank2[0],bank2[1])<2.5)clear[i]=1;
    else for(const c of CLEARINGS)if(((x-c.x)/c.rx)**2+((y-c.y)/c.ry)**2<=1)clear[i]=1;
  }
  // Riesen
  for(const [gx,gy] of GIANTS){for(let dy=-1;dy<=2;dy++)for(let dx=-1;dx<=2;dx++)if(inb(gx+dx,gy+dy))clear[idx(gx+dx,gy+dy)]=Math.max(clear[idx(gx+dx,gy+dy)],1);addTree('eiche',gx,gy,CFG.giantH,true)}
  // Wald
  const nSp=makeNoise(11),nDen=makeNoise(7);
  const order=[];for(let i=0;i<N;i++)order.push(i);
  for(let i=N-1;i>0;i--){const j=Math.floor(R()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  for(const i of order){
    if(clear[i])continue;const x=i%W,y=(i/W)|0;
    if(treeNear(x,y))continue;
    if(R()>0.45+nDen(x,y)*0.5)continue;
    let edge=99;for(const c of CLEARINGS)edge=Math.min(edge,dist(x,y,c.x,c.y)-Math.max(c.rx,c.ry));
    edge=Math.min(edge,Math.sqrt(((x-ESTATE.cx)/16)**2+((y-ESTATE.cy)/14)**2)*15-15);
    const ns=nSp(x,y);let sp;
    if(edge<4&&R()<0.6)sp='birke';else if(ns>0.58)sp='buche';else if(ns<0.38)sp=R()<0.8?'eiche':'birke';else sp=['eiche','buche','birke','buche'][ri(0,3)];
    const s=CFG.sp[sp];const h=R()<0.15?ri(2,3):ri(4,s.hMax);
    addTree(sp,x,y,h,false);
  }
  // Kronen vorwachsen lassen
  for(let it=0;it<34;it++){
    computeLight();
    for(const t of trees){if(t.h<2)continue;
      if(it>20&&t.crown.length>trunkTiles(t).length)t.crown=t.crown.filter((c,k)=>k<trunkTiles(t).length||lightAbove(c,t.h)>=CFG.crownDieLight||R()>0.5);
      if(R()<0.85)growCrown(t)}
  }
  // Vorab ausdünnen, was im Schatten ohnehin eingehen würde (Startwald im Gleichgewicht)
  for(let pass=0;pass<3;pass++){computeLight();
    for(const t of trees){if(t.h<2||t.giant)continue;let s=0;for(const c of t.crown)s+=lightAbove(c,t.h);if(s/t.crown.length<CFG.sp[t.sp].need*0.5)killTree(t)}
    compactTrees();computeLight();for(const t of trees)if(t.h>=2&&R()<0.85)growCrown(t)}
  computeLight();
  // Unterwuchs, Gras
  for(let i=0;i<N;i++){
    const x=i%W,y=(i/W)|0;
    if(ground[i]===G_LAWN){grass[i]=0;gprog[i]=R();continue}
    if(ground[i]!==G_FOREST||fkind[i])continue;
    const l=light[i];
    if(l>=CFG.litMeadow){grass[i]=inHofClearing(x,y)&&dist(x,y,ESTATE.gx,ESTATE.y1+2)<4?0:ri(1,2);gprog[i]=R()}
    else if(l>=CFG.litHalf){grass[i]=R()<0.3?1:0;gprog[i]=R()}
    if(trunkAt[i]<0&&clear[i]!==2&&!inGarden(x,y)&&!treeNear(x,y)){
      const sp=l>=0.6?(R()<0.6?'birke':'eiche'):l>=0.3?(R()<0.5?'buche':'eiche'):'buche';
      const p=inHofClearing(x,y)?0.004:l>=0.6?0.02:l>=0.3?0.05:0.015;
      if(R()<p)addTree(sp,x,y,1,false);
    }
  }
  // altes Totholz
  for(let k=0;k<12;k++){const i=ri(0,N-1);if(light[i]<0.5&&ground[i]===G_FOREST&&!clear[i]&&trunkAt[i]<0)placeLying(i%W,(i/W)|0,ri(2,3),ri(3,10))}
  for(let i=0;i<N;i++){deco[i]=decoTarget(i);if(deco[i]===D_BUSCH)berry[i]=1}
  // Hasen in den Waldwiesen
  for(const c of CLEARINGS.slice(0,4)){
    for(let t=0;t<80;t++){const x=c.x+ri(-3,3),y=c.y+ri(-3,3);if(inb(x,y)&&burrowSiteOk(x,y,[])){addBurrow(x,y,ri(3,4),false);break}}
  }
  // ein kleiner Bau am Rand der Hoflichtung
  for(let t=0;t<200;t++){const a=R()*Math.PI*2,x=Math.round(ESTATE.cx+Math.cos(a)*13),y=Math.round(ESTATE.cy+Math.sin(a)*11);
    if(inb(x,y)&&!inGarden(x,y)&&distFence(x,y)>=6&&burrowSiteOk(x,y,[])){addBurrow(x,y,2,false);break}}
  // Füchse im Dunkel
  for(let k=0;k<2;k++){const s=findDenSite();if(s>=0){feat[s]=F_DEN;foxes.push({id:nextId++,den:[s%W,(s/W)|0],hunger:R(),alive:true})}}
  // Personal, Spieler, Zustand
  staff=STAFF_DEF.map(d=>({...d,x:d.home[0],y:d.home[1],tx:d.home[0],ty:d.home[1],path:[],jobs:[],cur:null,state:'idle',workT:0,dir:'down',anim:0,available:false,budget:0,failed:[]}));
  P={x:HOF[0],y:HOF[1],px:HOF[0],py:HOF[1],nx:HOF[0],ny:HOF[1],dir:'down',moving:false,mt:0,md:0.2,anim:0,mowTask:null};
  const kinds=['winter','jagd','holz'],kind=kinds[ri(0,2)];
  G={day:1,clock:6,state:'play',kraft:CFG.kraft,enjoyed:false,barnWood:CFG.startWood,barnHay:CFG.startHay,barnHares:0,traps:CFG.traps,
     chickens:CFG.chickens,chickHunger:0,fed:true,coopClosed:true,hensInside:true,grazedOk:false,hensFoodOk:false,hutch:0,taler:CFG.startTaler,
     smokedLeft:0,food:{brot:CFG.startBrot*CFG.brotPortion,eier:CFG.startEier,fleisch:0,beeren:0},
     batches:{brot:[{n:CFG.startBrot*CFG.brotPortion,day:1}],eier:[{n:CFG.startEier,day:1}],fleisch:[],beeren:[]},tasks:[],insights:new Set(),letters:[],hist:[],guideDone:new Set(),
     night:freshNight(),dbg:{paths:[],log:[],layers:new Set()},vis:{hares:[],foxes:[],chickens:[]},pendingDisperse:[],talked:new Set()};
  startStats=stats();
  scen={kind,wood:kind==='winter'?ri(25,35):ri(8,12),hareStock:ri(4,7),hunt:ri(20,30),big:Math.max(10,Math.round(startStats.big*(0.95+R()*0.1)))};
  G.hist.push(startStats);
  startDay(true);
}
function distFence(x,y){const dx=Math.max(ESTATE.x0-x,0,x-ESTATE.x1),dy=Math.max(ESTATE.y0-y,0,y-ESTATE.y1);return Math.max(dx,dy)}
function treeNear(x,y){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if(inb(X,Y)&&trunkAt[idx(X,Y)]>=0)return true}return false}
function decoTarget(i){
  if(ground[i]!==G_FOREST||fkind[i])return 0;
  const l=light[i],h=hash(i);
  if(l<CFG.litMoss){if(h<0.12)return D_MOOS;if(h<0.15)return D_STEIN;
    if(h<0.34){const x=i%W,y=(i/W)|0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if(inb(X,Y)&&lyingAt[idx(X,Y)]>=0)return D_PILZE}}return 0}
  if(l<CFG.litMeadow){if(h<0.2)return D_FARN;if(h<0.3)return D_FARN2;if(h<0.36)return D_BUSCH;if(h<0.42)return D_LAUB;return 0}
  if(h<0.05)return D_BLUMEN;if(h<0.07)return D_STEIN;return 0;
}

// ================================================================ Nacht: Ökologie
function freshNight(){return{holes:0,fenceDug:0,newBurrows:0,gardenBurrow:0,foxCatch:0,chickFox:0,foxAtCoop:0,newFox:0,foxGone:0,
  verbiss:0,verbissTot:0,treesDied:0,logsFell:0,chickStarve:0,trapped:0,lost:0,sprouts:0,seedlings:0,darkBurrows:0}}
function log(s){G.dbg.log.push(`T${G.day}: ${s}`);if(G.dbg.log.length>400)G.dbg.log.shift()}
const season=d=>CFG.season0+(CFG.season1-CFG.season0)*clamp((d-1)/(DAYS-1),0,1);

function nightStep(){
  const s=season(G.day);
  G.night=freshNight();G.dbg.paths=[];G.dbg.log=[];
  growTrees(s);
  seedTrees(s);
  stumpsAndLogs();
  compactTrees();
  computeLight();
  groundStep(s);
  hareStep(s);
  trapStep();
  foxStep();
  chickenStep();
  spoilFood();
  G.hist.push(stats());
}

function growTrees(season){
  computeLight();
  for(const t of trees){
    if(!t.alive)continue;
    const sp=CFG.sp[t.sp],ti=idx(t.x,t.y);
    if(t.dead){t.deadDays++;if(t.deadDays>=CFG.snagFallDays){killTree(t);if(t.h>=5&&placeLying(t.x,t.y,t.h>=6?3:2,2))G.night.logsFell++;log(`Tote ${SPNAME[t.sp]} (${t.x},${t.y}) stürzt um`)}continue}
    const top=t.h<=1?light[ti]:lightAbove(ti,t.h);
    let vit=top;
    if(t.h>=2&&t.crown.length){let s=0;for(const c of t.crown)s+=lightAbove(c,t.h);vit=s/t.crown.length}
    if(vit<sp.need*0.5)t.stress++;else t.stress=Math.max(0,t.stress-1);
    if(t.h<=1){if(t.stress>=2&&R()<CFG.sapDieP){killTree(t);continue}}
    else if(t.stress>=CFG.treeStressDie&&!t.giant){
      if(t.h<=3){killTree(t);G.night.treesDied++;continue}
      t.dead=true;t.crown=[];G.night.treesDied++;log(`${SPNAME[t.sp]} (${t.x},${t.y}) stirbt im Schatten`);continue}
    const hMax=t.giant?CFG.giantH:sp.hMax;
    if(t.h<hMax&&top>=sp.need)t.hp+=season/sp.hDays*(0.5+0.5*top);
    if(t.bitten>0){t.hp-=0.4;t.bitten--}
    if(t.hp<0)t.hp=0;
    while(t.hp>=1&&t.h<hMax){t.h++;t.hp-=1;if(t.h===2&&!t.crown.length)t.crown=trunkTiles(t).slice()}
    if(t.h>=2){
      const base=trunkTiles(t).length;
      if(t.crown.length>base)t.crown=t.crown.filter((c,k)=>k<base||lightAbove(c,t.h)>=CFG.crownDieLight||R()>CFG.crownDieP);
      if(R()<sp.crownP*season)growCrown(t);
    }
  }
}
function germOk(j){const g=ground[j];return (g===G_FOREST||g===G_LAWN)&&!fkind[j]&&trunkAt[j]<0&&lyingAt[j]<0&&!stumpAt[j]&&feat[j]!==F_BURROW&&feat[j]!==F_DEN}
function bigTrunkNear(x,y){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if(!inb(X,Y))continue;const t=treeAt(idx(X,Y));if(t&&t.h>=4)return true}return false}
function seedTrees(season){
  computeLight();
  const births=[];
  for(const t of trees){
    if(!t.alive||t.dead||t.h<4)continue;const sp=CFG.sp[t.sp];
    for(let k=chance(sp.seeds*season);k>0;k--){
      const d=t.sp==='birke'?ri(2,10):t.sp==='eiche'?(R()<0.1?ri(4,14):ri(1,3)):ri(1,3);
      const a=R()*Math.PI*2,x=Math.round(t.x+Math.cos(a)*d),y=Math.round(t.y+Math.sin(a)*d);
      if(!inb(x,y))continue;const j=idx(x,y);
      if(!germOk(j)||light[j]<sp.need*0.8)continue;
      let p=sp.germ*season*0.6;if(bigTrunkNear(x,y))p*=CFG.rootComp;
      if(R()<p)births.push([t.sp,x,y]);
    }
  }
  for(const [s,x,y] of births)if(germOk(idx(x,y))&&trees.length<CFG.maxTrees){addTree(s,x,y,1,false);G.night.seedlings++}
}
function stumpsAndLogs(){
  for(let i=0;i<N;i++){if(!stumpAt[i])continue;stumpAge[i]++;
    if(stumpAge[i]>=CFG.stumpDays&&trunkAt[i]<0&&light[i]>=0.25&&stumpAge[i]<=12){
      addTree(SPECIES[stumpAt[i]-1],i%W,(i/W)|0,1,false);stumpAt[i]=0;G.night.sprouts++;log(`Stumpf (${i%W},${(i/W)|0}) treibt aus`)}
    else if(stumpAge[i]>14)stumpAt[i]=0}
  for(const l of logs)l.age++;
  for(const l of logs.filter(l=>l.age>CFG.logRotDays)){for(const j of l.tiles)lyingAt[j]=-1;logs.splice(logs.indexOf(l),1);logById.delete(l.id)}
}
function compactTrees(){trees=trees.filter(t=>t.alive);treeById=new Map(trees.map(t=>[t.id,t]))}

function groundStep(s){
  for(let i=0;i<N;i++){
    const g=ground[i];
    if((g===G_FOREST||g===G_LAWN)&&!fkind[i]){
      const l=light[i];let d;
      if(l>=CFG.litMeadow)d=s/CFG.grassDays*(g===G_LAWN?0.55:1);
      else if(l>=CFG.litHalf)d=grass[i]>1?-0.5:grass[i]===1?0:s/CFG.grassDays*0.5;
      else d=-0.4;
      const t=treeAt(i);if(t&&t.h>=2)d=-0.5;
      gprog[i]+=d;
      if(gprog[i]>=1){if(grass[i]<2){grass[i]++;gprog[i]-=1}else gprog[i]=1}
      else if(gprog[i]<0){if(grass[i]>0){grass[i]--;gprog[i]+=1}else gprog[i]=0}
      const tgt=decoTarget(i);if(deco[i]!==tgt&&R()<0.3)deco[i]=tgt;
      if(deco[i]===D_BUSCH&&!berry[i]&&++berryT[i]>=CFG.berryRegrow){berry[i]=1;berryT[i]=0}
    }
    if(feat[i]===F_HOLE&&g!==G_LAWN){featAge[i]++;if(featAge[i]>=CFG.holeDays)feat[i]=0}
    if(track[i]){trackAge[i]++;if(trackAge[i]>=CFG.trackDays)track[i]=0}
  }
}

// ---------------------------------------------------------------- Hasen
function habitable(j){const g=ground[j];if((g!==G_FOREST&&g!==G_LAWN)||fkind[j])return false;const t=treeAt(j);return !(t&&t.h>=2)}
function addBurrow(x,y,n,garden){const b={id:nextId++,x,y,n,alive:true,empty:0,food:0,garden:!!garden};feat[idx(x,y)]=F_BURROW;burrows.push(b);return b}
function burrowSiteOk(x,y,extra){
  const j=idx(x,y);if(!habitable(j)||feat[j]||trunkAt[j]>=0||lyingAt[j]>=0||stumpAt[j]||ground[j]===G_PATH)return false;
  if(light[j]<CFG.burrowLight)return false;
  const garden=inGarden(x,y);let bright=0;
  for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const X=x+dx,Y=y+dy;if(inb(X,Y)&&habitable(idx(X,Y))&&light[idx(X,Y)]>=0.6)bright++}
  if(bright<CFG.burrowBright)return false;
  const sp=garden?3:CFG.burrowSpacing;
  for(const b of burrows)if(b.alive&&Math.max(Math.abs(b.x-x),Math.abs(b.y-y))<sp)return false;
  for(const b of extra)if(Math.max(Math.abs(b.x-x),Math.abs(b.y-y))<sp)return false;
  return true;
}
function harePassTile(j){const g=ground[j];if(g===G_BLOCK||g===G_WATER)return false;const t=treeAt(j);return !(t&&t.h>=2)}
function disperse(from,k,newB){
  let x=from.x,y=from.y,dx=0,dy=0;const path=[[x,y]],seen=new Set([idx(x,y)]);
  for(let s=0;s<CFG.disperseSteps;s++){
    const opts=[];
    for(const [ddx,ddy] of DIRS){const nx=x+ddx,ny=y+ddy;if(!inb(nx,ny))continue;const j=idx(nx,ny);if(!harePassTile(j))continue;
      let w=(light[j]*light[j]+0.03)*(ddx===dx&&ddy===dy?1.8:1)*(seen.has(j)?0.15:1);opts.push({x:nx,y:ny,j,w})}
    if(!opts.length)break;
    const o=pickWeighted(opts);
    if(fkind[o.j]===FK_GATE)continue;
    if((fkind[o.j]===FK_H||fkind[o.j]===FK_V)&&fence[o.j]>0){
      if(R()<0.35){fence[o.j]--;track[o.j]=TR_ERDE;trackAge[o.j]=0;G.night.fenceDug++;if(!fence[o.j])log(`Abwanderer graben den Zaun (${o.x},${o.y}) durch`)}
      continue}
    dx=o.x-x;dy=o.y-y;x=o.x;y=o.y;seen.add(o.j);path.push([x,y]);
    if(s%2===0&&!track[o.j]){track[o.j]=TR_HARE;trackAge[o.j]=0}
    if(s>=5&&burrowSiteOk(x,y,newB)){
      const nb={id:nextId++,x,y,n:k,alive:true,empty:0,food:0,garden:inGarden(x,y)};feat[o.j]=F_BURROW;newB.push(nb);
      G.dbg.paths.push({type:'hase',path});G.night.newBurrows++;if(nb.garden)G.night.gardenBurrow++;
      log(`${k} Hasen ziehen von (${from.x},${from.y}) los und gründen Bau (${x},${y})${nb.garden?' – IM GARTEN':''}`);return}
  }
  G.dbg.paths.push({type:'hase',path,lost:true});G.night.lost+=k;
  log(`${k} Hasen aus (${from.x},${from.y}) finden keine Lichtung und verlieren sich`);
}
function hareStep(season){
  const newB=[];
  for(const p of G.pendingDisperse)disperse(p,p.n,newB);
  G.pendingDisperse=[];
  for(const b of burrows){
    if(!b.alive)continue;
    const bi=idx(b.x,b.y);
    if(feat[bi]!==F_BURROW){b.alive=false;continue}
    let bright=0,food=0;const near=[];
    for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const x=b.x+dx,y=b.y+dy;if(!inb(x,y))continue;const j=idx(x,y);
      const t=treeAt(j);
      if(t&&t.h<=2&&b.n>0){food+=1.5;if(R()<Math.min(0.6,b.n*CFG.verbissP)){t.bitten=2;t.hp-=0.5;if(t.h===1&&R()<0.25){killTree(t);G.night.verbissTot++}else G.night.verbiss++}}
      if(!habitable(j))continue;const l=light[j];
      if(Math.max(Math.abs(dx),Math.abs(dy))<=3&&l>=0.6)bright++;
      if(l>=0.55){food+=grass[j]*0.8+0.3;near.push(j)}}
    b.food=food;
    if(!b.garden&&bright<CFG.burrowBright*0.6){
      log(`Bau (${b.x},${b.y}) ist zugewachsen und zu dunkel – ${b.n} Hasen ziehen aus`);G.night.darkBurrows++;
      if(b.n>0)disperse(b,b.n,newB);b.n=0;b.alive=false;feat[bi]=0;continue}
    if(b.n<=0){b.empty++;if(b.empty>=3){b.alive=false;feat[bi]=0;log(`Bau (${b.x},${b.y}) verfällt`)}continue}
    b.empty=0;
    for(let k=0;k<b.n&&near.length;k++)gprog[near[ri(0,near.length-1)]]-=0.25;
    for(let k=chance(b.n*CFG.holesPerHare*(b.garden?2:1));k>0&&near.length;k--){const j=near[ri(0,near.length-1)];
      if(!feat[j]&&trunkAt[j]<0&&lyingAt[j]<0&&ground[j]!==G_PATH){feat[j]=F_HOLE;featAge[j]=0;G.night.holes++}}
    for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++){const x=b.x+dx,y=b.y+dy;if(!inb(x,y))continue;const j=idx(x,y);
      if((fkind[j]===FK_H||fkind[j]===FK_V)&&fence[j]>0&&R()<b.n*CFG.fenceDigPerHare){fence[j]--;track[j]=TR_ERDE;trackAge[j]=0;G.night.fenceDug++;
        if(!fence[j])log(`Hasen aus Bau (${b.x},${b.y}) graben den Zaun (${x},${y}) durch`)}}
    const per=food/Math.max(1,b.n);let births=0,deaths=0;
    if(b.n>=2&&per>=CFG.hareFoodNeed)births=chance(b.n*CFG.hareBirth*Math.min(1.5,per/CFG.hareFoodNeed)*season);
    if(per<1.2)deaths=Math.ceil(b.n*0.2);
    b.n=Math.max(0,b.n+births-deaths);
    const cap=clamp(Math.floor(food/CFG.hareCapFood),2,CFG.hareMaxBurrow);
    log(`Bau (${b.x},${b.y})${b.garden?' [Garten]':''}: ${b.n} Hasen · Futter ${food.toFixed(0)} · +${births} −${deaths} · Platz ${cap}`);
    if(b.n>cap){const k=b.n-cap;b.n=cap;disperse(b,k,newB)}
    for(let k=0;k<Math.min(3,b.n)&&near.length;k++){const j=near[ri(0,near.length-1)];if(!track[j]){track[j]=TR_HARE;trackAge[j]=0}}
  }
  burrows.push(...newB);
  burrows=burrows.filter(b=>b.alive);
}
function trapStep(){
  for(let i=0;i<N;i++){if(feat[i]!==F_TRAP)continue;const x=i%W,y=(i/W)|0;let best=null;
    for(const b of burrows){if(!b.alive||b.n<=0)continue;const d=Math.max(Math.abs(b.x-x),Math.abs(b.y-y));if(d<=3&&(!best||d<best.d))best={b,d}}
    if(best&&R()<0.35*best.b.n/(best.b.n+2)){best.b.n--;feat[i]=F_TRAPFULL;G.night.trapped++;log(`Falle (${x},${y}) fängt einen Hasen`)}}
}

// ---------------------------------------------------------------- Füchse
function foxPass(j,f){const g=ground[j];if(g===G_BLOCK||g===G_WATER)return false;const t=treeAt(j);if(t&&t.h>=2)return false;
  if(fkind[j]===FK_GATE||((fkind[j]===FK_H||fkind[j]===FK_V)&&fence[j]>0))return f.hunger>=CFG.foxJumpHunger;return true}
function findDenSite(){
  for(let i=0;i<N;i++)if(feat[i]===F_DEN&&!foxes.some(f=>f.alive&&idx(f.den[0],f.den[1])===i))return i;
  for(let t=0;t<5000;t++){const i=ri(0,N-1),x=i%W,y=(i/W)|0;
    if(ground[i]!==G_FOREST||fkind[i]||trunkAt[i]>=0||lyingAt[i]>=0||feat[i]||stumpAt[i])continue;
    if(light[i]>=CFG.denLight||dist(x,y,ESTATE.cx,ESTATE.cy)<18)continue;
    if(foxes.some(f=>f.alive&&dist(f.den[0],f.den[1],x,y)<12))continue;
    if(!burrows.some(b=>b.alive&&dist(b.x,b.y,x,y)<13))continue;
    return i}
  return -1;
}
function foxStep(){
  scent.fill(0);
  for(const b of burrows){if(!b.alive||b.n<=0)continue;
    for(let dy=-16;dy<=16;dy++)for(let dx=-16;dx<=16;dx++){const x=b.x+dx,y=b.y+dy;if(!inb(x,y))continue;const d=Math.hypot(dx,dy);if(d>16)continue;scent[idx(x,y)]+=b.n*(1-d/16)}}
  for(const f of foxes)if(f.alive)foxWalk(f);
  foxes=foxes.filter(f=>f.alive);
  const hares=burrows.reduce((a,b)=>a+(b.alive?b.n:0),0);
  if(hares/(foxes.length+1)>CFG.haresPerFox&&foxes.length<CFG.maxFoxes){
    const s=findDenSite();
    if(s>=0){feat[s]=F_DEN;foxes.push({id:nextId++,den:[s%W,(s/W)|0],hunger:1,alive:true});G.night.newFox++;log(`Ein Fuchs wandert ein und bezieht den Bau (${s%W},${(s/W)|0})`)}
  }
}
function foxWalk(f){
  const budget=CFG.foxBaseSteps+f.hunger*CFG.foxHungerSteps;
  let [x,y]=f.den,dx=0,dy=0;const path=[[x,y]],seen=new Set();
  // Zum Stall zieht es ihn nur, wenn er daheim kaum Beute wittert – oder der Hunger übermächtig wird
  const raid=G.chickens>0&&f.hunger>=CFG.foxRaidHunger&&(scent[idx(f.den[0],f.den[1])]<2||R()<0.15*(f.hunger-1));
  let caught=false;
  for(let s=0;s<budget&&!caught;s++){
    const toCoop=raid&&s>budget*0.35;
    const opts=[];
    for(const [ddx,ddy] of DIRS){const nx=x+ddx,ny=y+ddy;if(!inb(nx,ny))continue;const j=idx(nx,ny);if(!foxPass(j,f))continue;
      let w;
      if(toCoop)w=dist(nx,ny,COOP[0],COOP[1])<dist(x,y,COOP[0],COOP[1])?3:0.4;
      else w=(scent[j]+0.4)*(1.3-light[j]*0.6);
      w*=(ddx===dx&&ddy===dy?1.6:1)*(seen.has(j)?0.2:1);
      opts.push({x:nx,y:ny,j,w})}
    if(!opts.length)break;
    const o=pickWeighted(opts);dx=o.x-x;dy=o.y-y;x=o.x;y=o.y;seen.add(o.j);path.push([x,y]);
    if(s%2===0&&!track[o.j]&&ground[o.j]!==G_BRIDGE){track[o.j]=TR_FOX;trackAge[o.j]=0}
    for(const b of burrows){if(!b.alive||b.n<=0||Math.abs(b.x-x)>2||Math.abs(b.y-y)>2)continue;
      let tall=0,cnt=0;for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++){if(!inb(b.x+xx,b.y+yy))continue;cnt++;if(grass[idx(b.x+xx,b.y+yy)]===2)tall++}
      const p=CFG.foxCatch*b.n/(b.n+2)*(1-0.5*tall/Math.max(1,cnt));
      if(R()<p){b.n--;f.hunger=0;caught=true;track[o.j]=TR_FELL;trackAge[o.j]=0;G.night.foxCatch++;log(`Fuchs ${f.id} reißt bei Bau (${b.x},${b.y}) einen Hasen (nach ${s} Schritten)`);break}}
    if(!caught&&toCoop&&Math.abs(x-COOP[0])<=1&&Math.abs(y-COOP[1])<=1){
      const c=idx(COOP[0],COOP[1]);
      if(!G.coopClosed&&G.chickens>0){G.chickens--;f.hunger=0;caught=true;track[c]=TR_FEDERN;trackAge[c]=0;G.night.chickFox++;log(`Fuchs ${f.id} holt eine Henne aus dem offenen Stall!`)}
      else{G.night.foxAtCoop++;track[c]=TR_FOX;trackAge[c]=0;log(`Fuchs ${f.id} streicht um den verschlossenen Stall`)}
      break}
  }
  G.dbg.paths.push({type:'fuchs',path,caught});
  if(!caught){f.hunger++;
    if(f.hunger>=CFG.foxLeaveHunger){f.alive=false;G.night.foxGone++;log(`Fuchs ${f.id} zieht hungrig fort`)}
    else log(`Fuchs ${f.id} geht leer aus (Hunger ${f.hunger.toFixed(1)}, ${path.length} Schritte)`)}
}
// Vorräte: Zu- und Abgänge laufen über Chargen, damit Altes zuerst verbraucht wird und verderben kann
function addFood(k,n,day){if(n<=0)return;G.food[k]+=n;G.batches[k].push({n,day:day||G.day})}
function takeFood(k,n){let got=0;const b=G.batches[k];while(n>0&&b.length){const x=Math.min(n,b[0].n);b[0].n-=x;n-=x;got+=x;if(!b[0].n)b.shift()}G.food[k]-=got;return got}
function spoilsTonight(k){return G.batches[k].filter(b=>G.day-b.day+1>=CFG.spoil[k]).reduce((a,b)=>a+b.n,0)}
function spoilFood(){const sp={};
  for(const k of Object.keys(G.batches)){let lost=0;G.batches[k]=G.batches[k].filter(b=>{if(G.day-b.day+1>=CFG.spoil[k]){lost+=b.n;return false}return true});
    if(lost){G.food[k]-=lost;sp[k]=lost;log(`${lost} Portionen ${k} verdorben`)}}
  G.night.spoiled=sp}
function graze(units){const tiles=[];
  for(let dy=-8;dy<=8;dy++)for(let dx=-8;dx<=8;dx++){const x=COOP[0]+dx,y=COOP[1]+dy;if(!inb(x,y))continue;const i=idx(x,y);
    if((ground[i]===G_LAWN||ground[i]===G_FOREST)&&!fkind[i]&&grass[i]>=1)tiles.push(i)}
  for(let k=tiles.length-1;k>0;k--){const j=Math.floor(R()*(k+1));[tiles[k],tiles[j]]=[tiles[j],tiles[k]]}
  for(const i of tiles){while(units>0&&grass[i]>0){grass[i]--;gprog[i]=0.3;units--}if(units<=0)break}
  return units<=0}
function chickenStep(){
  const n=G.night;
  if(G.chickens>0){if(!G.hensFoodOk){G.chickHunger++;if(G.chickHunger>=2){G.chickens--;n.chickStarve++;G.chickHunger=1;log('Eine Henne ist verhungert')}}else G.chickHunger=0}
  if(G.coopClosed){G.hensInside=true;G.grazedOk=false}
  else{G.hensInside=false;G.grazedOk=G.chickens>0&&graze(G.chickens*CFG.henGrass);
    if(G.grazedOk){addFood('eier',G.chickens,G.day+1);n.eggs=G.chickens;log(`Die Hennen schlafen draußen, fressen Gras und legen ${G.chickens} Eier`)}else if(G.chickens>0){n.grassShort=true;log('Die Hennen finden draußen nicht genug Gras')}}
}

// ---------------------------------------------------------------- Kennzahlen (nur intern / Debug)
function stats(){
  const s={day:G?G.day:1,hares:0,burrows:0,gardenHares:0,foxes:0,chickens:G?G.chickens:CFG.chickens,sap:0,young:0,big:0,giants:0,
    birke:0,eiche:0,buche:0,dead:0,bright:0,dark:0,hofBright:0,hofSaplings:0,gHoles:0,gTall:0,gPlants:0,fBroken:0,fDamaged:0,
    logs:logs.length,wood:G?G.barnWood:0,hay:G?G.barnHay:0,avgLight:0};
  for(const b of burrows)if(b.alive){s.burrows++;s.hares+=b.n;if(b.garden)s.gardenHares+=b.n}
  s.foxes=foxes.filter(f=>f.alive).length;
  for(const t of trees){if(!t.alive)continue;if(t.dead){s.dead++;continue}
    if(t.h<=1)s.sap++;else if(t.h<=3)s.young++;else{s.big++;s[t.sp]++}if(t.giant)s.giants++;
    if(t.h<=3&&inHofClearing(t.x,t.y)&&!inGarden(t.x,t.y))s.hofSaplings++;
    if(inGarden(t.x,t.y))s.gPlants++}
  let lsum=0,lc=0;
  for(let i=0;i<N;i++){const x=i%W,y=(i/W)|0,g=ground[i];
    if(g===G_FOREST&&!fkind[i]){lsum+=light[i];lc++;if(light[i]>=CFG.litMeadow){s.bright++;if(inHofClearing(x,y))s.hofBright++}else if(light[i]<CFG.litMoss)s.dark++}
    if(g===G_LAWN){if(feat[i]===F_HOLE)s.gHoles++;if(grass[i]===2)s.gTall++}
    if(fkind[i]===FK_H||fkind[i]===FK_V){if(fence[i]<=0)s.fBroken++;else if(fence[i]<3)s.fDamaged++}}
  s.avgLight=lc?lsum/lc:0;
  return s;
}

// ================================================================ Aufgaben (Kategorien)
const BLOCKS=['Morgens','Vormittags','Nachmittags','Abends'];
const BLOCK_CLOCK=[[6,9],[9,12],[13,16],[16,19]];
const TASKS={
  maehen:   {label:'Wiese mähen',group:true,unit:'Felder'},
  einholen: {label:'Heu & Holz einholen',group:true,auto:true,unit:'Haufen'},
  flicken:  {label:'Zaun flicken',group:true,auto:true,unit:'Stellen'},
  setzlinge:{label:'Jungpflanzen ziehen',group:true,unit:'Pflanzen'},
  loecher:  {label:'Löcher zuschütten',group:true,unit:'Löcher'},
  faellen:  {label:'Fällen'},
  zerlegen: {label:'Stamm zerlegen'},
  roden:    {label:'Stumpf roden'},
  bau:      {label:'Bau zuschütten'},
  falle:    {label:'Falle stellen'},
  beeren:   {label:'Beeren sammeln',group:true,unit:'Büsche'},
  fuettern: {label:'Hühner füttern',fixed:true,auto:true},
  einsperren:{label:'Hühner einsperren',fixed:true,auto:true},
  markt:    {label:'Zum Markt (Eier verkaufen, Brot kaufen)',fixed:true,auto:true},
  kochen:   {label:'Mittagessen kochen',fixed:true,auto:true}
};
// Wer was darf und wie schnell, aus rollen.js: who[id] = Zeitfaktor (Effektivität 100 % → 1, 50 % → 2)
for(const [k,d] of Object.entries(TASKS)){const r=RL.aufgaben[k]||{personen:{}};d.who={};
  for(const [id,e] of Object.entries(r.personen||{}))if(e>0&&RL.personen[id])d.who[id]=100/e;
  d.ueblich=d.fixed&&r.ueblich&&d.who[r.ueblich]?r.ueblich:null;d.nurJung=r.nurJung||[]}
const isHen=t=>t.type==='fuettern'||t.type==='einsperren';
const routineOwner=t=>TASKS[t.type].fixed?TASKS[t.type].ueblich:null;
function effectiveWho(t){return t.who===null&&routineOwner(t)?routineOwner(t):t.who}
function whoName(t){const w=effectiveWho(t);
  if(w==='none')return t.type==='einsperren'?'niemand – bleiben draußen':t.type==='kochen'?'niemand – nur Brotzeit':'niemand';
  if(!w)return 'niemand';return S(w).name+(t.who===null?' (üblich)':'')}
// Zuständigkeit: feste Aufgaben haben genau eine Person (who), alle anderen eine Mannschaft (crew).

// ================================================================ Personal: Tagesplan in Zeitblöcken
function capOf(s){return CFG.pensum[s.id]+(G.goodMeal&&!s.weakNext?CFG.mealBonus:0)}
function stdLabel(s,b){return{hannes:'einholen am Hof',jost:'Stämme am Hof zerlegen',grete:'Hof & Hühner',liese:'Haus & Garten'}[s.id]}
// Beim Appell (und mittags) wird der Plan festgelegt; Änderungen dazwischen gelten ab der nächsten Verteilung
function staffTasks(s,live){const base=!live&&G.frozen?(G.frozen[s.id]||[]).map(id=>G.tasks.find(t=>t.id===id)).filter(Boolean):G.tasks.filter(t=>assigned(t,s.id));

// Tagesplan aller Leute ab Block `from`, gemeinsam gerechnet: je Block und Person genau eine Aufgabe (sonst das Übliche).
// Feste Aufgaben liegen fest: Markt morgens bis nachmittags, Kochen vormittags, Einsperren abends, Füttern im ersten freien Block.
// Arbeiten mehrere am selben Sammelposten, teilen sie sich die Restarbeit. Wegkosten fallen je Person nur einmal am Tag an.
// Ergebnis: plans[id] = [{b,task,label,std}], finish: Aufgaben-ID → {b: letzter Block, left: Restarbeit}
function planAll(from,live){
  const plans={},finish=new Map(),rem=new Map(),slots={},lists={},went=new Set();
  for(const s of staff){
    if(!s.available){plans[s.id]=[];for(let b=from;b<4;b++)plans[s.id].push({b,task:null,label:s.weak?'zu schwach – hat nichts gegessen':`ab Tag ${s.from}`});continue}
    const list=staffTasks(s,live),sl=[null,null,null,null],rest=[];
    const mk=list.find(t=>t.type==='markt');
    if(mk&&(from===0||(G.marketOut&&from<=2)))for(let b=from;b<=2;b++)sl[b]=mk;
    for(const t of list){
      if(t.type==='markt')continue;
      if(t.type==='kochen'){if(from<=1&&!sl[1])sl[1]=t}
      else if(t.type==='einsperren')sl[3]=t;
      else if(t.type==='fuettern'){for(let b=from;b<4;b++)if(!sl[b]){sl[b]=t;break}}
      else rest.push(t);
    }
    for(let b=from;b<4;b++)if(sl[b])finish.set(sl[b].id,{b,left:0});
    slots[s.id]=sl;lists[s.id]=rest;
  }

    const r=remOf(t);rem.set(t.id,r*m<=work+CFG.slack?0:r-Math.max(0,work)/m);
    sl[b]=t;finish.set(t.id,{b,left:rem.get(t.id)});
  }

}
function planFor(s,from,live){return planAll(from,live).plans[s.id]}
// Wer kocht heute? (feste Aufgabe „kochen“, üblich laut rollen.js)
function cookOf(){const t=G.tasks.find(t=>t.type==='kochen'),w=t&&effectiveWho(t);return w&&w!=='none'?S(w):null}
function cooksToday(live){const c=cookOf();if(!c||!c.available)return false;const p=planFor(c,0,live).find(e=>e.b===1);return !!(p&&p.task&&p.task.type==='kochen')}
const askerOf=()=>{const c=cookOf();return c&&c.available?c:staff.find(s=>s.available&&TASKS.kochen.who[s.id])||S('grete')};
function planWarnings(live){const w=[];
  const ein=G.tasks.find(t=>t.type==='einsperren'),fu=G.tasks.find(t=>t.type==='fuettern');
  if(ein&&visibleTask(ein)){if(ein.who==='none')w.push('Die Hühner bleiben nachts draußen – Eier, aber Fuchsgefahr.');else{const s=S(effectiveWho(ein));if(!s||!s.available)w.push('Niemand sperrt die Hühner abends ein.')}}

  if(ko&&visibleTask(ko)&&!cooksToday(live)){const c=cookOf();w.push(`${c?c.name+' kocht heute nicht':'Heute kocht niemand'} – mittags gibt es nur kalte Brotzeit (Brot, Beeren, notfalls Geräuchertes).`)}

function nearestFirst(items,pos,tileOf){const rest=items.slice(),out=[];let [x,y]=pos;
  while(rest.length){let bi=0,bd=1e9;for(let k=0;k<rest.length;k++){const j=tileOf(rest[k]);const d=dist(x,y,j%W,(j/W)|0);if(d<bd){bd=d;bi=k}}
    const it=rest.splice(bi,1)[0];out.push(it);const j=tileOf(it);x=j%W;y=(j/W)|0}return out}
function groupJobs(s,t,budget){
  const m=mult(t.type,s.id),jobs=[],sb=t.startedBy||(t.startedBy={});let first=sb[s.id]!==G.day;sb[s.id]=G.day;
  const cl=G.claimed||(G.claimed=new Set());   // was andere in diesem Block schon übernommen haben
  const its=nearestFirst(taskItems(t).filter(it=>!cl.has(t.id+':'+it)),[Math.round(s.x),Math.round(s.y)],it=>itemTile(t,it)).filter(it=>itemTile(t,it)>=0);

  for(const it of its){

    if(c>budget&&jobs.length)break;budget-=c;jobs.push({kind:'item',task:t,item:it,x:j%W,y:(j/W)|0,pts:c});if(budget<=0)break}
  for(const j of jobs)cl.add(t.id+':'+j.item);
  return jobs;
}
function stdJobs(s,b,budget){
  const jobs=[];const push=(j)=>{if(j.pts<=budget||!jobs.length){budget-=j.pts;jobs.push(j);return true}return false};
  if(s.id==='grete')return jobs;
  if(s.id==='hannes'){const its=[];for(let i=0;i<N;i++){const f=feat[i];if((f===F_WOOD||f===F_HAY)&&dist(i%W,(i/W)|0,HOF[0],HOF[1])<=16||f===F_TRAPFULL&&dist(i%W,(i/W)|0,HOF[0],HOF[1])<=30)its.push(i)}
    for(const i of nearestFirst(its,[Math.round(s.x),Math.round(s.y)],i=>i))if(!push({kind:'routine',name:'einholen',x:i%W,y:(i/W)|0,pts:CFG.cost.einholen}))break;return jobs}
  if(s.id==='jost'){for(const l of logs){const j=l.tiles[0];if(dist(j%W,(j/W)|0,HOF[0],HOF[1])>16)continue;const c=CFG.cost.zerlegen*l.tiles.length;if(c<=budget){budget-=c;jobs.push({kind:'routine',name:'zerlegen',log:l.id,x:j%W,y:(j/W)|0,pts:c})}}return jobs}
  if(s.id==='liese'){const garden=[];
    for(let y=ESTATE.y0+1;y<ESTATE.y1;y++)for(let x=ESTATE.x0+1;x<ESTATE.x1;x++){const i=idx(x,y);
      if(feat[i]===F_HOLE)garden.push({p:3,x,y,pts:CFG.cost.loch,name:'loch'});
      const t=treeAt(i);if(t&&t.h<=3)garden.push({p:2,x,y,pts:CFG.cost.setzling,name:'setzling'});
      if(grass[i]===2&&ground[i]===G_LAWN)garden.push({p:1,x,y,pts:CFG.cost.rasen,name:'rasen'})}
    garden.sort((a,b)=>b.p-a.p);let done=0;
    for(const g of garden){if(g.pts>budget)break;budget-=g.pts;jobs.push({kind:'routine',...g});done++}
    G.gardenBacklog=garden.length-done;return jobs}
  return jobs;
}
function buildBlockJobs(s,b,p){
  if(!s.available||s.away)return[];
  if(p===undefined)p=planFor(s,b)[0];const budget=capOf(s);
  if(!p||!p.task)return stdJobs(s,b,budget);
  const t=p.task;
  if(t.type==='fuettern')return[{kind:'fuettern',task:t,x:COOP[0]+2,y:COOP[1],pts:capOf(s)}];
  if(t.type==='einsperren')return[{kind:'einsperren',task:t,x:COOP[0],y:COOP[1],pts:capOf(s)}];
  if(t.type==='markt')return b===0?[{kind:'markt',task:t,x:ESTATE.gx,y:H-1,pts:0.5}]:[];
  if(t.type==='kochen')return[{kind:'kochen',task:t,x:HOF[0],y:HOF[1],pts:capOf(s)}];
  if(TASKS[t.type].group){const jobs=groupJobs(s,t,budget);return jobs.length?jobs:stdJobs(s,b,budget)}
  const sb=t.startedBy||(t.startedBy={}),first=sb[s.id]!==G.day;sb[s.id]=G.day;
  const way=first?wayCost(t.x,t.y):0,rem=taskRemaining(t,s.id);let c=Math.min(budget,rem+way);if(rem+way<=budget+CFG.slack)c=rem+way;
  return[{kind:'single',task:t,x:t.x,y:t.y,pts:c,work:Math.max(0,c-way)/(mult(t.type,s.id)||1)}];
}
function applyJob(s,j){
  switch(j.kind){
    case 'fuettern':{const need=G.chickens*CFG.chickenHay;if(G.barnHay>=need){G.barnHay-=need;G.hensFoodOk=true}else G.hayShort=true;j.task.doneDay=G.day;break}
    case 'einsperren':G.coopClosed=true;j.task.doneDay=G.day;break;
    case 'markt':s.away=true;G.marketOut=true;break;
    case 'kochen':j.task.doneDay=G.day;cookMeal(s);break;
    case 'item':if(G.tasks.includes(j.task))applyItem(j.task,j.item);break;
    case 'single':{const t=j.task;if(!G.tasks.includes(t))break;if(!validTask(t)){removeTask(t);break}
      t.done+=j.work;
      if(t.done>=singleCost(t)-1e-6){if(applySingle(t))removeTask(t);else{s.failed.push(t);t.done=singleCost(t)-0.01}}
      break}
    case 'routine':{const i=idx(j.x,j.y);
      if(j.name==='einholen'){if(feat[i]===F_WOOD||feat[i]===F_HAY||feat[i]===F_TRAPFULL)collectPile(i)}
      else if(j.name==='loch'){if(feat[i]===F_HOLE)feat[i]=0}
      else if(j.name==='setzling'){const t=treeAt(i);if(t&&t.h<=3){killTree(t);computeLight()}}
      else if(j.name==='rasen'){grass[i]=0;gprog[i]=0}
      else if(j.name==='zerlegen'){const l=logById.get(j.log);if(l){cutLog(l);G.tasks.filter(t=>t.type==='zerlegen'&&t.ref===l.id).forEach(removeTask)}}
      break}
  }
}
function findPath(sx,sy,tx,ty){
  sx=Math.round(sx);sy=Math.round(sy);
  const goal=new Set();
  if(walkable(tx,ty))goal.add(idx(tx,ty));
  else for(const [dx,dy] of DIRS)if(walkable(tx+dx,ty+dy))goal.add(idx(tx+dx,ty+dy));
  if(!goal.size)return null;
  const start=idx(sx,sy);if(goal.has(start))return [];
  const prev=new Int32Array(N).fill(-2);prev[start]=-1;const q=[start];let h=0;
  while(h<q.length){const c=q[h++];const cx=c%W,cy=(c/W)|0;
    for(const [dx,dy] of DIRS){const nx=cx+dx,ny=cy+dy;if(!walkable(nx,ny))continue;const n=idx(nx,ny);if(prev[n]!==-2)continue;prev[n]=c;
      if(goal.has(n)){const path=[];let k=n;while(k!==start){path.push(k);k=prev[k]}return path.reverse()}
      q.push(n)}}
  return null;
}
function goTo(s,x,y){const p=findPath(s.x,s.y,x,y);s.cur=null;s.jobs=[];s.path=p||[];s.state='walk';s.goal=[x,y]}
function nextJob(s){
  while(s.jobs.length){const j=s.jobs.shift();const p=findPath(s.x,s.y,j.x,j.y);
    if(p){s.cur=j;s.path=p;s.state='walk';return}
    if(j.kind==='single'||j.kind==='item'){if(!s.failed.includes(j.task))s.failed.push(j.task)}else applyJob(s,j)}
  s.cur=null;s.state='rest';s.done=true;
}
function followPath(s,dt){
  if(!s.path.length)return true;
  const n=s.path[0],tx=n%W,ty=(n/W)|0,dx=tx-s.x,dy=ty-s.y,d=Math.hypot(dx,dy),m=3.2*dt;
  if(Math.abs(dx)>Math.abs(dy))s.dir=dx>0?'right':'left';else if(dy)s.dir=dy>0?'down':'up';
  if(d<=m){s.x=tx;s.y=ty;s.path.shift();return !s.path.length}
  s.x+=dx/d*m;s.y+=dy/d*m;return false;
}
function faceTo(s,x,y){const dx=x-s.x,dy=y-s.y;if(Math.abs(dx)>Math.abs(dy))s.dir=dx>0?'right':'left';else if(dy)s.dir=dy>0?'down':'up'}
function updateStaff(dt){
  for(const s of staff){if(!s.available||s.away)continue;s.anim+=dt;
    if(s.state==='idle')nextJob(s);
    else if(s.state==='walk'){if(followPath(s,dt)){if(s.cur){s.state='work';s.workT=0;faceTo(s,s.cur.x,s.cur.y)}else{s.state='rest';s.dir='down'}}}
    else if(s.state==='work'){s.workT+=dt;
      if(s.cur.kind==='single'&&s.cur.task.type==='faellen'&&(s.workT%0.5)<dt)SFX.chop();
      if(s.workT>=s.cur.pts*CFG.secPerPoint){applyJob(s,s.cur);s.cur=null;nextJob(s)}}
  }
}

// ================================================================ Tageslauf: Appell, Blöcke, Pause, Feierabend
const LINE=[[49,49],[50,49],[51,49],[52,49]],PLAYER_LINE=[50,51];
function startDay(first,quiet){
  G.state='play';G.kraft=CFG.kraft;G.enjoyed=false;G.clock=6;G.coopClosed=false;G.phase='appell';G.block=0;G.blockT=0;
  G.hensFoodOk=!G.hensInside&&G.grazedOk;G.hayShort=false;G.marketOut=false;G.goodMeal=false;G.ateWithStaff=false;G.cooked=false;
  G.tasks=G.tasks.filter(validTask);ensureAutoTasks();
  staff.forEach((s,k)=>{s.weak=!!s.weakNext;s.weakNext=false;s.away=false;s.available=G.day>=s.from&&!s.weak;s.jobs=[];s.cur=null;s.path=[];s.state='rest';s.failed=[];s.done=true;s.dismissed=false;
    s.x=s.tx=LINE[k][0];s.y=s.ty=LINE[k][1];s.dir='down'});
  spawnCritters();computeLight();
  G.mealPlan=defaultMeal();
  if(quiet){beginBlock(0);return}
  P.x=P.nx=PLAYER_LINE[0];P.y=P.ny=PLAYER_LINE[1];P.px=P.x;P.py=P.y;P.dir='up';P.moving=false;
  showMorning(first);
  G.afterCard=first?()=>beginBlock(0):startAppell;
}
function beginBlock(b){
  G.phase='block';G.block=b;G.blockT=0;let est=0;
  if(b===0||b===2)freezePlans();
  G.claimed=new Set();const pa=planAll(b).plans;
  for(const s of staff){if(!s.available)continue;s.jobs=buildBlockJobs(s,b,pa[s.id][0]);s.cur=null;s.done=!!s.away;s.state=s.away?'rest':'idle';
    let t=0,x=s.x,y=s.y;for(const j of s.jobs){t+=j.pts*CFG.secPerPoint+(Math.abs(j.x-x)+Math.abs(j.y-y))/3.2;x=j.x;y=j.y}est=Math.max(est,t)}
  G.blockEst=Math.max(CFG.blockMinSec,est);
}
function marketReturn(){
  if(!G.marketOut)return;G.marketOut=false;const l=staff.find(s=>s.away)||S('liese');l.away=false;l.x=ESTATE.gx;l.y=H-2;l.state='rest';
  const sell=takeFood('eier',Math.max(0,G.food.eier-CFG.keepEggs));G.taler+=sell*CFG.eggPrice;let bought=0;
  while(G.taler>=CFG.brotPreis&&bought<CFG.brotMax){G.taler-=CFG.brotPreis;addFood('brot',CFG.brotPortion);bought++}
  const t=G.tasks.find(t=>t.type==='markt');if(t)t.doneDay=G.day;
  const note=`${l.name} ist vom Markt zurück: ${sell} Eier verkauft, ${bought} Laib Brot gekauft, ${G.taler} Taler in der Kasse.`;log(note);if(G.state==='play')toast(note,5000);
}
function endBlock(){
  const b=G.block;if(b===2)marketReturn();
  if(b===1){G.phase='mittag';G.blockT=0;G.frozen=null;coldMeal();staff.forEach((s,k)=>{if(s.available&&!s.away)goTo(s,LINE[k][0],LINE[k][1])});
    toast('Mittagspause. Den Nachmittag kannst du jetzt im Notizbuch [N] umplanen.',4200)}
  else if(b===3){G.phase='feierabend';G.frozen=null;G.clock=19;staff.forEach(s=>{if(s.available&&!s.away)goTo(s,s.home[0],s.home[1])});toast('Feierabend. Die Leute gehen heim.')}
  else beginBlock(b+1);
}
function updateDay(dt){
  if(G.phase==='block'){
    G.blockT+=dt;updateStaff(dt);const [c0,c1]=BLOCK_CLOCK[G.block];G.clock=c0+(c1-c0)*Math.min(1,G.blockT/G.blockEst);
    if(G.blockT>=CFG.blockMinSec&&staff.every(s=>!s.available||s.done))endBlock();
  } else if(G.phase==='mittag'){
    G.blockT+=dt;updateStaff(dt);G.clock=12+Math.min(1,G.blockT/CFG.pauseSec);
    if(G.blockT>=CFG.pauseSec&&staff.every(s=>!s.available||s.away||s.state==='rest'))beginBlock(2);
  } else if(G.phase==='feierabend'){updateStaff(dt);G.clock=Math.min(21,G.clock+dt*2/40)}
}
function finishDay(){
  let b=0;
  if(G.phase==='block'){for(const s of staff){if(!s.available)continue;if(s.cur)applyJob(s,s.cur);for(const j of s.jobs)applyJob(s,j);s.jobs=[];s.cur=null}b=G.block+1}
  else if(G.phase==='mittag')b=2;else if(G.phase==='feierabend')b=4;
  for(;b<4;b++){G.claimed=new Set();const pa=planAll(b).plans;for(const s of staff)if(s.available)for(const j of buildBlockJobs(s,b,pa[s.id][0]))applyJob(s,j)}
  marketReturn();noMeal();
  G.phase='nacht';G.frozen=null;
  G.lastDay={fed:G.hensFoodOk,closed:G.coopClosed,failed:staff.flatMap(s=>s.failed.map(t=>({who:s.name,title:taskTitle(t),where:where(...taskPos(t))})))};
}
function sleep(){
  if(P.mowTask)toggleMow();
  finishDay();nightStep();G.day++;
  P.x=P.nx=HOF[0];P.y=P.ny=HOF[1];P.px=P.x;P.py=P.y;P.dir='down';P.moving=false;
  if(G.day>DAYS){showEnding();return}
  startDay(false);
}
function dbgDays(k){
  for(let n=0;n<k;n++){if(G.state==='end')return;finishDay();nightStep();G.day++;if(G.day>DAYS){showEnding();return}startDay(false,n<k-1)}
  if(G.state==='card'){} // Morgenkarte des letzten Tages bleibt stehen
}

    case 'gras':{title=grass[i]===2?'Hohes Gras':'Wiese';ex(grass[i]===2?'Hohes, saftiges Gras. Hier kommt man nur mühsam voran.':'Eine helle Wiese.','gras');
      if(!marked.length){const area=mowArea(x,y,40);O.push({label:`Markieren: Wiese hier mähen (${area.length} Felder)`,fn(){const t=groupTask('maehen');for(const j of area)if(!t.items.includes(j))t.items.push(j);SFX.peg();guide('mow');

          if(!marked.length)O.push(markGroupOpt('beeren',i))}

      ex({[D_FARN]:'Farne lieben den Halbschatten.',[D_FARN2]:'Farne lieben den Halbschatten.',[D_BUSCH]:'Ein Brombeerbusch.',[D_PILZE]:'Pilze am morschen Holz.',[D_BLUMEN]:'Wiesenblumen im Licht.',[D_STEIN]:'Ein bemooster Stein.',[D_MOOS]:'Weiches Moos – hier ist es dunkel.',[D_LAUB]:'Altes Laub.'}[d],d===D_MOOS?'moos':d===D_PILZE?'totholz':null);break}

      if(!feat[i]&&walkable(x,y)&&ground[i]!==G_PATH){

        if(!marked.length)O.push(markSingleOpt('falle',x,y))}}
  }
  for(const t of marked)O.push({label:`Markierung entfernen: ${TASKS[t.type].label}`,fn(){unmark(t,x,y);toast('Markierung entfernt.')}});

}
function mowArea(x,y,max){const out=[],seen=new Set([idx(x,y)]),q=[[x,y]];
  while(q.length&&out.length<max){const [cx,cy]=q.shift();const i=idx(cx,cy);if(grass[i]>=1&&light[i]>=0.55&&ground[i]!==G_PATH&&!fkind[i]){out.push(i);
    for(const [dx,dy] of DIRS){const nx=cx+dx,ny=cy+dy;if(inb(nx,ny)&&!seen.has(idx(nx,ny))){seen.add(idx(nx,ny));q.push([nx,ny])}}}}
  return out}
function toggleMow(){
  if(P.mowTask){P.mowTask=null;const t=G.tasks.find(t=>t.type==='maehen');toast(t?`Mähfläche abgesteckt – „Wiese mähen“ umfasst jetzt ${taskItems(t).length} Felder.`:'Keine Fläche abgesteckt.');guide('mow');return}
  P.mowTask=true;addMowTile(idx(P.x,P.y));
  toast('Pflock-Modus: Lauf über das Gras, das gemäht werden soll. [M] beendet.');
}
function addMowTile(i){if(!P.mowTask||grass[i]<1||ground[i]===G_PATH||fkind[i])return;const t=groupTask('maehen');if(t.items.includes(i))return;t.items.push(i);SFX.peg()}
function help(s){

}

function bookKey(e){

  if(d==='up'||d==='down'){const k=d==='up'?-1:1;if(e.shiftKey){moveTask(t,k);book.sel=clamp(book.sel+k,0,n-1)}else book.sel=clamp(book.sel+k,0,n-1)}

}

// Jede Person braucht 2 Portionen aus den gewählten Zutaten. Wer leer ausgeht, ist morgen zu schwach zum Arbeiten.
// Reihenfolge beim Austeilen: wer kocht, isst zuerst
const eatOrder=ppl=>{const c=cookOf();return [c,...['grete','liese','hannes','jost'].map(S)].filter((s,k,a)=>s&&ppl.includes(s)&&a.indexOf(s)===k)};
function serveMeal(sel){
  const ppl=eaters(),mouths=ppl.length+1;let need=mouths*2,got=0,k=0;const take={};
  let pool=sel.filter(f=>G.food[f]>0);
  while(need>0&&pool.length){const f=pool[k%pool.length];takeFood(f,1);take[f]=(take[f]||0)+1;need--;got++;k++;pool=pool.filter(x=>G.food[x]>0)}
  const fed=Math.floor(got/2),order=eatOrder(ppl);
  order.forEach((s,i)=>{s.weakNext=i>=fed&&!s.weak});   // wer heute schon ausgeruht hat, ist morgen wieder dabei
  G.mealHungry=order.filter(s=>s.weakNext).map(s=>s.name);
  G.ateWithStaff=fed>order.length;if(G.ateWithStaff)G.kraft+=CFG.mealKraft;   // der Verwalter isst als Letzter
  G.goodMeal=Object.keys(take).length>=2&&fed>0;
  return take;
}

  const msg=`${cook?cook.name:'Die Köchin'} ruft zum Mittagessen: ${what.length?what.join(' und '):'leider nichts – die Kammer ist leer'}.${G.mealHungry.length?' '+G.mealHungry.join(', ')+' geh'+(G.mealHungry.length>1?'en':'t')+' leer aus.':''}`;
  log(msg);if(G.state==='play'){toast(msg,4500);
    if(G.ateWithStaff)toast(`Du isst mit deinen Leuten. (+${CFG.mealKraft} Kraft)${G.goodMeal?' Gute Küche – alle packen am Nachmittag kräftiger an.':''}`,4500);

  for(const k of ['brot','beeren']){const n=takeFood(k,Math.min(need,G.food[k]));if(n){take[k]=n;need-=n;got+=n}}
  while(need>0&&(G.smokedLeft>0||G.barnHares>0)){if(!G.smokedLeft){G.barnHares--;G.smokedLeft=CFG.meatPortion;smoked++}const n=Math.min(need,G.smokedLeft);G.smokedLeft-=n;need-=n;got+=n;take.geraeuchert=(take.geraeuchert||0)+n}
  const fed=Math.floor(got/2),order=eatOrder(ppl);
  order.forEach((s,i)=>{s.weakNext=i>=fed&&!s.weak});
  G.mealHungry=order.filter(s=>s.weakNext).map(s=>s.name);
  const what=[take.brot?'Brot':null,take.beeren?'Beeren':null,take.geraeuchert?'Geräuchertes':null].filter(Boolean);
  const msg=`Kein warmes Essen heute – ${what.length?'es gibt kalte Brotzeit: '+what.join(', '):'und auch nichts für eine Brotzeit'}.${smoked?` Dafür musste ${smoked>1?smoked+' geräucherte Hasen':'ein geräucherter Hase'} aus der Räucherkammer dran glauben.`:''}${G.mealHungry.length?' '+G.mealHungry.join(', ')+' geh'+(G.mealHungry.length>1?'en':'t')+' leer aus.':''}`;

const rnd=Math.random;
function freeNear(x,y,r){const c=[];for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(!dx&&!dy)continue;const X=x+dx,Y=y+dy;if(!inb(X,Y))continue;const i=idx(X,Y);
  if(walkable(X,Y)&&!feat[i]&&ground[i]!==G_PATH&&ground[i]!==G_BRIDGE&&ground[i]!==G_FORD)c.push([X,Y])}return c.length?c[Math.floor(rnd()*c.length)]:null}
function gardenSpot(){for(let k=0;k<100;k++){const x=COOP[0]+Math.floor(rnd()*9)-4,y=COOP[1]+Math.floor(rnd()*6);if(inGarden(x,y)&&walkable(x,y))return[x,y]}return[COOP[0],COOP[1]+1]}
function spawnCritters(){
  const V=G.vis;V.hares=[];V.foxes=[];V.chickens=[];
  for(const b of burrows){if(!b.alive||b.n<=0)continue;for(let k=0;k<Math.min(3,b.n);k++){const s=freeNear(b.x,b.y,2);if(s)V.hares.push({x:s[0],y:s[1],tx:s[0],ty:s[1],hx:b.x,hy:b.y,face:rnd()<.5?1:-1,rest:rnd()*3,anim:rnd()*5,flee:false})}}
  for(const f of foxes){if(f.alive&&rnd()<0.5){const s=freeNear(f.den[0],f.den[1],1);if(s)V.foxes.push({x:s[0],y:s[1],face:rnd()<.5?1:-1,shown:true})}}
  for(let k=0;k<G.chickens;k++){const s=gardenSpot();V.chickens.push({x:s[0],y:s[1],tx:s[0],ty:s[1],face:1,rest:rnd()*3,peck:0})}
}
function critterPass(x,y){return inb(x,y)&&walkable(x,y)&&fkind[idx(x,y)]!==FK_GATE}
function stepTo(e,dt,sp){const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy),m=sp*dt;if(Math.abs(dx)>0.01)e.face=dx>0?1:-1;if(d<=m){e.x=e.tx;e.y=e.ty;return true}e.x+=dx/d*m;e.y+=dy/d*m;return false}
function updateCritters(dt){
  const V=G.vis;
  for(const h of V.hares){h.anim+=dt;
    if(h.rest>0){h.rest-=dt;if(dist(h.x,h.y,P.px,P.py)<3)h.rest=0;else continue}
    if(!stepTo(h,dt,h.flee?3.6:2.2))continue;h.x=Math.round(h.x);h.y=Math.round(h.y);
    const near=dist(h.x,h.y,P.px,P.py)<3.2;h.flee=near;
    if(!near&&rnd()<0.45){h.rest=0.6+rnd()*3;continue}
    let best=null,bs=-1e9;
    for(const [dx,dy] of DIRS){const nx=h.x+dx,ny=h.y+dy;if(!critterPass(nx,ny))continue;
      let s=rnd();if(near)s+=dist(nx,ny,P.px,P.py)*2;else s-=Math.max(0,dist(nx,ny,h.hx,h.hy)-3);if(s>bs){bs=s;best=[nx,ny]}}
    if(best){h.tx=best[0];h.ty=best[1]}else h.rest=1}
  for(const f of V.foxes)if(f.shown&&dist(f.x,f.y,P.px,P.py)<5){f.shown=false;SFX.bark()}
  for(const c of V.chickens){c.peck-=dt;if(c.rest>0){c.rest-=dt;continue}if(!stepTo(c,dt,1.2))continue;c.x=Math.round(c.x);c.y=Math.round(c.y);
    if(rnd()<0.5){c.rest=1+rnd()*3;if(rnd()<0.6)c.peck=0.6;continue}
    const o=DIRS.map(([dx,dy])=>[c.x+dx,c.y+dy]).filter(([x,y])=>inGarden(x,y)&&critterPass(x,y)&&dist(x,y,COOP[0],COOP[1])<7);
    if(o.length){const p=o[Math.floor(rnd()*o.length)];c.tx=p[0];c.ty=p[1]}}
}

let AC=null,noiseBuf=null;
let master=null,amb=null,muted=false;
function audioInit(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);ambInit()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f0,f1,dur,type,vol,delay=0){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(master);o.start(t);o.stop(t+dur+0.05)}
function noise(dur,freq,q,vol,type,delay=0){if(!AC)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type=type;f.frequency.value=freq;f.Q.value=q;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f).connect(g).connect(master);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05)}
const SFX={
  chop(){noise(0.08,900,2,0.18,'bandpass');tone(180,90,0.07,'triangle',0.05)},
  pull(){tone(260,640,0.09,'sine',0.1)},dig(){noise(0.14,240,1,0.35,'lowpass')},hammer(){tone(1300,900,0.04,'square',0.05)},
  pick(){tone(600,950,0.07,'triangle',0.07)},peg(){tone(900,700,0.03,'square',0.025)},
  store(){tone(520,520,0.08,'triangle',0.07);tone(780,780,0.12,'triangle',0.07,0.09)},
  fell(){noise(0.8,160,0.8,0.45,'lowpass');noise(0.3,700,1,0.12,'bandpass',0.1)},
  bird(){const n=2+Math.floor(Math.random()*4),b=2200+Math.random()*1800;for(let k=0;k<n;k++)tone(b*(1+Math.random()*.2),b*(1.3+Math.random()*.4),0.05+Math.random()*0.05,'sine',0.022,k*0.1)},
  bark(){tone(560,320,0.11,'sawtooth',0.03);tone(560,300,0.13,'sawtooth',0.03,0.22)},

// Hintergrund: Wind in den Kronen, Plätschern am Bach, Grillen am Abend, Vögel im Wald
function ambInit(){
  const loop=(type,freq,q)=>{const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
    const g=AC.createGain();g.gain.value=0;s.connect(f).connect(g).connect(master);s.start(0,Math.random());return{f,g}};
  amb={wind:loop('lowpass',380,0.6),bach:loop('bandpass',1500,0.8),bach2:loop('bandpass',520,1.4),t:0};
}
function ambience(dt){
  if(!AC||!amb)return;amb.t+=dt;
  let n=0,water=99;
  for(let dy=-7;dy<=7;dy+=2)for(let dx=-7;dx<=7;dx+=2){const X=P.x+dx,Y=P.y+dy;if(inb(X,Y)&&covers[idx(X,Y)].length)n++}
  for(let dy=-9;dy<=9;dy++)for(let dx=-9;dx<=9;dx++){const X=P.x+dx,Y=P.y+dy;if(inb(X,Y)){const g=ground[idx(X,Y)];if(g===G_WATER||g===G_FORD||g===G_BRIDGE)water=Math.min(water,Math.hypot(dx,dy))}}

  const gust=0.6+0.4*Math.sin(amb.t*0.23)*Math.sin(amb.t*0.071+1);
  amb.wind.g.gain.setTargetAtTime(CFG.ambWind*(0.35+dens)*gust,now,0.6);amb.wind.f.frequency.setTargetAtTime(260+260*gust,now,0.8);
  const w=water<99?Math.max(0,1-water/9)**2:0,ripple=0.7+0.3*Math.sin(amb.t*3.1)*Math.sin(amb.t*1.7);
  amb.bach.g.gain.setTargetAtTime(CFG.ambBach*w*ripple,now,0.3);amb.bach2.g.gain.setTargetAtTime(CFG.ambBach*0.6*w,now,0.5);
  const rate=dens*(evening?0.15:1);if(Math.random()<rate*dt*0.9)SFX.bird();
  if(evening&&Math.random()<dt*1.6)SFX.cricket();

const CM=32;                                   // Rand oben im Kronen-Zwischenspeicher (Kronen sitzen angehoben)
const canopyCv=document.createElement('canvas');canopyCv.width=W*T;canopyCv.height=H*T+CM;const canopyCtx=canopyCv.getContext('2d');
function sprRaw(c,name,x,y){const f=FR[name];if(f)c.drawImage(atlas,f[0],f[1],f[2],f[3],x,y,f[2],f[3])}
function renderCanopyCache(){
  const c=canopyCtx;c.clearRect(0,0,canopyCv.width,canopyCv.height);
  const vis=trees.filter(t=>t.alive&&!t.dead&&t.h>=2&&t.crown.length).sort((a,b)=>a.h-b.h||a.y-b.y);
  const jx=k=>Math.floor(hash(k)*7)-3,jy=k=>Math.floor(hash2(k)*7)-3;
  for(const t of vis){const lift=4+t.h;for(const k of t.crown){const wx=(k%W)*T-4+jx(k),wy=((k/W)|0)*T-4-lift+CM+jy(k);
    sprRaw(c,'01-krone_rand',wx-1,wy);sprRaw(c,'01-krone_rand',wx+1,wy);sprRaw(c,'01-krone_rand',wx,wy-1);sprRaw(c,'01-krone_rand',wx,wy+1)}}
  for(const t of vis){const lift=4+t.h;const v=t.sp==='eiche'?['01-krone','01-krone_eiche2']:t.sp==='birke'?['01-krone_birke','01-krone_birke2']:['01-krone_buche','01-krone_buche2'];
    for(const k of t.crown)sprRaw(c,v[(k+t.id)%2],(k%W)*T-4+jx(k),((k/W)|0)*T-4-lift+CM+jy(k))}

}
function drawCanopy(){

  c.drawImage(canopyCv,camX/SC,camY/SC+CM,cw/SC,ch/SC,0,0,cw,ch);

  c.globalCompositeOperation='destination-out';
  const g=c.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(0.6,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g;c.fillRect(px-r,py-r,2*r,2*r);c.globalCompositeOperation='source-over';

}

];
const TOUCH_STEUERKREUZ_IN=['play','menu','book','appell'];
// Tastennamen in Spieltexten durch die Knopfnamen ersetzen (nur Touch; Reihenfolge zählt, Spezielles zuerst)
const TOUCH_TEXT=[
  [/\[Leertaste\]/g,'[Aktion]'],[/Leertaste/g,'Aktion'],[/\[N\]/g,'[Buch]'],[/\[M\]/g,'[Pflock]'],[/\[L\]/g,'[Ton]'],[/\[Esc\]/g,'[✕]'],
  [/Esc schließen/g,'✕ schließen'],[/Shift\+↑↓/g,'⇧ + ↑↓'],[/Entf streichen/g,'Streichen'],[/1–6 Reiter/g,'Reiter-Knopf'],[/Enter:/g,'Fertig:'],
  [/WASD\/Pfeile laufen/g,'Steuerkreuz links: laufen'],
];
const TOUCH=matchMedia('(pointer:coarse)').matches||/[?&]touch\b/.test(location.search);
const tkPortrait=()=>TOUCH&&innerHeight>innerWidth;   // im Hochformat steht das Spiel still
let tkState,tkDir=null,tkShift=false,tkBtns=[],tkPager=null;
function tkSend(type,code){dispatchEvent(new KeyboardEvent(type,{code,key:code,shiftKey:tkShift,bubbles:true,cancelable:true}))}
function tkSetDir(d){if(d===tkDir)return;const C={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'};
  if(tkDir)tkSend('keyup',C[tkDir]);tkDir=d;if(d)tkSend('keydown',C[d]);document.getElementById('tk-dpad').dataset.d=d||''}
function touchSync(){if(!TOUCH)return;const s=G?G.state:null;if(s===tkState)return;tkState=s;
  tkSetDir(null);tkShift=false;if(s!=='card')tkPager=null;
  for(const b of tkBtns){b.el.style.display=b.in.includes(s)?'':'none';b.el.classList.remove('on')}
  document.getElementById('tk-dpad').style.display=TOUCH_STEUERKREUZ_IN.includes(s)?'':'none'}
// Tastenbelegungs-Hinweise (Legenden, Tastenkasten) fallen am Handy weg
function tkStrip(root){if(root.nodeType!==1)return;
  const hit=el=>el.matches('.keys,.legend')||(/^↑↓/.test(el.textContent.trim())&&el.textContent.length<220);
  if(hit(root)){root.remove();return}
  root.querySelectorAll('.keys,.legend,.cont,div').forEach(el=>{if(hit(el))el.remove()})}
// Karten ohne Scrollen: ist der Text länger als der Bildschirm, wird er in Seiten geteilt (Aktion oder Antippen = nächste Seite)
function tkPaginate(paper){
  if(G.state!=='card'||paper.dataset.pg)return;paper.dataset.pg='1';
  if(paper.scrollHeight<=paper.clientHeight+1)return;
  const cont=paper.querySelector(':scope>.cont'),blocks=[...paper.children].filter(c=>c!==cont),cs=getComputedStyle(paper);
  const room=paper.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-44;
  const R=blocks.map(b=>b.getBoundingClientRect()),pages=[];let cur=[],top=0;
  blocks.forEach((b,i)=>{if(cur.length&&R[i].bottom-top>room){pages.push(cur);cur=[]}if(!cur.length)top=R[i].top;cur.push(b)});
  pages.push(cur);
  if(pages.length<2)return;   // ein einzelner riesiger Block: Scrollen bleibt als Rückfall
  const tooBig=pages.some(pg=>pg.length===1&&R[blocks.indexOf(pg[0])].height>room);
  paper.style.overflowY=tooBig?'auto':'hidden';
  const ind=document.createElement('div');ind.className='cont';paper.appendChild(ind);
  let k=0;
  const show=()=>{blocks.forEach(b=>b.classList.toggle('tk-weg',!pages[k].includes(b)));const last=k===pages.length-1;
    if(cont)cont.classList.toggle('tk-weg',!last);ind.classList.toggle('tk-weg',last);ind.textContent=`[Aktion] weiterlesen (${k+1}/${pages.length})`;paper.scrollTop=0};
  const pager={paper,next(){if(k>=pages.length-1)return false;k++;show();return true}};
  paper.addEventListener('click',()=>{if(tkPager===pager)pager.next()});
  tkPager=pager;show()}
function tkTextNode(n){let v=n.nodeValue,o=v;for(const [re,r] of TOUCH_TEXT)v=v.replace(re,r);if(v!==o)n.nodeValue=v}
function tkTextTree(root){if(root.nodeType===3){tkTextNode(root);return}
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);for(let n=w.nextNode();n;n=w.nextNode())tkTextNode(n)}
if(TOUCH){
  document.documentElement.classList.add('touch');
  const pad=document.getElementById('tk-dpad'),small=document.getElementById('tk-small'),right=document.getElementById('tk-right');
  let ptr=null;
  const dirOf=e=>{const r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    if(Math.hypot(dx,dy)<r.width*0.14)return null;return Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')};
  pad.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();ptr=e.pointerId;pad.setPointerCapture(ptr);tkSetDir(dirOf(e))});
  pad.addEventListener('pointermove',e=>{if(e.pointerId===ptr)tkSetDir(dirOf(e))});
  for(const t of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(t,e=>{if(e.pointerId===ptr){ptr=null;tkSetDir(null)}});
  for(const t of TOUCH_TASTEN){
    const el=document.createElement('button');el.type='button';el.tabIndex=-1;el.className='tk'+(t.big?' big':'');el.textContent=t.label;
    (t.big?right:small).appendChild(el);tkBtns.push({el,in:t.in});
    if(t.mod){el.addEventListener('pointerdown',e=>{e.preventDefault();tkShift=!tkShift;el.classList.toggle('on',tkShift)});continue}
    let down=false;
    el.addEventListener('pointerdown',e=>{e.preventDefault();
      if(t.code==='Space'&&G.state==='card'&&tkPager&&tkPager.paper.isConnected&&tkPager.next())return;   // erst alle Seiten der Karte lesen
      el.setPointerCapture(e.pointerId);down=true;el.classList.add('down');tkSend('keydown',t.code)});
    for(const ev of ['pointerup','pointercancel'])el.addEventListener(ev,()=>{if(!down)return;down=false;el.classList.remove('down');tkSend('keyup',t.code)});
  }
  right.insertBefore(small,right.firstChild);   // kleine Knöpfe oben, große Aktion unten
  addEventListener('contextmenu',e=>e.preventDefault());
  new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')tkTextNode(m.target);else m.addedNodes.forEach(n=>{tkTextTree(n);tkStrip(n);if(n.nodeType===1&&n.classList.contains('paper'))tkPaginate(n)})}})
    .observe(document.body,{childList:true,subtree:true,characterData:true});
  tkTextTree(document.body);
  // Leitfaden: antippen klappt ihn auf/zu (anfangs zu)
  const gd=document.getElementById('guide');gd.classList.add('zu');gd.addEventListener('click',()=>gd.classList.toggle('zu'));
  // Vollbild (Android/iPad; iPhone kann das nicht – dort hilft „Zum Home-Bildschirm“)
  const fb=document.getElementById('tk-full'),de=document.documentElement,fsReq=de.requestFullscreen||de.webkitRequestFullscreen;
  const fsOn=()=>document.fullscreenElement||document.webkitFullscreenElement;
  if(fsReq){fb.style.display='block';
    fb.addEventListener('click',()=>{if(fsOn()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
      else{const r=fsReq.call(de);Promise.resolve(r).then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{})}});
    for(const ev of ['fullscreenchange','webkitfullscreenchange'])document.addEventListener(ev,()=>{fb.textContent=fsOn()?'Vollbild aus':'Vollbild'})}
}

// ================================================================ Hauptschleife
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);   // zuerst: ein Fehler unten darf die Schleife nicht anhalten
  const dt=tkPortrait()?0:Math.min(0.05,(now-last)/1000);last=now;
  if(G&&G.state==='play'){updatePlayer(dt);updateDay(dt);updateCritters(dt);try{ambience(dt)}catch(e){console.warn('Ton:',e.message)}}
  else if(G&&G.state==='appell'){updateStaff(dt);updateCritters(dt)}
  touchSync();draw(now);hud();
  if(dbgOpen&&now-dbgT>1000){dbgT=now;refreshDebug()}
}
window.__dbg={get G(){return G},get P(){return P},stats,dbgDays,CFG,get trees(){return trees},get burrows(){return burrows},get foxes(){return foxes},get staff(){return staff},sleep,nightStep};
newGame();
requestAnimationFrame(frame);
</script>
</body>
