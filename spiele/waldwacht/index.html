<!DOCTYPE html>
<!--
  Waldwacht (Arbeitstitel) – Entwurf 3: Probe-Dungeon. Top-Down-Action-Adventure im Stil von „A Link to the Past“.
  Zweck: Räume, die je eine Mechanik, einen Gegner oder ein Rätsel erproben. Linear hintereinander, alle gleich groß
  (20×15 Felder); wo ein Schlüssel oder Gegenstand nötig ist, zweigt der Raum davor eindeutig ab. Daraus wird später
  das Tutorial. Raumformen, Dungeonformen, Randomizer: erst danach.

  Räume: RAEUME (Karte als Zeichenraster, Türen je Himmelsrichtung n/o/s/w mit Ziel und Art, Texte). Neuer Raum =
  ein Eintrag mehr, Gegentür im Zielraum nicht vergessen (wird beim Start geprüft, Warnung in der Konsole).
  Türarten: offen · kampf (Gitter zu, solange Füchse da sind) · schloss (kleiner Schlüssel) · schalter (alle Platten belegt).
  Kartenzeichen: # Mauer · . Boden · L Baumstamm · S Stein · E Beerenbusch · P Baumstumpf · O Holzstapel (fest)
                 b Busch (Schwert schlägt ihn weg) · B Steinblock (schiebbar) · _ Druckplatte · T Schild
                 K Truhe · k Truhe, die erst erscheint, wenn der Kampfraum geräumt ist · f/s/g Fuchs/Silberfuchs/Glutfuchs
  Fortschritt (offene Türen, geräumte Räume, geöffnete Truhen) bleibt bei Game Over erhalten; Neustart im aktuellen Raum.

  Grafik: Held, Füchse, Gras und Hindernisse aus dem Atlas des Gutsverwalters (atlas_bauen.py → FR/ATLAS_SRC); Mauer,
  Türen, Truhe, Schild, Block, Platte, Schwert, Herzen, Schrift und Effekte in Pixeln mit der Gutsverwalter-Palette (PAL).
  Leinwand 640×480, 32 Bildschirmpixel je Feld. Spiellogik in Bildschirmpixeln, feste Schrittweite 1/60 s,
  Kollision achsengetrennt (AABB) gegen die Hindernisliste des Raums.

  Steuerung: WASD/Pfeile laufen · Leertaste: lesen/öffnen, sonst Schwert · R Neustart im Raum (nach Game Over)
  Touch (erscheint beim ersten Fingertipp): linke Hälfte Steuerstick, rechte Hälfte wie Leertaste.
  Testen: ?raum=<id> startet in einem Raum (z. B. ?raum=schieben), ?touch zeigt die Touch-Bedienung am PC.
-->

function zufall(seed) {   // mulberry32: gleicher Raum bei jedem Laden
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const ueberlappt = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const fuss = e => ({ x: e.x - e.hw, y: e.y - e.hh, w: 2 * e.hw, h: 2 * e.hh });
const rechteck = ([x, y, w, h], extra = {}) => ({ x, y, w, h, ...extra });
const zufallIn = ([a, b]) => a + Math.random() * (b - a);

// Bewegt e (Mittelpunkt x/y, halbe Fußbox hw/hh) achsenweise und schiebt es aus jedem Hindernis heraus.
// stossX/stossY merken, woran es zuletzt gestoßen ist (Block schieben, Tür aufschließen).
function bewege(e, mx, my, liste) {
  e.stossX = e.stossY = null;
  if (mx) {
    e.x += mx;
    for (const r of liste) if (ueberlappt(fuss(e), r)) { e.x = mx > 0 ? r.x - e.hw : r.x + r.w + e.hw; e.stossX = r; }
  }
  if (my) {
    e.y += my;
    for (const r of liste) if (ueberlappt(fuss(e), r)) { e.y = my > 0 ? r.y - e.hh : r.y + r.h + e.hh; e.stossY = r; }
  }
}

// Farbkarte (Zeilen aus Zeichen) → Leinwand; Kontur automatisch um alle gefüllten Pixel.
function pixelbild(zeilen, farben, kontur, massstab = 1) {
  const h = zeilen.length, w = zeilen[0].length, k = kontur ? 1 : 0;
  const [c, g] = leinwand((w + 2 * k) * massstab, (h + 2 * k) * massstab);
  const voll = (x, y) => y >= 0 && y < h && x >= 0 && x < w && zeilen[y][x] !== '.';
  for (let y = -k; y < h + k; y++) for (let x = -k; x < w + k; x++) {
    let f = null;
    if (voll(x, y)) f = farben[zeilen[y][x]];
    else if (kontur && (voll(x - 1, y) || voll(x + 1, y) || voll(x, y - 1) || voll(x, y + 1))) f = kontur;
    if (f) { g.fillStyle = f; g.fillRect((x + k) * massstab, (y + k) * massstab, massstab, massstab); }
  }
  return c;
}

// Text mit dunkler Kontur; x ist die Mitte (mitte=true) oder der linke Rand
function schreibe(text, x, y, s, farbe, mitte = true) {
  const zeichen = [...text.toUpperCase()].map(ch => (SCHRIFT[ch] || SCHRIFT[' ']).split(' '));
  const breite = zeichen.length * 6 * s - s;
  const x0 = Math.round(mitte ? x - breite / 2 : x);
  for (const [f, d] of [[PAL.schwarz, 1], [farbe, 0]]) {
    ctx.fillStyle = f;
    zeichen.forEach((z, i) => z.forEach((zeile, yy) => [...zeile].forEach((p, xx) => {
      if (p === '#') ctx.fillRect(x0 + (i * 6 + xx) * s - d * s, y + yy * s - d * s, s + 2 * d * s, s + 2 * d * s);
    })));
  }
}

}

  const hex = (d, i) => '#' + [d[i], d[i + 1], d[i + 2]].map(v => v.toString(16).padStart(2, '0')).join('');
  const kopie = name => { const f = FR[name], [c, g] = leinwand(f[2], f[3]); g.drawImage(atlas, f[0], f[1], f[2], f[3], 0, 0, f[2], f[3]); return [c, g]; };

    const [c, g] = kopie(n); g.globalCompositeOperation = 'source-in'; g.fillStyle = PAL.weiss; g.fillRect(0, 0, c.width, c.height); return c;
  });
  for (const [art, tausch] of Object.entries(FUCHSFARBEN)) FUCHSBILD[art] = ['fuchs_0', 'fuchs_1'].map(n => {
    const [c, g] = kopie(n), bild = g.getImageData(0, 0, c.width, c.height), d = bild.data;

}

// ---------- Spielzustand ----------

  for (const t of r.truhen) if (truheSichtbar(t)) liste.push(t);
  const oeffnungen = [];
  for (const d of Object.keys(r.def.tueren)) {

// ---------- Text ----------
// Seiten zu je drei Zeilen, Zeilen höchstens 46 Zeichen; Schreibmaschine, Leertaste/Tipp: zeigen bzw. weiter
function zeigeText(text, gegenstand = null) {

    const z = zeilen.length ? zeilen[zeilen.length - 1] : null;

  }

  const t = S.text, laenge = t.seiten[t.seite].join('').length;

// ---------- Raumwechsel ----------
// Am Bildrand einer offenen Tür: Bildlauf in den Nachbarraum, dann läuft der Held selbst ein Stück hinein.

  else if (d === 'n') neu.y = HOEHE - h.hh - 1; else neu.y = h.hh + 1;

// ---------- Wellenräume ----------
function freierPlatz(hw, hh) {   // zufällige Stelle im Raum: frei von Hindernissen, nicht zu nah am Helden

    if (S.festGegner.some(r => ueberlappt(fuss({ ...p, hw: hw + 4, hh: hh + 4 }), r))) continue;
    if (S.fuechse.some(f => Math.hypot(f.x - p.x, f.y - p.y) < 30)) continue;
    const d = Math.hypot(p.x - h.x, p.y - h.y);
    if (d >= CFG.welle.mindestAbstand) return p;

  if (w.warteschlange.length) {
    w.spawnUhr -= DT;
    if (w.spawnUhr <= 0) {
      const p = freierPlatz(11, 6);
      S.fuechse.push(neuerFuchs(w.warteschlange.shift(), p.x, p.y));
      S.effekte.push({ art: 'puff', x: p.x, y: p.y - 8, t: 0 });

  w.nr++; w.warteschlange = [...liste[w.nr - 1]]; w.banner = CFG.welle.banner; w.spawnUhr = CFG.welle.bannerVorlauf; w.ruhe = CFG.welle.pause;
}
function pruefeGeraeumt() {   // Kampfraum leer: Türen auf, versteckte Truhe erscheint

  if (!r.def.kampf || S.geraeumt.has(r.id) || S.einlauf) return;

  S.geraeumt.add(r.id);

// ---------- Schwert ----------
// Schwertstellung: vier Winkel je Blickrichtung, von der Seite her über die Front geschwungen (links gespiegelt)
function schwertWinkel(h) {

const heldKoerper = h => ({ x: h.x - 9, y: h.y - 22, w: 18, h: 28 });
const fuchsKoerper = f => ({ x: f.x - 13, y: f.y - 14, w: 26, h: 20 });

function starteSchlag(h) { h.modus = 'schlag'; h.t = 0; h.schlagNr++; h.anim = 0; }

// Leertaste vor einem Schild oder einer Truhe: lesen bzw. öffnen statt zuschlagen

  S.held.blick = 'runter';   // Gegenstand hochhalten, zum Betrachter gewandt

function updateHeld(h) {

    const koerper = fuchsKoerper(f), feld = felder.find(t => ueberlappt(t, koerper));
    if (!feld) continue;
    f.getroffen = h.schlagNr; f.lp--; f.blitz = CFG.fuchs.blitz; f.rueck = CFG.fuchs.rueckDauer; f.warten = 0;
    if (f.modus !== 'jagen') { f.modus = 'jagen'; f.sprungPause = CFG.arten[f.art].sprung.pause[0]; }   // Treffer unterbricht den Sprung
    let rx = f.x - h.x, ry = f.y - h.y; const l = Math.hypot(rx, ry) || 1; rx /= l; ry /= l;
    f.vx = rx * CFG.fuchs.rueckTempo; f.vy = ry * CFG.fuchs.rueckTempo;

    S.effekte.push({ art: 'funke', x: feld.x + feld.w / 2, y: feld.y + feld.h / 2, t: 0 });
    S.stopp = CFG.trefferStopp;
  }
  for (const b of S.raum.buesche) {   // Büsche: weg mit Blätterregen, manchmal ein Herz
    if (!b.da || !felder.some(t => ueberlappt(t, b))) continue;
    b.da = false;
    const x = b.x + b.w / 2, y = b.y + b.h / 2;
    S.effekte.push({ art: 'blaetter', x, y, t: 0, teile: Array.from({ length: 8 }, (_, i) => ({ a: i / 8 * Math.PI * 2 + Math.random() * 0.5, v: 50 + Math.random() * 60 })) });
    if (Math.random() < CFG.busch.herz) S.beute.push({ x, y: y + 6, t: 0 });

// ---------- Blöcke und Platten ----------
function schiebeBlock(b, dx, dy) {

  if (S.raum.bloecke.some(o => o !== b && o.c === c && o.r === r)) return;
  if (S.fest.some(o => !o.block && ueberlappt(o, ziel))) return;
  if (S.fuechse.some(f => ueberlappt(fuss(f), ziel))) return;

}

    b.bewegt.t = Math.min(1, b.bewegt.t + DT / CFG.schieben.dauer);
    b.x = b.bewegt.x0 + (b.c * T - b.bewegt.x0) * b.bewegt.t; b.y = b.bewegt.y0 + (b.r * T - b.bewegt.y0) * b.bewegt.t;

  for (const [d, t] of Object.entries(r.def.tueren)) if (t.art === 'schalter' && !S.offen.has(`${r.id}:${d}`)) oeffneTuer(d);

// ---------- Füchse ----------

}

function trenneFuechse() {   // Füchse sollen nicht ineinander laufen

  for (let i = 0; i < lebend.length; i++) for (let j = i + 1; j < lebend.length; j++) {

function pruefeBeruehrung(h) {

  const k = heldKoerper(h);

  h.unverwundbar = CFG.held.unverwundbar;

}

function pruefeBeute(h) {   // Herzen: einsammeln heilt ein ganzes Herz, nach einer Weile verschwinden sie
  const k = heldKoerper(h);

    if (S.zustand === 'spiel' && ueberlappt(k, { x: b.x - 9, y: b.y - 12, w: 18, h: 16 })) { h.lp = Math.min(S.maxLp, h.lp + 2); return false; }
    return b.t < CFG.herz.dauer;

}

  S.zustand = 'spiel'; S.held.lp = S.maxLp; S.held.unverwundbar = 0; S.text = null;
  betreteRaum(S.raum.id, S.eintritt);
}

  S.zeit += DT;
  if (S.wechsel) {
    S.wechsel.t += DT / CFG.wechsel.dauer;
    if (S.wechsel.t >= 1) S.wechsel = null;
    gedrueckt.clear(); return;
  }
  if (S.text) { updateText(); gedrueckt.clear(); return; }
  aktualisiereHindernisse();
  const h = S.held;
  if (S.zustand === 'spiel' || h.modus === 'rueckstoss') updateHeld(h);
  if (S.wechsel) { gedrueckt.clear(); return; }   // gerade in den nächsten Raum gegangen
  updateBloecke();
  steuereWellen();

  trenneFuechse();
  pruefeBeruehrung(h);
  pruefeBeute(h);
  pruefeGeraeumt();

  S.effekte = S.effekte.filter(e => e.t < (e.art === 'funke' ? 0.12 : 0.4));
  if (S.zustand !== 'spiel' && gedrueckt.has('neustart') && S.zeit - S.endeZeit > 0.8) neustartImRaum();

// ---------- Zeichnen ----------
const SCHRITTFOLGE = [1, 0, 2, 0];

    const o = w.t < 0.5 ? 2 * w.t * w.t : 1 - 2 * (1 - w.t) * (1 - w.t), [dx, dy] = RICHTUNG[w.d];
    ctx.drawImage(w.altBg, Math.round(-dx * o * BREITE), Math.round(-dy * o * HOEHE));
    ctx.drawImage(S.raum.bg, Math.round(dx * (1 - o) * BREITE), Math.round(dy * (1 - o) * HOEHE));
    const ax = w.p0.x - dx * o * BREITE, ay = w.p0.y - dy * o * HOEHE, bx = h.x + dx * (1 - o) * BREITE, by = h.y + dy * (1 - o) * HOEHE;
    ctx.save(); ctx.translate(Math.round(ax + (bx - ax) * o - h.x), Math.round(ay + (by - ay) * o - h.y)); zeichneHeld(h); ctx.restore();
    zeichneHud(h);
    return;
  }
  ctx.drawImage(S.raum.bg, 0, 0);
  zeichneWelt();
  zeichneHud(h);
  zeichneBanner();
  if (S.text) zeichneText();
  if (S.zustand !== 'spiel') zeichneEnde();
}

// ---------- Schleife & Skalierung ----------
// Tastatur: Platz für die Hilfezeile. Touch hochkant: Spielfeld oben, Bedienung darunter.
// Touch quer: links und rechts Rand für Stick und Aktionsknopf (darf das Spielfeld etwas überdecken).
function skaliere() {
  const w = innerWidth, h = innerHeight, hochkant = h > w;
  document.body.classList.toggle('hochkant', TOUCH.aktiv && hochkant);
  let s;
  if (!TOUCH.aktiv) s = Math.min(w / BREITE, (h - document.querySelector('.hilfe').offsetHeight - 30) / HOEHE);
  else if (hochkant) s = Math.min((w - 8) / BREITE, (h - 240) / HOEHE);
  else s = Math.min((w - 2 * 130) / BREITE, h / HOEHE);
  if (s >= 1) s = Math.floor(s);   // ganzzahlig, damit die Pixel gleich groß bleiben
  cv.style.width = BREITE * s + 'px'; cv.style.height = HOEHE * s + 'px';
}
addEventListener('resize', skaliere);

let vorher = 0, rest = 0;
function schleife(jetzt) {
  rest = Math.min(rest + (jetzt - vorher) / 1000, 0.25); vorher = jetzt;
  while (rest >= DT) { schritt(); rest -= DT; }
  zeichne();
  requestAnimationFrame(schleife);
}

atlas.onload = () => {
  baueFuchsbilder();
  neuesSpiel(RAEUME[PARAM.get('raum')] ? PARAM.get('raum') : START_RAUM);
  skaliere();
  requestAnimationFrame(t => { vorher = t; schleife(t); });
};
atlas.src = ATLAS_SRC;
</script>
