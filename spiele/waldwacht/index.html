<!DOCTYPE html>
<!--
  Waldwacht (Arbeitstitel) – Entwurf 10: datengetriebene Engine mit Editor, Gegnern aus Bausteinen und Phasen, Waffen, Logikprüfung und Nachweisen. Top-Down-Action-Adventure im Stil von „A Link to the Past“.

  Trennung: Der Code kennt nur allgemeine Bausteine (Kacheln, Objekt-Eigenschaften, Gegner-Verhalten, Bedingungen).
  Alles Konkrete steht als reines JSON im Block <script id="spieldaten">: Einstellungen, Kacheln, Zeichen-Legende,
  Objektarten, Gegnerarten, Gegenstände und die Dungeons mit ihren Räumen. Ziel: ein Editor schreibt später genau dieses JSON.

  Daten (Kurzreferenz, Details im JSON selbst):
    kacheln      Zeichen → Gelände: mauer | boden | abgrund
    zeichen      Zeichen → { objekt: <objektart>, ...Parameter } oder { gegner: <gegnerart> }; je Raum ergänzbar (raum.zeichen)
    objektarten  Eigenschaften, die die Engine kennt:
                   bild ("@intern" oder Atlasname) · bilder+kette (gleiche Zeichen nebeneinander = ein Objekt) · fest [x,y,w,h]
                   schneidbar {herz} · schiebbar · lesbar (text) · oeffnbar (inhalt) · platte (signal, wer: block|alle, merken)
                   kristall (kristalltyp; Schwert: nächste Farbe) · pflock (kristalltyp + farbe: oben, wenn der Typ diese
                   Farbe zeigt; ohne kristalltyp: oben_wenn, z. B. Sperre {"nicht": "signal"}) · leuchtet {radius, staerke} (an, an_wenn)
                 Parameter je Objekt: sichtbar_wenn, an_wenn, oben_wenn, merken (einmal wahr = bleibt wahr), spiegeln
    waffen       { id: {name, art: stich|schwung, laenge (px), schaden, dauer (s), rueckstoss (Faktor), schneidet (Büsche),
                 reflektiert (Kugeln zurückschlagen), aufladen {zeit, schaden} (halten → Kreisschwung)} } – jede Waffe ist zugleich ein
                 Gegenstand gleichen Namens (Truhen-Inhalt), Startwaffe: dungeon.start.waffe oder einstellungen.held.waffe
    kristalltypen  { id: {name, farben: [Farbe…]} } – Farben in Schaltreihenfolge, die erste gilt zu Beginn. Der Zustand
                 gilt im ganzen Dungeon: alle Kristalle eines Typs zeigen dieselbe Farbe und schalten gemeinsam weiter.
    gegnerarten  bild, farben (Farbtausch), lp, tempo, schaden, fuss, koerper, beute {herz}, groesse, gewicht (Rückstoß-Faktor,
                 0 = unbeweglich), abgrundfest (lässt sich nicht in Abgründe stoßen). Verhalten aus Bausteinen, alle optional:
                   ki {wegfindung, reihe (Angriffs-Reihenfolge), abstand: abstossen|draengen}
                   bemerkt {art: immer|sicht|kegel|geraeusch|beruehrung, weite, kegel (Grad), nurLicht}
                   ruhig: stehen|pendeln_w|pendeln_s|patrouille|umherirren · alarm: jagen|fliehen|bleiben|schleichen
                   Angriffe sprung|schuss|rammen|stampfen {reichweite, zielen (Ankündigung), pause [von, bis], …}
                   schild {drehtempo} · ruestung: schlag|betaeubt · teilen {art, anzahl} · explodiert {zeit, radius, schaden}
                   unverwundbar · benommen · serienschutz {treffer, zeit, dauer, konter, schaden} · ausweichen {chance, tempo, abklingzeit}
                   signal (beim Besiegen) · boss {name} · balken: aus|klein|gross
                 phasen [{name, …Bausteine (null = aus), tempoFaktor, pauseFaktor, eintritt {text, ruft, unverwundbar},
                   weiter [{wenn: zeit|zufall|lp|angriff|treffer|signal, …, ziel: Nr|"zufall"}]}] · wendepunkte [{wenn: lp|signal, ziel, text, ruft}]
    gegenstaende bild, text, wirkung {schluessel|laterne|…: Anzahl, maxLp, heilen}, leuchtet (Held trägt Licht)
    dungeons     titel, start {raum, feld}, raeume { id: raum }
    raum         nr, titel, licht (Stufe oder 0..1), lichtkarte (Ziffern 0–9 je Feld), kampf (geräumt bleibt geräumt),
                 karte (15 Zeilen × 20 Zeichen), zeichen, objekte [{objekt, feld:[c,r], …}], gegner [{gegner, feld}],
                 gegner [{gegner, feld, signal, weg [[c,r]…], blick, traegt (Gegenstand: fällt beim Besiegen heraus)}],
                 tueren {n|o|s|w: {ziel, schloss (true | "gross"), riegel, braucht (Gegenstand), offen_wenn, merken}}, wellen [[gegnerart…]…], einstieg (Text),
                 je Wand bis zu drei Türen: n1 n n3 (links, Mitte, rechts), w1 w w3 (oben, Mitte, unten), ebenso s und o;
                 die Gegentür liegt an derselben Stelle der Nachbarwand (n1 ↔ s1, o3 ↔ w3),
                 ereignisse [{wenn, wiederholen, schritte [{art: signal|warte|warteBis|text|ende, signal, wert, s, wenn, text}]}]
                 (ende: der Dungeon ist geschafft – nach dem letzten Text kommt der Abspann)
                 (ältere Form {wenn, text, setze}); Platten optional nachlauf (Sekunden: Zeitschalter)
  Bedingungen: "signal" · {"alle": [...]} · {"eine": [...]} · {"nicht": ...}. Eingebaut: "geraeumt" (keine Gegner mehr, Wellen fertig),
               "<kristalltyp>=<farbe>" (z. B. "kristall=orange": der Typ zeigt gerade diese Farbe).
  Signale kommen von Platten (solange belegt, mit merken dauerhaft), Kristallen (siehe oben), Ereignissen (setze),
  besiegten Gegnern (signal an der Art oder am einzelnen Gegner; solche Gegner kommen nicht wieder, Bosse auch nicht).
  Ein Signal gilt im ganzen Dungeon, nur „Platte gerade belegt“ wirkt allein im eigenen Raum.
  Bedingungen können auch Gegenstände abfragen: "hat:laterne". Nachweise (dungeon.nachweise {raum: {fp, erreicht}}) halten fest,
  welche Ziele eines Raums (Türen, Truhen) ein Testlauf aus dem Editor erreicht hat (raumZiele, raumFingerabdruck).
  Logik: pruefeLogik(DATEN, dungeonId) spielt einen Dungeon gedanklich durch (Stufen/Sphären, Schlüssel, Signale) und meldet
  unerreichbare Räume mit Grund, Schlüssel-Fallen und Räume ohne Rückweg (der Editor zeigt das als Prüfstatus und Reiter „Logik“).
  Licht: je Feld ein Wert 0..1 aus Raumstufe/Lichtkarte, dazu Lichtquellen (Fackeln, Laterne, eigener Schein); lichtBei(x, y)
  liefert ihn für spätere Spielregeln – bisher wirkt Dunkelheit nur auf die Darstellung.

  Engine: Leinwand 640×480, 32 px je Feld, feste Schrittweite 1/60 s, Kollision achsengetrennt (AABB).
  Grafik: Held, Füchse, Gras, Hindernisse, Laterne aus dem Gutsverwalter-Atlas (atlas_bauen.py → FR/ATLAS_SRC);
  Mauer, Abgrund, Türen, Truhe, Schild, Block, Platte, Kristall, Pflöcke, Fackel, Schwert, Herzen, Schrift in Pixeln (PAL).

  Steuerung: WASD/Pfeile laufen · Leertaste: lesen/öffnen, sonst Schwert · R Neustart im Raum (nach Game Over) · M Ton · Esc Menü
  Touch (erscheint beim ersten Fingertipp): linke Hälfte Steuerstick, rechte Hälfte wie Leertaste, im Menü Eintrag antippen.
  Editor: Menüeintrag EDITOR lädt editor.js (Dungeons, Räume, Objekte, Gegner, Gegnerarten), CREATOR dazu creator.js (planen in
  Arbeitsschritten, Plan in dungeon.plan – vom Spiel nicht gelesen), Löser loeser.js; gespeichert wird im Browser
  (localStorage, EIGENE_SCHLUESSEL) im selben Format, eigene Dungeons erscheinen im Menü. Export/Import als JSON-Datei.
  Spielstand: je Dungeon im Browser (localStorage waldwacht.stand.<id>), sobald er aus dem Menü gestartet wurde; im Menü dann
  „Weiterspielen / Neues Spiel“. Optionen (localStorage waldwacht.optionen): Sprache, Schwierigkeit (normal: nach Tod oder
  Neuladen weiter im Raum; classic: zurück zum Eingang des Dungeons, Fortschritt bleibt) und Bild (scharfe Pixel / Rahmen füllen).
  Einzelspiel: steht in den Spieldaten "einzelspiel": {"dungeon": <id>}, zeigt das Menü nur diesen Dungeon (Weiterspielen /
  Neues Spiel / Optionen) und kennt weder Editor noch eigene Dungeons – so entsteht mit werkzeuge/einzelspiel.py z. B. die
  Fuchsfeste als eigenes Spiel (itch.io).
  sprachen {<code>: {name, texte, daten}}: die erste Sprache ist die, in der Code und Daten geschrieben sind (Deutsch);
                 jede weitere bringt "texte" (Bildschirmtexte der Engine – im Code immer tx('deutscher Text')) und "daten"
                 (Titel, Schilder, Ereignisse, Namen der Dungeons: deutscher Text → Übersetzung) mit. Fehlt eine Übersetzung,
                 bleibt der deutsche Text. Gibt es mehrere Sprachen, fragt das Spiel beim ersten Start und unter „Optionen“.
                 Die Pixelschrift kann nur Großbuchstaben, Ziffern, ÄÖÜ und : ! . - , ? / ' ( ) >.
  Testen: ?dungeon=<id>&raum=<id> startet direkt (z. B. ?dungeon=hain&raum=kristall), ?touch zeigt die Touch-Bedienung am PC.
-->

<style>
  html,body{margin:0;height:100%;background:#120d14;color:#a9b2b0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  .hilfe{margin:0;text-align:center}
  kbd{display:inline-block;padding:0 5px;border:1px solid #454a55;border-radius:4px;background:#1c1e26;color:#ece8d6;font:inherit}
  html,body{touch-action:none}   /* muss vor dem ersten Finger feststehen, sonst bricht der Browser die Geste ab */
  body.touch{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  body.touch .hilfe{display:none}
  body.hochkant{justify-content:flex-start;padding-top:max(8px,env(safe-area-inset-top))}
  .tb{display:none;position:fixed;pointer-events:none;border-radius:50%;box-sizing:border-box}
  body.touch .tb{display:block}
  #stick{left:28px;bottom:28px;width:120px;height:120px;border:3px solid rgba(236,232,214,.35);background:rgba(18,13,20,.35);opacity:.5}
  #stick.an{opacity:1;bottom:auto;transform:translate(-50%,-50%)}
  #stick:not(.an){bottom:max(28px,env(safe-area-inset-bottom))}
  #knauf{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(236,232,214,.75);border:3px solid #120d14}
  #schlagknopf{right:max(28px,env(safe-area-inset-right));bottom:max(40px,env(safe-area-inset-bottom));width:96px;height:96px;
    border:3px solid #120d14;background:rgba(208,87,74,.75);color:#fffbec;font:bold 15px/90px sans-serif;text-align:center}
  #schlagknopf.an{background:rgba(244,205,94,.9);transform:scale(.92)}
  #neustartknopf{right:max(46px,env(safe-area-inset-right));bottom:max(156px,env(safe-area-inset-bottom));width:56px;height:56px;
    border:3px solid #120d14;background:rgba(18,13,20,.55);color:#fffbec;font:bold 28px/50px sans-serif;text-align:center}
  #neustartknopf.an{background:rgba(244,205,94,.9);color:#120d14}
  body.editor>canvas,body.editor>.hilfe,body.editor>.tb{display:none!important}
</style>

      "daten": {
        "Kleiner Schlüssel": "Small Key",
        "Du hast einen kleinen Schlüssel gefunden! Er öffnet eine verschlossene Tür.": "You found a small key! It opens a locked door.",

        "Ein Herzcontainer! Du hast jetzt ein Herz mehr, und alle Herzen sind wieder voll.": "A heart container! You now have one more heart, and all your hearts are full again.",
        "Großer Schlüssel": "Big Key",
        "Der große Schlüssel! Er öffnet die verzierte Tür zum Herz des Dungeons.": "The big key! It opens the ornate door to the heart of the dungeon.",
        "Laterne": "Lantern",
        "Du hast eine Laterne gefunden! In dunklen Räumen leuchtet sie dir den Weg.": "You found a lantern! It lights your way in dark rooms.",
        "Dolch": "Dagger",

        "DER KÖNIG WIRD WÜTEND!": "THE KING GROWS ANGRY!",
        "PANZERKEILER": "ARMORED BOAR",
        "TURMEULE": "TOWER OWL",
        "Lauern": "Lurking",

        "DIE EULE WIRD ZORNIG!": "THE OWL IS FURIOUS!",
        "SCHATTENFUCHS": "SHADOW FOX",
        "Schattenwut": "Shadow rage",
        "DER SCHATTEN ERWACHT!": "THE SHADOW AWAKENS!",
        "LETZTE KRAFT!": "LAST STAND!",
        "GRUBENKEILER": "PIT BOAR",
        "SCHILDWACHE": "SHIELD GUARD",
        "Wache": "Guard",
        "DIE WACHE RUFT VERSTÄRKUNG!": "THE GUARD CALLS FOR HELP!",
        "KRISTALLWÄCHTER": "CRYSTAL WARDEN",
        "Blauer Panzer": "Blue armor",
        "Offen": "Open",
        "Oranger Panzer": "Orange armor",
        "DER WÄCHTER WIRD RASEND!": "THE WARDEN GOES BERSERK!",
        "DIE FUCHSFESTE": "THE FOX FORTRESS",
        "23 Räume, zwei Zwischenbosse": "23 rooms, two mini-bosses",
        "TORHALLE": "GATE HALL",
        "Die Fuchsfeste! Ganz oben haust der Schattenfuchs. Du hast nur einen Dolch - such dir unterwegs ein Schwert. Leertaste: zustechen, lesen, öffnen.": "The Fox Fortress! The Shadow Fox lives at the very top. You only have a dagger - find a sword along the way. Space: stab, read, open.",
        "Westen: Brunnenstube. Norden: Dornenhof. Der Ostflügel ist von der anderen Seite verriegelt - irgendwann kommst du von dort zurück.": "West: Well Room. North: Thorn Yard. The east wing is bolted from the other side - one day you will come back that way.",
        "BRUNNENSTUBE": "WELL ROOM",
        "Ein Kristallschalter: schlag ihn, dann tauschen blaue und orange Pflöcke. Seine Farbe gilt in der ganzen Feste!": "A crystal switch: strike it and the blue and orange pegs swap. Its color counts throughout the whole fortress!",
        "DORNENHOF": "THORN YARD",
        "Büsche versperren den Weg. Stich sie mit dem Dolch weg - manchmal steckt ein Herz darin.": "Bushes block the way. Cut them down with your dagger - sometimes there is a heart inside.",
        "Die Tür im Norden ist verschlossen. Den Schlüssel bewachen Füchse in der Wachstube im Westen.": "The north door is locked. Foxes guard the key in the guard room to the west.",
        "WACHSTUBE": "GUARD ROOM",
        "Die Tür fällt zu! Besiege die Wachen - dann zeigt sich, was sie bewachen.": "The door slams shut! Defeat the guards - then you will see what they are guarding.",
        "BLOCKSAAL": "BLOCK HALL",
        "Schieb den Steinblock auf die Platte: dagegen laufen und weiterdrücken. Steckt er fest, verlass den Raum und komm zurück.": "Push the stone block onto the plate: walk into it and keep pushing. If it gets stuck, leave the room and come back.",
        "ABGRUNDSTEG": "CHASM WALK",
        "Schmale Stege über dem Abgrund. Stoß die Füchse hinunter - aber pass auf, dass sie dich nicht hinunterstoßen!": "Narrow walkways over the chasm. Knock the foxes off - but don't let them knock you off!",
        "FINSTERER GANG": "DARK PASSAGE",
        "Finsternis. Irgendwo in der Mitte liegt eine Platte, die die Fackeln entzündet. Wächter sehen nur nach vorn.": "Darkness. Somewhere in the middle lies a plate that lights the torches. Sentries only look straight ahead.",
        "KRISTALLWACHE": "CRYSTAL WATCH",
        "Blaue Pflöcke oben, orange unten. Du brauchst beide Wege - und denk an die Brunnenstube: Die Farbe gilt überall.": "Blue pegs at the top, orange at the bottom. You need both paths - and remember the Well Room: the color counts everywhere.",
        "BLOCKGRABEN": "BLOCK TRENCH",
        "Zwei Blöcke, zwei Reihen Graben. Erst den unteren hinein, dann den oberen hinterher.": "Two blocks, two rows of trench. Push the lower one in first, then the upper one after it.",
        "ZEITSTEG": "TIMED BRIDGE",
        "Zeitschalter! Die Tür im Süden bleibt nach dem Loslassen nur kurz offen. Lauf!": "A timed plate! The south door only stays open for a moment after you step off. Run!",
        "OSTWACHE": "EAST WATCH",
        "Knaller explodieren kurz nach dem Treffer - weg da! Ihre Explosion trifft auch andere Gegner.": "Poppers explode shortly after being hit - get away! Their blast hits other enemies too.",
        "OSTFLÜGEL": "EAST WING",
        "Der Riegel zur Torhalle lässt sich von hier aufschieben - eine Abkürzung zurück zum Eingang.": "From here you can slide back the bolt to the Gate Hall - a shortcut back to the entrance.",
        "ZWISCHENHALLE": "MIDDLE HALL",
        "Das Tor im Norden öffnet sich nur für ein Schwert. Hinter der verschlossenen Tür im Westen haust der Panzerkeiler - er bewacht eines.": "The north gate only opens for a sword. Behind the locked door to the west lives the Armored Boar - he guards one.",
        "KEILERHÖHLE": "BOAR'S DEN",
        "Der Panzerkeiler! Sein Panzer ist zu hart für deinen Dolch. Lass ihn gegen Wand oder Säule rennen - benommen ist er verwundbar.": "The Armored Boar! His armor is too tough for your dagger. Make him charge into a wall or pillar - while dazed he is vulnerable.",
        "Der Keiler ist erledigt! In der Truhe glänzt ein Schwert.": "The boar is beaten! A sword gleams in the chest.",
        "SCHÜTZENGALERIE": "ARCHER GALLERY",
        "Die Schützen stehen auf Inseln. Schlag ihre Kugeln mit dem Schwert zurück! Fallen beide, öffnet sich das Tor.": "The archers stand on islands. Knock their orbs back with your sword! Once both fall, the gate opens.",
        "WÄCHTERSAAL": "SENTRY HALL",
        "Wächter sehen nur nach vorn. Erwisch den Hauptmann oben - fällt er, erscheint der Schlüssel.": "Sentries only look straight ahead. Catch the captain at the top - when he falls, the key appears.",
        "KREUZUNG": "CROSSROADS",
        "Norden: Thronsaal - nur mit dem großen Schlüssel. Westen und Osten: verschlossen. Den großen Schlüssel hütet die Turmeule im Osten.": "North: Throne Room - big key only. West and east: locked. The Tower Owl in the east guards the big key.",
        "ZEITLAUF": "RACE THE CLOCK",
        "Die Platte unten rechts öffnet das Tor im Westen - aber nur kurz.": "The plate at the bottom right opens the west gate - but only briefly.",
        "SPRÖSSLINGSNEST": "SPLITTER NEST",
        "Ein Nest! Teiler zerfallen in zwei. Halte die Taste gedrückt, bis das Schwert funkelt - loslassen räumt rundum auf.": "A nest! Splitters break in two. Hold the button until your sword sparkles - let go to clear everything around you.",
        "DREIKLANG": "TRIAD",
        "Drei Farben: Rot, Grün, Blau. Jeder Schlag schaltet alle Kristalle eine Farbe weiter. Pflöcke stehen, solange ihre Farbe leuchtet.": "Three colors: red, green, blue. Every strike moves all crystals on to the next color. Pegs stay up while their color is lit.",
        "EULENTURM": "OWL TOWER",
        "Die Turmeule thront über dem Abgrund - unerreichbar für jede Klinge. Schlag ihre Kugeln mit dem Schwert zurück! Die Säulen geben Deckung.": "The Tower Owl perches above the chasm - out of reach of any blade. Knock its orbs back with your sword! The pillars give cover.",
        "VORKAMMER": "ANTECHAMBER",
        "Der Schattenfuchs schimmert, solange er angreift - dann prallt alles ab. Warte, bis er erschöpft ist. Knaller-Explosionen treffen ihn immer.": "The Shadow Fox shimmers while it attacks - then everything bounces off. Wait until it is exhausted. Popper blasts always hit it.",
        "THRONSAAL": "THRONE ROOM",
        "Der Schattenfuchs! Das Ende der Fuchsfeste.": "The Shadow Fox! The end of the Fox Fortress.",
        "Der Schattenfuchs ist besiegt - die Fuchsfeste ist befreit! Danke fürs Spielen.": "The Shadow Fox is defeated - the Fox Fortress is free! Thanks for playing."
      }
    }
  }
}
</script>

// ---------- Grundmaße ----------
const T = 32, SPALTEN = 20, ZEILEN = 15, BREITE = 640, HOEHE = 480, DT = 1 / 60;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DATEN = JSON.parse(document.getElementById('spieldaten').textContent);
const CFG = DATEN.einstellungen;
// Texte stehen in der ersten Sprache (Deutsch) im Code und in den Daten; "sprachen" in den Spieldaten liefert je weitere Sprache
// "texte" (Bildschirmtexte der Engine) und "daten" (Texte der Dungeons) als Übersetzung. Fehlt eine, bleibt der Text. {0} {1} … sind Werte.
let UEBERSETZUNG = {};
const tx = (s, ...w) => s == null ? '' : String(UEBERSETZUNG[s] || s).replace(/\{(\d)\}/g, (_, i) => w[i]);

// Farben aus der Gutsverwalter-Palette
const PAL = {
  schwarz: '#120d14', nacht: '#1c1e26', fels0: '#2e313b', fels1: '#454a55', fels2: '#626a72', fels3: '#848e92',
  fels4: '#a9b2b0', fels5: '#cfd6cf', weiss: '#fffbec', creme: '#ece8d6',
  moos0: '#1f4226', moos1: '#2a552c', moos2: '#376a31', moos3: '#467f36', moos4: '#58933b', moos5: '#8abd4f',
  holz0: '#5e3826', holz1: '#7a4b2e', holz2: '#986438', gold0: '#b5761e', gold1: '#e0a33a', gold2: '#f4cd5e',
  rot0: '#3e1420', rot1: '#a3343a', rot2: '#d0574a', rosa: '#f2c6a2',
  blau0: '#3f5190', blau1: '#5a70b0', blau2: '#8098cc', blau3: '#7fbcdc',
};

// Bis zu drei Türen je Wand an festen Stellen: n/s/w/o ist die Mitte, mit 1 links bzw. oben, mit 3 rechts bzw. unten
// (n1 n n3 · w1 w w3 …). Nord 2×2 Felder (Mauer ist oben zwei Felder dick), sonst 2 Felder breit. Gegentür: gleiche
// Stelle auf der anderen Seite (n1 ↔ s1, w3 ↔ o3), damit die Räume nahtlos aneinanderpassen.
const TUER_SPALTE = { 1: 5, 2: 9, 3: 13 }, TUER_ZEILE = { 1: 3, 2: 7, 3: 11 };
const TUER_RECHTECK = {}, RICHTUNG = {}, GEGENUEBER = {}, BLICK_VON = {};
for (const [seite, gegen, richtung, blick] of [['n', 's', [0, -1], 'hoch'], ['s', 'n', [0, 1], 'runter'], ['w', 'o', [-1, 0], 'links'], ['o', 'w', [1, 0], 'rechts']])
  for (const nr of ['1', '', '3']) {
    const d = seite + nr, c = TUER_SPALTE[nr || 2], r = TUER_ZEILE[nr || 2];
    TUER_RECHTECK[d] = seite === 'n' ? [c * T, 0, 2 * T, 2 * T] : seite === 's' ? [c * T, 14 * T, 2 * T, T] : seite === 'w' ? [0, r * T, T, 2 * T] : [19 * T, r * T, T, 2 * T];
    RICHTUNG[d] = richtung; GEGENUEBER[d] = gegen + nr; BLICK_VON[d] = blick;
  }
const TUERSEITE = d => d[0];   // n1 → n
const TUERNAME = d => ({ n: 'Nord', s: 'Süd', w: 'West', o: 'Ost' })[d[0]] + (d[1] === '1' ? (d[0] === 'n' || d[0] === 's' ? ' links' : ' oben') : d[1] === '3' ? (d[0] === 'n' || d[0] === 's' ? ' rechts' : ' unten') : '');
const WINKEL = { rechts: 0, runter: 90, links: 180, hoch: 270 };

// ---------- Hilfen ----------
function zufall(seed) {   // mulberry32: gleicher Raum bei jedem Laden
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const ueberlappt = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const fuss = e => ({ x: e.x - e.hw, y: e.y - e.hh, w: 2 * e.hw, h: 2 * e.hh });
const rechteck = ([x, y, w, h], extra = {}) => ({ x, y, w, h, ...extra });
const zufallIn = ([a, b]) => a + Math.random() * (b - a);
const feldVon = (x, y) => [Math.floor(x / T), Math.floor(y / T)];
function leinwand(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }

// Bewegt e (Mittelpunkt x/y, halbe Fußbox hw/hh) achsenweise und schiebt es aus jedem Hindernis heraus.
// stossX/stossY merken, woran es zuletzt gestoßen ist (Block schieben, Tür aufschließen).
function bewege(e, mx, my, liste) {
  e.stossX = e.stossY = null;
  if (mx) {
    e.x += mx;
    for (const r of liste) if (ueberlappt(fuss(e), r)) { e.x = mx > 0 ? r.x - e.hw : r.x + r.w + e.hw; e.stossX = r; }
  }
  if (my) {
    e.y += my;
    for (const r of liste) if (ueberlappt(fuss(e), r)) { e.y = my > 0 ? r.y - e.hh : r.y + r.h + e.hh; e.stossY = r; }
  }
}

// ---------- Kristalltypen ----------
const kristallTyp = id => DATEN.kristalltypen[id] || { name: id, farben: ['blau', 'orange'] };
function migriereGegnerart(a) {   // ältere Daten: boss.phasen [{ab, tempo, pause, ruft, text}] → phasen + wendepunkte
  const alt = a.boss && a.boss.phasen;
  if (!alt || a.phasen) { if (a.boss) delete a.boss.phasen; return a; }
  let t = 1, p = 1;
  a.phasen = [{ name: 'Start' }, ...alt.map((ph, i) => ({ name: 'Phase ' + (i + 2), tempoFaktor: +(t *= ph.tempo || 1).toFixed(2), pauseFaktor: +(p *= ph.pause || 1).toFixed(2) }))];
  a.wendepunkte = alt.map((ph, i) => ({ wenn: 'lp', unter: ph.ab, ziel: i + 1, ...(ph.text ? { text: ph.text } : {}), ...(ph.ruft ? { ruft: ph.ruft } : {}) }));
  delete a.boss.phasen;
  return a;
}
function migriereObjekt(o) {   // ältere Daten: Kristall mit signal, Pflock mit oben_wenn → Kristalltyp und Farbe
  const art = DATEN.objektarten[o.objekt];
  if (!art) return o;
  if (art.kristall && o.kristalltyp === undefined) { o.kristalltyp = o.signal || 'kristall'; delete o.signal; }
  if (art.pflock && o.kristalltyp === undefined) {
    const b = o.oben_wenn, typ = typeof b === 'string' ? b : b && typeof b.nicht === 'string' ? b.nicht : null;
    if (typ && (DATEN.kristalltypen[typ] || typ === 'kristall')) { const f = kristallTyp(typ).farben; o.kristalltyp = typ; o.farbe = typeof b === 'string' ? f[1] : f[0]; delete o.oben_wenn; }   // sonst: Sperrpflock über ein Signal
  }
  return o;
}
// Welche Signale eine Bedingung abfragt (für die Prüfung und den Editor)
function bedingungsSignale(b, liste = []) {
  if (typeof b === 'string') liste.push(b);
  else if (b && typeof b === 'object') for (const t of [b.nicht, ...(b.alle || []), ...(b.eine || [])]) if (t !== undefined) bedingungsSignale(t, liste);
  return liste;
}
// Alle Signale eines Dungeons: wer sie auslöst (Platten, Ereignisse, Kristalltypen) und wer sie abfragt
function dungeonSignale(d, dg) {

// Verhalten einer Gegnerart in einer Phase: Phase überschreibt die Art, null schaltet einen Baustein ab (siehe Phasen)

  const v = {};
  for (const k of VERHALTEN) { const w = phase && k in phase ? phase[k] : a[k]; if (w !== null && w !== undefined) v[k] = w; }
  return v;

// ---------- Daten prüfen ----------

// ---------- Spielstand ----------

  const a = Math.min(1, (S.zeit - S.endeZeit) / 0.6), blinkt = Math.floor(S.zeit * 2) % 2 === 0;
  if (S.zustand === 'sieg') {   // Abspann: geschafft, Spielzeit, Truhen, Herzen
    ctx.fillStyle = `rgba(18,13,20,${0.8 * a})`; ctx.fillRect(0, 0, BREITE, HOEHE);
    if (a < 1) return;
    schreibe(tx('GESCHAFFT!'), BREITE / 2, 110, 6, PAL.gold2);
    schreibe(tx(S.dungeon.titel), BREITE / 2, 170, 3, PAL.creme);
    schreibe(tx('SPIELZEIT  {0}', zeitText(S.endeSpielzeit || 0)), BREITE / 2, 235, 2, PAL.fels4);
    schreibe(tx('TRUHEN  {0} VON {1}', S.truhen.size, truhenImDungeon(S.dungeon)), BREITE / 2, 265, 2, PAL.fels4);
    schreibe(tx('HERZEN  {0}', S.maxLp / 2), BREITE / 2, 295, 2, PAL.fels4);
    if (S.zeit - S.endeZeit > 1.5 && blinkt) schreibe(tx(TOUCH.aktiv ? 'TIPPEN: ZURÜCK ZUM TITEL' : 'LEERTASTE: ZURÜCK ZUM TITEL'), BREITE / 2, 380, 2, PAL.creme);
    return;
  }
  ctx.fillStyle = `rgba(18,13,20,${0.65 * a})`; ctx.fillRect(0, 0, BREITE, HOEHE);
  if (a < 1) return;
  schreibe('GAME OVER', BREITE / 2, 170, 6, PAL.rot2);
  if (blinkt) schreibe(tx(classic() ? (TOUCH.aktiv ? 'TIPPEN: ZURÜCK ZUM EINGANG' : 'TASTE R: ZURÜCK ZUM EINGANG') : (TOUCH.aktiv ? 'TIPPEN: RAUM NEU BEGINNEN' : 'TASTE R: RAUM NEU BEGINNEN')), BREITE / 2, 260, 2, PAL.creme);
}
function zeichneWelt() {
  const h = S.held, r = S.raum;
  for (const k of r.gefuellt) { const [c, rr] = k.split(','); ctx.drawImage(BLOCK_VERSENKT, c * T, rr * T); }
  for (const d of Object.keys(r.def.tueren)) if (r.tuerZu[d]) zeichneTuer(d, r.def.tueren[d]);
  for (const o of r.objekte) if (flachesObjekt(o)) zeichneObjekt(o);
  for (const b of S.beute) zeichneBeute(b);
  for (const l of Object.values(S.liegt)) if (l.raum === r.schluessel && GEGENSTANDBILD[l.id]) {   // fallengelassener Gegenstand, leicht schwebend
    schatten(l.x, l.y + 4, 12); ctx.drawImage(GEGENSTANDBILD[l.id], Math.round(l.x - 10), Math.round(l.y - 22 - Math.abs(Math.sin(S.zeit * 3)) * 3), 20, 20);
  }
  for (const g of S.gegner) if (g.warten <= 0 && g.faellt === undefined) schatten(g.x, g.y + 6 * g.s, 22 * g.s);
  zeichneWarnungen();
  if (h.modus !== 'fallen') schatten(h.x, h.y + 6, 18);
  // nach unterer Kante sortiert: Objekte, Gegner und Held verdecken sich richtig
  const liste = [
    ...r.objekte.filter(o => !flachesObjekt(o) && sichtbar(o)).map(o => { const f = festVon(o); return { y: f ? f.y + f.h : o.y + T, mal: () => zeichneObjekt(o) }; }),
    ...S.gegner.map(g => ({ y: g.y + g.hh, mal: () => zeichneGegner(g) })),
    { y: h.y + h.hh + 0.5, mal: () => zeichneHeld(h) },
  ];
  liste.sort((a, b) => a.y - b.y).forEach(e => e.mal());
  zeichneGeschosse();
  zeichneEffekte();
}
function zeichne() {
  ctx.imageSmoothingEnabled = false;
  const h = S.held, w = S.wechsel;
  if (w) {   // Bildlauf: alter Raum schiebt hinaus, neuer herein, der Held wandert mit
    const o = w.t < 0.5 ? 2 * w.t * w.t : 1 - 2 * (1 - w.t) * (1 - w.t), [dx, dy] = RICHTUNG[w.d];
    const ax0 = Math.round(-dx * o * BREITE), ay0 = Math.round(-dy * o * HOEHE), bx0 = Math.round(dx * (1 - o) * BREITE), by0 = Math.round(dy * (1 - o) * HOEHE);
    ctx.drawImage(w.alt.bg, ax0, ay0);
    if (w.alt.licht) zeichneDunkel(w.alt.licht, ax0, ay0);
    ctx.drawImage(S.raum.bg, bx0, by0);
    if (raumDunkel(S.raum)) { berechneLicht(); zeichneDunkel(lichtCv, bx0, by0); }
    const ax = w.p0.x - dx * o * BREITE, ay = w.p0.y - dy * o * HOEHE, bx = h.x + dx * (1 - o) * BREITE, by = h.y + dy * (1 - o) * HOEHE;
    ctx.save(); ctx.translate(Math.round(ax + (bx - ax) * o - h.x), Math.round(ay + (by - ay) * o - h.y)); zeichneHeld(h); ctx.restore();
    zeichneHud(h);
    return;
  }
  ctx.save();
  if (S.wackeln > 0) ctx.translate(Math.round((Math.random() - 0.5) * 6), Math.round((Math.random() - 0.5) * 6));   // Bildschirm wackelt
  ctx.drawImage(S.raum.bg, 0, 0);
  zeichneWelt();
  if (raumDunkel(S.raum)) { berechneLicht(); zeichneDunkel(lichtCv); }
  ctx.restore();
  zeichneHud(h);
  zeichneBanner();
  if (S.text) zeichneText();
  if (S.zustand !== 'spiel') zeichneEnde();
}

// ---------- Menü ----------
// Hauptmenü (Dungeons, Eigene Dungeons, Creator, Editor, Optionen) und je eine Liste, die mit „Zurück“ (oder Esc) endet;
// höchstens MENUE.sichtbar Einträge auf einmal, dann wird geblättert. Hat ein Dungeon einen Spielstand, fragt eine Ebene
// „Weiterspielen / Neues Spiel“. Im Einzelspiel ist das Hauptmenü genau diese Frage. Nach einem Dungeon geht es in seine Liste zurück.
const MENUE = { wahl: 0, oben: 0, sichtbar: 5, zeit: 0, ebene: null, dungeon: null };
const HAUPTMENUE = ['@dungeons', '@eigene', '@creator', '@editor', '@optionen'];
const OPTIONSEINTRAEGE = ['@sprache', '@modus', '@bild'];
const menueDungeon = () => EINZEL || MENUE.dungeon;
const menueListe = () => {
  const eb = MENUE.ebene;
  if (eb === null) return EINZEL ? [...(liesStand(EINZEL) ? ['@weiter'] : []), '@neu', '@optionen'] : HAUPTMENUE;
  if (eb === 'stand') return ['@weiter', '@neu', '@zurueck'];
  if (eb === 'optionen') return [...(SPRACHEN.length > 1 ? ['@sprache'] : []), '@modus', '@bild', '@zurueck'];
  if (eb === 'sprachwahl') return SPRACHEN.map(c => '@sp:' + c);
  return [...Object.keys(DATEN.dungeons).filter(id => !DATEN.dungeons[id].eigen === (eb === 'dungeons')), '@zurueck'];
};
const menueY = i => 214 + (i - MENUE.oben) * 46;
function menueEbene(ebene) {
  const vorher = MENUE.ebene;
  MENUE.ebene = ebene; MENUE.oben = 0;
  const liste = menueListe();
  MENUE.wahl = ebene === 'sprachwahl' ? Math.max(0, SPRACHEN.indexOf(OPT.sprache)) : Math.max(0, liste.indexOf(vorher === 'stand' ? MENUE.dungeon : '@' + vorher));
  ton('menue');
}
function menueZurueck() {
  const dg = MENUE.ebene === 'stand' && DATEN.dungeons[MENUE.dungeon];
  menueEbene(dg ? (dg.eigen ? 'eigene' : 'dungeons') : null);
}
function waehleMenue(i) {
  const id = menueListe()[i];
  if (id === '@weiter') spielStarten(menueDungeon(), true);
  else if (id === '@neu') spielStarten(menueDungeon());
  else if (id === '@editor') ladeEditor('editor');
  else if (id === '@creator') ladeEditor('creator');
  else if (id === '@dungeons') menueEbene('dungeons');
  else if (id === '@eigene') menueEbene('eigene');
  else if (id === '@optionen') menueEbene('optionen');
  else if (id === '@zurueck') menueZurueck();
  else if (id.startsWith('@sp:')) { setzeOption('sprache', id.slice(4)); menueEbene(null); }
  else if (OPTIONSEINTRAEGE.includes(id)) wechsleOption(id.slice(1), 1);
  else if (liesStand(id)) { MENUE.dungeon = id; menueEbene('stand'); }
  else spielStarten(id);
}
function updateMenue() {
  MENUE.zeit += DT;
  if (MENUE.ebene === 'stand' && !liesStand(MENUE.dungeon)) menueZurueck();   // Spielstand ist weg (Dungeon geschafft)
  const liste = menueListe(), n = liste.length;
  MENUE.wahl = Math.min(MENUE.wahl, n - 1);
  if (gedrueckt.has('hoch')) { MENUE.wahl = (MENUE.wahl + n - 1) % n; ton('menue'); }
  if (gedrueckt.has('runter')) { MENUE.wahl = (MENUE.wahl + 1) % n; ton('menue'); }
  MENUE.oben = Math.max(0, Math.min(MENUE.oben, MENUE.wahl, n - MENUE.sichtbar), MENUE.wahl - MENUE.sichtbar + 1);
  const opt = OPTIONSEINTRAEGE.includes(liste[MENUE.wahl]) && liste[MENUE.wahl].slice(1);
  if (opt && (gedrueckt.has('links') || gedrueckt.has('rechts'))) wechsleOption(opt, gedrueckt.has('links') ? -1 : 1);   // Optionen auch mit ← →
  else if (gedrueckt.has('schlag')) waehleMenue(MENUE.wahl);
  else if (gedrueckt.has('menue') && MENUE.ebene !== null) menueZurueck();
  gedrueckt.clear();
}
function menueTipp(y) {
  const liste = menueListe();
  const i = liste.findIndex((_, i) => i >= MENUE.oben && i < MENUE.oben + MENUE.sichtbar && y >= menueY(i) - 4 && y < menueY(i) + 42);
  if (i >= 0) { MENUE.wahl = i; waehleMenue(i); }
  else if (y > menueY(MENUE.oben + MENUE.sichtbar) - 4 && MENUE.oben + MENUE.sichtbar < liste.length) MENUE.oben++;   // Tipp unter die Liste: weiterblättern
  else if (y < menueY(MENUE.oben) - 4 && y > 180 && MENUE.oben > 0) MENUE.oben--;
}
function zeichneMenue() {
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = PAL.schwarz; ctx.fillRect(0, 0, BREITE, HOEHE);
  for (let i = 0; i < SPALTEN; i++) zeichneBild(ctx, 'gras_' + (i * 7 % 4 === 3 ? 1 : i * 7 % 4), i * T, 40);
  zeichneBild(ctx, 'held_3', 236, 28); zeichneLeinwand(GEGNERBILD.fuchs[Math.floor(MENUE.zeit * 4) % 2], 372, 44, true);
  schreibe('WALDWACHT', BREITE / 2, 112, 6, PAL.gold2);
  const eb = MENUE.ebene, did = menueDungeon(), dgd = did && DATEN.dungeons[did], stand = did && liesStand(did);
  const kopf = eb === 'dungeons' ? tx('WÄHLE EINEN DUNGEON') : eb === 'eigene' ? tx('EIGENE DUNGEONS') : eb === 'optionen' ? tx('OPTIONEN')
    : eb === 'sprachwahl' ? SPRACHEN.map(c => DATEN.sprachen[c].name || c).join(' / ') : (eb === 'stand' || EINZEL) && dgd ? tx(dgd.titel) : tx('HAUPTMENÜ');
  schreibe(kopf, BREITE / 2, 186, 2, eb === 'stand' || (EINZEL && eb === null) ? PAL.creme : PAL.fels4);
  const liste = menueListe(), zahl = eigen => Object.values(DATEN.dungeons).filter(d => !d.eigen === !eigen).length;
  const EINTRAG = {
    '@weiter': { titel: tx('WEITERSPIELEN'), untertitel: stand ? standText(did, stand) : '' },
    '@neu': { titel: tx(stand ? 'NEUES SPIEL' : 'SPIEL STARTEN'), untertitel: stand ? tx('Der Spielstand wird überschrieben') : dgd ? tx(dgd.untertitel) : '' },
    '@dungeons': { titel: tx('DUNGEONS'), untertitel: tx('{0} fertige Dungeons, von klein bis groß', zahl(false)) },
    '@eigene': { titel: tx('EIGENE DUNGEONS'), untertitel: zahl(true) ? tx('{0} im Editor gebaut', zahl(true)) : tx('Noch keine - im Editor bauen') },
    '@creator': { titel: 'CREATOR', untertitel: 'Dungeon planen und bauen in 5 Schritten' },
    '@editor': { titel: 'EDITOR', untertitel: 'Dungeons, Räume und Gegner im Detail' },
    '@optionen': { titel: tx('OPTIONEN'), untertitel: tx(SPRACHEN.length > 1 ? 'Sprache, Schwierigkeit, Bild' : 'Schwierigkeit, Bild') },
    '@sprache': { titel: tx('SPRACHE: {0}', (DATEN.sprachen[OPT.sprache] || {}).name || OPT.sprache), untertitel: tx('Menü und Texte im Spiel') },
    '@modus': { titel: tx('SCHWIERIGKEIT: {0}', OPT.modus === 'classic' ? 'CLASSIC' : 'NORMAL'),
      untertitel: tx(OPT.modus === 'classic' ? 'Tod oder Neuladen: zurück zum Eingang' : 'Tod oder Neuladen: weiter im Raum') },
    '@bild': { titel: tx('BILD: {0}', tx(OPT.bild === 'fuellen' ? 'RAHMEN FÜLLEN' : 'SCHARFE PIXEL')),
      untertitel: tx(OPT.bild === 'fuellen' ? 'Ganzer Platz, Pixel leicht ungleich' : 'Gleich große Pixel, evtl. mit Rand') },
    '@zurueck': { titel: tx('ZURÜCK'), untertitel: eb === 'eigene' && !zahl(true) ? tx('Noch keine eigenen Dungeons - im Editor bauen') : '' },
  };
  const eintrag = id => {
    if (EINTRAG[id]) return EINTRAG[id];
    if (id.startsWith('@sp:')) return { titel: DATEN.sprachen[id.slice(4)].name || id.slice(4), untertitel: '' };
    const dg = DATEN.dungeons[id], st = liesStand(id);
    return { titel: tx(dg.titel), untertitel: st ? standText(id, st) : tx(dg.untertitel) };
  };
  liste.forEach((id, i) => {
    if (i < MENUE.oben || i >= MENUE.oben + MENUE.sichtbar) return;
    const e = eintrag(id), an = i === MENUE.wahl, y = menueY(i);
    if (an && Math.floor(MENUE.zeit * 3) % 2 === 0) schreibe('>', 120, y, 3, PAL.gold2, false);
    schreibe(e.titel, 150, y, 3, an ? PAL.creme : id === '@editor' || id === '@creator' || id === '@zurueck' || id === '@optionen' ? PAL.gold1 : PAL.fels3, false);
    schreibe(e.untertitel || '', 150, y + 26, 2, PAL.fels3, false);
  });
  if (MENUE.oben > 0) schreibe(tx('- MEHR -'), BREITE / 2, 200, 1, PAL.fels3);
  if (MENUE.oben + MENUE.sichtbar < liste.length) schreibe(tx('- MEHR -'), BREITE / 2, menueY(MENUE.oben + MENUE.sichtbar) - 4, 1, PAL.fels3);
  schreibe(tx(TOUCH.aktiv ? 'EINTRAG ANTIPPEN' : eb === 'optionen' ? 'ANKLICKEN ODER LEERTASTE ÄNDERT' : 'ANKLICKEN ODER PFEILE UND LEERTASTE'), BREITE / 2, 455, 2, PAL.fels3);
  if (WARNUNGEN.length) schreibe(`${WARNUNGEN.length} WARNUNGEN IN DEN SPIELDATEN (KONSOLE)`, BREITE / 2, 472, 1, PAL.rot2);
}

// ---------- Schleife & Skalierung ----------
// Tastatur: Platz für die Hilfezeile. Touch hochkant: Spielfeld oben, Bedienung darunter.
// Touch quer: links und rechts Rand für Stick und Aktionsknopf (darf das Spielfeld etwas überdecken).
function skaliere() {
  const w = innerWidth, h = innerHeight, hochkant = h > w;
  document.body.classList.toggle('hochkant', TOUCH.aktiv && hochkant);
  let s;
  if (!TOUCH.aktiv) s = Math.min(w / BREITE, (h - document.querySelector('.hilfe').offsetHeight - 30) / HOEHE);
  else if (hochkant) s = Math.min((w - 8) / BREITE, (h - 240) / HOEHE);
  else s = Math.min((w - 2 * 130) / BREITE, h / HOEHE);
  if (s >= 1 && OPT.bild !== 'fuellen') s = Math.floor(s);   // ganzzahlig, damit die Pixel gleich groß bleiben (Option „Rahmen füllen“: stufenlos)
  cv.style.width = BREITE * s + 'px'; cv.style.height = HOEHE * s + 'px';
}
addEventListener('resize', skaliere);

let vorher = 0, rest = 0;
function schleife(jetzt) {
  rest = Math.min(rest + (jetzt - vorher) / 1000, 0.25); vorher = jetzt;
  while (rest >= DT) { if (S) schritt(); else updateMenue(); rest -= DT; }
  if (S) zeichne(); else zeichneMenue();
  requestAnimationFrame(schleife);
}

atlas.onload = () => {
  baueDatenbilder();
  wendeSpracheAn();
  const d = PARAM.get('dungeon') || (PARAM.has('raum') ? 'probe' : null);
  if (d && DATEN.dungeons[d]) starteDungeon(d, PARAM.get('raum'));
  else if (SPRACHEN.length > 1 && !OPT.gewaehlt) menueEbene('sprachwahl');   // erster Start: Sprache wählen
  skaliere();
  requestAnimationFrame(t => { vorher = t; schleife(t); });
};
atlas.src = ATLAS_SRC;
</script>
