<!DOCTYPE html>
<!--
  Waldwacht (Arbeitstitel) – Entwurf 4: datengetriebene Engine. Top-Down-Action-Adventure im Stil von „A Link to the Past“.

  Trennung: Der Code kennt nur allgemeine Bausteine (Kacheln, Objekt-Eigenschaften, Gegner-Verhalten, Bedingungen).
  Alles Konkrete steht als reines JSON im Block <script id="spieldaten">: Einstellungen, Kacheln, Zeichen-Legende,
  Objektarten, Gegnerarten, Gegenstände und die Dungeons mit ihren Räumen. Ziel: ein Editor schreibt später genau dieses JSON.

  Daten (Kurzreferenz, Details im JSON selbst):
    kacheln      Zeichen → Gelände: mauer | boden | abgrund
    zeichen      Zeichen → { objekt: <objektart>, ...Parameter } oder { gegner: <gegnerart> }; je Raum ergänzbar (raum.zeichen)
    objektarten  Eigenschaften, die die Engine kennt:
                   bild ("@intern" oder Atlasname) · bilder+kette (gleiche Zeichen nebeneinander = ein Objekt) · fest [x,y,w,h]
                   schneidbar {herz} · schiebbar · lesbar (text) · oeffnbar (inhalt) · platte (signal, wer: block|alle)
                   kristall (signal, Schwert schaltet um) · pflock (oben_wenn) · leuchtet {radius, staerke} (an_wenn)
                 Parameter je Objekt: sichtbar_wenn, an_wenn, oben_wenn, merken (einmal wahr = bleibt wahr), spiegeln
    gegnerarten  bild, farben (Farbtausch), lp, tempo, schaden, fuss, koerper, beute {herz}, sprung {…} (Verhalten)
    gegenstaende bild, text, wirkung {schluessel|laterne|…: Anzahl, maxLp, heilen}, leuchtet (Held trägt Licht)
    dungeons     titel, start {raum, feld}, raeume { id: raum }
    raum         nr, titel, licht (Stufe oder 0..1), lichtkarte (Ziffern 0–9 je Feld), kampf (geräumt bleibt geräumt),
                 karte (15 Zeilen × 20 Zeichen), zeichen, objekte [{objekt, feld:[c,r], …}], gegner [{gegner, feld}],
                 tueren {n|o|s|w: {ziel, schloss, offen_wenn, merken}}, wellen [[gegnerart…]…], einstieg (Text),
                 ereignisse [{wenn, text, setze {signal: wert}}] (je einmal)
  Bedingungen: "signal" · {"alle": [...]} · {"eine": [...]} · {"nicht": ...}. Eingebaut: "geraeumt" (keine Gegner mehr, Wellen fertig).
  Signale kommen von Platten (solange belegt), Kristallen (umschalten, bleibt), Ereignissen (setze).
  Licht: je Feld ein Wert 0..1 aus Raumstufe/Lichtkarte, dazu Lichtquellen (Fackeln, Laterne, eigener Schein); lichtBei(x, y)
  liefert ihn für spätere Spielregeln – bisher wirkt Dunkelheit nur auf die Darstellung.

  Engine: Leinwand 640×480, 32 px je Feld, feste Schrittweite 1/60 s, Kollision achsengetrennt (AABB).
  Grafik: Held, Füchse, Gras, Hindernisse, Laterne aus dem Gutsverwalter-Atlas (atlas_bauen.py → FR/ATLAS_SRC);
  Mauer, Abgrund, Türen, Truhe, Schild, Block, Platte, Kristall, Pflöcke, Fackel, Schwert, Herzen, Schrift in Pixeln (PAL).

  Steuerung: WASD/Pfeile laufen · Leertaste: lesen/öffnen, sonst Schwert · R Neustart im Raum (nach Game Over) · Esc Menü
  Touch (erscheint beim ersten Fingertipp): linke Hälfte Steuerstick, rechte Hälfte wie Leertaste, im Menü Eintrag antippen.
  Editor: Menüeintrag EDITOR lädt editor.js (Dungeons, Räume, Objekte, Gegner, Gegnerarten); gespeichert wird im Browser
  (localStorage, EIGENE_SCHLUESSEL) im selben Format, eigene Dungeons erscheinen im Menü. Export/Import als JSON-Datei.
  Testen: ?dungeon=<id>&raum=<id> startet direkt (z. B. ?dungeon=hain&raum=kristall), ?touch zeigt die Touch-Bedienung am PC.
-->

  html,body{margin:0;height:100%;background:#120d14;color:#a9b2b0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  .hilfe{margin:0;text-align:center}
  kbd{display:inline-block;padding:0 5px;border:1px solid #454a55;border-radius:4px;background:#1c1e26;color:#ece8d6;font:inherit}
  html,body{touch-action:none}   /* muss vor dem ersten Finger feststehen, sonst bricht der Browser die Geste ab */
  body.touch{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  body.touch .hilfe{display:none}
  body.hochkant{justify-content:flex-start;padding-top:max(8px,env(safe-area-inset-top))}
  .tb{display:none;position:fixed;pointer-events:none;border-radius:50%;box-sizing:border-box}
  body.touch .tb{display:block}
  #stick{left:28px;bottom:28px;width:120px;height:120px;border:3px solid rgba(236,232,214,.35);background:rgba(18,13,20,.35);opacity:.5}
  #stick.an{opacity:1;bottom:auto;transform:translate(-50%,-50%)}
  #stick:not(.an){bottom:max(28px,env(safe-area-inset-bottom))}
  #knauf{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(236,232,214,.75);border:3px solid #120d14}
  #schlagknopf{right:max(28px,env(safe-area-inset-right));bottom:max(40px,env(safe-area-inset-bottom));width:96px;height:96px;
    border:3px solid #120d14;background:rgba(208,87,74,.75);color:#fffbec;font:bold 15px/90px sans-serif;text-align:center}
  #schlagknopf.an{background:rgba(244,205,94,.9);transform:scale(.92)}
  body.editor>canvas,body.editor>.hilfe,body.editor>.tb{display:none!important}
</style>
</head>

// Türöffnungen liegen immer an derselben Stelle: Nord 2×2 Felder (Mauer ist oben zwei Felder dick), sonst 2 Felder breit.
const TUER_RECHTECK = { n: [9 * T, 0, 2 * T, 2 * T], s: [9 * T, 14 * T, 2 * T, T], w: [0, 7 * T, T, 2 * T], o: [19 * T, 7 * T, T, 2 * T] };
const RICHTUNG = { n: [0, -1], s: [0, 1], w: [-1, 0], o: [1, 0] };
const GEGENUEBER = { n: 's', s: 'n', w: 'o', o: 'w' };
const BLICK_VON = { n: 'hoch', s: 'runter', w: 'links', o: 'rechts' };
const WINKEL = { rechts: 0, runter: 90, links: 180, hoch: 270 };

// ---------- Hilfen ----------
function zufall(seed) {   // mulberry32: gleicher Raum bei jedem Laden
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const ueberlappt = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const fuss = e => ({ x: e.x - e.hw, y: e.y - e.hh, w: 2 * e.hw, h: 2 * e.hh });
const rechteck = ([x, y, w, h], extra = {}) => ({ x, y, w, h, ...extra });
const zufallIn = ([a, b]) => a + Math.random() * (b - a);
const feldVon = (x, y) => [Math.floor(x / T), Math.floor(y / T)];
function leinwand(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }

// Bewegt e (Mittelpunkt x/y, halbe Fußbox hw/hh) achsenweise und schiebt es aus jedem Hindernis heraus.
// stossX/stossY merken, woran es zuletzt gestoßen ist (Block schieben, Tür aufschließen).
function bewege(e, mx, my, liste) {
  e.stossX = e.stossY = null;
  if (mx) {
    e.x += mx;
    for (const r of liste) if (ueberlappt(fuss(e), r)) { e.x = mx > 0 ? r.x - e.hw : r.x + r.w + e.hw; e.stossX = r; }
  }
  if (my) {
    e.y += my;
    for (const r of liste) if (ueberlappt(fuss(e), r)) { e.y = my > 0 ? r.y - e.hh : r.y + r.h + e.hh; e.stossY = r; }
  }
}

// ---------- Daten prüfen ----------
// Meldet Fehler in den Spieldaten (Konsole, Zahl im Menü), damit ein späterer Editor dieselben Regeln nutzen kann.
function pruefeDaten(d, still = false) {
  const w = [], bekannt = ch => d.kacheln[ch] !== undefined;
  for (const [ch, e] of Object.entries(d.zeichen)) if (e.objekt && !d.objektarten[e.objekt]) w.push(`Zeichen ${ch}: unbekannte Objektart ${e.objekt}`);
  for (const [did, dg] of Object.entries(d.dungeons)) {
    if (!dg.raeume[dg.start.raum]) w.push(`${did}: Startraum ${dg.start.raum} fehlt`);
    else {   // jeder Raum vom Start aus über Türen erreichbar?
      const da = new Set([dg.start.raum]), offen = [dg.start.raum];
      while (offen.length) for (const t of Object.values(dg.raeume[offen.pop()].tueren)) if (dg.raeume[t.ziel] && !da.has(t.ziel)) { da.add(t.ziel); offen.push(t.ziel); }
      for (const id of Object.keys(dg.raeume)) if (!da.has(id)) w.push(`${did}/${id}: vom Start aus nicht erreichbar`);
    }
    for (const [id, r] of Object.entries(dg.raeume)) {
      const wo = `${did}/${id}`, legende = { ...d.zeichen, ...(r.zeichen || {}) };
      if (r.karte.length !== ZEILEN || r.karte.some(z => z.length !== SPALTEN)) w.push(`${wo}: Karte muss ${ZEILEN} Zeilen zu ${SPALTEN} Zeichen haben`);
      for (const z of r.karte) for (const ch of z) if (!bekannt(ch) && !legende[ch]) w.push(`${wo}: unbekanntes Zeichen „${ch}“`);
      for (const e of [...Object.values(r.zeichen || {}), ...(r.objekte || []), ...(r.gegner || [])]) {
        if (e.objekt && !d.objektarten[e.objekt]) w.push(`${wo}: unbekannte Objektart ${e.objekt}`);
        if (e.gegner && !d.gegnerarten[e.gegner]) w.push(`${wo}: unbekannte Gegnerart ${e.gegner}`);
        if (e.inhalt && !d.gegenstaende[e.inhalt]) w.push(`${wo}: unbekannter Gegenstand ${e.inhalt}`);
      }
      for (const welle of r.wellen || []) for (const g of welle) if (!d.gegnerarten[g]) w.push(`${wo}: Welle mit unbekannter Gegnerart ${g}`);
      for (const [dir, t] of Object.entries(r.tueren)) {
        const gegen = dg.raeume[t.ziel] && dg.raeume[t.ziel].tueren[GEGENUEBER[dir]];
        if (!gegen || gegen.ziel !== id) w.push(`${wo}: Tür ${dir} → ${t.ziel} hat keine passende Gegentür`);
      }
    }
  }
  if (!still) for (const m of w) console.warn('Spieldaten:', m);
  return w;
}
let WARNUNGEN = [];

// ---------- Eigene Dungeons und Gegnerarten (Editor) ----------
// Der Editor speichert im Browser (localStorage) im selben Format; beim Start kommen sie zu den eingebauten dazu.
const EINGEBAUT = { dungeons: { ...DATEN.dungeons }, gegnerarten: { ...DATEN.gegnerarten } };
const EIGENE_SCHLUESSEL = 'waldwacht.eigene';
function ladeEigene() {
  try {
    const e = JSON.parse(localStorage.getItem(EIGENE_SCHLUESSEL) || 'null');
    if (e && e.format === 1) return { dungeons: {}, gegnerarten: {}, ...e };
  } catch (err) { console.warn('Eigene Daten nicht lesbar:', err); }
  return { format: 1, dungeons: {}, gegnerarten: {} };
}
function uebernehmeEigene(e, mitBildern = false) {   // auch vom Editor nach jeder Änderung aufgerufen
  const kopie = o => JSON.parse(JSON.stringify(o));
  DATEN.gegnerarten = { ...EINGEBAUT.gegnerarten, ...kopie(e.gegnerarten) };
  DATEN.dungeons = { ...EINGEBAUT.dungeons };
  for (const [id, d] of Object.entries(e.dungeons)) DATEN.dungeons[id] = { ...kopie(d), eigen: true };
  WARNUNGEN = pruefeDaten(DATEN, mitBildern);
  if (mitBildern) baueDatenbilder();

  const ist = (cc, r, art) => kachel[r] && kachel[r][cc] === art;
  const belegt = new Set(raum.objekte.map(o => `${o.c},${o.r}`));
  for (let r = 0; r < ZEILEN; r++) for (let cc = 0; cc < SPALTEN; cc++) {
    const w = zz(); zeichneBild(g, w < 0.6 ? 'gras_0' : w < 0.85 ? 'gras_1' : w < 0.95 ? 'gras_2' : 'gras_3', cc * T, r * T);
  }
  for (let r = 2; r < ZEILEN - 1; r++) for (let cc = 1; cc < SPALTEN - 1; cc++) {
    const d = zz();
    if (ist(cc, r, 'boden') && !belegt.has(`${cc},${r}`) && d < 0.1) zeichneBild(g, d < 0.05 ? 'buesche' : d < 0.08 ? 'blumen' : 'pilz', cc * T, r * T, zz() < 0.5);
  }
  for (let r = 0; r < ZEILEN; r++) for (let cc = 0; cc < SPALTEN; cc++)
    if (ist(cc, r, 'abgrund')) abgrundKachel(g, cc * T, r * T, (dx, dy) => ist(cc + dx, r + dy, 'abgrund'));
  // Schatten der Mauern auf den Boden (Licht von oben links)
  g.fillStyle = 'rgba(18,13,20,.32)'; g.fillRect(T, 2 * T, BREITE - 2 * T, 5); g.fillRect(T, 2 * T, 5, HOEHE - 3 * T);
  g.fillStyle = 'rgba(18,13,20,.16)'; g.fillRect(T, 2 * T + 5, BREITE - 2 * T, 5); g.fillRect(T + 5, 2 * T, 4, HOEHE - 3 * T);
  // Mauer, Kante der Mauerkrone zum Raum hin
  for (let r = 0; r < ZEILEN; r++) for (let cc = 0; cc < SPALTEN; cc++) {
    if (!ist(cc, r, 'mauer')) continue;
    if (r === 1 && cc > 0 && cc < SPALTEN - 1) mauerWand(g, cc * T, r * T, zz); else mauerKrone(g, cc * T, r * T, zz);
    if (r < 2) continue;
    g.fillStyle = PAL.fels4;
    if (kachel[r][cc + 1] && kachel[r][cc + 1] !== 'mauer') g.fillRect(cc * T + T - 2, r * T, 2, T);
    if (kachel[r][cc - 1] && kachel[r][cc - 1] !== 'mauer') { g.fillRect(cc * T, r * T, 2, T); g.fillStyle = PAL.nacht; g.fillRect(cc * T + 2, r * T, 1, T); }
    g.fillStyle = PAL.fels4;
    if (r === ZEILEN - 1 && kachel[r - 1][cc] !== 'mauer') { g.fillRect(cc * T, r * T, T, 2); g.fillStyle = PAL.nacht; g.fillRect(cc * T, r * T + 2, T, 1); }
  }

  for (const d of Object.keys(def.tueren)) {
    const [x, y, w, h] = TUER_RECHTECK[d], [dx, dy] = RICHTUNG[d];
    for (let i = 0; i < 8; i++) {
      g.fillStyle = `rgba(18,13,20,${0.08 * (8 - i)})`;
      if (dx) g.fillRect(dx > 0 ? x + w - (i + 1) * 3 : x + i * 3, y, 3, h);
      else g.fillRect(x, dy > 0 ? y + h - (i + 1) * 3 : y + i * 3, w, 3);
    }
    g.fillStyle = PAL.fels0;
    if (dx) { g.fillRect(x, y - 2, w, 2); g.fillRect(x, y + h, w, 2); } else { g.fillRect(x - 2, y, 2, h); g.fillRect(x + w, y, 2, h); }
  }

}

// ---------- Raum: aus den Daten aufbauen ----------
// Liest die Karte über Kacheln und Legende (global + Raum), dazu explizite objekte/gegner-Listen; Türöffnungen werden ausgeschnitten.
function baueRaum(id) {
  const def = S.dungeon.raeume[id], legende = { ...DATEN.zeichen, ...(def.zeichen || {}) };
  const raum = { id, def, schluessel: `${S.dungeonId}/${id}`, kachel: [], objekte: [], gegner: [], mauern: [], gefuellt: new Set(), tuerZu: {} };
  const neu = (e, quelle = e) => {   // quelle: Legenden-Eintrag, damit Ketten (Baumstamm) zusammenfinden
    const typ = DATEN.objektarten[e.objekt], [c, r] = e.feld;
    raum.objekte.push({ art: e.objekt, typ, p: e, quelle, c, r, x: c * T, y: r * T, laenge: 1, key: `${raum.schluessel}:${c},${r}`,
      weg: false, oben: false, bewegt: null, getroffen: -1 });
  };
  for (let r = 0; r < ZEILEN; r++) {
    raum.kachel.push([]);
    for (let c = 0; c < SPALTEN; c++) {
      const ch = def.karte[r][c], e = legende[ch];
      raum.kachel[r].push(DATEN.kacheln[ch] || 'boden');
      if (!e) continue;
      if (e.gegner) raum.gegner.push({ art: e.gegner, x: c * T + T / 2, y: r * T + T / 2 });
      else if (e.objekt && DATEN.objektarten[e.objekt]) {
        const vorher = raum.objekte[raum.objekte.length - 1];
        if (DATEN.objektarten[e.objekt].kette && vorher && vorher.quelle === e && vorher.r === r && vorher.c + vorher.laenge === c) vorher.laenge++;
        else neu({ ...e, feld: [c, r] }, e);
      }
    }
  }
  for (const e of def.objekte || []) {   // Liste (Editor): unbekannte Arten überspringen, Ketten nebeneinander zusammenfassen
    const typ = DATEN.objektarten[e.objekt], v = raum.objekte[raum.objekte.length - 1];
    if (!typ) continue;
    if (typ.kette && v && v.art === e.objekt && v.quelle === v.p && v.r === e.feld[1] && v.c + v.laenge === e.feld[0]) v.laenge++;
    else neu(e);
  }
  for (const e of def.gegner || []) if (DATEN.gegnerarten[e.gegner]) raum.gegner.push({ art: e.gegner, x: e.feld[0] * T + T / 2, y: e.feld[1] * T + T / 2 });
  for (const d of Object.keys(def.tueren)) {
    const [x, y, w, h] = TUER_RECHTECK[d];
    for (let r = y / T; r < (y + h) / T; r++) for (let c = x / T; c < (x + w) / T; c++) raum.kachel[r][c] = 'boden';
  }
  for (let r = 0; r < ZEILEN; r++) for (let c = 0; c < SPALTEN; c++) if (raum.kachel[r][c] === 'mauer') raum.mauern.push(rechteck([c * T, r * T, T, T]));
  if (!HG[raum.schluessel]) HG[raum.schluessel] = baueHintergrund(raum);
  raum.bg = HG[raum.schluessel];
  return raum;
}
const HG = {};   // Hintergründe je Raum, beim ersten Betreten gezeichnet
const istLoch = (c, r) => S.raum.kachel[r] && S.raum.kachel[r][c] === 'abgrund' && !S.raum.gefuellt.has(`${c},${r}`);

// ---------- Eingabe: Tastatur ----------
const TASTEN = { ArrowUp: 'hoch', KeyW: 'hoch', ArrowDown: 'runter', KeyS: 'runter', ArrowLeft: 'links', KeyA: 'links',
  ArrowRight: 'rechts', KeyD: 'rechts', Space: 'schlag', Enter: 'schlag', KeyR: 'neustart', Escape: 'menue' };
const gehalten = new Set(), gedrueckt = new Set();   // gedrueckt: seit dem letzten Spielschritt neu gedrückt
addEventListener('keydown', e => { const t = TASTEN[e.code]; if (!t || imEditor() || (e.target.closest && e.target.closest('input,textarea,select'))) return; e.preventDefault(); if (!e.repeat) gedrueckt.add(t); gehalten.add(t); });
addEventListener('keyup', e => { const t = TASTEN[e.code]; if (t) gehalten.delete(t); });
addEventListener('blur', () => { gehalten.clear(); TOUCH.richtung.clear(); });

// ---------- Eingabe: Touch ----------
// Linke Bildschirmhälfte: Steuerstick, der dort entsteht, wo der Daumen aufsetzt (8 Richtungen).
// Rechte Hälfte: wie Leertaste (lesen, öffnen, Schwert). Nach dem Ende startet ein Tipp neu. Im Menü: Eintrag antippen.
// Touch schreibt dieselben Befehle wie die Tastatur (TOUCH.richtung neben gehalten, gedrueckt gemeinsam).
const TOUCH = { aktiv: false, stick: null, schlagId: null, richtung: new Set() };
const elStick = document.getElementById('stick'), elKnauf = document.getElementById('knauf'), elSchlag = document.getElementById('schlagknopf');
const STICK = { tot: 14, weg: 44 };   // Totzone und größter Ausschlag in CSS-Pixeln
const halt = t => gehalten.has(t) || TOUCH.richtung.has(t);
function touchAn() {
  if (TOUCH.aktiv) return;
  TOUCH.aktiv = true; document.body.classList.add('touch'); skaliere();
}
function stickZeigen(x, y, dx = 0, dy = 0) {
  elStick.style.left = x + 'px'; elStick.style.top = y + 'px'; elStick.classList.add('an');
  elKnauf.style.transform = `translate(${dx}px,${dy}px)`;
}
function stickLos() {
  TOUCH.stick = null; TOUCH.richtung.clear();
  elStick.classList.remove('an'); elStick.style.left = elStick.style.top = ''; elKnauf.style.transform = '';
}
addEventListener('pointerdown', e => {
  if (imEditor() || (e.pointerType === 'mouse' && !TOUCH.aktiv)) return;
  const b = cv.getBoundingClientRect();   // vor touchAn: das ändert die Größe der Leinwand
  touchAn(); e.preventDefault();
  if (!S) { menueTipp((e.clientY - b.top) / b.height * HOEHE); return; }
  if (S.zustand !== 'spiel') { gedrueckt.add('neustart'); return; }
  if (e.clientX < innerWidth / 2) {
    if (!TOUCH.stick) { TOUCH.stick = { id: e.pointerId, x0: e.clientX, y0: e.clientY }; stickZeigen(e.clientX, e.clientY); }
  } else { gedrueckt.add('schlag'); TOUCH.schlagId = e.pointerId; elSchlag.classList.add('an'); }
}, { passive: false });
addEventListener('pointermove', e => {
  const s = TOUCH.stick; if (!s || e.pointerId !== s.id) return;
  let dx = e.clientX - s.x0, dy = e.clientY - s.y0; const l = Math.hypot(dx, dy);
  TOUCH.richtung.clear();
  if (l > STICK.tot) {   // Sektoren zu je 45°: eine Achse zählt, wenn sie mehr als cos(67,5°) des Ausschlags trägt
    if (dx > l * 0.38) TOUCH.richtung.add('rechts'); else if (dx < -l * 0.38) TOUCH.richtung.add('links');
    if (dy > l * 0.38) TOUCH.richtung.add('runter'); else if (dy < -l * 0.38) TOUCH.richtung.add('hoch');
  }
  if (l > STICK.weg) { dx *= STICK.weg / l; dy *= STICK.weg / l; }
  stickZeigen(s.x0, s.y0, dx, dy);
});
function touchEnde(e) {
  if (TOUCH.stick && e.pointerId === TOUCH.stick.id) stickLos();
  if (e.pointerId === TOUCH.schlagId) { TOUCH.schlagId = null; elSchlag.classList.remove('an'); }
}
addEventListener('pointerup', touchEnde); addEventListener('pointercancel', touchEnde);
addEventListener('contextmenu', e => { if (TOUCH.aktiv) e.preventDefault(); });
const PARAM = new URLSearchParams(location.search);
if (PARAM.has('touch')) touchAn();

// ---------- Spielstand ----------
let S = null;   // null = Menü; sonst der gesamte Spielstand eines Dungeons
function starteDungeon(dungeonId, raumId) {
  const dg = DATEN.dungeons[dungeonId];
  S = {
    dungeonId, dungeon: dg,
    zustand: 'spiel',   // spiel | gameover
    zeit: 0, endeZeit: 0, stopp: 0,
    maxLp: CFG.held.lp, inventar: {}, besitz: new Set(),
    signale: {}, gemerkt: new Set(), geraeumt: new Set(), truhen: new Set(), besucht: new Set(),   // Fortschritt
    live: new Set(),   // Signale, die gerade anliegen (belegte Platten)
    held: { x: 0, y: 0, hw: 9, hh: 6, blick: 'runter', lp: CFG.held.lp, modus: 'normal', t: 0, vx: 0, vy: 0,
      unverwundbar: 0, anim: 0, schlagNr: 0, schieben: 0 },
    raum: null, eintritt: null, einlauf: null, wechsel: null, text: null, wellen: null,
    gegner: [], beute: [], effekte: [], fest: [], festGegner: [], festRueck: [],
  };
  if (!raumId || !dg.raeume[raumId] || raumId === dg.start.raum) {
    betreteRaum(dg.start.raum, { x: dg.start.feld[0] * T, y: dg.start.feld[1] * T, blick: 'runter' });
  } else if (!Object.keys(dg.raeume[raumId].tueren).length) {   // Teststart in einem Raum ohne Türen: in der Mitte
    betreteRaum(raumId, { x: 9.5 * T, y: 8.5 * T, blick: 'runter' });
  } else {   // Teststart in einem Raum: durch seine erste Tür hinein
    const d = Object.keys(dg.raeume[raumId].tueren)[0], [x, y, w, h] = TUER_RECHTECK[d];
    betreteRaum(raumId, { x: x + w / 2, y: y + h / 2, blick: BLICK_VON[GEGENUEBER[d]], einlauf: GEGENUEBER[d] });
    durchgangOffen(d);
  }
}

// Raum betreten: aufbauen, Gegner setzen, Held an den Eintrittspunkt (optional mit Einlaufen durch die Tür)
function betreteRaum(id, eintritt) {
  S.raum = baueRaum(id);
  const h = S.held, def = S.raum.def;
  Object.assign(h, { x: eintritt.x, y: eintritt.y, blick: eintritt.blick, modus: 'normal', t: 0, anim: 0, schieben: 0 });
  S.gegner = []; S.beute = []; S.effekte = []; S.wellen = null; S.live = new Set();
  if (!(def.kampf && S.geraeumt.has(S.raum.schluessel))) {
    for (const g of S.raum.gegner) if (DATEN.gegnerarten[g.art]) S.gegner.push(neuerGegner(g.art, g.x, g.y));
    if (def.wellen) S.wellen = { nr: 0, warteschlange: [], spawnUhr: 0, banner: 0, ruhe: 0.5, fertig: false };
  }
  S.einlauf = eintritt.einlauf || null;
  for (const o of S.raum.objekte) if (o.typ.pflock) o.oben = gilt(o.p.oben_wenn);
  aktualisiereSignale();
  for (const d of Object.keys(def.tueren)) S.raum.tuerZu[d] = tuerZu(d);
  aktualisiereHindernisse();
  if (!S.einlauf) nachEinlauf();
}
function nachEinlauf() {   // der Held steht im Raum: Eintrittspunkt merken (für Neustart und Abgründe), Einstiegstext beim ersten Mal
  const h = S.held, k = S.raum.schluessel;
  S.eintritt = { x: h.x, y: h.y, blick: h.blick };
  if (!S.besucht.has(k)) { S.besucht.add(k); if (S.raum.def.einstieg) zeigeText(S.raum.def.einstieg); }
}
function neuerGegner(art, x, y) {
  const a = DATEN.gegnerarten[art];
  return { art, a, x, y, hw: a.fuss[0], hh: a.fuss[1], lp: a.lp, rueck: 0, vx: 0, vy: 0, blitz: 0, anim: 0,
    spiegeln: x > S.held.x, getroffen: -1, warten: CFG.gegner.wachAb, sterbend: false, modus: 'jagen', mt: 0,
    sprungPause: a.sprung ? zufallIn(a.sprung.pause) : 0 };
}

// ---------- Signale und Bedingungen ----------
function raumGeraeumt() {
  if (S.raum.def.kampf) return S.geraeumt.has(S.raum.schluessel);
  return !S.gegner.some(g => !g.sterbend) && (!S.wellen || S.wellen.fertig);
}
function signal(name) {
  if (name === 'geraeumt') return raumGeraeumt();
  return S.live.has(name) || !!S.signale[name];
}
function gilt(b) {   // Bedingung aus den Daten auswerten; fehlende Bedingung gilt
  if (b === undefined || b === null) return true;
  if (typeof b === 'string') return signal(b);
  if (b.alle) return b.alle.every(gilt);
  if (b.eine) return b.eine.some(gilt);
  if (b.nicht !== undefined) return !gilt(b.nicht);
  return false;
}
function gemerkt(key, bedingung, merken) {   // merken: einmal wahr, bleibt wahr (für Türen, Fackeln …)
  if (merken && S.gemerkt.has(key)) return true;
  const v = gilt(bedingung);
  if (v && merken) S.gemerkt.add(key);
  return v;
}
const sichtbar = o => !o.weg && gilt(o.p.sichtbar_wenn);
const fackelAn = o => o.p.an !== false && gemerkt(o.key + ':an', o.p.an_wenn, o.p.merken);
function platteBelegt(o) {
  if (S.raum.objekte.some(b => b.typ.schiebbar && !b.weg && !b.bewegt && b.c === o.c && b.r === o.r)) return true;
  if (o.p.wer !== 'alle') return false;
  const drauf = (x, y) => { const [c, r] = feldVon(x, y); return c === o.c && r === o.r; };
  return drauf(S.held.x, S.held.y) || S.gegner.some(g => !g.sterbend && drauf(g.x, g.y));
}
function aktualisiereSignale() {
  S.live = new Set();
  for (const o of S.raum.objekte) if (o.typ.platte && platteBelegt(o)) S.live.add(o.p.signal);
}

// ---------- Türen und Hindernisse ----------
function tuerZu(d) {
  const t = S.raum.def.tueren[d], key = `${S.raum.schluessel}:${d}`;
  if (S.gemerkt.has(key)) return false;
  if (t.schloss) return true;
  if (t.offen_wenn === undefined || S.einlauf) return false;   // beim Hereinlaufen sind Bedingungstüren offen
  return !gemerkt(key, t.offen_wenn, t.merken);
}
function durchgangOffen(d) {   // wer durch eine Schloss- oder Merk-Tür hereinkommt, hat sie auf dieser Seite offen
  const t = S.raum.def.tueren[d];
  if (t && (t.schloss || (t.offen_wenn !== undefined && t.merken))) { S.gemerkt.add(`${S.raum.schluessel}:${d}`); S.raum.tuerZu[d] = false; aktualisiereHindernisse(); }
}
function aktualisiereTueren() {   // geht eine Tür auf, gibt es eine Rauchwolke
  for (const d of Object.keys(S.raum.def.tueren)) {
    const zu = tuerZu(d);
    if (S.raum.tuerZu[d] && !zu) { const [x, y, w, h] = TUER_RECHTECK[d]; S.effekte.push({ art: 'puff', x: x + w / 2, y: y + h / 2, t: 0 }); }
    S.raum.tuerZu[d] = zu;
  }
}
function festVon(o) {   // Kollisionsrechteck eines Objekts oder null
  const f = o.typ.fest;
  if (!f || !sichtbar(o) || (o.typ.pflock && !o.oben)) return null;
  return { x: o.x + f[0], y: o.y + f[1], w: o.typ.kette ? o.laenge * T + f[2] : f[2], h: f[3], obj: o };
}
// Einmal je Spielschritt. Held: Mauern, Objekte, geschlossene Türen. Gegner zusätzlich offene Türen (sie bleiben im Raum)
// und Abgründe (sie laufen nicht hinein); beim Rückstoß fehlen die Abgründe – dann können sie hineinfallen.
function aktualisiereHindernisse() {
  const r = S.raum, fest = [...r.mauern], offen = [], loecher = [];
  for (const o of r.objekte) { const f = festVon(o); if (f) fest.push(f); }
  for (const d of Object.keys(r.def.tueren)) { const rt = rechteck(TUER_RECHTECK[d], { tuer: d }); (r.tuerZu[d] ? fest : offen).push(rt); }
  for (let rr = 0; rr < ZEILEN; rr++) for (let c = 0; c < SPALTEN; c++) if (istLoch(c, rr)) loecher.push(rechteck([c * T, rr * T, T, T]));
  S.fest = fest; S.festRueck = [...fest, ...offen]; S.festGegner = [...fest, ...offen, ...loecher];
}

// ---------- Text ----------
// Seiten zu je drei Zeilen, Zeilen höchstens 46 Zeichen; Schreibmaschine, Leertaste/Tipp: zeigen bzw. weiter
function zeigeText(text, gegenstand = null) {
  const zeilen = [];
  for (const wort of text.toUpperCase().split(/\s+/)) {
    const z = zeilen.length ? zeilen[zeilen.length - 1] : null;
    if (z !== null && (z + ' ' + wort).length <= 46) zeilen[zeilen.length - 1] = z + ' ' + wort; else zeilen.push(wort);
  }
  const seiten = [];
  for (let i = 0; i < zeilen.length; i += 3) seiten.push(zeilen.slice(i, i + 3));
  S.text = { seiten, seite: 0, zeichen: 0, gegenstand };
}
function updateText() {
  const t = S.text, laenge = t.seiten[t.seite].join('').length;
  t.zeichen = Math.min(laenge, t.zeichen + CFG.text.tempo * DT);
  if (!gedrueckt.has('schlag')) return;
  if (t.zeichen < laenge) t.zeichen = laenge;
  else if (t.seite < t.seiten.length - 1) { t.seite++; t.zeichen = 0; }
  else S.text = null;
}
function pruefeEreignisse() {   // je Ereignis einmal: wenn die Bedingung gilt, Signale setzen und/oder Text zeigen
  (S.raum.def.ereignisse || []).forEach((e, i) => {
    const key = `${S.raum.schluessel}:e${i}`;
    if (S.text || S.gemerkt.has(key) || !gilt(e.wenn)) return;
    S.gemerkt.add(key);
    Object.assign(S.signale, e.setze || {});
    if (e.text) zeigeText(e.text);
  });
}

// ---------- Raumwechsel ----------
// Am Bildrand einer offenen Tür: Bildlauf in den Nachbarraum, dann läuft der Held selbst ein Stück hinein.
function pruefeAusgang(h) {
  const d = h.y - h.hh < 1 ? 'n' : h.y + h.hh > HOEHE - 1 ? 's' : h.x - h.hw < 1 ? 'w' : h.x + h.hw > BREITE - 1 ? 'o' : null;
  if (!d || !S.raum.def.tueren[d]) return;
  const alt = { bg: S.raum.bg, licht: raumDunkel(S.raum) ? lichtKopie() : null }, p0 = { x: h.x, y: h.y };
  const neu = { x: h.x, y: h.y, blick: BLICK_VON[d], einlauf: d };
  if (d === 'o') neu.x = h.hw + 1; else if (d === 'w') neu.x = BREITE - h.hw - 1;
  else if (d === 'n') neu.y = HOEHE - h.hh - 1; else neu.y = h.hh + 1;
  betreteRaum(S.raum.def.tueren[d].ziel, neu);
  durchgangOffen(GEGENUEBER[d]);
  S.wechsel = { d, t: 0, alt, p0 };
}

  return q;
}
function lichtBei(x, y, quellen = lichtquellen()) {   // für spätere Spielregeln: wie hell ist es hier (0..1)?
  const [c, r] = feldVon(x, y);
  let l = grundlicht(S.raum, Math.min(SPALTEN - 1, Math.max(0, c)), Math.min(ZEILEN - 1, Math.max(0, r)));
  for (const q of quellen) { const d = Math.hypot(x - q.x, y - q.y); if (d < q.r) l = Math.max(l, q.s * (1 - (d / q.r) ** 2)); }
  return l;
}
function berechneLicht() {
  const q = lichtquellen(), d = lichtBild.data, max = CFG.licht.dunkelMax;
  for (let j = 0; j < LH; j++) for (let i = 0; i < LW; i++) {
    const k = (j * LW + i) * 4, l = lichtBei(i * LG + LG / 2, j * LG + LG / 2, q);
    d[k] = 18; d[k + 1] = 13; d[k + 2] = 20; d[k + 3] = Math.round(255 * max * (1 - l));
  }
  lichtCtx.putImageData(lichtBild, 0, 0);
}
function lichtKopie() { berechneLicht(); const [c, g] = leinwand(LW, LH); g.drawImage(lichtCv, 0, 0); return c; }
function zeichneDunkel(bild, x = 0, y = 0) { ctx.imageSmoothingEnabled = true; ctx.drawImage(bild, x, y, BREITE, HOEHE); ctx.imageSmoothingEnabled = false; }

// ---------- Zeichnen ----------
const SCHRITTFOLGE = [1, 0, 2, 0];
function schatten(x, y, w) {
  ctx.fillStyle = 'rgba(18,13,20,.28)';
  ctx.fillRect(Math.round(x - w / 2 + 2), Math.round(y - 2), w - 4, 5); ctx.fillRect(Math.round(x - w / 2), Math.round(y - 1), w, 3);
}
function zeichneSchwert(h) {
  const w = schwertWinkel(h), [gx, gy] = schwertGriff(h, w);
  const gerade = w % 90 === 0, bild = gerade ? SCHWERT_GERADE : SCHWERT_SCHRAEG, [px, py] = gerade ? SCHWERT_GERADE_DREH : SCHWERT_SCHRAEG_DREH;
  ctx.save(); ctx.translate(gx, gy); ctx.rotate((gerade ? w : w - 45) * Math.PI / 180); ctx.drawImage(bild, -px, -py); ctx.restore();
}
function zeichneHeld(h) {
  const basis = { runter: 0, rechts: 3, links: 3, hoch: 6 }[h.blick];
  if (h.modus === 'fallen') {   // schrumpft ins Loch
    const k = Math.max(0, h.t / CFG.abgrund.fallDauer);
    ctx.save(); ctx.translate(h.fallX, h.fallY); ctx.scale(k, k); zeichneBild(ctx, 'held_' + basis, -16, -32, h.blick === 'links'); ctx.restore();
    return;
  }
  if (h.unverwundbar > 0 && Math.floor(h.unverwundbar * 20) % 2) return;   // Blinken in der Schutzzeit
  const laeuft = (h.modus === 'normal' && h.anim > 0) || S.einlauf || S.wechsel;
  const bild = laeuft ? basis + SCHRITTFOLGE[Math.floor((h.anim + S.zeit * (S.wechsel ? 1 : 0)) * 8) % 4] : basis;
  const schlag = h.modus === 'schlag', hinten = schlag && Math.sin(schwertWinkel(h) * Math.PI / 180) < -0.1;
  if (hinten) zeichneSchwert(h);
  zeichneBild(ctx, 'held_' + bild, h.x - 16, h.y + 8 - 48 + (schlag && h.t > CFG.schlag.phasen[1] ? 1 : 0), h.blick === 'links');
  if (schlag && !hinten) zeichneSchwert(h);
  const g = S.text && S.text.gegenstand;   // gefundenen Gegenstand über den Kopf halten
  if (g) ctx.drawImage(g, Math.round(h.x - g.width / 2), Math.round(h.y - 44 - g.height));
}
function zeichneGegner(g) {
  const bild = g.modus === 'sprung' ? 1 : g.rueck > 0 || g.anim === 0 || g.modus === 'zielen' ? 0 : Math.floor(g.anim * 6) % 2;
  const zittern = g.modus === 'zielen' ? (Math.floor(S.zeit * 30) % 2 ? 1 : -1) : 0;
  const x = Math.round(g.x - 16) + zittern, y = Math.round(g.y + 8 - 32) - (g.modus === 'sprung' ? 3 : 0);
  if (g.warten > 0 && g.warten > CFG.gegner.wachAb - 0.4 && Math.floor(g.warten * 16) % 2) return;   // Erscheinen: kurz flackern
  const blitz = g.blitz > 0 && Math.floor(g.blitz * 30) % 2 === 0;
  const b = blitz ? BLITZ[g.a.bild][bild] : GEGNERBILD[g.art][bild];
  if (g.faellt !== undefined) {   // fällt in den Abgrund
    const k = Math.max(0, g.faellt / 0.4);
    ctx.save(); ctx.translate(g.x, g.y); ctx.scale(k, k); zeichneLeinwand(b, -16, -24, g.spiegeln); ctx.restore();
    return;
  }
  zeichneLeinwand(b, x, y, g.spiegeln);
  if (g.modus === 'zielen') schreibe('!', g.x, y - 14, 2, PAL.gold2);
}
const flachesObjekt = o => o.typ.platte || (o.typ.pflock && !o.oben);
function zeichneObjekt(o) {   // Bild nach Eigenschaft und Zustand
  if (!sichtbar(o)) return;
  const t = o.typ, x = Math.round(o.x), y = Math.round(o.y);
  if (t.platte) ctx.drawImage(PLATTE[platteBelegt(o) ? 1 : 0], x, y);
  else if (t.pflock) ctx.drawImage(PFLOCK[o.p.farbe || 'blau'][o.oben ? 1 : 0], x, y);
  else if (t.kristall) ctx.drawImage(KRISTALL[signal(o.p.signal) ? 1 : 0], x + 2, y - 2);
  else if (t.oeffnbar) ctx.drawImage(S.truhen.has(o.key) ? TRUHE_AUF : TRUHE_ZU, x + 4, y + 9);
  else if (t.bild === '@fackel') ctx.drawImage(FACKEL[fackelAn(o) ? 1 + Math.floor(S.zeit * 6 + o.c) % 2 : 0], x + 8, y);
  else if (t.bild === '@schild') ctx.drawImage(SCHILD, x + 4, y + 10);
  else if (t.bild === '@block') ctx.drawImage(BLOCK, x, y);
  else if (t.kette) for (let i = 0; i < o.laenge; i++) zeichneBild(ctx, t.bilder[i === 0 ? 0 : i === o.laenge - 1 ? 2 : 1], x + i * T, y);
  else zeichneBild(ctx, t.bild, x, y, t.spiegeln === 'schachbrett' && (o.c + o.r) % 2 === 1);
}
function zeichneTuer(d, schloss) {   // geschlossene Tür über der Öffnung: Holz mit Schloss oder Gitter
  const [x, y, w, h] = TUER_RECHTECK[d];
  ctx.fillStyle = PAL.schwarz; ctx.fillRect(x, y, w, h);
  if (schloss) {
    ctx.fillStyle = PAL.holz1; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
    ctx.fillStyle = PAL.holz0;
    if (w >= h) for (let i = x + 9; i < x + w - 4; i += 9) ctx.fillRect(i, y + 2, 2, h - 4);
    else for (let i = y + 9; i < y + h - 4; i += 9) ctx.fillRect(x + 2, i, w - 4, 2);
    ctx.fillStyle = PAL.fels1;
    if (w >= h) { ctx.fillRect(x + 2, y + 6, w - 4, 3); ctx.fillRect(x + 2, y + h - 9, w - 4, 3); }
    else { ctx.fillRect(x + 6, y + 2, 3, h - 4); ctx.fillRect(x + w - 9, y + 2, 3, h - 4); }
    const mx = x + w / 2, my = y + h / 2;
    ctx.fillStyle = PAL.gold1; ctx.fillRect(mx - 5, my - 6, 10, 12);
    ctx.fillStyle = PAL.schwarz; ctx.fillRect(mx - 1, my - 3, 2, 3); ctx.fillRect(mx - 2, my, 4, 3);
  } else {
    ctx.fillStyle = PAL.fels1; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
    ctx.fillStyle = PAL.nacht; ctx.fillRect(x + 5, y + 5, w - 10, h - 10);
    ctx.fillStyle = PAL.fels3;
    if (w >= h) for (let i = x + 7; i < x + w - 5; i += 8) { ctx.fillRect(i, y + 3, 3, h - 6); }
    else for (let i = y + 7; i < y + h - 5; i += 8) { ctx.fillRect(x + 3, i, w - 6, 3); }
    ctx.fillStyle = PAL.fels4;
    if (w >= h) ctx.fillRect(x + 3, y + h / 2 - 2, w - 6, 3); else ctx.fillRect(x + w / 2 - 2, y + 3, 3, h - 6);
  }
}
function zeichneBeute(b) {
  const rest = CFG.gegner.herzDauer - b.t;
  if (rest < 2 && Math.floor(rest * 10) % 2) return;   // kurz vor dem Verschwinden blinken
  ctx.drawImage(HERZ.voll, Math.round(b.x - 9), Math.round(b.y - 14 - Math.abs(Math.sin(b.t * 4)) * 3));
}
function zeichneEffekte() {
  for (const e of S.effekte) {
    if (e.art === 'puff') { const b = PUFF[Math.min(PUFF.length - 1, Math.floor(e.t / 0.4 * PUFF.length))]; ctx.drawImage(b, Math.round(e.x - 20), Math.round(e.y - 20)); }
    else if (e.art === 'blaetter') {
      for (const [i, p] of e.teile.entries()) {
        ctx.fillStyle = i % 2 ? PAL.moos4 : PAL.moos2;
        ctx.fillRect(Math.round(e.x + Math.cos(p.a) * p.v * e.t), Math.round(e.y + Math.sin(p.a) * p.v * e.t + 120 * e.t * e.t), 4, 3);
      }
    }
    else { const b = FUNKE[e.t < 0.06 ? 0 : 1]; ctx.drawImage(b, Math.round(e.x - b.width / 2), Math.round(e.y - b.height / 2)); }
  }
}
function zeichneHud(h) {
  const anzahl = S.maxLp / 2, mitte = BREITE - 30 - anzahl * 10, x0 = Math.round(mitte - anzahl * 10 + 1);   // oben rechts wie im Vorbild
  schreibe('- LEBEN -', mitte, 6, 2, PAL.creme);
  for (let i = 0; i < anzahl; i++) {
    const rest = h.lp - i * 2;
    ctx.drawImage(rest >= 2 ? HERZ.voll : rest === 1 ? HERZ.halb : HERZ.leer, x0 + i * 20, 24);
  }
  schreibe(S.raum.def.nr + ' ' + S.raum.def.titel, 40, 6, 2, PAL.creme, false);
  ctx.drawImage(SCHLUESSEL, 40, 27);
  schreibe(String(S.inventar.schluessel || 0), 72, 26, 2, PAL.creme, false);
  if (S.ausEditor) schreibe('TEST - ESC: ZURÜCK ZUM EDITOR', 40, HOEHE - 14, 1, PAL.gold2, false);
  let x = 96;   // dauerhafte Gegenstände (alles außer Verbrauchtem wie Schlüsseln und Herzen) als Bild
  for (const id of S.besitz) { const w = DATEN.gegenstaende[id].wirkung || {}; if (!w.schluessel && !w.maxLp) { ctx.drawImage(GEGENSTANDBILD[id], x, 20, 20, 20); x += 26; } }
}
function zeichneBanner() {
  const w = S.wellen;
  if (!w || w.banner <= 0 || S.zustand !== 'spiel') return;
  schreibe(`WELLE ${w.nr}/${S.raum.def.wellen.length}`, BREITE / 2, 190, 5, PAL.gold2);
}
function zeichneText() {
  const t = S.text, oben = S.held.y > 300, y = oben ? 72 : HOEHE - 104, x = 24, w = BREITE - 48, hh = 88;
  ctx.fillStyle = 'rgba(18,13,20,.92)'; ctx.fillRect(x, y, w, hh);
  ctx.fillStyle = PAL.creme; ctx.fillRect(x, y, w, 2); ctx.fillRect(x, y + hh - 2, w, 2); ctx.fillRect(x, y, 2, hh); ctx.fillRect(x + w - 2, y, 2, hh);
  let rest = Math.floor(t.zeichen);
  t.seiten[t.seite].forEach((zeile, i) => {
    if (rest <= 0) return;
    schreibe(zeile.slice(0, rest), x + 16, y + 14 + i * 22, 2, PAL.creme, false); rest -= zeile.length;
  });
  if (t.zeichen >= t.seiten[t.seite].join('').length && Math.floor(S.zeit * 3) % 2 === 0) {   // weiter-Pfeil
    ctx.fillStyle = PAL.gold2; const ax = x + w - 22, ay = y + hh - 16;
    ctx.fillRect(ax, ay, 10, 2); ctx.fillRect(ax + 2, ay + 2, 6, 2); ctx.fillRect(ax + 4, ay + 4, 2, 2);
  }
}
function zeichneEnde() {
  const a = Math.min(1, (S.zeit - S.endeZeit) / 0.6), blinkt = Math.floor(S.zeit * 2) % 2 === 0;
  ctx.fillStyle = `rgba(18,13,20,${0.65 * a})`; ctx.fillRect(0, 0, BREITE, HOEHE);
  if (a < 1) return;
  schreibe('GAME OVER', BREITE / 2, 170, 6, PAL.rot2);
  if (blinkt) schreibe(TOUCH.aktiv ? 'TIPPEN: RAUM NEU BEGINNEN' : 'TASTE R: RAUM NEU BEGINNEN', BREITE / 2, 260, 2, PAL.creme);
}
function zeichneWelt() {
  const h = S.held, r = S.raum;
  for (const k of r.gefuellt) { const [c, rr] = k.split(','); ctx.drawImage(BLOCK_VERSENKT, c * T, rr * T); }
  for (const d of Object.keys(r.def.tueren)) if (r.tuerZu[d]) zeichneTuer(d, !!r.def.tueren[d].schloss);
  for (const o of r.objekte) if (flachesObjekt(o)) zeichneObjekt(o);
  for (const b of S.beute) zeichneBeute(b);
  for (const g of S.gegner) if (g.warten <= 0 && g.faellt === undefined) schatten(g.x, g.y + 6, 22);
  if (h.modus !== 'fallen') schatten(h.x, h.y + 6, 18);
  // nach unterer Kante sortiert: Objekte, Gegner und Held verdecken sich richtig
  const liste = [
    ...r.objekte.filter(o => !flachesObjekt(o) && sichtbar(o)).map(o => { const f = festVon(o); return { y: f ? f.y + f.h : o.y + T, mal: () => zeichneObjekt(o) }; }),
    ...S.gegner.map(g => ({ y: g.y + g.hh, mal: () => zeichneGegner(g) })),
    { y: h.y + h.hh + 0.5, mal: () => zeichneHeld(h) },
  ];
  liste.sort((a, b) => a.y - b.y).forEach(e => e.mal());
  zeichneEffekte();
}
function zeichne() {
  ctx.imageSmoothingEnabled = false;
  const h = S.held, w = S.wechsel;
  if (w) {   // Bildlauf: alter Raum schiebt hinaus, neuer herein, der Held wandert mit
    const o = w.t < 0.5 ? 2 * w.t * w.t : 1 - 2 * (1 - w.t) * (1 - w.t), [dx, dy] = RICHTUNG[w.d];
    const ax0 = Math.round(-dx * o * BREITE), ay0 = Math.round(-dy * o * HOEHE), bx0 = Math.round(dx * (1 - o) * BREITE), by0 = Math.round(dy * (1 - o) * HOEHE);
    ctx.drawImage(w.alt.bg, ax0, ay0);
    if (w.alt.licht) zeichneDunkel(w.alt.licht, ax0, ay0);
    ctx.drawImage(S.raum.bg, bx0, by0);
    if (raumDunkel(S.raum)) { berechneLicht(); zeichneDunkel(lichtCv, bx0, by0); }
    const ax = w.p0.x - dx * o * BREITE, ay = w.p0.y - dy * o * HOEHE, bx = h.x + dx * (1 - o) * BREITE, by = h.y + dy * (1 - o) * HOEHE;
    ctx.save(); ctx.translate(Math.round(ax + (bx - ax) * o - h.x), Math.round(ay + (by - ay) * o - h.y)); zeichneHeld(h); ctx.restore();
    zeichneHud(h);
    return;
  }
  ctx.drawImage(S.raum.bg, 0, 0);
  zeichneWelt();
  if (raumDunkel(S.raum)) { berechneLicht(); zeichneDunkel(lichtCv); }
  zeichneHud(h);
  zeichneBanner();
  if (S.text) zeichneText();
  if (S.zustand !== 'spiel') zeichneEnde();
}

// ---------- Menü ----------
// Einträge: eingebaute und eigene Dungeons, zuletzt der Editor; höchstens MENUE.sichtbar auf einmal, dann wird geblättert
const MENUE = { wahl: 0, oben: 0, sichtbar: 4, zeit: 0 };
const menueListe = () => [...Object.keys(DATEN.dungeons), '@editor'];
const menueY = i => 220 + (i - MENUE.oben) * 52;
function waehleMenue(i) {
  const id = menueListe()[i];
  if (id === '@editor') ladeEditor(); else starteDungeon(id);
}
function updateMenue() {
  MENUE.zeit += DT;
  const n = menueListe().length;
  MENUE.wahl = Math.min(MENUE.wahl, n - 1);
  if (gedrueckt.has('hoch')) MENUE.wahl = (MENUE.wahl + n - 1) % n;
  if (gedrueckt.has('runter')) MENUE.wahl = (MENUE.wahl + 1) % n;
  MENUE.oben = Math.max(0, Math.min(MENUE.oben, MENUE.wahl, n - MENUE.sichtbar), MENUE.wahl - MENUE.sichtbar + 1);
  if (gedrueckt.has('schlag')) waehleMenue(MENUE.wahl);
  gedrueckt.clear();
}
function menueTipp(y) {
  const liste = menueListe();
  const i = liste.findIndex((_, i) => i >= MENUE.oben && i < MENUE.oben + MENUE.sichtbar && y >= menueY(i) - 10 && y < menueY(i) + 42);
  if (i >= 0) { MENUE.wahl = i; waehleMenue(i); }
  else if (y > menueY(MENUE.oben + MENUE.sichtbar) - 10 && MENUE.oben + MENUE.sichtbar < liste.length) MENUE.oben++;   // Tipp unter die Liste: weiterblättern
  else if (y < menueY(MENUE.oben) - 10 && y > 180 && MENUE.oben > 0) MENUE.oben--;
}
function zeichneMenue() {
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = PAL.schwarz; ctx.fillRect(0, 0, BREITE, HOEHE);
  for (let i = 0; i < SPALTEN; i++) zeichneBild(ctx, 'gras_' + (i * 7 % 4 === 3 ? 1 : i * 7 % 4), i * T, 40);
  zeichneBild(ctx, 'held_3', 236, 28); zeichneLeinwand(GEGNERBILD.fuchs[Math.floor(MENUE.zeit * 4) % 2], 372, 44, true);
  schreibe('WALDWACHT', BREITE / 2, 112, 6, PAL.gold2);
  schreibe('WÄHLE EINEN DUNGEON', BREITE / 2, 186, 2, PAL.fels4);
  const liste = menueListe();
  liste.forEach((id, i) => {
    if (i < MENUE.oben || i >= MENUE.oben + MENUE.sichtbar) return;
    const dg = id === '@editor' ? { titel: 'EDITOR', untertitel: 'Dungeons, Räume und Gegner bauen' } : DATEN.dungeons[id];
    const an = i === MENUE.wahl, y = menueY(i);
    if (an && Math.floor(MENUE.zeit * 3) % 2 === 0) schreibe('>', 120, y, 3, PAL.gold2, false);
    schreibe(dg.titel, 150, y, 3, an ? PAL.creme : id === '@editor' ? PAL.gold1 : PAL.fels3, false);
    schreibe(dg.eigen ? 'EIGENER DUNGEON' + (dg.untertitel ? ' - ' + dg.untertitel : '') : (dg.untertitel || ''), 150, y + 26, 2, PAL.fels3, false);
  });
  if (MENUE.oben > 0) schreibe('- MEHR -', BREITE / 2, 200, 1, PAL.fels3);
  if (MENUE.oben + MENUE.sichtbar < liste.length) schreibe('- MEHR -', BREITE / 2, menueY(MENUE.oben + MENUE.sichtbar) - 4, 1, PAL.fels3);
  schreibe(TOUCH.aktiv ? 'EINTRAG ANTIPPEN' : 'PFEILE WÄHLEN, LEERTASTE STARTEN', BREITE / 2, 440, 2, PAL.fels3);
  if (WARNUNGEN.length) schreibe(`${WARNUNGEN.length} WARNUNGEN IN DEN SPIELDATEN (KONSOLE)`, BREITE / 2, 460, 1, PAL.rot2);
}

// ---------- Schleife & Skalierung ----------
// Tastatur: Platz für die Hilfezeile. Touch hochkant: Spielfeld oben, Bedienung darunter.
// Touch quer: links und rechts Rand für Stick und Aktionsknopf (darf das Spielfeld etwas überdecken).
function skaliere() {
  const w = innerWidth, h = innerHeight, hochkant = h > w;
  document.body.classList.toggle('hochkant', TOUCH.aktiv && hochkant);
  let s;
  if (!TOUCH.aktiv) s = Math.min(w / BREITE, (h - document.querySelector('.hilfe').offsetHeight - 30) / HOEHE);
  else if (hochkant) s = Math.min((w - 8) / BREITE, (h - 240) / HOEHE);
  else s = Math.min((w - 2 * 130) / BREITE, h / HOEHE);
  if (s >= 1) s = Math.floor(s);   // ganzzahlig, damit die Pixel gleich groß bleiben
  cv.style.width = BREITE * s + 'px'; cv.style.height = HOEHE * s + 'px';
}
addEventListener('resize', skaliere);

let vorher = 0, rest = 0;
function schleife(jetzt) {
  rest = Math.min(rest + (jetzt - vorher) / 1000, 0.25); vorher = jetzt;
  while (rest >= DT) { if (S) schritt(); else updateMenue(); rest -= DT; }
  if (S) zeichne(); else zeichneMenue();
  requestAnimationFrame(schleife);
}

atlas.onload = () => {
  baueDatenbilder();
  const d = PARAM.get('dungeon') || (PARAM.has('raum') ? 'probe' : null);
  if (d && DATEN.dungeons[d]) starteDungeon(d, PARAM.get('raum'));
  skaliere();
  requestAnimationFrame(t => { vorher = t; schleife(t); });
};
atlas.src = ATLAS_SRC;
</script>
