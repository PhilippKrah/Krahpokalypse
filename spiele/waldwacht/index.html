<!DOCTYPE html>
<!--
  Waldwacht (Arbeitstitel) – Entwurf 2: Top-Down-Action-Adventure im Stil von „A Link to the Past“.
  Ein geschlossener Raum (Waldlichtung hinter einer alten Steinmauer), der Verwalter mit Schwert, Füchse in Wellen:
  je Welle mehr und schneller; ab Welle 3 Silberfüchse (springen nach kurzer Warnung), ab Welle 5 Glutfüchse
  (zäher, ein ganzes Herz Schaden). Füchse lassen manchmal ein Herz fallen. Rekord (höchste Welle) im localStorage.
  Alle Stellschrauben in CFG (arten, welle, herz).

  Grafik: Held, Füchse, Gras und Hindernisse sind aus dem Atlas des Gutsverwalters (spiele/foerster) geschnitten
  (atlas_bauen.py, Ergebnis steht unten in FR/ATLAS_SRC). Mauer, Schwert, Herzen, Schrift und Effekte werden beim Start
  in Pixeln gezeichnet, mit Farben aus der Gutsverwalter-Palette (PAL). Maßstab wie dort: 32 Bildschirmpixel je Feld.
  Leinwand 640×480 (20×15 Felder), ganzzahlig hochskaliert, wenn das Fenster es hergibt.

  Spiellogik in Bildschirmpixeln, feste Schrittweite 1/60 s. Kollision: achsengetrennte AABB-Prüfung gegen die Liste
  HINDERNISSE (Mauern + Hindernisse mit Rechtecken passend zur Grafik, nicht zum ganzen Feld).

  Steuerung: WASD/Pfeile laufen (8 Richtungen) · Leertaste Schwert · R Neustart (nach Game Over)
  Touch (erscheint beim ersten Fingertipp): linke Hälfte Steuerstick, rechte Hälfte Schwert, nach Game Over Tippen = Neustart.
             Touch schreibt dieselben Befehle wie die Tastatur. Zum Testen am PC: index.html?touch
-->

const FORM = {
  S: [4, 12, 24, 16], U: [3, 8, 26, 21], E: [3, 8, 26, 21], P: [5, 12, 22, 16], O: [4, 10, 22, 18],
};
const HINDERNISSE = [
  { x: 0, y: 0, w: BREITE, h: 2 * T },                // obere Mauer (Krone + Wandfläche)
  { x: 0, y: (ZEILEN - 1) * T, w: BREITE, h: T },     // untere Mauer
  { x: 0, y: 0, w: T, h: HOEHE },                     // links
  { x: (SPALTEN - 1) * T, y: 0, w: T, h: HOEHE },     // rechts
];
for (let r = 0; r < ZEILEN; r++) {
  const zeile = KARTE[r];
  for (let c = 0; c < SPALTEN; c++) {
    const z = zeile[c];
    if (FORM[z]) { const [x, y, w, h] = FORM[z]; HINDERNISSE.push({ x: c * T + x, y: r * T + y, w, h }); }
    if (z === 'L' && zeile[c - 1] !== 'L') {   // ganzer Stamm als ein Rechteck
      let n = 0; while (zeile[c + n] === 'L') n++;
      HINDERNISSE.push({ x: c * T + 3, y: r * T + 11, w: n * T - 6, h: 16 });
    }
  }
}

// ---------- Hilfen ----------
function zufall(seed) {   // mulberry32: gleicher Raum bei jedem Laden
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const ueberlappt = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const fuss = e => ({ x: e.x - e.hw, y: e.y - e.hh, w: 2 * e.hw, h: 2 * e.hh });
function leinwand(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }

// Bewegt e (Mittelpunkt x/y, halbe Fußbox hw/hh) achsenweise und schiebt es aus jedem Hindernis heraus.
function bewege(e, mx, my) {
  if (mx) {
    e.x += mx;
    for (const r of HINDERNISSE) if (ueberlappt(fuss(e), r)) e.x = mx > 0 ? r.x - e.hw : r.x + r.w + e.hw;
  }
  if (my) {
    e.y += my;
    for (const r of HINDERNISSE) if (ueberlappt(fuss(e), r)) e.y = my > 0 ? r.y - e.hh : r.y + r.h + e.hh;
  }
}

// ---------- Pixelgrafik ----------
// Farbkarte (Zeilen aus Zeichen) → Leinwand; Kontur automatisch um alle gefüllten Pixel.
function pixelbild(zeilen, farben, kontur, massstab = 1) {
  const h = zeilen.length, w = zeilen[0].length, k = kontur ? 1 : 0;
  const [c, g] = leinwand((w + 2 * k) * massstab, (h + 2 * k) * massstab);
  const voll = (x, y) => y >= 0 && y < h && x >= 0 && x < w && zeilen[y][x] !== '.';
  for (let y = -k; y < h + k; y++) for (let x = -k; x < w + k; x++) {
    let f = null;
    if (voll(x, y)) f = farben[zeilen[y][x]];
    else if (kontur && (voll(x - 1, y) || voll(x + 1, y) || voll(x, y - 1) || voll(x, y + 1))) f = kontur;
    if (f) { g.fillStyle = f; g.fillRect((x + k) * massstab, (y + k) * massstab, massstab, massstab); }
  }
  return c;
}

function kreis(g, cx, cy, r, f) {
  g.fillStyle = f;
  for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * 0.6) g.fillRect(cx + x, cy + y, 1, 1);

// Text mit dunkler Kontur; x ist die Mitte (mitte=true) oder der linke Rand
function schreibe(text, x, y, s, farbe, mitte = true) {
  const zeichen = [...text.toUpperCase()].map(ch => (SCHRIFT[ch] || SCHRIFT[' ']).split(' '));
  const breite = zeichen.length * 6 * s - s;
  const x0 = Math.round(mitte ? x - breite / 2 : x);
  for (const [f, d] of [[PAL.schwarz, 1], [farbe, 0]]) {
    ctx.fillStyle = f;
    zeichen.forEach((z, i) => z.forEach((zeile, yy) => [...zeile].forEach((p, xx) => {
      if (p === '#') ctx.fillRect(x0 + (i * 6 + xx) * s - d * s, y + yy * s - d * s, s + 2 * d * s, s + 2 * d * s);
    })));

}

// ---------- Atlas ----------
const atlas = new Image();
// Fuchsbilder je Art (Farbtausch wie auf dem SNES) plus weiße Umrisse für den Treffer-Effekt: FUCHSBILD[art][bild]
const FUCHSBILD = {};
const FUCHSFARBEN = {   // Fell, Beine/Ohren, Bauch/Schwanzspitze des Atlas-Fuchses → je Art
  silber: { '#b88250': PAL.fels4, '#4a2a2a': PAL.fels1, '#ece8d6': PAL.weiss },

function zeichneBild(g, name, x, y, spiegeln = false) {
  const f = FR[name]; if (!f) return;
  x = Math.round(x); y = Math.round(y);
  if (!spiegeln) { g.drawImage(atlas, f[0], f[1], f[2], f[3], x, y, f[2], f[3]); return; }
  g.save(); g.translate(x + f[2], y); g.scale(-1, 1); g.drawImage(atlas, f[0], f[1], f[2], f[3], 0, 0, f[2], f[3]); g.restore();
}
function zeichneLeinwand(bild, x, y, spiegeln) {

}
function baueFuchsbilder() {
  const hex = (d, i) => '#' + [d[i], d[i + 1], d[i + 2]].map(v => v.toString(16).padStart(2, '0')).join('');
  const kopie = name => { const f = FR[name], [c, g] = leinwand(f[2], f[3]); g.drawImage(atlas, f[0], f[1], f[2], f[3], 0, 0, f[2], f[3]); return [c, g]; };
  FUCHSBILD.fuchs = ['fuchs_0', 'fuchs_1'].map(n => kopie(n)[0]);
  FUCHSBILD.blitz = ['fuchs_0', 'fuchs_1'].map(n => {
    const [c, g] = kopie(n); g.globalCompositeOperation = 'source-in'; g.fillStyle = PAL.weiss; g.fillRect(0, 0, c.width, c.height); return c;
  });
  for (const [art, tausch] of Object.entries(FUCHSFARBEN)) FUCHSBILD[art] = ['fuchs_0', 'fuchs_1'].map(n => {
    const [c, g] = kopie(n), bild = g.getImageData(0, 0, c.width, c.height), d = bild.data;
    for (let i = 0; i < d.length; i += 4) {
      const neu = d[i + 3] && tausch[hex(d, i)];
      if (neu) for (let k = 0; k < 3; k++) d[i + k] = parseInt(neu.slice(1 + 2 * k, 3 + 2 * k), 16);
    }
    g.putImageData(bild, 0, 0); return c;
  });
}

// ---------- Hintergrund (einmal gezeichnet) ----------
const [hg, hgCtx] = leinwand(BREITE, HOEHE);
function mauerKrone(g, x, y, zz) {   // Draufsicht auf die Mauerkrone: grobe Steine, Moos
  g.fillStyle = PAL.fels0; g.fillRect(x, y, T, T);
  for (let sy = 0; sy < 2; sy++) for (let sx = 0; sx < 2; sx++) {
    const ox = x + sx * 16 + (zz() * 2 | 0), oy = y + sy * 16 + (zz() * 2 | 0), w = 13 + (zz() * 2 | 0), h = 12 + (zz() * 3 | 0);
    g.fillStyle = PAL.fels2; g.fillRect(ox + 1, oy + 1, w, h);
    g.fillStyle = PAL.fels3; g.fillRect(ox + 1, oy + 1, w, 2); g.fillRect(ox + 1, oy + 1, 2, h);
    g.fillStyle = PAL.fels1; g.fillRect(ox + 1, oy + h - 1, w, 2); g.fillRect(ox + w - 1, oy + 1, 2, h);
    if (zz() < 0.35) { g.fillStyle = zz() < 0.5 ? PAL.moos1 : PAL.moos2; const mx = ox + 2 + (zz() * (w - 6) | 0), my = oy + 2 + (zz() * (h - 5) | 0);
      g.fillRect(mx, my, 4, 2); g.fillRect(mx + 1, my - 1, 2, 4); }
  }
}
function mauerWand(g, x, y, zz) {   // senkrechte Wandfläche der oberen Mauer: Ziegelreihen, Moos von oben
  g.fillStyle = PAL.fels1; g.fillRect(x, y, T, T);
  for (let reihe = 0; reihe < 4; reihe++) {
    const versatz = reihe % 2 ? 8 : 0;
    for (let b = -1; b < 2; b++) {
      const bx = x + b * 16 + versatz, by = y + reihe * 8, l = Math.max(bx, x), r = Math.min(bx + 15, x + T);
      if (r <= l) continue;
      g.fillStyle = PAL.fels3; g.fillRect(l, by, r - l, 7);
      g.fillStyle = PAL.fels4; g.fillRect(l, by, r - l, 1);
      g.fillStyle = PAL.fels2; g.fillRect(l, by + 5, r - l, 2);
      if (zz() < 0.15) { g.fillStyle = PAL.fels2; g.fillRect(l + 3 + (zz() * 6 | 0), by + 2, 2, 2); }
    }
  }
  g.fillStyle = PAL.nacht; g.fillRect(x, y, T, 1);
  for (let i = 0; i < T; i += 2) if (zz() < 0.45) { g.fillStyle = zz() < 0.5 ? PAL.moos2 : PAL.moos1; g.fillRect(x + i, y + 1, 2, 1 + (zz() * 5 | 0)); }
  g.fillStyle = PAL.fels0; g.fillRect(x, y + T - 2, T, 2);
}
function baueHintergrund() {
  const g = hgCtx, zz = zufall(7);
  // Boden überall, Deko nur auf freien Feldern abseits des Startplatzes
  const frei = (c, r) => KARTE[r] && KARTE[r][c] === '.';
  const startfeld = (c, r) => Math.abs(START_HELD.x / T - 0.5 - c) < 1.5 && Math.abs(START_HELD.y / T - 0.5 - r) < 1.5;
  for (let r = 0; r < ZEILEN; r++) for (let c = 0; c < SPALTEN; c++) {
    const w = zz(); zeichneBild(g, w < 0.6 ? 'gras_0' : w < 0.85 ? 'gras_1' : w < 0.95 ? 'gras_2' : 'gras_3', c * T, r * T);
  }
  for (let r = 0; r < ZEILEN; r++) for (let c = 0; c < SPALTEN; c++) {
    const d = zz();
    if (frei(c, r) && !startfeld(c, r) && d < 0.12) zeichneBild(g, d < 0.06 ? 'buesche' : d < 0.1 ? 'blumen' : 'pilz', c * T, r * T, zz() < 0.5);
  }

  g.fillStyle = 'rgba(18,13,20,.32)'; g.fillRect(T, 2 * T, BREITE - 2 * T, 5); g.fillRect(T, 2 * T, 5, HOEHE - 3 * T);
  g.fillStyle = 'rgba(18,13,20,.16)'; g.fillRect(T, 2 * T + 5, BREITE - 2 * T, 5); g.fillRect(T + 5, 2 * T, 4, HOEHE - 3 * T);
  // Mauer
  for (let r = 0; r < ZEILEN; r++) for (let c = 0; c < SPALTEN; c++) {
    if (KARTE[r][c] !== '#') continue;
    if (r === 1 && c > 0 && c < SPALTEN - 1) mauerWand(g, c * T, r * T, zz); else mauerKrone(g, c * T, r * T, zz);
  }
  // Kante der Mauerkrone zum Raum hin
  g.fillStyle = PAL.fels4;
  g.fillRect(T - 2, 2 * T, 2, HOEHE - 3 * T);                  // links
  g.fillRect(BREITE - T, 2 * T, 2, HOEHE - 3 * T);             // rechts
  g.fillRect(T, HOEHE - T, BREITE - 2 * T, 2);                 // unten
  g.fillStyle = PAL.nacht;
  g.fillRect(BREITE - T + 2, 2 * T, 1, HOEHE - 3 * T); g.fillRect(T, HOEHE - T + 2, BREITE - 2 * T, 1);

  for (let r = 0; r < ZEILEN; r++) {
    const zeile = KARTE[r];
    for (let c = 0; c < SPALTEN; c++) {
      const z = zeile[c], x = c * T, y = r * T;
      if (z === 'S') zeichneBild(g, 'stein', x, y, (c + r) % 2 === 1);
      else if (z === 'U') zeichneBild(g, 'busch', x, y);
      else if (z === 'E') zeichneBild(g, 'beerenbusch', x, y);
      else if (z === 'P') zeichneBild(g, 'stumpf', x, y);
      else if (z === 'O') zeichneBild(g, 'holzstapel', x, y);
      else if (z === 'L') zeichneBild(g, zeile[c - 1] !== 'L' ? 'stamm_0' : zeile[c + 1] !== 'L' ? 'stamm_2' : 'stamm_1', x, y);
    }
  }
}

const gehalten = new Set(), gedrueckt = new Set();   // gedrueckt: seit dem letzten Spielschritt neu gedrückt

// ---------- Eingabe: Touch ----------
// Linke Bildschirmhälfte: Steuerstick, der dort entsteht, wo der Daumen aufsetzt (8 Richtungen).
// Rechte Hälfte: jeder Tipp ein Schwerthieb. Nach dem Ende startet ein Tipp neu.
// Touch schreibt dieselben Befehle wie die Tastatur (TOUCH.richtung neben gehalten, gedrueckt gemeinsam).
// Am PC testen: index.html?touch (dann zählt auch die Maus).
const TOUCH = { aktiv: false, stick: null, schlagId: null, richtung: new Set() };
const elStick = document.getElementById('stick'), elKnauf = document.getElementById('knauf'), elSchlag = document.getElementById('schlagknopf');
const STICK = { tot: 14, weg: 44 };   // Totzone und größter Ausschlag in CSS-Pixeln
const halt = t => gehalten.has(t) || TOUCH.richtung.has(t);
function touchAn() {
  if (TOUCH.aktiv) return;
  TOUCH.aktiv = true; document.body.classList.add('touch'); skaliere();
}
function stickZeigen(x, y, dx = 0, dy = 0) {
  elStick.style.left = x + 'px'; elStick.style.top = y + 'px'; elStick.classList.add('an');
  elKnauf.style.transform = `translate(${dx}px,${dy}px)`;
}
function stickLos() {
  TOUCH.stick = null; TOUCH.richtung.clear();
  elStick.classList.remove('an'); elStick.style.left = elStick.style.top = ''; elKnauf.style.transform = '';
}
addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && !TOUCH.aktiv) return;
  touchAn(); e.preventDefault();
  if (S && S.zustand !== 'spiel') { gedrueckt.add('neustart'); return; }
  if (e.clientX < innerWidth / 2) {
    if (!TOUCH.stick) { TOUCH.stick = { id: e.pointerId, x0: e.clientX, y0: e.clientY }; stickZeigen(e.clientX, e.clientY); }
  } else { gedrueckt.add('schlag'); TOUCH.schlagId = e.pointerId; elSchlag.classList.add('an'); }
}, { passive: false });
addEventListener('pointermove', e => {
  const s = TOUCH.stick; if (!s || e.pointerId !== s.id) return;
  let dx = e.clientX - s.x0, dy = e.clientY - s.y0; const l = Math.hypot(dx, dy);
  TOUCH.richtung.clear();
  if (l > STICK.tot) {   // Sektoren zu je 45°: eine Achse zählt, wenn sie mehr als cos(67,5°) des Ausschlags trägt
    if (dx > l * 0.38) TOUCH.richtung.add('rechts'); else if (dx < -l * 0.38) TOUCH.richtung.add('links');
    if (dy > l * 0.38) TOUCH.richtung.add('runter'); else if (dy < -l * 0.38) TOUCH.richtung.add('hoch');
  }
  if (l > STICK.weg) { dx *= STICK.weg / l; dy *= STICK.weg / l; }

});
function touchEnde(e) {
  if (TOUCH.stick && e.pointerId === TOUCH.stick.id) stickLos();

}

// ---------- Wellen ----------
// Welle n: 2+n Füchse (höchstens anzahlMax), ab Welle 3 Silberfüchse, ab Welle 5 Glutfüchse; alle laufen je Welle schneller.
function welleInhalt(n) {
  const anzahl = Math.min(CFG.welle.anzahlMax, 2 + n);
  const glut = n >= 5 ? Math.min(4, Math.floor((n - 3) / 2)) : 0;
  const silber = n >= 3 ? Math.min(anzahl - glut, 5, n - 2) : 0;
  const liste = [...Array(glut).fill('glut'), ...Array(silber).fill('silber'), ...Array(anzahl - glut - silber).fill('fuchs')];
  for (let i = liste.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [liste[i], liste[j]] = [liste[j], liste[i]]; }
  return liste;
}
const welleTempo = n => Math.min(CFG.welle.tempoMax, 1 + CFG.welle.tempoPlus * (n - 1));
function starteWelle(n) {
  S.welle = n; S.banner = CFG.welle.banner; S.warteschlange = welleInhalt(n); S.spawnUhr = CFG.welle.bannerVorlauf;
}
function freierPlatz(hw, hh) {   // zufällige Stelle im Raum: frei von Hindernissen, nicht zu nah am Helden
  const h = S.held;
  let bester = null, besterAbstand = -1;
  for (let i = 0; i < 40; i++) {
    const p = { x: T + hw + 4 + Math.random() * (BREITE - 2 * T - 2 * hw - 8), y: 2 * T + hh + 8 + Math.random() * (HOEHE - 3 * T - 2 * hh - 16), hw, hh };
    if (HINDERNISSE.some(r => ueberlappt(fuss({ ...p, hw: hw + 4, hh: hh + 4 }), r))) continue;
    if (S.fuechse.some(f => Math.hypot(f.x - p.x, f.y - p.y) < 30)) continue;
    const d = Math.hypot(p.x - h.x, p.y - h.y);
    if (d >= CFG.welle.mindestAbstand) return p;
    if (d > besterAbstand) { bester = p; besterAbstand = d; }
  }
  return bester || { x: BREITE - 2 * T, y: HOEHE - 2 * T };
}
function setzeFuchs(art) {
  const a = CFG.arten[art], p = freierPlatz(11, 6);
  S.fuechse.push({ art, x: p.x, y: p.y, hw: 11, hh: 6, lp: a.lp, tempo: a.tempo * welleTempo(S.welle), schaden: a.schaden,
    rueck: 0, vx: 0, vy: 0, blitz: 0, anim: 0, spiegeln: p.x > S.held.x, getroffen: -1, warten: CFG.fuchs.wachAb, sterbend: false,
    modus: 'jagen', mt: 0, sprungPause: a.sprung ? zufallIn(a.sprung.pause) : 0 });
  S.effekte.push({ art: 'puff', x: p.x, y: p.y - 8, t: 0 });
}
const zufallIn = ([a, b]) => a + Math.random() * (b - a);
function steuereWellen() {
  if (S.zustand !== 'spiel') return;
  if (S.banner > 0) S.banner -= DT;
  if (S.warteschlange.length) {
    S.spawnUhr -= DT;
    if (S.spawnUhr <= 0) { setzeFuchs(S.warteschlange.shift()); S.spawnUhr = CFG.welle.abstand; }
    return;
  }
  if (S.fuechse.length) return;
  S.ruhe -= DT;   // kurze Verschnaufpause, dann die nächste Welle
  if (S.ruhe <= 0) { S.ruhe = CFG.welle.pause; starteWelle(S.welle + 1); }
}

// ---------- Schwert ----------
// Schwertstellung: vier Winkel je Blickrichtung, von der Seite her über die Front geschwungen (links gespiegelt)
function schwertWinkel(h) {
  const p = CFG.schlag.phasen, stufe = h.t < p[0] ? 0 : h.t < p[1] ? 1 : h.t < p[2] ? 2 : 3;
  const sinn = h.blick === 'links' ? -1 : 1;
  return ((WINKEL[h.blick] - 90 * sinn + 45 * stufe * sinn) % 360 + 360) % 360;
}
function schwertGriff(h, w) {   // Hand des Helden plus ein Stück in Schwertrichtung
  const hand = { rechts: [5, -13], links: [-5, -13], runter: [3, -8], hoch: [-2, -17] }[h.blick];
  const a = w * Math.PI / 180;
  return [Math.round(h.x + hand[0] + Math.cos(a) * 6), Math.round(h.y + hand[1] + Math.sin(a) * 6)];
}
function schwertTrefferfelder(h) {   // drei kleine AABB entlang der Klinge
  const w = schwertWinkel(h), [gx, gy] = schwertGriff(h, w), a = w * Math.PI / 180;
  return [10, 18, 26].map(d => ({ x: gx + Math.cos(a) * d - 5, y: gy + Math.sin(a) * d - 5, w: 10, h: 10 }));
}
const heldKoerper = h => ({ x: h.x - 9, y: h.y - 22, w: 18, h: 28 });
const fuchsKoerper = f => ({ x: f.x - 13, y: f.y - 14, w: 26, h: 20 });

function starteSchlag(h) { h.modus = 'schlag'; h.t = 0; h.schlagNr++; h.anim = 0; }

function updateHeld(h) {
  if (h.unverwundbar > 0) h.unverwundbar -= DT;
  if (h.modus === 'rueckstoss') {
    h.t -= DT; bewege(h, h.vx * DT, h.vy * DT); h.vx *= 0.88; h.vy *= 0.88;
    if (h.t <= 0) h.modus = 'normal';
    return;
  }
  if (h.modus === 'schlag') {
    h.t += DT;
    if (h.t < CFG.schlag.aktivBis) pruefeSchwert(h);
    if (gedrueckt.has('schlag') && h.t >= CFG.schlag.neuAb) starteSchlag(h);
    else if (h.t >= CFG.schlag.dauer) h.modus = 'normal';
    return;
  }
  if (gedrueckt.has('schlag')) { starteSchlag(h); pruefeSchwert(h); return; }
  const dx = halt('rechts') - halt('links'), dy = halt('runter') - halt('hoch');
  if (!dx && !dy) { h.anim = 0; return; }
  const n = dx && dy ? Math.SQRT1_2 : 1;
  bewege(h, dx * n * CFG.held.tempo * DT, dy * n * CFG.held.tempo * DT);
  // Blickrichtung bleibt, solange sie zu einer gedrückten Richtung passt (schräg laufen dreht nicht hin und her)
  const passt = { hoch: dy < 0, runter: dy > 0, links: dx < 0, rechts: dx > 0 }[h.blick];
  if (!passt) h.blick = dx ? (dx < 0 ? 'links' : 'rechts') : (dy < 0 ? 'hoch' : 'runter');
  h.anim += DT;
}

function pruefeSchwert(h) {
  const felder = schwertTrefferfelder(h);
  for (const f of S.fuechse) {
    if (f.sterbend || f.getroffen === h.schlagNr) continue;
    const koerper = fuchsKoerper(f), feld = felder.find(t => ueberlappt(t, koerper));
    if (!feld) continue;
    f.getroffen = h.schlagNr; f.lp--; f.blitz = CFG.fuchs.blitz; f.rueck = CFG.fuchs.rueckDauer; f.warten = 0;
    if (f.modus !== 'jagen') { f.modus = 'jagen'; f.sprungPause = CFG.arten[f.art].sprung.pause[0]; }   // Treffer unterbricht den Sprung
    let rx = f.x - h.x, ry = f.y - h.y; const l = Math.hypot(rx, ry) || 1; rx /= l; ry /= l;
    f.vx = rx * CFG.fuchs.rueckTempo; f.vy = ry * CFG.fuchs.rueckTempo;
    if (f.lp <= 0) f.sterbend = true;
    S.effekte.push({ art: 'funke', x: feld.x + feld.w / 2, y: feld.y + feld.h / 2, t: 0 });
    S.stopp = CFG.trefferStopp;
  }
}

// ---------- Füchse ----------
// jagen: langsam auf den Helden zu. Mit Sprung (Silber, Glut): in Reichweite kurz anhalten und zittern (zielen,
// das ist die Warnung), dann geradeaus dorthin springen, wo der Held beim Absprung stand.
function updateFuchs(f, h) {
  f.blitz = Math.max(0, f.blitz - DT);
  if (f.rueck > 0) {
    f.rueck -= DT; bewege(f, f.vx * DT, f.vy * DT); f.vx *= 0.88; f.vy *= 0.88;
    if (f.rueck <= 0 && f.sterbend) {
      f.weg = true; S.effekte.push({ art: 'puff', x: f.x, y: f.y - 8, t: 0 });
      if (Math.random() < CFG.herz.chance) S.beute.push({ x: f.x, y: f.y, t: 0 });
    }
    return;
  }
  if (f.warten > 0) { f.warten -= DT; return; }
  if (S.zustand !== 'spiel') return;
  const sp = CFG.arten[f.art].sprung, dx = h.x - f.x, dy = h.y - f.y, l = Math.hypot(dx, dy) || 1;
  if (f.modus === 'zielen') {
    f.mt -= DT;
    if (f.mt <= 0) { f.modus = 'sprung'; f.mt = sp.dauer; f.vx = dx / l * sp.tempo; f.vy = dy / l * sp.tempo; f.spiegeln = dx < 0; }
    return;
  }
  if (f.modus === 'sprung') {
    f.mt -= DT;
    const x0 = f.x, y0 = f.y; bewege(f, f.vx * DT, f.vy * DT);
    const gestoppt = Math.hypot(f.x - x0, f.y - y0) < sp.tempo * DT * 0.3;   // gegen Wand oder Hindernis
    if (f.mt <= 0 || gestoppt) { f.modus = 'jagen'; f.sprungPause = zufallIn(sp.pause); }
    return;
  }
  if (sp) {
    f.sprungPause -= DT;
    if (f.sprungPause <= 0 && l < sp.reichweite) { f.modus = 'zielen'; f.mt = sp.zielen; f.spiegeln = dx < 0; return; }
  }
  if (l < 2) return;
  bewege(f, dx / l * f.tempo * DT, dy / l * f.tempo * DT);
  if (Math.abs(dx) > 2) f.spiegeln = dx < 0;
  f.anim += DT;
}

function trenneFuechse() {   // Füchse sollen nicht ineinander laufen
  const lebend = S.fuechse.filter(f => !f.sterbend && f.modus !== 'sprung');
  for (let i = 0; i < lebend.length; i++) for (let j = i + 1; j < lebend.length; j++) {
    const a = lebend[i], b = lebend[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01, min = 24;
    if (d >= min) continue;
    const s = (min - d) / 2;
    bewege(a, -dx / d * s, -dy / d * s); bewege(b, dx / d * s, dy / d * s);
  }
}

function pruefeBeruehrung(h) {
  if (h.unverwundbar > 0 || S.zustand !== 'spiel') return;
  const k = heldKoerper(h);
  const f = S.fuechse.find(f => !f.sterbend && f.warten <= 0 && ueberlappt(k, fuchsKoerper(f)));
  if (!f) return;
  h.lp = Math.max(0, h.lp - f.schaden);
  let rx = h.x - f.x, ry = h.y - f.y; const l = Math.hypot(rx, ry) || 1; rx /= l; ry /= l;
  h.modus = 'rueckstoss'; h.t = CFG.held.rueckDauer; h.vx = rx * CFG.held.rueckTempo; h.vy = ry * CFG.held.rueckTempo;
  h.unverwundbar = CFG.held.unverwundbar;
  if (h.lp === 0) {
    S.zustand = 'gameover'; S.endeZeit = S.zeit;
    if (S.welle > beste) { beste = S.welle; S.neuerRekord = true; try { localStorage.setItem('waldwacht.beste', beste); } catch (e) { /* egal */ } }
  }
}

function pruefeBeute(h) {   // Herzen: einsammeln heilt ein ganzes Herz, nach einer Weile verschwinden sie
  const k = heldKoerper(h);
  S.beute = S.beute.filter(b => {
    b.t += DT;
    if (S.zustand === 'spiel' && ueberlappt(k, { x: b.x - 9, y: b.y - 12, w: 18, h: 16 })) { h.lp = Math.min(CFG.held.lp, h.lp + 2); return false; }
    return b.t < CFG.herz.dauer;
  });
}

function schritt() {
  if (S.stopp > 0) { S.stopp--; gedrueckt.clear(); return; }   // kurzes Standbild beim Treffer
  S.zeit += DT;
  const h = S.held;
  if (S.zustand === 'spiel') updateHeld(h);
  else if (h.modus === 'rueckstoss') updateHeld(h);
  steuereWellen();
  for (const f of S.fuechse) updateFuchs(f, h);
  S.fuechse = S.fuechse.filter(f => !f.weg);
  trenneFuechse();
  pruefeBeruehrung(h);
  pruefeBeute(h);
  for (const e of S.effekte) e.t += DT;
  S.effekte = S.effekte.filter(e => e.t < (e.art === 'puff' ? 0.4 : 0.12));
  if (S.zustand !== 'spiel' && gedrueckt.has('neustart') && S.zeit - S.endeZeit > 0.8) neuesSpiel();
  gedrueckt.clear();
}

// ---------- Zeichnen ----------
const SCHRITTFOLGE = [1, 0, 2, 0];
function schatten(x, y, w) {
  ctx.fillStyle = 'rgba(18,13,20,.28)';
  ctx.fillRect(Math.round(x - w / 2 + 2), Math.round(y - 2), w - 4, 5); ctx.fillRect(Math.round(x - w / 2), Math.round(y - 1), w, 3);
}
function zeichneSchwert(h) {
  const w = schwertWinkel(h), [gx, gy] = schwertGriff(h, w);
  const gerade = w % 90 === 0, bild = gerade ? SCHWERT_GERADE : SCHWERT_SCHRAEG, [px, py] = gerade ? SCHWERT_GERADE_DREH : SCHWERT_SCHRAEG_DREH;
  ctx.save(); ctx.translate(gx, gy); ctx.rotate((gerade ? w : w - 45) * Math.PI / 180); ctx.drawImage(bild, -px, -py); ctx.restore();
}
function zeichneHeld(h) {
  if (h.unverwundbar > 0 && Math.floor(h.unverwundbar * 20) % 2) return;   // Blinken in der Schutzzeit
  const basis = { runter: 0, rechts: 3, links: 3, hoch: 6 }[h.blick];
  const bild = h.modus === 'normal' && h.anim > 0 ? basis + SCHRITTFOLGE[Math.floor(h.anim * 8) % 4] : basis;
  const schlag = h.modus === 'schlag', hinten = schlag && Math.sin(schwertWinkel(h) * Math.PI / 180) < -0.1;
  if (hinten) zeichneSchwert(h);
  zeichneBild(ctx, 'held_' + bild, h.x - 16, h.y + 8 - 48 + (schlag && h.t > CFG.schlag.phasen[1] ? 1 : 0), h.blick === 'links');
  if (schlag && !hinten) zeichneSchwert(h);
}
function zeichneFuchs(f) {
  const bild = f.modus === 'sprung' ? 1 : f.rueck > 0 || f.anim === 0 || f.modus === 'zielen' ? 0 : Math.floor(f.anim * 6) % 2;
  const zittern = f.modus === 'zielen' ? (Math.floor(S.zeit * 30) % 2 ? 1 : -1) : 0;
  const x = Math.round(f.x - 16) + zittern, y = Math.round(f.y + 8 - 32) - (f.modus === 'sprung' ? 3 : 0);
  if (f.warten > 0 && Math.floor(f.warten * 16) % 2) return;   // Erscheinen: kurz flackern
  const blitz = f.blitz > 0 && Math.floor(f.blitz * 30) % 2 === 0;
  zeichneLeinwand(blitz ? FUCHSBILD.blitz[bild] : FUCHSBILD[f.art][bild], x, y, f.spiegeln);
  if (f.modus === 'zielen') schreibe('!', f.x, y - 14, 2, PAL.gold2);
}
function zeichneBeute(b) {
  const rest = CFG.herz.dauer - b.t;
  if (rest < 2 && Math.floor(rest * 10) % 2) return;   // kurz vor dem Verschwinden blinken
  ctx.drawImage(HERZ.voll, Math.round(b.x - 9), Math.round(b.y - 14 - Math.abs(Math.sin(b.t * 4)) * 3));
}
function zeichneHud(h) {
  const anzahl = CFG.held.lp / 2, mitte = BREITE - 84, x0 = Math.round(mitte - anzahl * 10 + 1);   // oben rechts wie im Vorbild
  schreibe('- LEBEN -', mitte, 6, 2, PAL.creme);
  for (let i = 0; i < anzahl; i++) {
    const rest = h.lp - i * 2;
    ctx.drawImage(rest >= 2 ? HERZ.voll : rest === 1 ? HERZ.halb : HERZ.leer, x0 + i * 20, 24);
  }
  if (S.welle) {
    schreibe('WELLE ' + S.welle, 40, 6, 2, PAL.creme, false);
    schreibe('FÜCHSE ' + (S.fuechse.filter(f => !f.sterbend).length + S.warteschlange.length), 40, 26, 2, PAL.fels4, false);
  }
}
function zeichneBanner() {
  if (S.banner <= 0 || S.zustand !== 'spiel') return;
  const vergangen = CFG.welle.banner - S.banner;
  if (vergangen < 0.12 && Math.floor(vergangen * 30) % 2) return;
  schreibe('WELLE ' + S.welle, BREITE / 2, 190, 5, PAL.gold2);
  const neu = S.welle === 3 ? 'SILBERFÜCHSE SPRINGEN!' : S.welle === 5 ? 'GLUTFÜCHSE BEISSEN DOPPELT!' : '';
  if (neu) schreibe(neu, BREITE / 2, 240, 2, PAL.creme);
}
function zeichneEnde() {
  const a = Math.min(1, (S.zeit - S.endeZeit) / 0.6), blinkt = Math.floor(S.zeit * 2) % 2 === 0;
  ctx.fillStyle = `rgba(18,13,20,${0.65 * a})`; ctx.fillRect(0, 0, BREITE, HOEHE);
  if (a < 1) return;
  schreibe('GAME OVER', BREITE / 2, 150, 6, PAL.rot2);
  schreibe('WELLE ' + S.welle + ' ERREICHT', BREITE / 2, 230, 3, PAL.gold2);
  schreibe(S.neuerRekord ? 'NEUER REKORD!' : 'REKORD: WELLE ' + beste, BREITE / 2, 270, 2, S.neuerRekord ? PAL.gold2 : PAL.fels4);
  if (blinkt) schreibe(TOUCH.aktiv ? 'TIPPEN: NEUSTART' : 'TASTE R: NEUSTART', BREITE / 2, 320, 2, PAL.creme);
}
function zeichne() {
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(hg, 0, 0);
  const h = S.held;
  for (const b of S.beute) zeichneBeute(b);
  for (const f of S.fuechse) if (f.warten <= 0) schatten(f.x, f.y + 6, 22);
  schatten(h.x, h.y + 6, 18);
  const figuren = [...S.fuechse.map(f => ({ y: f.y, mal: () => zeichneFuchs(f) })), { y: h.y, mal: () => zeichneHeld(h) }];
  figuren.sort((a, b) => a.y - b.y).forEach(f => f.mal());
  for (const e of S.effekte) {
    if (e.art === 'puff') { const b = PUFF[Math.min(PUFF.length - 1, Math.floor(e.t / 0.4 * PUFF.length))]; ctx.drawImage(b, Math.round(e.x - 20), Math.round(e.y - 20)); }
    else { const b = FUNKE[e.t < 0.06 ? 0 : 1]; ctx.drawImage(b, Math.round(e.x - b.width / 2), Math.round(e.y - b.height / 2)); }
  }
  zeichneHud(h);
  zeichneBanner();
  if (S.zustand !== 'spiel') zeichneEnde();
}

// ---------- Schleife & Skalierung ----------
// Tastatur: Platz für die Hilfezeile. Touch hochkant: Spielfeld oben, Bedienung darunter.
// Touch quer: links und rechts Rand für Stick und Schwertknopf (darf das Spielfeld etwas überdecken).
function skaliere() {
  const w = innerWidth, h = innerHeight, hochkant = h > w;
  document.body.classList.toggle('hochkant', TOUCH.aktiv && hochkant);
  let s;
  if (!TOUCH.aktiv) s = Math.min(w / BREITE, (h - document.querySelector('.hilfe').offsetHeight - 30) / HOEHE);
  else if (hochkant) s = Math.min((w - 8) / BREITE, (h - 240) / HOEHE);
  else s = Math.min((w - 2 * 130) / BREITE, h / HOEHE);
  if (s >= 1) s = Math.floor(s);   // ganzzahlig, damit die Pixel gleich groß bleiben
  cv.style.width = BREITE * s + 'px'; cv.style.height = HOEHE * s + 'px';
}
addEventListener('resize', skaliere);

let vorher = 0, rest = 0;
function schleife(jetzt) {
  rest = Math.min(rest + (jetzt - vorher) / 1000, 0.25); vorher = jetzt;
  while (rest >= DT) { schritt(); rest -= DT; }
  zeichne();
  requestAnimationFrame(schleife);
}

atlas.onload = () => {
  baueFuchsbilder(); baueHintergrund(); neuesSpiel(); skaliere();
  requestAnimationFrame(t => { vorher = t; schleife(t); });
};
atlas.src = ATLAS_SRC;
</script>
</body>
</html>
